[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-institutional-scanner"
version = "0.9.0"
description = "Production-oriented forex scanner research foundation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pandas==2.2.3",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "duckdb==1.5.5",
  "pyarrow==25.0.1",
  "supabase==2.31.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
ctrader = ["ctrader-open-api==0.9.2"]

[project.scripts]
fx-scanner = "fx_scanner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
