# Add INSIDE the existing TLS server block listening on25345.
# These locations preserve / and /btc7d130; no existing upstream is replaced.
# This file is a snippet, not a complete nginx.conf or standalone server block.
location = /r3 {
    proxy_pass http://127.0.0.1:25347;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}
location ^~ /r3/ {
    proxy_pass http://127.0.0.1:25347;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}
