name: Research XAU cTrader History Probe V193

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_ctrader_history_probe_v193.py"
      - ".github/workflows/research-xau-ctrader-history-probe-v193.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-ctrader-history-probe-v193
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Probe cTrader M5 history depth
        run: python -m fx_scanner.research_xau_ctrader_history_probe_v193
