name: V396 XAU AFIQ Challenger Replay

on:
  workflow_dispatch:
    inputs:
      start:
        description: Replay start (ISO-8601 UTC)
        required: false
        default: "2025-01-01T00:00:00+00:00"
      end:
        description: Replay end (ISO-8601 UTC; blank = now)
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/xau_afiq_replay_v396.py"
      - "src/fx_scanner/demo_xau_afiq_replay_v396.py"
      - "tests/test_xau_afiq_replay_v396.py"
      - ".github/workflows/ctrader-demo-xau-afiq-replay-v396.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-demo-xau-afiq-replay-v396
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      V396_START: ${{ github.event.inputs.start || '2025-01-01T00:00:00+00:00' }}
      V396_END: ${{ github.event.inputs.end || '' }}
      V396_OUTPUT_PATH: v396_replay.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: V396 deterministic regression tests
        run: pytest -q tests/test_xau_afiq_challenger_v395.py tests/test_xau_afiq_replay_v396.py
      - name: Run no-lookahead XAUUSD replay
        run: python -m fx_scanner.demo_xau_afiq_replay_v396
      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: v396-xau-afiq-replay
          path: v396_replay.json
          if-no-files-found: error
          retention-days: 30
