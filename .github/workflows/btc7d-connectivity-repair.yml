name: BTC 7D lease and routing audit
on:
  push:
    branches: [fix/btc7d-bridge-connectivity-20261021]
    paths: ['bridge_repair_btc/**', '.github/workflows/btc7d-connectivity-repair.yml']
permissions:
  contents: read
concurrency:
  group: rizan-cbot-bridge-production-ssh
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only lease and route audit
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          opts=(-i "$ssh_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=20)
          target=Rizanrizan@202.74.74.172
          remote="/home/Rizanrizan/btc7d-audit-${GITHUB_RUN_ID}"
          ssh "${opts[@]}" "$target" "umask 077; mkdir -p '$remote'"
          scp "${opts[@]}" bridge_repair_btc/{audit_btc.py,lease_audit.py} "$target:$remote/"
          ssh "${opts[@]}" "$target" "sudo -n python3 '$remote/lease_audit.py'" | tee BTC_LEASE_AUDIT.json
      - uses: actions/upload-artifact@v4
        with:
          name: BTC7D-LEASE-AUDIT
          path: BTC_LEASE_AUDIT.json
