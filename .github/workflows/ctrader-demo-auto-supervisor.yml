name: cTrader Demo Auto Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * 1-5"

permissions:
  actions: write
  contents: read

concurrency:
  group: ctrader-demo-auto-supervisor
  cancel-in-progress: false

jobs:
  dispatch-fast-and-discovery-lanes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Dispatch five-core execution and discovery lanes every minute
        shell: bash
        run: |
          set -euo pipefail

          fast_dispatched=0
          fast_busy=0
          discovery_dispatched=0
          discovery_busy=0

          active_count() {
            local workflow_file="$1"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
          }

          dispatch_workflow() {
            local workflow_file="$1"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
              -f ref=main
          }

          market_weekday_utc() {
            local weekday
            weekday="$(date -u +%u)"
            [ "${weekday}" -le 5 ]
          }

          if ! market_weekday_utc; then
            echo "CTRADER_DEMO_SUPERVISOR_MARKET_CLOSED calendar=WEEKDAY_24X5 action=NO_DISPATCH"
            exit 0
          fi

          echo "CTRADER_DEMO_SUPERVISOR_START event=${GITHUB_EVENT_NAME} universe=XAUUSD,EURUSD,GBPUSD,USDJPY,AUDUSD strategies=FIVE_CORE_ROUTER_V1 fast_cadence_seconds=60 discovery_check_seconds=60 overlap_within_lane=DISABLED cross_lane=ENABLED authority=SCHEDULE_15M self_handoff=DISABLED"

          # One scheduled supervisor owns one bounded 15-minute window.  The
          # next cron run becomes the next owner; no workflow_run/push trigger
          # and no recursive handoff can cancel or multiply healthy supervisors.
          for cycle in $(seq 1 15); do
            if ! market_weekday_utc; then
              echo "CTRADER_DEMO_SUPERVISOR_MARKET_CLOSED cycle=${cycle}/15 calendar=WEEKDAY_24X5 action=STOP"
              exit 0
            fi

            active_fast="$(active_count ctrader-demo-auto-pipeline.yml)"
            if [ "${active_fast}" -eq 0 ]; then
              echo "SUPERVISOR_FAST_DISPATCH cycle=${cycle}/15 cadence_seconds=60"
              dispatch_workflow ctrader-demo-auto-pipeline.yml
              fast_dispatched=$((fast_dispatched + 1))
            else
              echo "SUPERVISOR_FAST_SKIP_BUSY cycle=${cycle}/15 active_runs=${active_fast}"
              fast_busy=$((fast_busy + 1))
            fi

            active_discovery="$(active_count ctrader-demo-discovery-pipeline.yml)"
            if [ "${active_discovery}" -eq 0 ]; then
              echo "SUPERVISOR_DISCOVERY_DISPATCH cycle=${cycle}/15 check_seconds=60"
              dispatch_workflow ctrader-demo-discovery-pipeline.yml
              discovery_dispatched=$((discovery_dispatched + 1))
            else
              echo "SUPERVISOR_DISCOVERY_SKIP_BUSY cycle=${cycle}/15 active_runs=${active_discovery}"
              discovery_busy=$((discovery_busy + 1))
            fi

            if [ "${cycle}" -lt 15 ]; then
              sleep 60
            fi
          done

          echo "CTRADER_DEMO_SUPERVISOR_OK universe=XAUUSD,EURUSD,GBPUSD,USDJPY,AUDUSD strategies=FIVE_CORE_ROUTER_V1 fast_dispatched=${fast_dispatched} fast_busy=${fast_busy} discovery_dispatched=${discovery_dispatched} discovery_busy=${discovery_busy} fast_cadence_seconds=60 discovery_check_seconds=60 overlap_within_lane=DISABLED authority=SCHEDULE_15M self_handoff=DISABLED"
