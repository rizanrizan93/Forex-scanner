name: cTrader Demo Auto Supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: ctrader-demo-auto-supervisor
  cancel-in-progress: false

jobs:
  dispatch-fast-and-discovery-lanes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Dispatch one bounded fast and discovery cycle
        shell: bash
        run: |
          set -euo pipefail

          active_count() {
            local workflow_file="$1"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
          }

          dispatch_workflow() {
            local workflow_file="$1"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
              -f ref=main
          }

          echo "CTRADER_DEMO_SUPERVISOR_START event=${GITHUB_EVENT_NAME} universe=XAUUSD,EURUSD strategies=PAIR_SPECIFIC cadence_minutes=5 self_handoff=DISABLED"

          active_fast="$(active_count ctrader-demo-auto-pipeline.yml)"
          if [ "${active_fast}" -eq 0 ]; then
            echo "SUPERVISOR_FAST_DISPATCH cadence_minutes=5"
            dispatch_workflow ctrader-demo-auto-pipeline.yml
          else
            echo "SUPERVISOR_FAST_SKIP_BUSY active_runs=${active_fast}"
          fi

          active_discovery="$(active_count ctrader-demo-discovery-pipeline.yml)"
          if [ "${active_discovery}" -eq 0 ]; then
            echo "SUPERVISOR_DISCOVERY_DISPATCH cadence_minutes=5"
            dispatch_workflow ctrader-demo-discovery-pipeline.yml
          else
            echo "SUPERVISOR_DISCOVERY_SKIP_BUSY active_runs=${active_discovery}"
          fi

          echo "CTRADER_DEMO_SUPERVISOR_OK universe=XAUUSD,EURUSD cadence_minutes=5 overlap_within_lane=DISABLED self_handoff=DISABLED"
