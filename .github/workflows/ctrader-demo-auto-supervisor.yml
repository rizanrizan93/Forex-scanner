name: cTrader Demo Auto Supervisor

on:
  workflow_dispatch:
  schedule:
    # Primary 5-minute authority. A separate recovery watchdog can re-dispatch
    # this bounded supervisor if GitHub stops delivering the primary cron.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * 1-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ctrader-demo-auto-supervisor.yml"
      - ".github/workflows/ctrader-demo-auto-pipeline.yml"
      - ".github/workflows/ctrader-demo-auto-recovery-watchdog.yml"
      - "src/fx_scanner/demo_xau_d1_tsmom_candidate_producer.py"
      - "src/fx_scanner/demo_five_core_candidate_producer.py"
      - "src/fx_scanner/demo_five_core_router.py"
      - "src/fx_scanner/demo_xau_m15_ema_smc_reclaim.py"
      - "src/fx_scanner/demo_xau_m15_ema_smc_reclaim_execution.py"
      - "src/fx_scanner/demo_xau_m15_ema_smc_reclaim_candidate_producer.py"
      - "src/fx_scanner/demo_xau_m15_liquidity_sweep_fade.py"
      - "src/fx_scanner/demo_xau_m15_liquidity_sweep_fade_candidate_producer.py"
      - "src/fx_scanner/demo_execution_fresh_ready_handoff.py"
      - "src/fx_scanner/demo_fresh_ready_handoff.py"

permissions:
  actions: write
  contents: read

concurrency:
  group: ctrader-demo-auto-supervisor
  cancel-in-progress: false

jobs:
  dispatch-xau-execution-and-research-lanes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Dispatch execution and discovery lanes every minute
        shell: bash
        run: |
          set -euo pipefail

          fast_dispatched=0
          fast_busy=0
          discovery_dispatched=0
          discovery_busy=0

          active_count() {
            local workflow_file="$1"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
          }

          dispatch_workflow() {
            local workflow_file="$1"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
              -f ref=main
          }

          market_weekday_utc() {
            local weekday
            weekday="$(date -u +%u)"
            [ "${weekday}" -le 5 ]
          }

          if ! market_weekday_utc; then
            echo "CTRADER_DEMO_SUPERVISOR_MARKET_CLOSED calendar=WEEKDAY_24X5 action=NO_DISPATCH"
            exit 0
          fi

          echo "CTRADER_DEMO_SUPERVISOR_START event=${GITHUB_EVENT_NAME} head_sha=${GITHUB_SHA} universe=XAUUSD strategies=D1_TSMOM_60_200,XAU_M15_EMA_SMC_RECLAIM_V1 challengers=IMPULSE_RETEST_V2,XAU_EXPANSION_V42,XAU_M15_EMA_REVERSAL_RECOVERY_V1,TELEGRAM_XAU_M15_SWEEP_FADE_V1 fast_cadence_seconds=60 discovery_check_seconds=60 overlap_within_lane=DISABLED cross_lane=ENABLED authority=SCHEDULE_5M push_kick=SUPERVISOR_OR_AUTO_PIPELINE xau_ema_smc_push_kick=ENABLED telegram_strategy_push_kick=ENABLED self_handoff=DISABLED"

          # Each supervisor owns one bounded five-minute window. Scheduled runs
          # are re-registered every five minutes. A push touching this supervisor,
          # the execution Auto Pipeline, or an execution-authorized XAU strategy
          # provides an immediate recovery kick so execution-policy changes cannot
          # wait for a stale cron registration. Lane-level active checks prevent
          # duplicate Auto/Discovery execution within the window.
          for cycle in $(seq 1 5); do
            if ! market_weekday_utc; then
              echo "CTRADER_DEMO_SUPERVISOR_MARKET_CLOSED cycle=${cycle}/5 calendar=WEEKDAY_24X5 action=STOP"
              exit 0
            fi

            active_fast="$(active_count ctrader-demo-auto-pipeline.yml)"
            if [ "${active_fast}" -eq 0 ]; then
              echo "SUPERVISOR_FAST_DISPATCH cycle=${cycle}/5 cadence_seconds=60 head_sha=${GITHUB_SHA}"
              dispatch_workflow ctrader-demo-auto-pipeline.yml
              fast_dispatched=$((fast_dispatched + 1))
            else
              echo "SUPERVISOR_FAST_SKIP_BUSY cycle=${cycle}/5 active_runs=${active_fast}"
              fast_busy=$((fast_busy + 1))
            fi

            active_discovery="$(active_count ctrader-demo-discovery-pipeline.yml)"
            if [ "${active_discovery}" -eq 0 ]; then
              echo "SUPERVISOR_DISCOVERY_DISPATCH cycle=${cycle}/5 check_seconds=60 head_sha=${GITHUB_SHA}"
              dispatch_workflow ctrader-demo-discovery-pipeline.yml
              discovery_dispatched=$((discovery_dispatched + 1))
            else
              echo "SUPERVISOR_DISCOVERY_SKIP_BUSY cycle=${cycle}/5 active_runs=${active_discovery}"
              discovery_busy=$((discovery_busy + 1))
            fi

            if [ "${cycle}" -lt 5 ]; then
              sleep 60
            fi
          done

          echo "CTRADER_DEMO_SUPERVISOR_OK head_sha=${GITHUB_SHA} universe=XAUUSD strategies=D1_TSMOM_60_200,XAU_M15_EMA_SMC_RECLAIM_V1 challengers=IMPULSE_RETEST_V2,XAU_EXPANSION_V42,XAU_M15_EMA_REVERSAL_RECOVERY_V1,TELEGRAM_XAU_M15_SWEEP_FADE_V1 fast_dispatched=${fast_dispatched} fast_busy=${fast_busy} discovery_dispatched=${discovery_dispatched} discovery_busy=${discovery_busy} fast_cadence_seconds=60 discovery_check_seconds=60 overlap_within_lane=DISABLED authority=SCHEDULE_5M push_kick=SUPERVISOR_OR_AUTO_PIPELINE xau_ema_smc_push_kick=ENABLED telegram_strategy_push_kick=ENABLED self_handoff=DISABLED"
