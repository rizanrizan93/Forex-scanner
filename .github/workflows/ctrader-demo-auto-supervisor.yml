name: cTrader Demo Auto Supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * 1-5"
  workflow_run:
    workflows: ["cTrader Demo Technical Heartbeat"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: ctrader-demo-auto-supervisor
  cancel-in-progress: false

jobs:
  dispatch-two-minute-demo-pipeline:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Dispatch DEMO pipeline every two minutes without overlap
        shell: bash
        run: |
          set -euo pipefail
          dispatched=0
          skipped_busy=0

          echo "CTRADER_DEMO_SUPERVISOR_START event=${GITHUB_EVENT_NAME} cadence_seconds=120 self_renew_schedule=ENABLED"

          for cycle in $(seq 1 30); do
            active_runs="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-pipeline.yml/runs?branch=main&per_page=20" \
                --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
            )"

            if [ "${active_runs}" -eq 0 ]; then
              echo "SUPERVISOR_DISPATCH cycle=${cycle}/30 cadence_seconds=120"
              gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-pipeline.yml/dispatches" \
                -f ref=main
              dispatched=$((dispatched + 1))
            else
              echo "SUPERVISOR_SKIP_BUSY cycle=${cycle}/30 active_runs=${active_runs}"
              skipped_busy=$((skipped_busy + 1))
            fi

            if [ "${cycle}" -lt 30 ]; then
              sleep 120
            fi
          done

          echo "CTRADER_DEMO_SUPERVISOR_OK dispatched=${dispatched} skipped_busy=${skipped_busy} cadence_seconds=120 overlap=DISABLED self_renew_schedule=ENABLED"
