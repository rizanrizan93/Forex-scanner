name: cTrader Demo Auto Supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows: ["cTrader Demo Technical Heartbeat"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: ctrader-demo-auto-supervisor
  cancel-in-progress: false

jobs:
  dispatch-fast-and-discovery-lanes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Dispatch fast lane every two minutes and discovery lane independently
        shell: bash
        run: |
          set -euo pipefail
          fast_dispatched=0
          fast_busy=0
          discovery_dispatched=0
          discovery_busy=0

          active_count() {
            local workflow_file="$1"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
          }

          dispatch_workflow() {
            local workflow_file="$1"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
              -f ref=main
          }

          echo "CTRADER_DEMO_SUPERVISOR_START event=${GITHUB_EVENT_NAME} fast_cadence_seconds=120 discovery_check_seconds=360 overlap=DISABLED_WITHIN_LANE overlap_within_lane=DISABLED cross_lane=ENABLED calendar=SEVEN_DAYS"

          for cycle in $(seq 1 30); do
            active_fast="$(active_count ctrader-demo-auto-pipeline.yml)"
            if [ "${active_fast}" -eq 0 ]; then
              echo "SUPERVISOR_FAST_DISPATCH cycle=${cycle}/30 cadence_seconds=120"
              dispatch_workflow ctrader-demo-auto-pipeline.yml
              fast_dispatched=$((fast_dispatched + 1))
            else
              echo "SUPERVISOR_SKIP_BUSY lane=FAST cycle=${cycle}/30 active_runs=${active_fast}"
              echo "SUPERVISOR_FAST_SKIP_BUSY cycle=${cycle}/30 active_runs=${active_fast}"
              fast_busy=$((fast_busy + 1))
            fi

            if [ $(((cycle - 1) % 3)) -eq 0 ]; then
              active_discovery="$(active_count ctrader-demo-discovery-pipeline.yml)"
              if [ "${active_discovery}" -eq 0 ]; then
                echo "SUPERVISOR_DISCOVERY_DISPATCH cycle=${cycle}/30 check_seconds=360"
                dispatch_workflow ctrader-demo-discovery-pipeline.yml
                discovery_dispatched=$((discovery_dispatched + 1))
              else
                echo "SUPERVISOR_DISCOVERY_SKIP_BUSY cycle=${cycle}/30 active_runs=${active_discovery}"
                discovery_busy=$((discovery_busy + 1))
              fi
            fi

            if [ "${cycle}" -lt 30 ]; then
              sleep 120
            fi
          done

          echo "CTRADER_DEMO_SUPERVISOR_OK fast_dispatched=${fast_dispatched} fast_busy=${fast_busy} discovery_dispatched=${discovery_dispatched} discovery_busy=${discovery_busy} fast_cadence_seconds=120 discovery_check_seconds=360 overlap=DISABLED_WITHIN_LANE overlap_within_lane=DISABLED cross_lane=ENABLED calendar=SEVEN_DAYS"
