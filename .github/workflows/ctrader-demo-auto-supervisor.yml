name: cTrader Demo Auto Supervisor

on:
  workflow_dispatch:
  schedule:
    # Primary 5-minute authority. A separate recovery watchdog can re-dispatch
    # this bounded supervisor if GitHub stops delivering the primary cron.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * 0-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ctrader-demo-auto-supervisor.yml"
      - ".github/workflows/ctrader-demo-auto-pipeline.yml"
      - ".github/workflows/ctrader-demo-token-maintainer.yml"
      - ".github/workflows/ctrader-demo-xau-execution-lane.yml"
      - ".github/workflows/ctrader-demo-xau-afic-prepared-lane.yml"
      - ".github/workflows/ctrader-demo-maintenance-pipeline.yml"
      - ".github/workflows/ctrader-demo-xau-v218-htf-snapshot.yml"
      - ".github/workflows/ctrader-demo-discovery-pipeline.yml"
      - ".github/workflows/ctrader-demo-calibration-pipeline.yml"
      - ".github/workflows/ctrader-demo-xau-dom-v191.yml"
      - ".github/workflows/research-xau-forecast-ensemble-v171.yml"
      - "src/fx_scanner/research_xau_forecast_ensemble_v171.py"
      - "src/fx_scanner/research_xau_forecast_ensemble_v171_runtime.py"
      - ".github/workflows/ctrader-demo-auto-recovery-watchdog.yml"
      - "src/fx_scanner/demo_xau_v24_champion_candidate_producer.py"
      - "src/fx_scanner/demo_xau_v24_utc_d1_context.py"
      - "src/fx_scanner/demo_xau_v24_champion_time_exit.py"
      - "src/fx_scanner/demo_five_core_candidate_producer.py"
      - "src/fx_scanner/demo_five_core_router.py"
      - "src/fx_scanner/demo_xau_m15_ema_smc_reclaim.py"
      - "src/fx_scanner/demo_xau_m15_ema_smc_reclaim_execution.py"
      - "src/fx_scanner/demo_xau_m15_ema_smc_reclaim_candidate_producer.py"
      - "src/fx_scanner/demo_xau_m15_liquidity_sweep_fade.py"
      - "src/fx_scanner/demo_xau_m15_liquidity_sweep_fade_candidate_producer.py"
      - "src/fx_scanner/demo_xau_afic_path_shadow_observer.py"
      - "src/fx_scanner/demo_xau_afic_prepared_plan_producer.py"
      - "src/fx_scanner/demo_xau_afic_fresh_ready_handoff.py"
      - "src/fx_scanner/demo_xau_outcome_ledger.py"
      - "src/fx_scanner/demo_xau_prepared_plan_lifecycle.py"
      - "src/fx_scanner/demo_xau_premap_candidate_v181.py"
      - "src/fx_scanner/demo_xau_supply_demand_atlas_v182.py"
      - "src/fx_scanner/demo_xau_v196_shadow_evidence_v197.py"
      - "src/fx_scanner/demo_xau_v198_evidence_analytics.py"
      - "src/fx_scanner/demo_xau_v201_reaction_ladder.py"
      - "src/fx_scanner/demo_xau_v217_direction_probability.py"
      - "src/fx_scanner/demo_xau_v218_htf_strategic_snapshot.py"
      - "src/fx_scanner/demo_xau_v220_direction_prospective_calibration.py"
      - "src/fx_scanner/demo_xau_v222_m5_pocket_quality.py"
      - "src/fx_scanner/demo_xau_v223_m5_pocket_cluster_selector.py"
      - "src/fx_scanner/demo_xau_v224_primary_pocket_prospective.py"
      - "src/fx_scanner/demo_xau_v226_rizan_depth_map.py"
      - "src/fx_scanner/demo_xau_v227_depth_map_prospective.py"
      - "src/fx_scanner/demo_xau_v229_depth_execution.py"
      - "src/fx_scanner/demo_xau_v229_child_executor.py"
      - "src/fx_scanner/xau_decision_meta_v296.py"
      - "src/fx_scanner/demo_xau_decision_center_v296.py"
      - "src/fx_scanner/demo_xau_meta_research_sampler_v297.py"
      - "src/fx_scanner/xau_pressure_transition_v249.py"
      - "src/fx_scanner/xau_dynamic_depth_hazard_v251.py"
      - "src/fx_scanner/demo_xau_v229_ladder_plan.py"
      - "src/fx_scanner/demo_xau_v203_volatility_shock_guard.py"
      - "src/fx_scanner/demo_execution_fresh_ready_handoff.py"
      - "src/fx_scanner/demo_fresh_ready_handoff.py"

permissions:
  actions: write
  contents: read

concurrency:
  group: ctrader-demo-auto-supervisor
  cancel-in-progress: false

jobs:
  dispatch-xau-execution-and-research-lanes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Dispatch minute execution plus bounded maintenance and discovery
        shell: bash
        run: |
          set -euo pipefail

          execution_dispatched=0
          execution_busy=0
          rizan_dispatched=0
          rizan_busy=0
          maintenance_dispatched=0
          maintenance_busy=0
          dom_dispatched=0
          dom_busy=0
          discovery_dispatched=0
          discovery_busy=0
          calibration_dispatched=0
          calibration_busy=0
          forecast_v171_dispatched=0
          forecast_v171_busy=0
          token_maintainer_dispatched=0

          active_count() {
            local workflow_file="$1"
            local attempt value
            for attempt in 1 2 3; do
              if value="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=20" \
                  --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length' \
                  2>/tmp/gh-active-count.err
              )"; then
                printf '%s\n' "${value}"
                return 0
              fi
              echo "SUPERVISOR_GH_API_RETRY operation=active_count workflow=${workflow_file} attempt=${attempt}/3" >&2
              sleep $((attempt * 2))
            done
            # Unknown activity must be treated as busy so transient GitHub API
            # failures can never create duplicate workflow dispatches.
            echo "SUPERVISOR_GH_API_FAIL_CLOSED operation=active_count workflow=${workflow_file} assumed_active=1" >&2
            printf '1\n'
          }

          cancel_stale_discovery_runs() {
            local workflow_file="ctrader-demo-discovery-pipeline.yml"
            local stale_after_seconds=1800
            local now_epoch rows run_id status created_at created_epoch age_seconds

            now_epoch="$(date -u +%s)"
            if ! rows="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=20" \
                --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") | [.id, .status, .created_at] | join("|")' \
                2>/tmp/gh-stale-discovery.err
            )"; then
              echo "SUPERVISOR_DISCOVERY_STALE_CHECK_FAILED safety=FAIL_CLOSED" >&2
              return 0
            fi

            while IFS='|' read -r run_id status created_at; do
              [ -n "${run_id:-}" ] || continue
              if ! created_epoch="$(date -u -d "${created_at}" +%s 2>/dev/null)"; then
                echo "SUPERVISOR_DISCOVERY_STALE_PARSE_FAILED run_id=${run_id} status=${status} safety=FAIL_CLOSED" >&2
                continue
              fi
              age_seconds=$((now_epoch - created_epoch))
              if [ "${age_seconds}" -lt "${stale_after_seconds}" ]; then
                continue
              fi

              if gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                >/dev/null 2>/tmp/gh-stale-discovery-cancel.err; then
                echo "SUPERVISOR_DISCOVERY_STALE_CANCELLED run_id=${run_id} status=${status} age_seconds=${age_seconds} stale_after_seconds=${stale_after_seconds}"
              else
                echo "SUPERVISOR_DISCOVERY_STALE_CANCEL_FAILED run_id=${run_id} status=${status} age_seconds=${age_seconds} safety=FAIL_CLOSED" >&2
              fi
            done <<< "${rows}"
          }

          cancel_stale_lane_runs() {
            local workflow_file="$1"
            local label="$2"
            local stale_after_seconds="$3"
            local now_epoch rows run_id status created_at created_epoch age_seconds

            now_epoch="$(date -u +%s)"
            if ! rows="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=20" \
                --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") | [.id, .status, .created_at] | join("|")' \
                2>/tmp/gh-stale-lane.err
            )"; then
              echo "SUPERVISOR_${label}_STALE_CHECK_FAILED safety=FAIL_CLOSED" >&2
              return 0
            fi

            while IFS='|' read -r run_id status created_at; do
              [ -n "${run_id:-}" ] || continue
              if ! created_epoch="$(date -u -d "${created_at}" +%s 2>/dev/null)"; then
                echo "SUPERVISOR_${label}_STALE_PARSE_FAILED run_id=${run_id} status=${status} safety=FAIL_CLOSED" >&2
                continue
              fi
              age_seconds=$((now_epoch - created_epoch))
              if [ "${age_seconds}" -lt "${stale_after_seconds}" ]; then
                continue
              fi

              if gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                >/dev/null 2>/tmp/gh-stale-lane-cancel.err; then
                echo "SUPERVISOR_${label}_STALE_CANCELLED run_id=${run_id} status=${status} age_seconds=${age_seconds} stale_after_seconds=${stale_after_seconds}"
              else
                echo "SUPERVISOR_${label}_STALE_CANCEL_FAILED run_id=${run_id} status=${status} age_seconds=${age_seconds} safety=FAIL_CLOSED" >&2
              fi
            done <<< "${rows}"
          }

          dispatch_workflow() {
            local workflow_file="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
                -f ref=main >/dev/null 2>/tmp/gh-dispatch.err; then
                return 0
              fi
              echo "SUPERVISOR_GH_API_RETRY operation=dispatch workflow=${workflow_file} attempt=${attempt}/3" >&2
              sleep $((attempt * 2))
            done
            echo "SUPERVISOR_GH_API_FAIL_CLOSED operation=dispatch workflow=${workflow_file}" >&2
            return 1
          }

          latest_success_age_seconds() {
            local workflow_file="$1"
            local updated_at updated_epoch now_epoch
            if ! updated_at="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=20" \
                --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")][0].updated_at // ""' \
                2>/tmp/gh-latest-success-age.err
            )"; then
              echo "-1"
              return 0
            fi
            if [ -z "${updated_at}" ]; then
              echo "-1"
              return 0
            fi
            if ! updated_epoch="$(date -u -d "${updated_at}" +%s 2>/dev/null)"; then
              echo "-1"
              return 0
            fi
            now_epoch="$(date -u +%s)"
            echo $((now_epoch - updated_epoch))
          }


          market_open_utc() {
            local weekday hour
            weekday="$(date -u +%u)"
            hour="$(date -u +%H)"
            # Forex week: Sunday evening UTC through Friday evening UTC.
            # Broker/session availability remains authoritative downstream.
            if [ "${weekday}" -eq 7 ]; then
              [ "${hour}" -ge 21 ]
            elif [ "${weekday}" -ge 1 ] && [ "${weekday}" -le 4 ]; then
              return 0
            elif [ "${weekday}" -eq 5 ]; then
              [ "${hour}" -lt 22 ]
            else
              return 1
            fi
          }

          if ! market_open_utc; then
            echo "CTRADER_DEMO_SUPERVISOR_MARKET_CLOSED calendar=FOREX_WEEK_24X5 action=NO_DISPATCH"
            exit 0
          fi

          echo "CTRADER_DEMO_SUPERVISOR_START event=${GITHUB_EVENT_NAME} head_sha=${GITHUB_SHA} universe=XAUUSD strategies=XAU_V24_CHAMPION_DEMO_V1,XAU_M15_EMA_SMC_RECLAIM_V1,XAU_RIZAN_DEPTH_EXECUTION_V1 challengers=IMPULSE_RETEST_V2,XAU_EXPANSION_V42,XAU_M15_EMA_REVERSAL_RECOVERY_V1,TELEGRAM_XAU_M15_SWEEP_FADE_V1,XAU_RIZAN_PATH_PREPARED_V1 fast_cadence_seconds=60 maintenance_cadence_seconds=300 forecast_v171_cadence_seconds=300 forecast_v171_authority=SHADOW_ONLY discovery_check_seconds=60 discovery_stale_seconds=1800 calibration_mode=PAUSED_XAU_ONLY rizan_prepared_check_seconds=60 overlap_within_lane=DISABLED cross_lane=ENABLED authority=SCHEDULE_5M execution_workflow=ctrader-demo-xau-execution-lane.yml rizan_workflow=ctrader-demo-xau-afic-prepared-lane.yml maintenance_workflow=ctrader-demo-maintenance-pipeline.yml dom_workflow=ctrader-demo-xau-dom-v191.yml dom_cadence_seconds=60 push_kick=SUPERVISOR_EXECUTION_OR_MAINTENANCE_CHANGE self_handoff=SAFE_CONDITIONAL"

          latest_execution_guard_state() {
            local value
            if value="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-xau-execution-lane.yml/runs?branch=main&per_page=5" \
                --jq '[.workflow_runs[0].status // "", .workflow_runs[0].conclusion // ""] | join("|")' \
                2>/tmp/gh-cycle-execution-state.err
            )"; then
              printf '%s\n' "${value}"
              return 0
            fi
            # Unknown status is treated as busy/unsafe rather than triggering
            # extra dispatches after an infrastructure failure.
            printf 'unknown|unknown\n'
          }

          # Token durability is safety-critical but non-trading. GitHub scheduled
          # events can be delayed or dropped, so the primary supervisor provides
          # an independent recovery path for the hourly token maintainer.
          token_maintainer_workflow="ctrader-demo-token-maintainer.yml"
          token_maintainer_age="$(latest_success_age_seconds "${token_maintainer_workflow}")"
          active_token_maintainer="$(active_count "${token_maintainer_workflow}")"
          if [ "${active_token_maintainer}" -eq 0 ] && { [ "${token_maintainer_age}" -lt 0 ] || [ "${token_maintainer_age}" -gt 5400 ]; }; then
            if dispatch_workflow "${token_maintainer_workflow}"; then
              token_maintainer_dispatched=1
              echo "SUPERVISOR_TOKEN_MAINTAINER_RECOVERY action=DISPATCHED age_seconds=${token_maintainer_age} stale_after_seconds=5400"
            else
              echo "SUPERVISOR_TOKEN_MAINTAINER_RECOVERY action=DISPATCH_FAILED safety=FAIL_CLOSED age_seconds=${token_maintainer_age}" >&2
            fi
          elif [ "${active_token_maintainer}" -gt 0 ]; then
            echo "SUPERVISOR_TOKEN_MAINTAINER_OK action=ACTIVE_RUN age_seconds=${token_maintainer_age}"
          else
            echo "SUPERVISOR_TOKEN_MAINTAINER_OK action=FRESH age_seconds=${token_maintainer_age} stale_after_seconds=5400"
          fi

          # Each supervisor owns one bounded five-minute window. The exact XAU
          # execution lane is checked every minute so the V24 three-minute entry
          # grace is not bottlenecked by long lifecycle/shadow work. Maintenance
          # is dispatched once per supervisor window and never authorizes a new
          # order. Discovery remains independent and non-executing.
          for cycle in $(seq 1 5); do
            if [ "${cycle}" -gt 1 ]; then
              cycle_execution_state="$(latest_execution_guard_state)"
              IFS='|' read -r cycle_execution_status cycle_execution_conclusion <<< "${cycle_execution_state}"
              if [ "${cycle_execution_status}" = "completed" ] && [ "${cycle_execution_conclusion}" != "success" ]; then
                echo "SUPERVISOR_EXECUTION_FAILURE_CIRCUIT_BREAK cycle=${cycle}/5 latest_execution_status=${cycle_execution_status} latest_execution_conclusion=${cycle_execution_conclusion} action=STOP_REDISPATCH safety=FAIL_CLOSED"
                break
              fi
              if [ "${cycle_execution_status}" = "unknown" ]; then
                echo "SUPERVISOR_EXECUTION_STATE_UNKNOWN cycle=${cycle}/5 action=STOP_REDISPATCH safety=FAIL_CLOSED"
                break
              fi
            fi

            if ! market_open_utc; then
              echo "CTRADER_DEMO_SUPERVISOR_MARKET_CLOSED cycle=${cycle}/5 calendar=FOREX_WEEK_24X5 action=STOP"
              exit 0
            fi

            # A queued/in-progress GitHub run can survive indefinitely before
            # job-level timeout starts. Retire only clearly stale lane runs so one
            # orphaned queue item cannot block the whole scanner indefinitely.
            cancel_stale_lane_runs "ctrader-demo-xau-execution-lane.yml" "EXECUTION" 600
            cancel_stale_lane_runs "ctrader-demo-xau-afic-prepared-lane.yml" "RIZAN_PREPARED" 600
            cancel_stale_lane_runs "ctrader-demo-xau-dom-v191.yml" "DOM_V191" 600

            active_execution="$(active_count ctrader-demo-xau-execution-lane.yml)"
            if [ "${active_execution}" -eq 0 ]; then
              echo "SUPERVISOR_EXECUTION_DISPATCH cycle=${cycle}/5 cadence_seconds=60 head_sha=${GITHUB_SHA}"
              dispatch_workflow ctrader-demo-xau-execution-lane.yml
              execution_dispatched=$((execution_dispatched + 1))
            else
              echo "SUPERVISOR_EXECUTION_SKIP_BUSY cycle=${cycle}/5 active_runs=${active_execution}"
              execution_busy=$((execution_busy + 1))
            fi

            active_rizan="$(active_count ctrader-demo-xau-afic-prepared-lane.yml)"
            if [ "${active_rizan}" -eq 0 ]; then
              echo "SUPERVISOR_RIZAN_PREPARED_DISPATCH cycle=${cycle}/5 cadence_seconds=60 head_sha=${GITHUB_SHA}"
              dispatch_workflow ctrader-demo-xau-afic-prepared-lane.yml
              rizan_dispatched=$((rizan_dispatched + 1))
            else
              echo "SUPERVISOR_RIZAN_PREPARED_SKIP_BUSY cycle=${cycle}/5 active_runs=${active_rizan}"
              rizan_busy=$((rizan_busy + 1))
            fi

            active_dom="$(active_count ctrader-demo-xau-dom-v191.yml)"
            if [ "${active_dom}" -eq 0 ]; then
              echo "SUPERVISOR_DOM_V191_DISPATCH cycle=${cycle}/5 cadence_seconds=60 head_sha=${GITHUB_SHA}"
              dispatch_workflow ctrader-demo-xau-dom-v191.yml
              dom_dispatched=$((dom_dispatched + 1))
            else
              echo "SUPERVISOR_DOM_V191_SKIP_BUSY cycle=${cycle}/5 active_runs=${active_dom}"
              dom_busy=$((dom_busy + 1))
            fi

            if [ "${cycle}" -eq 1 ]; then
              active_maintenance="$(active_count ctrader-demo-maintenance-pipeline.yml)"
              if [ "${active_maintenance}" -eq 0 ]; then
                echo "SUPERVISOR_MAINTENANCE_DISPATCH cycle=${cycle}/5 cadence_seconds=300 head_sha=${GITHUB_SHA}"
                dispatch_workflow ctrader-demo-maintenance-pipeline.yml
                maintenance_dispatched=$((maintenance_dispatched + 1))
              else
                echo "SUPERVISOR_MAINTENANCE_SKIP_BUSY cycle=${cycle}/5 active_runs=${active_maintenance}"
                maintenance_busy=$((maintenance_busy + 1))
              fi
            fi

            if [ "${cycle}" -eq 1 ]; then
              active_v171="$(active_count research-xau-forecast-ensemble-v171.yml)"
              if [ "${active_v171}" -eq 0 ]; then
                echo "SUPERVISOR_V171_DISPATCH cycle=${cycle}/5 cadence_seconds=300 policy_effect=SHADOW_ONLY execution_authority=NONE head_sha=${GITHUB_SHA}"
                dispatch_workflow research-xau-forecast-ensemble-v171.yml
                forecast_v171_dispatched=$((forecast_v171_dispatched + 1))
              else
                echo "SUPERVISOR_V171_SKIP_BUSY cycle=${cycle}/5 active_runs=${active_v171} policy_effect=SHADOW_ONLY execution_authority=NONE"
                forecast_v171_busy=$((forecast_v171_busy + 1))
              fi
            fi

            # V298: legacy multi-pair calibration remains available manually,
            # but automatic runtime resources are reserved for XAUUSD.
            echo "SUPERVISOR_CALIBRATION_PAUSED_XAU_ONLY cycle=${cycle}/5 execution_authority=NONE"

            cancel_stale_discovery_runs
            active_discovery="$(active_count ctrader-demo-discovery-pipeline.yml)"
            if [ "${active_discovery}" -eq 0 ]; then
              echo "SUPERVISOR_DISCOVERY_DISPATCH cycle=${cycle}/5 check_seconds=60 head_sha=${GITHUB_SHA}"
              dispatch_workflow ctrader-demo-discovery-pipeline.yml
              discovery_dispatched=$((discovery_dispatched + 1))
            else
              echo "SUPERVISOR_DISCOVERY_SKIP_BUSY cycle=${cycle}/5 active_runs=${active_discovery}"
              discovery_busy=$((discovery_busy + 1))
            fi

            if [ "${cycle}" -lt 5 ]; then
              sleep 60
            fi
          done

          # The supervisor has no broker execution authority; it only dispatches
          # bounded workers that each enforce their own concurrency/idempotency gates.
          # Therefore the next supervisor may be queued even while the latest XAU
          # execution lane is still finishing. Requiring that lane to complete first
          # previously broke the self-handoff chain whenever a normal lane took >2m.
          other_active_supervisors=1
          for supervisor_query_attempt in 1 2 3; do
            if other_active_supervisors="$(
              gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-supervisor.yml/runs?branch=main&per_page=20" --jq "[.workflow_runs[] | select((.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") and (.id != ${GITHUB_RUN_ID}))] | length" 2>/tmp/gh-other-supervisors.err
            )"; then
              break
            fi
            echo "SUPERVISOR_GH_API_RETRY operation=other_active_supervisors attempt=${supervisor_query_attempt}/3" >&2
            other_active_supervisors=1
            sleep $((supervisor_query_attempt * 2))
          done

          self_handoff=0
          if market_open_utc && [ "${other_active_supervisors}" -eq 0 ]; then
            if dispatch_workflow ctrader-demo-auto-supervisor.yml; then
              self_handoff=1
              echo "CTRADER_DEMO_SUPERVISOR_SELF_HANDOFF_DISPATCHED source_run=${GITHUB_RUN_ID} safety=DISPATCH_ONLY execution_overlap_guard=ACTIVE_COUNT"
            else
              echo "CTRADER_DEMO_SUPERVISOR_SELF_HANDOFF_DISPATCH_FAILED source_run=${GITHUB_RUN_ID} safety=FAIL_CLOSED" >&2
            fi
          else
            echo "CTRADER_DEMO_SUPERVISOR_SELF_HANDOFF_SKIPPED source_run=${GITHUB_RUN_ID} other_active_supervisors=${other_active_supervisors} market_open_check=FAILED_OR_DUPLICATE safety=FAIL_CLOSED"
          fi
