name: RIZAN XAU R5 Readonly Trend + Macro Research

on:
  pull_request:
    paths:
      - "src/fx_scanner/xau_microalpha_r5.py"
      - "tests/test_xau_microalpha_r5.py"
      - "scripts/research_xau_microalpha_r5_multiyear.py"
      - ".github/workflows/xau-microalpha-r5-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r5-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal research dependencies
        run: python -m pip install pandas==2.2.3 pytest==9.0.2
      - name: Static compilation and fail-closed causality tests
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/fx_scanner/xau_microalpha_r5.py scripts/research_xau_microalpha_r5_multiyear.py
          python -m pytest -q tests/test_xau_microalpha_r5.py

  r5-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible data dependencies
        run: python -m pip install pandas==2.2.3 pyarrow==24.0.0
      - name: Replay SHA-pinned 2019–2026 XAUUSD M5 OHLC and publication-lagged macro proxies
        env:
          PYTHONPATH: src:scripts
        run: python -u scripts/research_xau_microalpha_r5_multiyear.py
      - name: Save research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rizan-xau-r5-research
          path: rizan_xau_microalpha_r5_research.json
          retention-days: 14
