name: cTrader XAU M15 Continuation Tournament V2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_m15_continuation_tournament.py"
      - "src/fx_scanner/research_xau_m15_continuation_tournament_runtime.py"
      - "config/validation.yaml"
      - ".github/workflows/ctrader-xau-m15-continuation-tournament.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-xau-m15-continuation-tournament-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xau-continuation-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      CTRADER_XAU_M15_RESEARCH_HISTORY_BARS: "100000"
      XAU_M15_CONTINUATION_RESEARCH_EVIDENCE_OUTPUT: artifacts/xau-m15-continuation-tournament-v2.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Run XAU M15 continuation/retest tournament V2 on 100k closed bars
        run: python -m fx_scanner.research_xau_m15_continuation_tournament_runtime
      - name: Upload XAU continuation tournament evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-m15-continuation-tournament-v2
          path: artifacts/xau-m15-continuation-tournament-v2.json
          if-no-files-found: error
          retention-days: 30
