name: XAU V140 Robustness V141

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v140_robustness_v141.py"
      - "src/fx_scanner/research_xau_v140_robustness_v141_runtime.py"
      - "tests/test_research_xau_v140_robustness_v141.py"
      - ".github/workflows/research-xau-v140-robustness-v141.yml"

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V141_EVIDENCE_OUTPUT: artifacts/xau-v140-robustness-v141.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v140_robustness_v141.py
      - name: Run V141
        run: python -m fx_scanner.research_xau_v140_robustness_v141_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v140-robustness-v141
          path: artifacts/xau-v140-robustness-v141.json
          if-no-files-found: error
          retention-days: 30
