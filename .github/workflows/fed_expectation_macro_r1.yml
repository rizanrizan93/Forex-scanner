name: Fed Expectation Macro R1 — PIT Research Only
on:
  pull_request:
    paths:
      - 'research/fed_expectation_r1/**'
      - 'tests/test_fed_expectation_r1.py'
      - 'tests/test_frbsf_usmpd_source_audit_r1.py'
      - 'scripts/audit_frbsf_usmpd_surprises_r1.py'
      - '.github/workflows/fed_expectation_macro_r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pit_integrity_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest==9.0.2
      - name: Compile point-in-time research code
        run: python -m py_compile research/fed_expectation_r1/engine.py scripts/audit_frbsf_usmpd_surprises_r1.py
      - name: Test hawkish/dovish symmetry and time guards
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_fed_expectation_r1.py tests/test_frbsf_usmpd_source_audit_r1.py
  official_public_source_audit:
    needs: pit_integrity_tests
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official SF Fed downloadable event-study ZIP and record SHA/schema
        run: python scripts/audit_frbsf_usmpd_surprises_r1.py
      - uses: actions/upload-artifact@v4
        with:
          name: fed-expectation-r1-official-source-audit
          path: artifacts/frbsf-usmpd-source-audit.json
          retention-days: 30
          if-no-files-found: error
