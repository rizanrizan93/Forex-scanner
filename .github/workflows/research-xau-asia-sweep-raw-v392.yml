name: Research XAU Asia Sweep Raw V392

on:
  workflow_dispatch:
  push:
    branches:
      - research/v390-xau-slr-raw
    paths:
      - "src/fx_scanner/research_xau_asia_sweep_v392.py"
      - "src/fx_scanner/research_xau_asia_sweep_v392_year_runtime.py"
      - "src/fx_scanner/research_xau_asia_sweep_v392_aggregate.py"
      - "tests/test_research_xau_asia_sweep_v392.py"
      - ".github/workflows/research-xau-asia-sweep-raw-v392.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-asia-sweep-raw-v392-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==9.0.2
      - name: Test V392 research harness
        run: pytest -q tests/test_research_xau_asia_sweep_v392.py

  backfill-year:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      XAU_SWEEP_V392_YEAR: ${{ matrix.year }}
      XAU_SWEEP_V392_PRICE_CSV: /tmp/histdata/xau-sweep-v392-${{ matrix.year }}.csv
      XAU_SWEEP_V392_PROVENANCE: artifacts/xau-sweep-v392-provenance-${{ matrix.year }}.json
      XAU_SWEEP_V392_OUTPUT: artifacts/xau-sweep-v392-${{ matrix.year }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install raw historical runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Run XAU Asia sweep raw year
        run: python -m fx_scanner.research_xau_asia_sweep_v392_year_runtime
      - name: Upload yearly shard
        uses: actions/upload-artifact@v4
        with:
          name: xau-sweep-v392-year-${{ matrix.year }}
          path: |
            artifacts/xau-sweep-v392-${{ matrix.year }}.json
            artifacts/xau-sweep-v392-provenance-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: backfill-year
    if: always() && needs.backfill-year.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XAU_SWEEP_V392_SHARD_DIR: /tmp/xau-sweep-v392-shards
      XAU_SWEEP_V392_FULL_OUTPUT: artifacts/xau-asia-sweep-raw-v392-full.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install aggregator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download all yearly shards
        uses: actions/download-artifact@v4
        with:
          pattern: xau-sweep-v392-year-*
          path: /tmp/xau-sweep-v392-shards
          merge-multiple: false
      - name: Aggregate rolling 3y train to 1y OOS
        run: python -m fx_scanner.research_xau_asia_sweep_v392_aggregate
      - name: Upload V392 full result
        uses: actions/upload-artifact@v4
        with:
          name: xau-asia-sweep-raw-v392-full
          path: artifacts/xau-asia-sweep-raw-v392-full.json
          if-no-files-found: error
          retention-days: 30
