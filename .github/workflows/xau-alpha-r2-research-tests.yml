name: XAU Alpha R2 Readonly Research

on:
  pull_request:
    paths:
      - "main.py"
      - "src/fx_scanner/xau_alpha_r2.py"
      - "pages/4_XAU_Alpha_Indicator_R2.py"
      - "tests/test_xau_alpha_r2.py"
      - ".github/workflows/xau-alpha-r2-research-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Research-only dependencies
        run: python -m pip install pandas==2.2.3 pytest==9.0.2
      - name: Syntax smoke
        run: python -m py_compile src/fx_scanner/xau_alpha_r2.py pages/4_XAU_Alpha_Indicator_R2.py
      - name: Fail-closed R2 unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_xau_alpha_r2.py
