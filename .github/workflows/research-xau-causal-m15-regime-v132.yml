name: XAU Causal M15 Regime V132

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_causal_m15_regime_v132.py"
      - "src/fx_scanner/research_xau_causal_m15_regime_v132_runtime.py"
      - "tests/test_research_xau_causal_m15_regime_v132.py"
      - ".github/workflows/research-xau-causal-m15-regime-v132.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V132_EVIDENCE_OUTPUT: artifacts/xau-causal-m15-regime-v132.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_causal_m15_regime_v132.py
      - name: Run V132
        run: python -m fx_scanner.research_xau_causal_m15_regime_v132_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-causal-m15-regime-v132
          path: artifacts/xau-causal-m15-regime-v132.json
          if-no-files-found: error
          retention-days: 30
