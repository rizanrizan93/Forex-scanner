name: Audit cBot bridge via SSH
on:
  push:
    branches: [main]
    paths:
      - 'bridge_diagnostics/audit_bridge.py'
      - '.github/workflows/audit-cbot-bridge-ssh.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rizan-cbot-bridge-production-ssh
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'rizanrizan93/Forex-scanner' && github.ref == 'refs/heads/main' && github.actor == 'rizanrizan93'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read-only bridge health and checkpoint audit
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo 'MISSING_SECRET:VPS_SSH_KEY'; exit 1; }
          [[ -n "$SSH_KNOWN_HOSTS" ]] || { echo 'MISSING_SECRET:VPS_KNOWN_HOSTS'; exit 1; }
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/key" > /dev/null
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target='Rizanrizan@202.74.74.172'
          remote_dir=$(ssh "${ssh_options[@]}" "$target" 'umask 077; mktemp -d /tmp/rizan-bridge-deploy.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/rizan-bridge-deploy\.[a-zA-Z0-9]+$ ]] || { echo 'REMOTE_TEMP_INVALID'; exit 1; }
          cleanup_remote() { ssh "${ssh_options[@]}" "$target" "rm -rf -- '$remote_dir'" > /dev/null 2>&1 || true; }
          trap 'cleanup_remote; rm -rf "$ssh_dir"' EXIT
          scp "${ssh_options[@]}" deployment/deploy_bridge.py bridge_diagnostics/audit_bridge.py "$target:$remote_dir/"
          ssh "${ssh_options[@]}" "$target" "python3 '$remote_dir/audit_bridge.py'"
