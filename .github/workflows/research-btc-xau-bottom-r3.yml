name: Research BTC XAU Bottom R3 (read only)
on:
  push:
    branches:
      - research/btc-xau-bottom-r3-20261123
    paths:
      - scripts/research_btc_xau_bottom_r3.mjs
      - .github/workflows/research-btc-xau-bottom-r3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reproducible pinned-data research
        run: node scripts/research_btc_xau_bottom_r3.mjs
      - name: Archive research evidence only
        uses: actions/upload-artifact@v4
        with:
          name: btc-xau-bottom-r3-research
          path: research_outputs/bottom_r3/
          retention-days: 30
