name: XAU V47 Forward Freeze V69

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v47_forward_freeze_v69.py"
      - "tests/test_research_xau_v47_forward_freeze_v69.py"
      - ".github/workflows/research-xau-v47-forward-freeze-v69.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Verify prospective freeze contract
        run: pytest -q tests/test_research_xau_v47_forward_freeze_v69.py
