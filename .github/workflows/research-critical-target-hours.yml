name: RIZAN final four weekday hour verification
on:
  push:
    branches: [research/tick-archive-2019-2026]
    paths: [.github/workflows/research-critical-target-hours.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow
      - name: Retry four unresolved weekday hours with cache-neutral source URLs
        run: python research/critical_revalidation/target_hours.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-TARGETED-FOUR-HOURS
          path: research/critical_revalidation/targeted_hour_recovery
          retention-days: 90
