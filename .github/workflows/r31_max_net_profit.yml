name: R31 XAU 2012-2026 Large Scale Max Net Profit Cost Drawdown Research
on:
  push:
    branches: ['research/r31-net-profit-max-2012-2026-20261123']
    paths:
      - 'scripts/r31_profit_grid.py'
      - 'tests/test_r31_profit_grid.py'
      - '.github/workflows/r31_max_net_profit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r31-max-net-profit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated research math/test stack, no trading SDK
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl pytest==9.0.2
      - name: Strict chronological, profit, drawdown, executable-open and read-only tests
        run: |
          python -m py_compile scripts/r31_profit_grid.py
          python -m pytest -q tests/test_r31_profit_grid.py tests/test_r30_pareto_direction_search.py

  study:
    needs: verify
    name: R31 ${{ matrix.tf }} H${{ matrix.hold }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {tf: '1h', hold: 1, mode: 'max_net'}
          - {tf: '1h', hold: 1, mode: 'net_dd'}
          - {tf: '1h', hold: 1, mode: 'profit_frequency'}
          - {tf: '1h', hold: 2, mode: 'max_net'}
          - {tf: '1h', hold: 2, mode: 'net_dd'}
          - {tf: '1h', hold: 2, mode: 'profit_frequency'}
          - {tf: '1h', hold: 4, mode: 'max_net'}
          - {tf: '1h', hold: 4, mode: 'net_dd'}
          - {tf: '1h', hold: 4, mode: 'profit_frequency'}
          - {tf: '4h', hold: 1, mode: 'max_net'}
          - {tf: '4h', hold: 1, mode: 'net_dd'}
          - {tf: '4h', hold: 1, mode: 'profit_frequency'}
          - {tf: '4h', hold: 2, mode: 'max_net'}
          - {tf: '4h', hold: 2, mode: 'net_dd'}
          - {tf: '4h', hold: 2, mode: 'profit_frequency'}
          - {tf: '4h', hold: 3, mode: 'max_net'}
          - {tf: '4h', hold: 3, mode: 'net_dd'}
          - {tf: '4h', hold: 3, mode: 'profit_frequency'}
          - {tf: '1D', hold: 1, mode: 'max_net'}
          - {tf: '1D', hold: 1, mode: 'net_dd'}
          - {tf: '1D', hold: 1, mode: 'profit_frequency'}
          - {tf: '1D', hold: 2, mode: 'max_net'}
          - {tf: '1D', hold: 2, mode: 'net_dd'}
          - {tf: '1D', hold: 2, mode: 'profit_frequency'}
          - {tf: '1W', hold: 1, mode: 'max_net'}
          - {tf: '1W', hold: 1, mode: 'net_dd'}
          - {tf: '1W', hold: 1, mode: 'profit_frequency'}
          - {tf: '1W', hold: 2, mode: 'max_net'}
          - {tf: '1W', hold: 2, mode: 'net_dd'}
          - {tf: '1W', hold: 2, mode: 'profit_frequency'}
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned isolated research dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - name: Download SHA-audited 2012–2018 independently-derived XAU H1/H4 bars
        if: matrix.tf == '1h' || matrix.tf == '4h'
        uses: actions/download-artifact@v4
        with:
          run-id: 45183311130
          github-token: ${{ github.token }}
          pattern: r30-hf-yr-*
          path: /tmp/r30_early
          merge-multiple: true
      - name: Download original 2019–2026 R10 H1/H4 bars
        if: matrix.tf == '1h' || matrix.tf == '4h'
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Download original daily 2012–2026 R9.8 bars
        if: matrix.tf == '1D' || matrix.tf == '1W'
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Scan thousands of regimes with fixed 1oz no-overlap and prior-2year net profit selection
        run: |
          python scripts/r31_profit_grid.py \
            --tf "${{ matrix.tf }}" \
            --hold "${{ matrix.hold }}" \
            --mode "${{ matrix.mode }}"
      - name: Archive full annual policy selection, trades and 3 assumed-cost scenarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r31-${{ matrix.tf }}-h${{ matrix.hold }}-${{ matrix.mode }}
          path: artifacts/r31/r31-${{ matrix.tf }}-h${{ matrix.hold }}-${{ matrix.mode }}.json
          retention-days: 90
          if-no-files-found: warn
