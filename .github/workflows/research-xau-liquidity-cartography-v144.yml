name: XAU Liquidity Cartography V144
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_liquidity_cartography_v144.py"
      - "src/fx_scanner/research_xau_liquidity_cartography_v144_runtime.py"
      - "tests/test_research_xau_liquidity_cartography_v144.py"
      - ".github/workflows/research-xau-liquidity-cartography-v144.yml"
permissions:
  contents: read
jobs:
  liquidity-cartography:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V144_EVIDENCE_OUTPUT: artifacts/xau-liquidity-cartography-v144.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_liquidity_cartography_v144.py
      - name: Run V144
        run: python -m fx_scanner.research_xau_liquidity_cartography_v144_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-liquidity-cartography-v144
          path: artifacts/xau-liquidity-cartography-v144.json
          if-no-files-found: error
          retention-days: 30
