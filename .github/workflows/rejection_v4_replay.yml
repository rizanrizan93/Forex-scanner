name: XAU Rejection V4 Dual-Side Replay — Research Only
on:
  pull_request:
    paths:
      - 'src/fx_scanner/rejection_v4_research.py'
      - 'scripts/replay_rejection_v4_outcomes.py'
      - 'tests/test_rejection_v4_research.py'
      - 'tests/test_rejection_v4_replay.py'
      - '.github/workflows/rejection_v4_replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v4_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - run: python -m py_compile src/fx_scanner/rejection_v4_research.py scripts/replay_rejection_v4_outcomes.py src/fx_scanner/rejection_dashboard_research.py
      - env: {PYTHONPATH: 'src:.'}
        run: python -m pytest -q tests/test_rejection_v4_research.py tests/test_rejection_v4_replay.py tests/test_rejection_lifecycle_research.py
  v4_ctrader_2026:
    needs: v4_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {PYTHONPATH: 'src:.'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Replay V4 read-only cTrader M1 research snapshot
        run: |
          mkdir -p artifacts
          python scripts/replay_rejection_v4_outcomes.py --source public --start 6100 --limit 4500 --out artifacts/rejection-v4-ctrader-2026.json
      - uses: actions/upload-artifact@v4
        with:
          name: rejection-v4-ctrader-2026
          path: artifacts/rejection-v4-ctrader-2026.json
          retention-days: 30
          if-no-files-found: error
  v4_histdata_2023:
    needs: v4_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: 'src:.'
      REJECTION_SAMPLE_PATH: /tmp/rejection-histdata-2023.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - run: python -m pip install 'git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8'
      - name: Obtain predeclared HistData Sep 2023 and verify SHA
        run: python scripts/rejection_source_histdata_sample.py
      - name: Replay V4 causal entries on verified 2023 M1
        run: |
          mkdir -p artifacts
          python scripts/replay_rejection_v4_outcomes.py --source csv --csv "$REJECTION_SAMPLE_PATH" --start 6100 --limit 4500 --out artifacts/rejection-v4-histdata-2023.json
      - uses: actions/upload-artifact@v4
        with:
          name: rejection-v4-histdata-2023
          path: artifacts/rejection-v4-histdata-2023.json
          retention-days: 30
          if-no-files-found: error
