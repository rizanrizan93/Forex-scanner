name: BTC10 read-only bridge audit
on:
  push:
    branches: ['work/btc-eff20-frozen-20261102']
    paths: ['diagnostics/btc10_readonly.py', 'diagnostics/btc10_connection_history.py', '.github/workflows/btc10-readonly-audit.yml']
permissions:
  contents: read
concurrency:
  group: rizan-cbot-bridge-production-ssh
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only VPS service, feed, checkpoint and network diagnostics
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set +x
          set -euo pipefail
          python3 diagnostics/vps_network_readonly.py
          umask 077
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          private_dir=$(mktemp -d)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$private_dir/known_hosts"
          ssh_options=(-4 -i "$private_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$private_dir/known_hosts" -o ConnectTimeout=45 -o ConnectionAttempts=1 -o IPQoS=none -o Compression=no -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          trap 'rm -rf "$private_dir"' EXIT
          ssh "${ssh_options[@]}" Rizanrizan@202.74.74.172 'sudo -n /opt/rizan-btc10-bridge/.venv/bin/python -' < diagnostics/btc10_readonly.py
          ssh "${ssh_options[@]}" Rizanrizan@202.74.74.172 'sudo -n python3 -' < diagnostics/btc10_connection_history.py
