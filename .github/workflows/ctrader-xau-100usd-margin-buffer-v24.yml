name: cTrader XAU $100 Margin Buffer V24

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_100usd_margin_buffer_v24.py"
      - "src/fx_scanner/research_xau_100usd_margin_buffer_v24_runtime.py"
      - "tests/test_research_xau_100usd_margin_buffer_v24.py"
      - ".github/workflows/ctrader-xau-100usd-margin-buffer-v24.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-xau-100usd-margin-buffer-v24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xau-100usd-margin-buffer-v24:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      V24_EVIDENCE_OUTPUT: artifacts/xau-100usd-margin-buffer-v24.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit tests
        run: pytest -q tests/test_research_xau_100usd_margin_buffer_v24.py
      - name: Run $100 margin-buffer sensitivity
        run: python -m fx_scanner.research_xau_100usd_margin_buffer_v24_runtime
      - name: Upload V24 evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-100usd-margin-buffer-v24
          path: artifacts/xau-100usd-margin-buffer-v24.json
          if-no-files-found: error
          retention-days: 30
