name: XAU Era Robustness V31

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_era_robustness_v31.py"
      - "src/fx_scanner/research_xau_era_robustness_v31_runtime.py"
      - "tests/test_research_xau_era_robustness_v31.py"
      - ".github/workflows/research-xau-era-robustness-v31.yml"

permissions:
  contents: read

jobs:
  era:
    strategy:
      fail-fast: false
      matrix:
        era: ["2012_2018","2019_2024"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      V31_ERA: ${{ matrix.era }}
      V31_EVIDENCE_OUTPUT: artifacts/xau-era-robustness-v31-${{ matrix.era }}.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_era_robustness_v31.py
      - name: Run era robustness
        run: python -m fx_scanner.research_xau_era_robustness_v31_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-era-robustness-v31-${{ matrix.era }}
          path: artifacts/xau-era-robustness-v31-${{ matrix.era }}.json
          if-no-files-found: error
          retention-days: 30
