name: R28.1 Frozen Cache Fast Inference Safety Tests
on:
  pull_request:
    paths:
      - '.github/workflows/r281_direction_shadow_hourly.yml'
      - '.github/workflows/r281_fast_inference_safety_tests.yml'
      - 'tests/test_r281_parallel_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/r281_direction_shadow_hourly.yml'
      - '.github/workflows/r281_fast_inference_safety_tests.yml'
      - 'tests/test_r281_parallel_workflow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-research-fast-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r281-direction-inference-parity-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated research dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.7.2 scipy joblib pytest==9.0.2
      - name: Ensure cache gates reject tampered models and preserve WAIT
        run: python -m pytest -q tests/test_r281_fast_live_inference.py tests/test_r281_live_market.py
      - name: Compile fast inference and original refit pipeline
        run: python -m py_compile scripts/r281_fast_live_inference.py scripts/r281_live_shadow_parity.py
