name: XAU Qualitative Reaccel Gate V126

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_qualitative_reaccel_gate_v126.py"
      - "src/fx_scanner/research_xau_qualitative_reaccel_gate_v126_runtime.py"
      - "tests/test_research_xau_qualitative_reaccel_gate_v126.py"
      - ".github/workflows/research-xau-qualitative-reaccel-gate-v126.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V126_EVIDENCE_OUTPUT: artifacts/xau-qualitative-reaccel-gate-v126.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_qualitative_reaccel_gate_v126.py
      - name: Run V126
        run: python -m fx_scanner.research_xau_qualitative_reaccel_gate_v126_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-qualitative-reaccel-gate-v126
          path: artifacts/xau-qualitative-reaccel-gate-v126.json
          if-no-files-found: error
          retention-days: 30
