name: XAU AFIC Independent Path Confirmation V166

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_independent_path_confirm_v166.py"
      - "src/fx_scanner/research_xau_afic_independent_path_confirm_v166_runtime.py"
      - "tests/test_research_xau_afic_independent_path_confirm_v166.py"
      - ".github/workflows/research-xau-afic-independent-path-confirm-v166.yml"

permissions:
  contents: read

jobs:
  afic-v166:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V166_OUTPUT: artifacts/xau-afic-independent-path-confirm-v166.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit test
        run: pytest -q tests/test_research_xau_afic_independent_path_confirm_v166.py
      - name: Run V166 independent-path confirmation diagnostic
        run: python -m fx_scanner.research_xau_afic_independent_path_confirm_v166_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-independent-path-confirm-v166
          path: artifacts/xau-afic-independent-path-confirm-v166.json
          if-no-files-found: error
          retention-days: 30
