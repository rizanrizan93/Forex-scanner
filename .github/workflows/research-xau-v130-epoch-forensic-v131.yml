name: XAU V130 Epoch Forensic V131

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v130_epoch_forensic_v131.py"
      - "src/fx_scanner/research_xau_v130_epoch_forensic_v131_runtime.py"
      - "tests/test_research_xau_v130_epoch_forensic_v131.py"
      - ".github/workflows/research-xau-v130-epoch-forensic-v131.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V131_EVIDENCE_OUTPUT: artifacts/xau-v130-epoch-forensic-v131.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v130_epoch_forensic_v131.py
      - name: Run V131
        run: python -m fx_scanner.research_xau_v130_epoch_forensic_v131_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v130-epoch-forensic-v131
          path: artifacts/xau-v130-epoch-forensic-v131.json
          if-no-files-found: error
          retention-days: 30
