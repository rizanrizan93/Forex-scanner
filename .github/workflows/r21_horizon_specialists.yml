name: R21 Horizon-specific H1 H4 D1 specialists
on:
  push:
    branches: ['research/r91-early-warning-m1-20261121']
    paths: ['scripts/r21_horizon_specialists.py','.github/workflows/r21_horizon_specialists.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        tf: ['1h','4h','1D']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - if: ${{ matrix.tf == '1h' || matrix.tf == '4h' }}
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - if: ${{ matrix.tf == '1D' }}
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - run: python scripts/r21_horizon_specialists.py --tf ${{ matrix.tf }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r21-specialist-${{ matrix.tf }}
          path: artifacts/r21-*.json
          if-no-files-found: warn
          retention-days: 90
