name: RIZAN verified critical replay with durable raw ledgers
on:
  push:
    branches: [research/tick-archive-2019-2026]
    paths: [.github/workflows/research-critical-durable-final.yml]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: rizanrizan93/Forex-scanner
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        mode: [control, patched]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow matplotlib
      - name: Verify original source and deterministic two-gap overlay
        run: |
          gh run download 39139148589 --name RIZAN-FINAL-FROZEN-TICK-PARITY-2019-2026 --dir /tmp/previous-zip
          python - <<'PY'
          import pathlib,zipfile,hashlib,tarfile
          p=pathlib.Path('/tmp/previous-zip/RIZAN_FROZEN_TICK_AUDIT.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='241e1288889e57596202658b45dcb9e2711f77710645ca0c5d3eef52729d247c'
          zipfile.ZipFile(p).extractall('/tmp/previous')
          pathlib.Path('research/critical_revalidation/executed_controls').mkdir(exist_ok=True)
          with tarfile.open('research/critical_revalidation/executed-controls.tgz')as t:t.extractall('research/critical_revalidation/executed_controls',filter='data')
          PY
          gh run download 39170473819 --name RIZAN-CRITICAL-GAP-RETRY --dir /tmp/gap-known
          cp -a /tmp/gap-known/gap_repair research/critical_revalidation/
          gh run download 39172140288 --name RIZAN-FINAL-HOURLY-RETRY --dir research/critical_revalidation/extended_hour_recovery
          gh run download 39171728062 --name RIZAN-TARGETED-FOUR-HOURS --dir research/critical_revalidation/four_hour_recovery
          gh run download 39170069211 --name RIZAN-CRITICAL-GAP-SOURCE-VERIFICATION --dir /tmp/first-probe
          cp /tmp/first-probe/gap_repair/HOURLY_PROVENANCE.json research/critical_revalidation/gap_repair/FIRST_HOURLY_PROVENANCE.json
          python research/critical_revalidation/merge_recovered.py
          python research/critical_revalidation/prepare_revalidation.py
      - name: Execute source regression suites
        run: python research/critical_revalidation/engine/build_tests.py --sdk "$DOTNET_ROOT"
      - name: Run uninterrupted 87-month shared-wallet scenarios
        run: RIZAN_REPLAY_MODES=${{ matrix.mode }} python research/critical_revalidation/execute_revalidation.py
      - name: Preserve complete raw engine state ledgers and source even if report later fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-CRITICAL-RAW-${{ matrix.mode }}
          path: research/critical_revalidation
          retention-days: 90
  quote_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow
      - name: Obtain exact old reference ledger
        run: |
          gh run download 39139148589 --name RIZAN-FINAL-FROZEN-TICK-PARITY-2019-2026 --dir /tmp/previous-zip
          python - <<'PY'
          import zipfile,hashlib,pathlib
          p=pathlib.Path('/tmp/previous-zip/RIZAN_FROZEN_TICK_AUDIT.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='241e1288889e57596202658b45dcb9e2711f77710645ca0c5d3eef52729d247c'
          zipfile.ZipFile(p).extractall('/tmp/previous')
          PY
      - name: Freeze schedule volume exit and common cohort then vary entry quotes and costs
        run: python research/critical_revalidation/locked_schedule.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-CRITICAL-LOCKED-DIAGNOSTIC
          path: research/critical_revalidation/locked_schedule
          retention-days: 90
  package:
    needs: [replay, quote_diagnostic]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas pyarrow matplotlib
      - name: Retrieve independently preserved raw results
        run: |
          gh run download "${{ github.run_id }}" --name RIZAN-CRITICAL-RAW-patched --dir /tmp/raw-patched
          gh run download "${{ github.run_id }}" --name RIZAN-CRITICAL-RAW-control --dir /tmp/raw-control
          gh run download "${{ github.run_id }}" --name RIZAN-CRITICAL-LOCKED-DIAGNOSTIC --dir /tmp/diagnostic
          cp -a /tmp/raw-patched/. research/critical_revalidation/
          cp -a /tmp/raw-control/control_results research/critical_revalidation/
          cp -a /tmp/diagnostic research/critical_revalidation/locked_schedule
          gh run download 39139148589 --name RIZAN-FINAL-FROZEN-TICK-PARITY-2019-2026 --dir /tmp/previous-zip
          python - <<'PY'
          import zipfile
          zipfile.ZipFile('/tmp/previous-zip/RIZAN_FROZEN_TICK_AUDIT.zip').extractall('/tmp/previous')
          PY
          git rev-parse HEAD > research/critical_revalidation/FINAL_EVIDENCE_COMMIT.txt
          python research/critical_revalidation/finalize_critical.py
      - name: Save final package on research-only VPS path and verify checksum
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/hosts"
          chmod 600 "$d/key" "$d/hosts"
          dest='/home/Rizanrizan/rizan-ticks/REPLAY_RESULTS/critical-frozen-revalidation-2019-2026/verified-final'
          opts=(-i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=30)
          ssh "${opts[@]}" Rizanrizan@202.74.74.172 "umask 077; mkdir -p '$dest'"
          scp "${opts[@]}" research/critical_revalidation/RIZAN_CRITICAL_REVALIDATION.zip research/critical_revalidation/PACKAGE_SHA256.txt research/critical_revalidation/LAPORAN_CRITICAL_REVALIDATION.md "Rizanrizan@202.74.74.172:$dest/"
          ssh "${opts[@]}" Rizanrizan@202.74.74.172 "cd '$dest' && sha256sum -c PACKAGE_SHA256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-CRITICAL-AUDIT-VERIFIED-FINAL
          path: |
            research/critical_revalidation/RIZAN_CRITICAL_REVALIDATION.zip
            research/critical_revalidation/LAPORAN_CRITICAL_REVALIDATION.md
            research/critical_revalidation/BEFORE_VS_AFTER_AUDIT.csv
            research/critical_revalidation/CONTROLLED_M1_TICK_CHAIN.csv
            research/critical_revalidation/DIFFERENTIAL_TEST_SUMMARY.json
            research/critical_revalidation/RECONCILIATION.json
            research/critical_revalidation/PACKAGE_SHA256.txt
          retention-days: 90
