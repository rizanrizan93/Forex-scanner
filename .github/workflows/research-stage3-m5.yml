name: research-stage3-m5

on:
  push:
    branches:
      - research/strategy-regime-100-20260911
    paths:
      - scripts/research_stage3_m5_runtime.py
      - .github/workflows/research-stage3-m5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run M5 validation
        run: python scripts/research_stage3_m5_runtime.py --output out/stage3_m5
      - name: Print report
        if: always()
        run: |
          if [ -f out/stage3_m5/report.md ]; then cat out/stage3_m5/report.md; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-m5-results
          path: out/stage3_m5/
          if-no-files-found: warn
          retention-days: 14
