name: Research XAU RIZAN AXY Delta V323

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_rizan_axy_delta_v323.py"
      - "src/fx_scanner/research_xau_rizan_axy_delta_v323_year_runtime.py"
      - "src/fx_scanner/research_xau_rizan_axy_delta_v323_aggregate.py"
      - "tests/test_research_xau_rizan_axy_delta_v323.py"
      - ".github/workflows/research-xau-rizan-axy-delta-v323.yml"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_rizan_axy_delta_v323.py"
      - "src/fx_scanner/research_xau_rizan_axy_delta_v323_year_runtime.py"
      - "src/fx_scanner/research_xau_rizan_axy_delta_v323_aggregate.py"
      - ".github/workflows/research-xau-rizan-axy-delta-v323.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-rizan-axy-delta-v323-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==9.0.2
      - run: pytest -q tests/test_research_xau_rizan_axy_delta_v323.py

  backfill-year:
    needs: unit
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      XAU_V193_YEAR: ${{ matrix.year }}
      XAU_V193_PRICE_CSV: /tmp/histdata/xau-v323-${{ matrix.year }}.csv
      XAU_V193_PRICE_PROVENANCE: artifacts/xau-v323-price-provenance-${{ matrix.year }}.json
      XAU_V323_YEAR: ${{ matrix.year }}
      XAU_V323_PRICE_CSV: /tmp/histdata/xau-v323-${{ matrix.year }}.csv
      XAU_V323_YEAR_OUTPUT: artifacts/xau-rizan-axy-delta-v323-${{ matrix.year }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Download normalized XAUUSD M1 shard
        run: python -m fx_scanner.research_xau_histdata_download_v193
      - name: Evaluate causal AXY grid
        run: python -m fx_scanner.research_xau_rizan_axy_delta_v323_year_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-rizan-axy-delta-v323-year-${{ matrix.year }}
          path: artifacts/xau-rizan-axy-delta-v323-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: backfill-year
    if: ${{ always() && needs.backfill-year.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XAU_V323_SHARD_DIR: /tmp/v323-shards
      XAU_V323_FULL_OUTPUT: artifacts/xau-rizan-axy-delta-v323-full.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: xau-rizan-axy-delta-v323-year-*
          path: /tmp/v323-shards
          merge-multiple: false
      - name: Aggregate 2012-2024 fit and 2025-2026 OOS
        run: python -m fx_scanner.research_xau_rizan_axy_delta_v323_aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: xau-rizan-axy-delta-v323-full
          path: artifacts/xau-rizan-axy-delta-v323-full.json
          if-no-files-found: error
          retention-days: 30
