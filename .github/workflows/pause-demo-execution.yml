name: Pause DEMO execution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pause-demo-execution.yml']

permissions:
  actions: write
  contents: read

concurrency:
  group: pause-demo-execution
  cancel-in-progress: false

jobs:
  stop-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Disable execution and recovery workflows, cancel active runs
        shell: python
        run: |
          import json, os, subprocess, time
          repo = os.environ['GITHUB_REPOSITORY']
          workflows = [
              'rizan-xau-dual-engine-v344.yml',
              'ctrader-demo-eurusd-frozen-dd37.yml',
              'rizan-xau-runtime-takeover-v365.yml',
              'ctrader-demo-auto-supervisor.yml',
              'ctrader-demo-auto-supervisor-watchdog.yml',
              'ctrader-demo-auto-recovery-watchdog.yml',
              'ctrader-demo-xau-execution-lane.yml',
              'ctrader-demo-auto-pipeline.yml',
              'ctrader-demo-autotrade.yml',
              'ctrader-demo-maintenance-pipeline.yml',
              'ctrader-demo-xau-afic-prepared-lane.yml',
              'ctrader-demo-order-smoke.yml',
          ]
          def api(path, method='GET'):
              result = subprocess.run(['gh','api','--method',method,
                  '/repos/'+repo+'/'+path],check=True,capture_output=True,text=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          available = []
          page = 1
          while True:
              batch = api('actions/workflows?per_page=100&page='+str(page))['workflows']
              available.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          selected = [w for w in available if w['path'].split('/')[-1] in workflows]
          for workflow in selected:
              if workflow['state'] not in {'disabled_manually','disabled_inactivity','deleted'}:
                  api('actions/workflows/'+str(workflow['id'])+'/disable', 'PUT')
              print('DEMO_WORKFLOW_STOPPED '+workflow['path'], flush=True)
          active = {'queued','in_progress','waiting','pending','requested'}
          for workflow in selected:
              runs = api('actions/workflows/'+str(workflow['id'])+'/runs?per_page=100')['workflow_runs']
              for run in runs:
                  if run['status'] in active:
                      try:
                          api('actions/runs/'+str(run['id'])+'/cancel','POST')
                      except subprocess.CalledProcessError:
                          current = api('actions/runs/'+str(run['id']))
                          if current['status'] != 'completed':
                              try:
                                  api('actions/runs/'+str(run['id'])+'/force-cancel','POST')
                              except subprocess.CalledProcessError as exc:
                                  print('DEMO_OLD_QUEUE_CANCEL_FAILED '+str(run['id'])+' '+exc.stderr.strip(), flush=True)
          for attempt in range(18):
              running, queued = [], []
              for workflow in selected:
                  state = api('actions/workflows/'+str(workflow['id']))['state']
                  if state not in {'disabled_manually','disabled_inactivity','deleted'}:
                      raise RuntimeError('Workflow was re-enabled: '+workflow['path'])
                  runs = api('actions/workflows/'+str(workflow['id'])+'/runs?per_page=100')['workflow_runs']
                  running.extend(run['id'] for run in runs if run['status'] == 'in_progress')
                  queued.extend(run['id'] for run in runs if run['status'] in active and run['status'] != 'in_progress')
              if not running:
                  print('DEMO_EXECUTION_STOPPED workflows='+str(len(selected))+' running=0 disabled_queue='+str(len(queued))+' live_enabled=0', flush=True)
                  break
              print('DEMO_CANCELLATION_PENDING running='+str(len(running)), flush=True)
              time.sleep(5)
          else:
              raise RuntimeError('DEMO executor still running: '+str(running))
