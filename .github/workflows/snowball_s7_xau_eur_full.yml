name: Snowball S7 XAU EUR Causal Proxy 3840 Annual 2012-2025
on:
  push:
    branches: ['research/bootstrap125-snowball-r2-20261122']
    paths: ['.github/workflows/snowball_s7_xau_eur_full.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: snowball-s7-xau-eur-2012-2025
  cancel-in-progress: false
jobs:
  yearly:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 requests==2.32.5
      - run: python scripts/snowball_s7_xau_eur_proxy.py --selftest
      - name: Research-only XAU bid ask entry, EUR earlier closed M5 macro proxy, volatility and H4 direction
        run: python scripts/snowball_s7_xau_eur_proxy.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowball-s7-${{ matrix.year }}
          path: artifacts/snowball_s7/s7_year_${{ matrix.year }}.json
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: yearly
    if: always() && needs.yearly.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 requests==2.32.5
      - uses: actions/download-artifact@v4
        with:
          pattern: snowball-s7-*
          path: /tmp/snowball_s7
          merge-multiple: true
      - name: Crossyear training-only selection, forward-fold validation and retrospective review
        run: python scripts/snowball_s7_xau_eur_proxy.py --aggregate --root /tmp/snowball_s7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowball-s7-xau-eur-3840-aggregate
          path: artifacts/snowball_s7/s7_aggregate.json
          if-no-files-found: warn
          retention-days: 90
