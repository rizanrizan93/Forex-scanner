name: Research XAU Expansion V4.1 Intraday Timing

on:
  push:
    branches:
      - research/market-adaptive-router-v4
    paths:
      - "research/adaptive_xau_expansion_v41_intraday_timing.py"
      - ".github/workflows/research-xau-expansion-v41-intraday-timing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-xau-expansion-v41-intraday-timing
  cancel-in-progress: true

jobs:
  timing-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate demo-only config
        run: python -m fx_scanner.cli validate-config
      - name: Run V4.1 H4/H1 timing study
        shell: bash
        env:
          PYTHONPATH: src:research
        run: |
          set -euo pipefail
          python research/adaptive_xau_expansion_v41_intraday_timing.py > xau_expansion_v41_intraday_timing.log
          python - <<'PY'
          from pathlib import Path
          lines = Path("xau_expansion_v41_intraday_timing.log").read_text(encoding="utf-8").splitlines()
          payload = next(line[len("RESULT_JSON="):] for line in lines if line.startswith("RESULT_JSON="))
          Path("xau_expansion_v41_intraday_timing.json").write_text(payload + "\n", encoding="utf-8")
          PY
      - name: Show compact evidence
        run: grep -E '^(ROBUST|BOUNDARY)' xau_expansion_v41_intraday_timing.log
      - uses: actions/upload-artifact@v4
        with:
          name: xau-expansion-v41-intraday-timing
          path: |
            xau_expansion_v41_intraday_timing.json
            xau_expansion_v41_intraday_timing.log
          if-no-files-found: error
