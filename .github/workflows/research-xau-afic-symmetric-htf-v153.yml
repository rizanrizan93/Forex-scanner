name: XAU AFIC Symmetric HTF V153

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_symmetric_htf_v153.py"
      - "src/fx_scanner/research_xau_afic_symmetric_htf_v153_runtime.py"
      - "tests/test_research_xau_afic_symmetric_htf_v153.py"
      - ".github/workflows/research-xau-afic-symmetric-htf-v153.yml"

permissions:
  contents: read

jobs:
  afic-symmetric-htf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V153_EVIDENCE_OUTPUT: artifacts/xau-afic-symmetric-htf-v153.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_afic_symmetric_htf_v153.py
      - name: Run AFIC-inspired symmetric V153
        run: python -m fx_scanner.research_xau_afic_symmetric_htf_v153_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-symmetric-htf-v153
          path: artifacts/xau-afic-symmetric-htf-v153.json
          if-no-files-found: error
          retention-days: 30
