name: RIZAN XAU Dual Engine V344

on:
  workflow_dispatch:
  schedule:
    # Low-frequency fallback only; continuous self-handoff is primary.
    - cron: "47 */6 * * 0-5"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/xau_sd_liquidity_engine_v342.py"
      - "src/fx_scanner/xau_structural_sr_map_v363.py"
      - "src/fx_scanner/xau_friend_entry_engine_v343.py"
      - "src/fx_scanner/xau_news_zone_source_v346.py"
      - "src/fx_scanner/xau_news_zone_v346.py"
      - "src/fx_scanner/demo_xau_event_risk_v192.py"
      - "src/fx_scanner/xau_macro_attribution_v357.py"
      - "src/fx_scanner/demo_xau_macro_attribution_v357.py"
      - "src/fx_scanner/providers/news.py"
      - "config/providers.yaml"
      - "src/fx_scanner/demo_xau_dual_engine_runtime_v344.py"
      - "src/fx_scanner/demo_xau_v351_executor.py"
      - "src/fx_scanner/xau_dual_engine_dashboard_v344.py"
      - "streamlit_app.py"
      - "tests/test_xau_sd_liquidity_engine_v342.py"
      - "tests/test_xau_structural_sr_map_v363.py"
      - "tests/test_v363_structural_sr_dashboard.py"
      - "tests/test_xau_friend_entry_engine_v343.py"
      - "tests/test_xau_news_zone_v346.py"
      - "tests/test_xau_macro_attribution_v357.py"
      - ".github/workflows/rizan-xau-dual-engine-v344.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: rizan-xau-dual-engine-v360-graceful-demo-execution
  # Never kill a healthy runtime in the middle of a cycle. A newer main
  # revision is detected after the current cycle and handed off cleanly.
  cancel-in-progress: false

jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://naxvdtvlfatljzzwhrmo.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      FX_KILL_SWITCH: "0"
      FX_IDEMPOTENCY_STATE_PATH: /tmp/v351_execution_idempotency.json
      CTRADER_DEMO_AUTOTRADE_ENABLED: I_UNDERSTAND_DEMO_ORDERS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Production runtime import smoke
        run: |
          python - <<'PY'
          import fx_scanner.demo_xau_dual_engine_runtime_v344
          import fx_scanner.demo_xau_v351_executor
          print("V360_RUNTIME_IMPORT_SMOKE_OK")
          PY
      - name: Validate configuration
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m fx_scanner.cli validate-config
      - name: Repair missing SL TP on scanner-linked DEMO positions
        id: repair_v351_protection
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: python -m fx_scanner.demo_existing_protection_repair

      - name: Run continuous V342 forecast + V351 DEMO execution
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -u
          end_epoch=$(( $(date +%s) + 19800 ))
          cycle=0
          while [ $(date +%s) -lt "$end_epoch" ]; do
            cycle=$((cycle + 1))
            echo "V353_CONTINUOUS_CYCLE cycle=$cycle at=$(date -u +%FT%TZ)"
            if [ "$cycle" -eq 1 ] || [ $((cycle % 5)) -eq 0 ]; then
              python -m fx_scanner.demo_xau_event_risk_v192 || echo "V192_EVENT_REFRESH_RETRY_NEXT_WINDOW rc=$?"
            fi
            if [ "$cycle" -eq 1 ] || [ $((cycle % 15)) -eq 0 ]; then
              python -m fx_scanner.demo_xau_macro_attribution_v357 || echo "V357_MACRO_REFRESH_RETRY_NEXT_WINDOW rc=$?"
            fi
            runtime_rc=0
            python -m fx_scanner.demo_xau_dual_engine_runtime_v344 || runtime_rc=$?
            if [ "$runtime_rc" -eq 0 ]; then
              python -m fx_scanner.demo_xau_v351_executor || echo "V351_EXECUTOR_RETRY_NEXT_CYCLE rc=$?"
            else
              echo "V344_RUNTIME_RETRY_NEXT_CYCLE rc=$runtime_rc"
            fi

            # Graceful code handoff: finish the current market/execution cycle
            # before yielding to a queued run built from newer main.
            git fetch origin main --depth=1 >/dev/null 2>&1 || true
            latest_main="$(git rev-parse FETCH_HEAD 2>/dev/null || true)"
            if [ -n "$latest_main" ] && [ "$latest_main" != "$GITHUB_SHA" ]; then
              echo "V360_GRACEFUL_HANDOFF current=$GITHUB_SHA latest_main=$latest_main"
              break
            fi
            sleep 60
          done

      - name: Self-handoff continuous XAU runtime
        if: ${{ success() && !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          market_open_utc() {
            weekday="$(date -u +%u)"
            hour="$(date -u +%H)"
            if [ "${weekday}" -eq 7 ]; then
              [ "${hour}" -ge 21 ]
            elif [ "${weekday}" -ge 1 ] && [ "${weekday}" -le 4 ]; then
              return 0
            elif [ "${weekday}" -eq 5 ]; then
              [ "${hour}" -lt 22 ]
            else
              return 1
            fi
          }
          if market_open_utc; then
            gh workflow run -R "${GITHUB_REPOSITORY}" rizan-xau-dual-engine-v344.yml --ref main
            echo "V360_RUNTIME_SELF_HANDOFF_DISPATCHED"
          else
            echo "V360_RUNTIME_SELF_HANDOFF_SKIPPED market=closed"
          fi
