name: RIZAN XAU Dual Engine V344

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/fx_scanner/xau_frozen_dd50*.py"
      - "src/fx_scanner/demo_xau_frozen_dd50.py"
      - "src/fx_scanner/frozen_layering*.py"
      - "config/frozen/*_layering_1m_v1.json"
      - "tests/test_frozen_layering.py"
      - "src/fx_scanner/execution/models.py"
      - "src/fx_scanner/execution/ctrader_gateway.py"
      - "config/frozen/xauusd_buysell_dd50_v1.json"
      - "tests/test_xau_frozen_dd50.py"
      - "src/fx_scanner/xau_sd_liquidity_engine_v342.py"
      - "src/fx_scanner/xau_structural_sr_map_v363.py"
      - "src/fx_scanner/xau_friend_entry_engine_v343.py"
      - "src/fx_scanner/xau_news_zone_v346.py"
      - "src/fx_scanner/xau_reaction_interceptor_v374.py"
      - "src/fx_scanner/xau_event_confidence_v377.py"
      - "src/fx_scanner/demo_xau_event_risk_v377.py"
      - "src/fx_scanner/demo_xau_v351_executor.py"
      - "src/fx_scanner/demo_xau_v375_reaction_executor.py"
      - "tests/test_xau_sd_liquidity_engine_v342.py"
      - "tests/test_xau_structural_sr_map_v363.py"
      - "tests/test_v363_structural_sr_dashboard.py"
      - "tests/test_xau_friend_entry_engine_v343.py"
      - "tests/test_xau_news_zone_v346.py"
      - "tests/test_xau_event_confidence_v377.py"
      - "tests/test_demo_xau_v351_executor.py"
      - "tests/test_demo_xau_v375_reaction_executor.py"
      - ".github/workflows/rizan-xau-dual-engine-v344.yml"
  schedule:
    # Low-frequency fallback only; continuous self-handoff is primary.
    - cron: "47 */6 * * 0-5"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/xau_frozen_dd50*.py"
      - "src/fx_scanner/demo_xau_frozen_dd50.py"
      - "src/fx_scanner/frozen_layering*.py"
      - "config/frozen/*_layering_1m_v1.json"
      - "tests/test_frozen_layering.py"
      - "src/fx_scanner/execution/models.py"
      - "src/fx_scanner/execution/ctrader_gateway.py"
      - "config/frozen/xauusd_buysell_dd50_v1.json"
      - "tests/test_xau_frozen_dd50.py"
      - "src/fx_scanner/xau_sd_liquidity_engine_v342.py"
      - "src/fx_scanner/xau_structural_sr_map_v363.py"
      - "src/fx_scanner/xau_friend_entry_engine_v343.py"
      - "src/fx_scanner/xau_news_zone_source_v346.py"
      - "src/fx_scanner/xau_news_zone_v346.py"
      - "src/fx_scanner/xau_reaction_interceptor_v374.py"
      - "src/fx_scanner/demo_xau_event_risk_v192.py"
      - "src/fx_scanner/xau_event_confidence_v377.py"
      - "src/fx_scanner/demo_xau_event_risk_v377.py"
      - "src/fx_scanner/xau_event_dashboard_patch_v377.py"
      - "src/fx_scanner/xau_macro_attribution_v357.py"
      - "src/fx_scanner/xau_intraday_yield_v367.py"
      - "src/fx_scanner/demo_xau_macro_attribution_v357.py"
      - "src/fx_scanner/providers/news.py"
      - "config/providers.yaml"
      - "src/fx_scanner/demo_xau_dual_engine_runtime_v344.py"
      - "src/fx_scanner/demo_xau_v351_executor.py"
      - "src/fx_scanner/demo_xau_v375_reaction_executor.py"
      - "src/fx_scanner/xau_dual_engine_dashboard_v344.py"
      - "main.py"
      - "streamlit_app.py"
      - "tests/test_xau_sd_liquidity_engine_v342.py"
      - "tests/test_xau_structural_sr_map_v363.py"
      - "tests/test_v363_structural_sr_dashboard.py"
      - "tests/test_xau_friend_entry_engine_v343.py"
      - "tests/test_xau_news_zone_v346.py"
      - "tests/test_xau_event_confidence_v377.py"
      - "tests/test_demo_xau_v351_executor.py"
      - "tests/test_demo_xau_v375_reaction_executor.py"
      - "tests/test_xau_macro_attribution_v357.py"
      - "tests/test_xau_intraday_yield_v367.py"
      - ".github/workflows/rizan-xau-dual-engine-v344.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: rizan-xau-dual-engine-v360-graceful-demo-execution
  # Never kill a healthy runtime in the middle of a cycle. A newer main
  # revision is detected after the current cycle and handed off cleanly.
  cancel-in-progress: false

jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      FX_DATABASE_BACKEND: turso
      TURSO_USAGE_TRACKING: '1'
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      SUPABASE_URL: https://naxvdtvlfatljzzwhrmo.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      FX_KILL_SWITCH: "0"
      FX_IDEMPOTENCY_STATE_PATH: /tmp/v351_execution_idempotency.json
      CTRADER_DEMO_AUTOTRADE_ENABLED: I_UNDERSTAND_DEMO_ORDERS
      RIZAN_RUNTIME_HEAD_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Production runtime import smoke
        run: |
          python - <<'PY'
          import fx_scanner.demo_xau_dual_engine_runtime_v344
          import fx_scanner.demo_xau_event_risk_v377
          import fx_scanner.demo_xau_v351_executor
          import fx_scanner.demo_xau_frozen_dd50
          import fx_scanner.demo_xau_v375_reaction_executor
          import fx_scanner.xau_reaction_interceptor_v374
          print("V377_RUNTIME_IMPORT_SMOKE_OK")
          PY
      - name: Run V375 reversal-entry regressions plus V377 event semantics
        run: |
          pytest -q \
            tests/test_xau_frozen_dd50.py tests/test_frozen_layering.py \
            tests/test_xau_sd_liquidity_engine_v342.py \
            tests/test_xau_friend_entry_engine_v343.py \
            tests/test_xau_news_zone_v346.py \
            tests/test_xau_event_confidence_v377.py \
            tests/test_demo_xau_v351_executor.py \
            tests/test_demo_xau_v375_reaction_executor.py \
            tests/test_xau_macro_attribution_v357.py \
            tests/test_xau_intraday_yield_v367.py
      - name: Validate configuration
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m fx_scanner.cli validate-config
      - name: Repair missing SL TP on scanner-linked DEMO positions
        id: repair_v351_protection
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: python -m fx_scanner.demo_existing_protection_repair

      - name: Run continuous frozen XAU BUY SELL core + DEMO execution
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -u
          end_epoch=$(( $(date +%s) + 19800 ))
          cycle=0
          while [ $(date +%s) -lt "$end_epoch" ]; do
            cycle=$((cycle + 1))
            echo "XAU_FROZEN_CONTINUOUS_CYCLE cycle=$cycle at=$(date -u +%FT%TZ)"
            if [ "$cycle" -eq 1 ] || [ $((cycle % 5)) -eq 0 ]; then
              python -m fx_scanner.demo_xau_event_risk_v377 || echo "V377_EVENT_REFRESH_RETRY_NEXT_WINDOW rc=$?"
            fi
            if [ "$cycle" -eq 1 ] || [ $((cycle % 2)) -eq 0 ]; then
              python -m fx_scanner.demo_xau_macro_attribution_v357 || echo "V357_MACRO_REFRESH_RETRY_NEXT_WINDOW rc=$?"
            fi
            runtime_rc=0
            python -m fx_scanner.demo_xau_dual_engine_runtime_v344 || runtime_rc=$?
            if [ "$runtime_rc" -eq 0 ]; then
              CTRADER_DEMO_XAU_FROZEN_ENABLED=1 python -m fx_scanner.demo_xau_frozen_dd50 || echo "XAU_FROZEN_EXECUTOR_RETRY_NEXT_CYCLE rc=$?"
            else
              echo "V344_RUNTIME_RETRY_NEXT_CYCLE rc=$runtime_rc"
            fi

            if [ "$cycle" -eq 1 ] || [ $((cycle % 5)) -eq 0 ]; then
              python scripts/demo_order_protection_audit.py || echo "BROKER_ORDER_AUDIT_FAILED retry=next_window"
            fi

            # Graceful code handoff: finish the current market/execution cycle
            # before yielding to a queued run built from newer main.
            latest_main=""
            for attempt in 1 2 3; do
              latest_main="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha 2>/tmp/v365-main-sha.err || true)"
              if [ -n "$latest_main" ]; then
                break
              fi
              echo "V365_MAIN_SHA_RETRY attempt=${attempt}/3"
              sleep $((attempt * 2))
            done
            if [ -z "$latest_main" ]; then
              echo "V365_HANDOFF_FAIL_CLOSED reason=MAIN_SHA_UNVERIFIED current=$GITHUB_SHA"
              break
            fi
            if [ "$latest_main" != "$GITHUB_SHA" ]; then
              echo "V365_GRACEFUL_HANDOFF current=$GITHUB_SHA latest_main=$latest_main"
              break
            fi
            sleep 60
          done

      - name: Self-handoff continuous XAU runtime
        if: ${{ success() && !cancelled() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          market_open_utc() {
            weekday="$(date -u +%u)"
            hour="$(date -u +%H)"
            if [ "${weekday}" -eq 7 ]; then
              [ "${hour}" -ge 21 ]
            elif [ "${weekday}" -ge 1 ] && [ "${weekday}" -le 4 ]; then
              return 0
            elif [ "${weekday}" -eq 5 ]; then
              [ "${hour}" -lt 22 ]
            else
              return 1
            fi
          }
          if market_open_utc; then
            gh workflow run -R "${GITHUB_REPOSITORY}" rizan-xau-dual-engine-v344.yml --ref main
            echo "V360_RUNTIME_SELF_HANDOFF_DISPATCHED"
          else
            echo "V360_RUNTIME_SELF_HANDOFF_SKIPPED market=closed"
          fi
