name: XAU V137 CFTC Positioning Forensic V138

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v137_cftc_positioning_forensic_v138.py"
      - "src/fx_scanner/research_xau_v137_cftc_positioning_forensic_v138_runtime.py"
      - "tests/test_research_xau_v137_cftc_positioning_forensic_v138.py"
      - ".github/workflows/research-xau-v137-cftc-positioning-forensic-v138.yml"

permissions:
  contents: read

jobs:
  positioning-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V138_EVIDENCE_OUTPUT: artifacts/xau-v137-cftc-positioning-forensic-v138.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v137_cftc_positioning_forensic_v138.py
      - name: Run V138
        run: python -m fx_scanner.research_xau_v137_cftc_positioning_forensic_v138_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v137-cftc-positioning-forensic-v138
          path: artifacts/xau-v137-cftc-positioning-forensic-v138.json
          if-no-files-found: error
          retention-days: 30
