name: R29.5 Tail-Risk Side Experts and Macro-Lag D1 Research (Read Only)
on:
  push:
    branches: ['research/r295-tailrisk-macro-direction-20261123']
    paths:
      - 'scripts/r295_tailrisk_macro.py'
      - 'tests/test_r295_tailrisk_macro.py'
      - '.github/workflows/r295_tailrisk_macro.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r295-tail-macro-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r295-tailrisk-macro-direction-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated quant research libraries
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl pytest==9.0.2
      - name: Validate non-execution and causal structure/macro gates
        run: python -m pytest -q tests/test_r29_direction60_walkforward.py tests/test_r292_magnitude_regime_expansion.py tests/test_r295_tailrisk_macro.py
      - name: Compile research candidate
        run: python -m py_compile scripts/r295_tailrisk_macro.py

  study:
    needs: verify
    name: R29.5 ${{ matrix.tf }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        tf: ['1h','4h','1D']
        mode: ['tail_guard','coverage_guard']
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r295-tailrisk-macro-direction-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies only
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - name: Restore immutable H1/H4 2019-2026 historical shards
        if: matrix.tf == '1h' || matrix.tf == '4h'
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Restore immutable D1 2012-2026 historical shards
        if: matrix.tf == '1D'
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Select BUY SELL separately on previous-year accuracy plus tail-risk and evaluate later year
        run: python scripts/r295_tailrisk_macro.py --tf "${{ matrix.tf }}" --mode "${{ matrix.mode }}"
      - name: Save annual evaluation and lagged macro evidence without live promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r295-${{ matrix.mode }}-${{ matrix.tf }}
          path: |
            artifacts/r295-${{ matrix.mode }}-${{ matrix.tf }}.json
            artifacts/r17-source-manifest.json
          retention-days: 90
          if-no-files-found: warn
