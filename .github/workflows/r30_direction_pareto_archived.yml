name: R30 XAU Direction Pareto Accuracy x Signal Count Study (Read Only)
on:
  push:
    branches: ['research/r30-pareto-direction-2012-2026-20261123']
    paths:
      - 'scripts/r30_pareto_direction_search.py'
      - 'tests/test_r30_pareto_direction_search.py'
      - '.github/workflows/r30_direction_pareto_archived.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r30-pareto-historical-2012-2026-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r30-pareto-direction-2012-2026-20261123
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install research math/test stack
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 pytest==9.0.2 openpyxl requests
      - name: Compile and prove no 2012 source fabrication
        run: |
          python -m py_compile scripts/r30_pareto_direction_search.py
          python -m pytest -q tests/test_r30_pareto_direction_search.py
  archived:
    needs: contract
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tf: ['1h','4h','1D','1W']
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r30-pareto-direction-2012-2026-20261123
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated research libraries, no LIVE SDK
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 openpyxl requests
      - name: Restore immutable original 2019-2026 H1/H4 price shards
        if: matrix.tf == '1h' || matrix.tf == '4h'
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Restore immutable original 2012-2026 D1/W1 price shards
        if: matrix.tf == '1D' || matrix.tf == '1W'
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Run fully causal previous-year precision / balanced / high-frequency Pareto
        run: python scripts/r30_pareto_direction_search.py --tf "${{ matrix.tf }}" --scope archived
      - name: Save complete year/side candidate evidence with actual source scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r30-pareto-${{ matrix.tf }}-archived
          path: artifacts/r30_pareto/r30-pareto-${{ matrix.tf }}-archived.json
          retention-days: 90
          if-no-files-found: warn
