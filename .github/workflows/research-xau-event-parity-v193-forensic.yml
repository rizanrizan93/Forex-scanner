name: Research XAU Event Parity V193 Forensic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_event_parity_v193.py"
      - "tests/test_research_xau_event_parity_v193.py"
      - ".github/workflows/research-xau-event-parity-v193-forensic.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: research-xau-event-parity-v193-forensic
  cancel-in-progress: true

jobs:
  parity-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      XAU_V193_FULL_ARTIFACT: /tmp/v193-full/xau-event-reaction-v193-full.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt

      - name: Unit test parity diagnostics
        run: pytest -q tests/test_research_xau_event_parity_v193.py

      - name: Download latest successful V193 full atlas
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/${GITHUB_REPOSITORY}/actions/workflows/research-xau-event-reaction-v193-full.yml/runs?branch=main&status=success&per_page=20"               --jq '.workflow_runs[0].id // empty'
          )"
          if [ -z "${run_id}" ]; then
            echo "V193_PARITY_FORENSIC_NO_SUCCESSFUL_FULL_RUN"
            exit 1
          fi
          mkdir -p /tmp/v193-full
          gh run download "${run_id}"             --repo "${GITHUB_REPOSITORY}"             --name xau-event-reaction-v193-full             --dir /tmp/v193-full
          test -s "${XAU_V193_FULL_ARTIFACT}"
          echo "V193_PARITY_FORENSIC_SOURCE_RUN_ID=${run_id}"

      - name: Compare latest V193 atlas with cTrader and run time-shift forensics
        run: python -m fx_scanner.research_xau_event_parity_v193
