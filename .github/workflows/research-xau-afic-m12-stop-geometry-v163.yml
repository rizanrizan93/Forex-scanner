name: XAU AFIC M12 Stop Geometry V163
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_m12_stop_geometry_v163.py"
      - "src/fx_scanner/research_xau_afic_m12_stop_geometry_v163_runtime.py"
      - "tests/test_research_xau_afic_m12_stop_geometry_v163.py"
      - ".github/workflows/research-xau-afic-m12-stop-geometry-v163.yml"
permissions:
  contents: read
jobs:
  afic-v163:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V163_OUTPUT: artifacts/xau-afic-m12-stop-geometry-v163.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit test
        run: pytest -q tests/test_research_xau_afic_m12_stop_geometry_v163.py
      - name: Run V163 M1 reconstruction
        run: python -m fx_scanner.research_xau_afic_m12_stop_geometry_v163_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-m12-stop-geometry-v163
          path: artifacts/xau-afic-m12-stop-geometry-v163.json
          if-no-files-found: error
          retention-days: 30
