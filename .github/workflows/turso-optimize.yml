name: Turso free tier optimization
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/turso-optimize.yml', 'scripts/turso_optimize.py', 'turso/optimize.sql']
permissions:
  contents: read
concurrency:
  group: turso-index-optimization
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      FX_DATABASE_BACKEND: turso
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==9.0.2 httpx==0.28.1 PyYAML==6.0.2
      - run: python -m pytest -q tests/test_turso_client.py tests/test_turso_optimization.py
      - run: python scripts/turso_optimize.py
