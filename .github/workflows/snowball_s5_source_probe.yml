name: Snowball S5 FXCM EUR M1 source probe
on:
  push:
    branches: ['research/bootstrap125-snowball-r2-20261122']
    paths: ['scripts/snowball_s5_fxcm_source_probe.py','.github/workflows/snowball_s5_source_probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 requests==2.32.5
      - name: Verify source schema, HTTPS and SHA256
        run: python scripts/snowball_s5_fxcm_source_probe.py
