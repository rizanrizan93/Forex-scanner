name: cTrader Demo XAU AFIC Prepared Lane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctrader-demo-xau-afic-prepared-lane
  cancel-in-progress: false

jobs:
  prepare-afic-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CTRADER_DEMO_AFIC_EXECUTION_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit test AFIC prepared plan
        run: pytest -q tests/test_demo_xau_afic_prepared_plan_producer.py tests/test_demo_xau_afic_path_shadow_observer.py
      - name: Prepare AFIC forecast/order blueprint
        run: python -m fx_scanner.demo_xau_afic_prepared_plan_producer
