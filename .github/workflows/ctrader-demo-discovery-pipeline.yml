name: cTrader Demo Discovery Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctrader-demo-discovery-pipeline
  cancel-in-progress: false

jobs:
  pair-specific-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FX_KILL_SWITCH: "0"
      CTRADER_DEMO_AUTOTRADE_ENABLED: ${{ secrets.CTRADER_DEMO_AUTOTRADE_ENABLED }}
      CTRADER_DEMO_EXECUTION_CANDIDATE_MIN: "70.0"
      CTRADER_DEMO_TECHNICAL_ONLY: "1"
      CTRADER_DEMO_CALIBRATION_ALLOW_PRETRIGGER: "1"
      CTRADER_DEMO_CHASE_BLOCK_ATR: "2.0"
      CTRADER_DEMO_MAX_ENTRY_DRIFT_R: "0.50"
      CTRADER_DEMO_RISK_PER_TRADE_PCT: "0.5"
      CTRADER_DEMO_XAUUSD_MAX_SPREAD_PIPS: "30"
      CTRADER_DEMO_STRUCTURAL_PROFIT_PROTECT_ENABLED: "1"
      CTRADER_DEMO_ADAPTIVE_CALIBRATION_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Discover pair-specific DEMO execution strategies
        run: python -m fx_scanner.demo_execution_technical_producer
      - name: Classify XAU expansion challenger shadow evidence
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_xau_expansion_challenger
      - name: Persist XAU active strategy identity and latency telemetry
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_xau_strategy_latency_telemetry
      - name: Reconcile cTrader closed DEMO outcomes
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_closed_trade_reconciler
      - name: Finalize sampled MAE and MFE trajectories
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_trajectory_finalizer
      - name: Summarize floating P&L and incremental calibration
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_normalized_calibration_runner incremental
      - name: Score XAUUSD IMPULSE_RETEST_V2 forward DEMO outcomes
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_xau_v2_forward_scorecard
      - name: Score EURUSD baseline forward DEMO outcomes
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_eurusd_forward_scorecard
      - name: Build Adaptive Calibration v2 shadow cohorts and diagnostics
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_normalized_calibration_runner adaptive-v2
      - name: Compare historical shadow cohorts
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_normalized_calibration_runner comparison
      - name: Attribute repeated loss patterns in shadow mode
        if: ${{ always() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_normalized_calibration_runner loss-attribution
