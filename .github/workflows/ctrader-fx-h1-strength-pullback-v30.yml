name: cTrader FX H1 Strength Pullback V30

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_fx_h1_strength_pullback_v30.py"
      - "src/fx_scanner/research_fx_h1_strength_pullback_v30_runtime.py"
      - "tests/test_research_fx_h1_strength_pullback_v30.py"
      - ".github/workflows/ctrader-fx-h1-strength-pullback-v30.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-fx-h1-strength-pullback-v30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fx-h1-strength-pullback-v30:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      V30_EVIDENCE_OUTPUT: artifacts/fx-h1-strength-pullback-v30.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit tests
        run: pytest -q tests/test_research_fx_h1_strength_pullback_v30.py
      - name: Run H1 strength pullback research
        run: python -m fx_scanner.research_fx_h1_strength_pullback_v30_runtime
      - name: Upload V30 evidence
        uses: actions/upload-artifact@v4
        with:
          name: fx-h1-strength-pullback-v30
          path: artifacts/fx-h1-strength-pullback-v30.json
          if-no-files-found: error
          retention-days: 30
