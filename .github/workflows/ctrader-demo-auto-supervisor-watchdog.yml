name: cTrader Demo Auto Supervisor Watchdog

on:
  workflow_dispatch:
  schedule:
    # Independent hourly recovery window. This does not execute trades or data
    # acquisition itself; it only ensures the bounded primary supervisor keeps
    # being re-dispatched if the primary 5-minute cron delivery stalls.
    - cron: "32 * * * 0-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ctrader-demo-auto-supervisor-watchdog.yml"
      - ".github/workflows/ctrader-demo-auto-supervisor.yml"
      - ".github/workflows/ctrader-demo-auto-pipeline.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: ctrader-demo-auto-supervisor-watchdog
  cancel-in-progress: true

jobs:
  recover-supervisor-if-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Maintain supervisor recovery window
        shell: bash
        run: |
          set -euo pipefail

          window_cycles=59
          cadence_seconds=60
          recovery_dispatches=0
          healthy_checks=0

          market_open_utc() {
            local weekday hour
            weekday="$(date -u +%u)"
            hour="$(date -u +%H)"
            if [ "${weekday}" -eq 7 ]; then
              [ "${hour}" -ge 21 ]
            elif [ "${weekday}" -ge 1 ] && [ "${weekday}" -le 4 ]; then
              return 0
            elif [ "${weekday}" -eq 5 ]; then
              [ "${hour}" -lt 22 ]
            else
              return 1
            fi
          }

          active_supervisor_count() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-supervisor.yml/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
          }

          dispatch_supervisor() {
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-supervisor.yml/dispatches" \
              -f ref=main
          }

          if ! market_open_utc; then
            echo "CTRADER_DEMO_SUPERVISOR_WATCHDOG_MARKET_CLOSED calendar=FOREX_WEEK_24X5 action=NO_DISPATCH"
            exit 0
          fi

          echo "CTRADER_DEMO_SUPERVISOR_WATCHDOG_START event=${GITHUB_EVENT_NAME} head_sha=${GITHUB_SHA} window_cycles=${window_cycles} cadence_seconds=${cadence_seconds} authority=RECOVERY_ONLY execution_authority=NONE push_kick=WATCHDOG_SUPERVISOR_OR_AUTO_PIPELINE"

          for cycle in $(seq 1 "${window_cycles}"); do
            if ! market_open_utc; then
              echo "CTRADER_DEMO_SUPERVISOR_WATCHDOG_MARKET_CLOSED cycle=${cycle}/${window_cycles} action=STOP"
              exit 0
            fi

            active_supervisor="$(active_supervisor_count)"
            if [ "${active_supervisor}" -gt 0 ]; then
              echo "CTRADER_DEMO_SUPERVISOR_WATCHDOG_OK cycle=${cycle}/${window_cycles} active_supervisor_runs=${active_supervisor} action=NO_DISPATCH"
              healthy_checks=$((healthy_checks + 1))
            else
              dispatch_supervisor
              recovery_dispatches=$((recovery_dispatches + 1))
              echo "CTRADER_DEMO_SUPERVISOR_WATCHDOG_RECOVERY cycle=${cycle}/${window_cycles} active_supervisor_runs=0 action=DISPATCHED"
            fi

            if [ "${cycle}" -lt "${window_cycles}" ]; then
              sleep "${cadence_seconds}"
            fi
          done

          echo "CTRADER_DEMO_SUPERVISOR_WATCHDOG_SUCCESS head_sha=${GITHUB_SHA} recovery_dispatches=${recovery_dispatches} healthy_checks=${healthy_checks} window_cycles=${window_cycles} cadence_seconds=${cadence_seconds} authority=RECOVERY_ONLY execution_authority=NONE push_kick=WATCHDOG_SUPERVISOR_OR_AUTO_PIPELINE"
