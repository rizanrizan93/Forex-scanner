name: BTCUSD USDJPY million configuration research 2019-2026
on:
  push:
    branches: [research/btcusd-usdjpy-million-2019-2026]
    paths: [.github/workflows/btcusd-usdjpy-million-2019-2026.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  supersede_initial:
    runs-on: ubuntu-latest
    steps:
      - name: Stop superseded research run only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/rizanrizan93/Forex-scanner/actions/runs/39208609672/cancel || true
  screen:
    needs: supersede_initial
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSD, USDJPY]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas numpy matplotlib
      - uses: actions/download-artifact@v4
        if: matrix.symbol == 'USDJPY'
        with:
          name: rizan-usdjpy-m1-all-years-csv-gz
          run-id: 39176779912
          github-token: ${{ github.token }}
          path: research_btc_jpy/input_usdjpy
      - name: Audit and freeze input candles
        run: python research_btc_jpy/prepare.py ${{ matrix.symbol }} --usdjpy research_btc_jpy/input_usdjpy/USDJPY_M1_2016_2026_UTC.csv.gz
      - name: Compile and run execution fixtures
        run: |
          set -euo pipefail
          mkdir -p research_btc_jpy/results_${{ matrix.symbol }}
          g++ -O3 -std=c++17 -Wall -Wextra research_btc_jpy/search.cpp -o search
          ./search --test | tee research_btc_jpy/results_${{ matrix.symbol }}/ENGINE_FIXTURES.log
          sha256sum research_btc_jpy/search.cpp research_btc_jpy/prepare.py research_btc_jpy/RESEARCH_PROTOCOL.md > research_btc_jpy/results_${{ matrix.symbol }}/SOURCE_SHA256.txt
          git rev-parse HEAD > research_btc_jpy/results_${{ matrix.symbol }}/COMMIT.txt
      - name: Run one million unique configurations and M1 validation
        run: |
          set -euo pipefail
          ./search research_btc_jpy/data/${{ matrix.symbol }}_M1.csv ${{ matrix.symbol }} research_btc_jpy/results_${{ matrix.symbol }} 1000000 | tee research_btc_jpy/results_${{ matrix.symbol }}/RUN.log
          grep -q 'COMPLETE unique=1000000' research_btc_jpy/results_${{ matrix.symbol }}/RUN.log
      - name: Reconcile ledgers and generate research report
        run: python research_btc_jpy/audit_report.py ${{ matrix.symbol }}
      - name: Compress large reproducibility inputs and screen rows
        if: always()
        run: |
          set -euo pipefail
          gzip -f research_btc_jpy/results_${{ matrix.symbol }}/ALL_CONFIGURATIONS.csv || true
          gzip -f research_btc_jpy/data/${{ matrix.symbol }}_M1.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-${{ matrix.symbol }}-1M-2019-2026
          retention-days: 30
          compression-level: 1
          path: |
            research_btc_jpy/results_${{ matrix.symbol }}/
            research_btc_jpy/data/
            research_btc_jpy/search.cpp
            research_btc_jpy/prepare.py
            research_btc_jpy/audit_report.py
            research_btc_jpy/RESEARCH_PROTOCOL.md
          if-no-files-found: error
