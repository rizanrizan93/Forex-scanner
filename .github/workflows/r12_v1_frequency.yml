name: RIZAN R12 V1 Additional Frequency Research Only
on:
  push:
    branches: ['research/r12-v1-frequency-pullback']
    paths:
      - '.github/workflows/r12_v1_frequency.yml'
      - 'research/r11_profitable_addon_alpha/r12_frequency.py'
      - 'research/r11_profitable_addon_alpha/R12_PROTOCOL.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r12-v1-frequency
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/r11_profitable_addon_alpha/requirements.txt
      - run: pip install -r research/r11_profitable_addon_alpha/requirements.txt
      - name: Verify chronology and execution mechanics
        run: python research/r11_profitable_addon_alpha/r12_frequency.py --selftest
      - name: Verify real-data pilot mechanics
        run: python research/r11_profitable_addon_alpha/r12_frequency.py --year 2021 --pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-pilot
          path: artifacts/r12/
          retention-days: 90
  annual:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/r11_profitable_addon_alpha/requirements.txt
      - run: pip install -r research/r11_profitable_addon_alpha/requirements.txt
      - name: Annual bid ask replay with all failures retained
        run: python research/r11_profitable_addon_alpha/r12_frequency.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-year-${{ matrix.year }}
          path: artifacts/r12/
          retention-days: 90
  aggregate:
    needs: annual
    if: always() && needs.annual.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/r11_profitable_addon_alpha/requirements.txt
      - run: pip install -r research/r11_profitable_addon_alpha/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: r12-year-*
          merge-multiple: true
          path: /tmp/r12-annual
      - name: Evaluate fixed economic gates and expanding walk forward
        run: python research/r11_profitable_addon_alpha/r12_frequency.py --aggregate /tmp/r12-annual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-final-selection
          path: artifacts/r12/aggregate.json
          retention-days: 90
