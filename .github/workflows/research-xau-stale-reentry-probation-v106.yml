name: XAU Stale Reentry Probation V106
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_stale_reentry_probation_v106.py"
      - "src/fx_scanner/research_xau_stale_reentry_probation_v106_runtime.py"
      - "tests/test_research_xau_stale_reentry_probation_v106.py"
      - ".github/workflows/research-xau-stale-reentry-probation-v106.yml"
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V106_EVIDENCE_OUTPUT: artifacts/xau-stale-reentry-probation-v106.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11",cache: pip}
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_stale_reentry_probation_v106.py
      - name: Run stale-reentry probation diagnostic
        run: python -m fx_scanner.research_xau_stale_reentry_probation_v106_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-stale-reentry-probation-v106
          path: artifacts/xau-stale-reentry-probation-v106.json
          if-no-files-found: error
          retention-days: 30
