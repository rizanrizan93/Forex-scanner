name: R9.7 D1 bias replay
on:
  push:
    branches: ['research/r91-early-warning-m1-20261121']
    paths: ['scripts/r97_bias.py','.github/workflows/r97_bias.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: 'src:.'
      XAU_V193_PRICE_PROVENANCE: /tmp/r97-source.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install numpy==2.3.5 pandas==2.2.3
          pip install 'git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8'
      - run: |
          for year in 2019 2020 2021 2022 2023 2024; do
            XAU_V193_YEAR=$year XAU_V193_PRICE_CSV=/tmp/r97-$year.csv python -m fx_scanner.research_xau_histdata_download_v193 || exit 1
          done
          python scripts/r97_bias.py
      - uses: actions/upload-artifact@v4
        with:
          name: r97-bias-results
          path: artifacts/r97.json
          if-no-files-found: error
