name: Pre-News 3-Source Forecast Regression

on:
  pull_request:
    paths:
      - "src/fx_scanner/pre_news_*.py"
      - "src/fx_scanner/demo_xau_event_risk_v193.py"
      - "tests/test_pre_news_*.py"
      - ".github/workflows/pre-news-forecast-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project and dashboard dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install scipy==1.17.0 numba==0.63.1
      - name: Syntax validation of modified Pre-News modules
        run: |
          python -m py_compile src/fx_scanner/pre_news_expectation.py
          python -m py_compile src/fx_scanner/pre_news_source_fusion.py
          python -m py_compile src/fx_scanner/pre_news_dashboard.py
          python -m py_compile src/fx_scanner/demo_xau_event_risk_v193.py
      - name: Source fusion, calendar, expectation and dashboard regression
        run: |
          pytest -q tests/test_pre_news_additional_providers.py \
            tests/test_pre_news_source_fusion.py \
            tests/test_pre_news_secondary_calendar.py \
            tests/test_pre_news_expectation.py \
            tests/test_pre_news_transport.py \
            tests/test_pre_news_runtime.py \
            tests/test_pre_news_cpi_2026.py
