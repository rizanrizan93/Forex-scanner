name: BUY050 read-only diagnostics after installation
on:
  push:
    branches: ['fix/buy050-identity-20261108']
    paths: ['.github/workflows/buy050-vps-diagnostics.yml','repairs/buy050_identity_20261108/bridge/deploy/diagnose_readonly.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only BUY050 health and authenticated no-order probe
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/known"
          ssh-keygen -y -f "$d/key" >/dev/null
          sshopt=(-i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/known" -o ConnectTimeout=20)
          host='Rizanrizan@202.74.74.172'
          remote=$(ssh "${sshopt[@]}" "$host" 'umask 077; mktemp -d /tmp/rizan-buy050-diag.XXXXXXXX')
          [[ "$remote" =~ ^/tmp/rizan-buy050-diag\.[a-zA-Z0-9]+$ ]] || exit 1
          cleanup() { ssh "${sshopt[@]}" "$host" "rm -rf -- '$remote'" >/dev/null 2>&1 || true; }
          trap 'cleanup; rm -rf "$d"' EXIT
          scp "${sshopt[@]}" repairs/buy050_identity_20261108/bridge/deploy/diagnose_readonly.py "$host:$remote/"
          ssh "${sshopt[@]}" "$host" "sudo -n python3 '$remote/diagnose_readonly.py'"
