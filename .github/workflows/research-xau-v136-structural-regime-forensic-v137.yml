name: XAU V136 Structural Regime Forensic V137

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v136_structural_regime_forensic_v137.py"
      - "src/fx_scanner/research_xau_v136_structural_regime_forensic_v137_runtime.py"
      - "tests/test_research_xau_v136_structural_regime_forensic_v137.py"
      - ".github/workflows/research-xau-v136-structural-regime-forensic-v137.yml"

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V137_EVIDENCE_OUTPUT: artifacts/xau-v136-structural-regime-forensic-v137.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v136_structural_regime_forensic_v137.py
      - name: Run V137
        run: python -m fx_scanner.research_xau_v136_structural_regime_forensic_v137_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v136-structural-regime-forensic-v137
          path: artifacts/xau-v136-structural-regime-forensic-v137.json
          if-no-files-found: error
          retention-days: 30
