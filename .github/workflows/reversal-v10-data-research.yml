name: Reversal V10 OOS Data Research Only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reversal-v10-data-research.yml
permissions:
  contents: read
jobs:
  dukascopy-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      V10_START: '2026-03-15'
      V10_END: '2026-10-20'
      V10_OUT: 'artifacts/research_v10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install research-only dependencies
        run: |
          python -m pip install pandas==2.2.3 numpy==2.2.6 pytest==8.3.4
          npm install --no-save dukascopy-node
      - name: Validate data ingestion
        run: PYTHONPATH=scripts/research_v10 python -m pytest -q scripts/research_v10/test_normalize.py
      - name: Download new public BID and ASK M1
        run: bash scripts/research_v10/fetch_quotes.sh
      - name: Upload verified OOS candles and quality manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reversal-v10-dukas-oos-m1-bid-ask
          path: artifacts/research_v10
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
