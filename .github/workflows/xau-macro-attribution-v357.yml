name: XAU Macro Attribution V399

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * 0-5"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/dxy_broker_context.py"
      - "scripts/collect_broker_dxy.py"
      - "src/fx_scanner/pre_news_transport.py"
      - "scripts/publish_pre_news_snapshot.py"
      - "scripts/run_pre_news_feed.py"
      - "src/fx_scanner/xau_macro_attribution_v357.py"
      - "src/fx_scanner/xau_intraday_yield_v367.py"
      - "src/fx_scanner/xau_intraday_macro_v398.py"
      - "src/fx_scanner/xau_treasury_session_v399.py"
      - "src/fx_scanner/demo_xau_macro_attribution_v357.py"
      - "src/fx_scanner/demo_xau_macro_attribution_v398.py"
      - "src/fx_scanner/demo_xau_macro_attribution_v399.py"
      - "src/fx_scanner/demo_xau_event_risk_v192.py"
      - "src/fx_scanner/providers/news.py"
      - "src/fx_scanner/providers/official.py"
      - "config/providers.yaml"
      - "tests/test_xau_macro_attribution_v357.py"
      - "tests/test_xau_intraday_yield_v367.py"
      - "tests/test_xau_intraday_macro_v398.py"
      - "tests/test_xau_treasury_session_v399.py"
      - ".github/workflows/xau-macro-attribution-v357.yml"
  pull_request:
    paths:
      - "src/fx_scanner/dxy_broker_context.py"
      - "scripts/collect_broker_dxy.py"
      - "src/fx_scanner/pre_news_transport.py"
      - "scripts/publish_pre_news_snapshot.py"
      - "scripts/run_pre_news_feed.py"
      - "src/fx_scanner/xau_macro_attribution_v357.py"
      - "src/fx_scanner/xau_intraday_yield_v367.py"
      - "src/fx_scanner/xau_intraday_macro_v398.py"
      - "src/fx_scanner/xau_treasury_session_v399.py"
      - "src/fx_scanner/demo_xau_macro_attribution_v357.py"
      - "src/fx_scanner/demo_xau_macro_attribution_v398.py"
      - "src/fx_scanner/demo_xau_macro_attribution_v399.py"
      - "config/providers.yaml"
      - "tests/test_xau_macro_attribution_v357.py"
      - "tests/test_xau_intraday_yield_v367.py"
      - "tests/test_xau_intraday_macro_v398.py"
      - "tests/test_xau_treasury_session_v399.py"
      - ".github/workflows/xau-macro-attribution-v357.yml"

permissions:
  contents: write

concurrency:
  group: xau-macro-attribution-v399-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  macro-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FX_DATABASE_BACKEND: turso
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      SUPABASE_URL: https://naxvdtvlfatljzzwhrmo.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==9.0.2 ctrader-open-api==0.9.2 service-identity==24.2.0
      - name: Test V357/V367/V398/V399
        run: |
          pytest -q \
            tests/test_xau_macro_attribution_v357.py \
            tests/test_xau_intraday_yield_v367.py \
            tests/test_xau_intraday_macro_v398.py \
            tests/test_xau_treasury_session_v399.py \
            tests/test_pre_news_runtime.py
      - name: Validate configuration
        run: python -c "from fx_scanner.config import load_project_config; load_project_config(None); print('Macro configuration valid')"
      - name: Publish Pre-News continuously every four minutes
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
        run: python -u scripts/run_pre_news_feed.py
