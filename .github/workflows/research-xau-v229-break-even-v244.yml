name: Research XAU V229 Break Even V244

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/fx_scanner/research_xau_v229_break_even_v244.py"
      - "src/fx_scanner/research_xau_v229_break_even_v244_year_runtime.py"
      - "src/fx_scanner/research_xau_v229_break_even_v244_aggregate.py"
      - "tests/test_research_xau_v229_break_even_v244.py"
      - ".github/workflows/research-xau-v229-break-even-v244.yml"
  push:
    branches:
      - research/v244-xau-break-even-management
    paths:
      - "src/fx_scanner/research_xau_v229_break_even_v244.py"
      - "src/fx_scanner/research_xau_v229_break_even_v244_year_runtime.py"
      - "src/fx_scanner/research_xau_v229_break_even_v244_aggregate.py"
      - "tests/test_research_xau_v229_break_even_v244.py"
      - ".github/workflows/research-xau-v229-break-even-v244.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-v229-break-even-v244-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==9.0.2
      - name: Test V244
        run: |
          pytest -q             tests/test_research_xau_v229_break_even_v244.py             tests/test_research_xau_v229_historical_v242.py

  backfill-year:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      XAU_V244_YEAR: ${{ matrix.year }}
      XAU_V244_PRICE_CSV: /tmp/histdata/xau-v244-${{ matrix.year }}.csv
      XAU_V244_PROVENANCE: artifacts/xau-v244-provenance-${{ matrix.year }}.json
      XAU_V244_OUTPUT: artifacts/xau-v229-break-even-v244-${{ matrix.year }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install historical runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Run exact M1 break-even management year
        run: python -m fx_scanner.research_xau_v229_break_even_v244_year_runtime
      - name: Upload yearly shard
        uses: actions/upload-artifact@v4
        with:
          name: xau-v244-year-${{ matrix.year }}
          path: |
            artifacts/xau-v229-break-even-v244-${{ matrix.year }}.json
            artifacts/xau-v244-provenance-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: backfill-year
    if: always() && needs.backfill-year.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XAU_V244_SHARD_DIR: /tmp/xau-v244-shards
      XAU_V244_FULL_OUTPUT: artifacts/xau-v229-break-even-v244-full.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install aggregator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download all yearly shards
        uses: actions/download-artifact@v4
        with:
          pattern: xau-v244-year-*
          path: /tmp/xau-v244-shards
          merge-multiple: false
      - name: Aggregate V244 break-even study
        run: python -m fx_scanner.research_xau_v229_break_even_v244_aggregate
      - name: Upload full V244 result
        uses: actions/upload-artifact@v4
        with:
          name: xau-v229-break-even-v244-full
          path: artifacts/xau-v229-break-even-v244-full.json
          if-no-files-found: error
          retention-days: 30
