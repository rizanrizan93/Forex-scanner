name: XAU Equity Unit Compounding V115
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_equity_unit_compounding_v115.py"
      - "src/fx_scanner/research_xau_equity_unit_compounding_v115_runtime.py"
      - "tests/test_research_xau_equity_unit_compounding_v115.py"
      - ".github/workflows/research-xau-equity-unit-compounding-v115.yml"
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V115_EVIDENCE_OUTPUT: artifacts/xau-equity-unit-compounding-v115.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11",cache: pip}
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_equity_unit_compounding_v115.py
      - name: Run equity-unit compounding diagnostic
        run: python -m fx_scanner.research_xau_equity_unit_compounding_v115_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-equity-unit-compounding-v115
          path: artifacts/xau-equity-unit-compounding-v115.json
          if-no-files-found: error
          retention-days: 30
