name: Zone rebound research causal checks
on:
  pull_request:
    paths: ['research/zone_rebound/**','tests/test_zone_rebound_audit.py','tests/test_exhaustion_rebound_r2.py','.github/workflows/zone-rebound-research.yml']
  push:
    branches: [main]
    paths: ['research/zone_rebound/**','tests/test_zone_rebound_audit.py','tests/test_exhaustion_rebound_r2.py','.github/workflows/zone-rebound-research.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - run: PYTHONPATH=src:. python -m pytest -q tests/test_zone_rebound_audit.py tests/test_exhaustion_rebound_r2.py
