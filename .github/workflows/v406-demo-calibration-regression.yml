name: V406 DEMO Calibration Selector Regression

on:
  pull_request:
    paths:
      - "src/fx_scanner/xau_demo_calibration_v406.py"
      - "tests/test_xau_demo_calibration_v406.py"
      - ".github/workflows/v406-demo-calibration-regression.yml"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/xau_demo_calibration_v406.py"
      - "tests/test_xau_demo_calibration_v406.py"
      - ".github/workflows/v406-demo-calibration-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest==9.0.2
      - name: Compile V404/V405/V406
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/fx_scanner/xau_runtime_decision_v404.py \
            src/fx_scanner/xau_whalezone_reconstruction_v405.py \
            src/fx_scanner/xau_demo_calibration_v406.py
      - name: Run V406 regression
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_xau_demo_calibration_v406.py
