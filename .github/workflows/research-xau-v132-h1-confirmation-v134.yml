name: XAU V132 H1 Confirmation V134

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v132_h1_confirmation_v134.py"
      - "src/fx_scanner/research_xau_v132_h1_confirmation_v134_runtime.py"
      - "tests/test_research_xau_v132_h1_confirmation_v134.py"
      - ".github/workflows/research-xau-v132-h1-confirmation-v134.yml"

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V134_EVIDENCE_OUTPUT: artifacts/xau-v132-h1-confirmation-v134.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v132_h1_confirmation_v134.py
      - name: Run V134
        run: python -m fx_scanner.research_xau_v132_h1_confirmation_v134_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v132-h1-confirmation-v134
          path: artifacts/xau-v132-h1-confirmation-v134.json
          if-no-files-found: error
          retention-days: 30
