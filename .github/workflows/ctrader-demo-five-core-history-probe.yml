name: cTrader Demo Five-Core History Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/demo_five_core_history_probe.py"
      - "src/fx_scanner/demo_five_core_candidate_producer.py"
      - ".github/workflows/ctrader-demo-five-core-history-probe.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-demo-five-core-history-probe
  cancel-in-progress: true

jobs:
  history-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Probe five-core D1/H4 history without live quotes or orders
        run: python -m fx_scanner.demo_five_core_history_probe
