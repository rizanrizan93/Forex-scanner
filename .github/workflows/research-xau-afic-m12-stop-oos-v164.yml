name: XAU AFIC M12 Stop OOS V164
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_m12_stop_oos_v164.py"
      - "src/fx_scanner/research_xau_afic_m12_stop_oos_v164_runtime.py"
      - "tests/test_research_xau_afic_m12_stop_oos_v164.py"
      - ".github/workflows/research-xau-afic-m12-stop-oos-v164.yml"
permissions:
  contents: read
jobs:
  afic-v164:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V164_OUTPUT: artifacts/xau-afic-m12-stop-oos-v164.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit test
        run: pytest -q tests/test_research_xau_afic_m12_stop_oos_v164.py
      - name: Run V164 2023-2024 holdout
        run: python -m fx_scanner.research_xau_afic_m12_stop_oos_v164_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-m12-stop-oos-v164
          path: artifacts/xau-afic-m12-stop-oos-v164.json
          if-no-files-found: error
          retention-days: 30
