name: XAU HTF Strategic Snapshot V218

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0,4,8,12,16,20 * * 1-5"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/demo_xau_v218_htf_strategic_snapshot.py"
      - "src/fx_scanner/demo_xau_v217_direction_probability.py"
      - ".github/workflows/ctrader-demo-xau-v218-htf-snapshot.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-demo-xau-v218-htf-snapshot
  cancel-in-progress: true

jobs:
  strategic-snapshot-v218:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      XAU_V218_HISTORY_BARS: "20000"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit test V218
        run: pytest -q tests/test_v218_htf_strategic_snapshot.py tests/test_v217_direction_probability.py
      - name: Refresh bounded D1/H4 strategic snapshot
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m fx_scanner.demo_xau_v218_htf_strategic_snapshot
