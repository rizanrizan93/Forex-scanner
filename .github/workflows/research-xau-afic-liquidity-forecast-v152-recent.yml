name: XAU AFIC Liquidity Forecast V152 Recent
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_liquidity_forecast_v152_recent_runtime.py"
      - ".github/workflows/research-xau-afic-liquidity-forecast-v152-recent.yml"
permissions:
  contents: read
jobs:
  recent-afic-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      V152_RECENT_OUTPUT: artifacts/xau-afic-liquidity-forecast-v152-recent.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install dukascopy-python==4.0.1
      - name: Run recent AFIC reconstruction
        run: python -m fx_scanner.research_xau_afic_liquidity_forecast_v152_recent_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-liquidity-forecast-v152-recent
          path: artifacts/xau-afic-liquidity-forecast-v152-recent.json
          if-no-files-found: error
          retention-days: 30
