name: R24 News BUY and COT SELL matched crossover
on:
  push:
    branches: ['research/r91-early-warning-m1-20261121']
    paths: ['scripts/r24_news_cot_crossover.py','.github/workflows/r24_news_cot_crossover.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - run: python scripts/r24_news_cot_crossover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r24-crossover
          path: artifacts/r24-*.json
          if-no-files-found: warn
          retention-days: 90
