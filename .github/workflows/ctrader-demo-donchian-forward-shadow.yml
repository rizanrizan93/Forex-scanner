name: cTrader Demo Donchian Forward Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * 1-5"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/demo_donchian_forward_shadow.py"
      - "src/fx_scanner/demo_donchian_lifecycle.py"
      - "src/fx_scanner/demo_donchian_adaptive_tournament.py"
      - "src/fx_scanner/demo_donchian_export_evidence.py"
      - ".github/workflows/ctrader-demo-donchian-forward-shadow.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-demo-donchian-forward-shadow
  cancel-in-progress: true

jobs:
  forward-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      CTRADER_DONCHIAN_FORWARD_HISTORY_BARS: "1200"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DONCHIAN_EVIDENCE_WORKER: ctrader_demo_donchian_forward_shadow
      DONCHIAN_EVIDENCE_OUTPUT: artifacts/donchian-forward-evidence.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Run prospective Donchian forward shadow
        run: python -m fx_scanner.demo_donchian_forward_shadow
      - name: Export exact forward evidence
        run: python -m fx_scanner.demo_donchian_export_evidence
      - name: Upload forward evidence
        uses: actions/upload-artifact@v4
        with:
          name: donchian-forward-evidence
          path: artifacts/donchian-forward-evidence.json
          if-no-files-found: error
          retention-days: 30
