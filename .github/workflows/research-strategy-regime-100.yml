name: research-strategy-regime-100

on:
  push:
    branches:
      - research/strategy-regime-100-20260911
    paths:
      - scripts/research_strategy_regime_100.py
      - .github/workflows/research-strategy-regime-100.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Run 100-trade multi-regime benchmark
        run: python scripts/research_strategy_regime_100.py --output out/strategy_regime_100

      - name: Show report
        if: always()
        run: |
          if [ -f out/strategy_regime_100/report.md ]; then
            cat out/strategy_regime_100/report.md
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-regime-100-results
          path: out/strategy_regime_100/
          if-no-files-found: warn
          retention-days: 14
