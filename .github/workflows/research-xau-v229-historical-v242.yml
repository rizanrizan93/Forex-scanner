name: Research XAU V229 Historical V242

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/fx_scanner/research_xau_v229_historical_v242.py"
      - "src/fx_scanner/research_xau_v229_historical_v242_year_runtime.py"
      - "src/fx_scanner/research_xau_v229_historical_v242_aggregate.py"
      - "tests/test_research_xau_v229_historical_v242.py"
      - ".github/workflows/research-xau-v229-historical-v242.yml"
  push:
    branches:
      - research/v242-xau-v229-historical
    paths:
      - "src/fx_scanner/research_xau_v229_historical_v242.py"
      - "src/fx_scanner/research_xau_v229_historical_v242_year_runtime.py"
      - "src/fx_scanner/research_xau_v229_historical_v242_aggregate.py"
      - "tests/test_research_xau_v229_historical_v242.py"
      - ".github/workflows/research-xau-v229-historical-v242.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-v229-historical-v242-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==9.0.2
      - name: Test V242
        run: |
          pytest -q             tests/test_research_xau_v229_historical_v242.py             tests/test_demo_xau_structural_targets_v229.py             tests/test_research_xau_zone_reversal_depth_v225.py

  backfill-year:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      XAU_V242_YEAR: ${{ matrix.year }}
      XAU_V242_PRICE_CSV: /tmp/histdata/xau-v242-${{ matrix.year }}.csv
      XAU_V242_PROVENANCE: artifacts/xau-v242-provenance-${{ matrix.year }}.json
      XAU_V242_OUTPUT: artifacts/xau-v229-historical-v242-${{ matrix.year }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install historical runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Run XAU canonical V229 historical year
        run: python -m fx_scanner.research_xau_v229_historical_v242_year_runtime
      - name: Upload yearly shard
        uses: actions/upload-artifact@v4
        with:
          name: xau-v242-year-${{ matrix.year }}
          path: |
            artifacts/xau-v229-historical-v242-${{ matrix.year }}.json
            artifacts/xau-v242-provenance-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: backfill-year
    if: always() && needs.backfill-year.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XAU_V242_SHARD_DIR: /tmp/xau-v242-shards
      XAU_V242_FULL_OUTPUT: artifacts/xau-v229-historical-v242-full.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install aggregator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download all yearly shards
        uses: actions/download-artifact@v4
        with:
          pattern: xau-v242-year-*
          path: /tmp/xau-v242-shards
          merge-multiple: false
      - name: Aggregate XAU V229 current-parameter replay
        run: python -m fx_scanner.research_xau_v229_historical_v242_aggregate
      - name: Upload full V242 result
        uses: actions/upload-artifact@v4
        with:
          name: xau-v229-historical-v242-full
          path: artifacts/xau-v229-historical-v242-full.json
          if-no-files-found: error
          retention-days: 30
