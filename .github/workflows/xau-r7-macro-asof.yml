name: XAU R7 Macro As-Of Integrity (Research Only)
on:
  pull_request:
    paths:
      - 'research/zone_rebound/xau_r7_macro_asof.py'
      - 'tests/test_xau_r7_macro_asof.py'
      - '.github/workflows/xau-r7-macro-asof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_asof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - name: Verify time alignment, stale rejection and honest proxy labels
        env:
          PYTHONPATH: 'src:.'
        run: python -m pytest -q tests/test_xau_r7_macro_asof.py
      - name: Ensure research-only source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/zone_rebound/xau_r7_macro_asof.py').read_text()
          assert 'EXECUTION_AUTHORITY=False' in p
          assert 'EXECUTION_INFLUENCE=False' in p
          assert 'DUKASCOPY_DOLLARIDXUSD_M1_NOT_ICE_DXY' in p
          print('R7_ASOF_RESEARCH_ONLY')
          PY
