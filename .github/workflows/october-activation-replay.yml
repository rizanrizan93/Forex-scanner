name: Replay frozen source since observed bridge activation
on:
  push:
    branches: [research/october-entry-audit-20261021]
    paths: ['october_order_readiness/build_activation_replay.py', 'october_order_readiness/run_activation_replay.py', 'october_order_readiness/ActivationReplay.csproj', 'october_order_readiness/export_live_seed.py', '.github/workflows/october-activation-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-BROKER-OCTOBER-READONLY-HISTORY
          run-id: 39535074795
          github-token: ${{ github.token }}
          path: broker
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-BRIDGE-ACTIVATION-READONLY
          run-id: 39535074795
          github-token: ${{ github.token }}
          path: activation
      - name: Export independent fresh seven-day BTC indicator seed
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          mkdir -p publish
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/hosts"
          opts=(-i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=20)
          dest="/home/Rizanrizan/rizan-ticks/REPLAY_RESULTS/october-order-readiness/replay-${GITHUB_RUN_ID}"
          target=Rizanrizan@202.74.74.172
          ssh "${opts[@]}" "$target" "umask 077; mkdir -p '$dest'"
          scp "${opts[@]}" october_order_readiness/export_live_seed.py "$target:$dest/"
          ssh "${opts[@]}" "$target" "sudo -n /usr/bin/python3 - '$dest'" <<'PY' | tee publish/BTC_FRESH_EXPORT.log
          import os,re,subprocess,sys
          dest=sys.argv[1]
          info=subprocess.run(['systemctl','show','rizan-btc7d130.service','--value','-p','ExecStart'],capture_output=True,text=True,check=True).stdout
          py=re.search(r'path=([^ ;}]+)',info).group(1)
          assert 'python' in py.rsplit('/',1)[-1]
          os.execv(py,[py,dest+'/export_live_seed.py',dest])
          PY
          ssh "${opts[@]}" "$target" "sudo -n cat '$dest/BTC_H1.csv'" > publish/BTC_H1.csv
          ssh "${opts[@]}" "$target" "sudo -n cat '$dest/BTC_FRESH_SEED_MANIFEST.json'" > publish/BTC_FRESH_SEED_MANIFEST.json
      - name: Build unchanged source with explicit research wrapper
        run: |
          python3 october_order_readiness/build_activation_replay.py
          dotnet build --configuration Release october_order_readiness/ActivationReplay.csproj | tee publish/ACTIVATION_BUILD.log
          cp october_order_readiness/ACTIVATION_HARNESS.diff publish/
      - name: Execute bounded source replay and macro controls
        run: python3 october_order_readiness/run_activation_replay.py | tee publish/ACTIVATION_REPLAY_EXECUTION.log
      - name: Require actual completed cases
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('publish/ACTIVATION_ENTRY_SUMMARY.json'));assert len(x)==8 and all(v['error_count']==0 for v in x)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-FROZEN-SOURCE-ACTIVATION-REPLAY
          path: |
            publish/
            activation/
            broker/**/BROKER_READ_ONLY_HISTORY.json
