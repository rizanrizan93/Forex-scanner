name: RIZAN XAU Standalone Snapshot V253

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * 1-5"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/xau_standalone_mode_v253.py"
      - "src/fx_scanner/xau_standalone_ctrader_v253.py"
      - "src/fx_scanner/xau_standalone_snapshot_v253.py"
      - "src/fx_scanner/xau_standalone_bridge_v253.py"
      - "calibration/xau_v225_2_depth_prior.json"
      - ".github/workflows/rizan-xau-standalone-v253.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: rizan-xau-standalone-v253
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install isolated cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt

      - name: Configure runtime snapshot branch
        run: |
          git config user.name "RIZAN Runtime"
          git config user.email "actions@users.noreply.github.com"

      - name: Hydrate previous standalone snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          git fetch origin runtime-snapshots --depth=1 || true
          git show FETCH_HEAD:runtime/xau_standalone_snapshot.json             > runtime/xau_standalone_snapshot.json 2>/dev/null || true

      - name: Publish continuous one-minute snapshots
        shell: bash
        run: |
          set -uo pipefail
          for i in $(seq 1 70); do
            started="$(date +%s)"
            snapshot_ok=0
            for attempt in 1 2 3; do
              if python -m fx_scanner.xau_standalone_snapshot_v253 \
                --output runtime/xau_standalone_snapshot.json; then
                snapshot_ok=1
                break
              fi
              echo "::warning::Standalone snapshot attempt ${attempt}/3 failed; retrying"
              sleep "$(( attempt * 5 ))"
            done

            if [ "$snapshot_ok" -eq 1 ]; then
              git add -f runtime/xau_standalone_snapshot.json
              if git diff --cached --quiet; then
                :
              elif [ "$i" -eq 1 ]; then
                git commit -m "runtime: refresh RIZAN XAU standalone snapshot"
              else
                git commit --amend --no-edit
              fi

              push_ok=0
              for push_attempt in 1 2 3; do
                if git push --force origin HEAD:runtime-snapshots; then
                  push_ok=1
                  break
                fi
                echo "::warning::Standalone snapshot push ${push_attempt}/3 failed; retrying"
                sleep "$(( push_attempt * 5 ))"
              done
              if [ "$push_ok" -ne 1 ]; then
                echo "::warning::Standalone snapshot publish skipped this cycle; worker will continue"
              fi
            else
              echo "::warning::Standalone snapshot generation failed this cycle; worker will continue"
            fi

            if [ "$i" -lt 70 ]; then
              elapsed="$(( $(date +%s) - started ))"
              sleep_for="$(( 60 - elapsed ))"
              if [ "$sleep_for" -gt 0 ]; then
                sleep "$sleep_for"
              fi
            fi
          done

      - name: Self-handoff publisher if scheduler misses the next window
        if: ${{ success() && !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          market_open_utc() {
            weekday="$(date -u +%u)"
            hour="$(date -u +%H)"
            if [ "${weekday}" -eq 7 ]; then
              [ "${hour}" -ge 21 ]
            elif [ "${weekday}" -ge 1 ] && [ "${weekday}" -le 4 ]; then
              return 0
            elif [ "${weekday}" -eq 5 ]; then
              [ "${hour}" -lt 22 ]
            else
              return 1
            fi
          }
          if market_open_utc; then
            gh workflow run rizan-xau-standalone-v253.yml --ref main
            echo "RIZAN_STANDALONE_PUBLISHER_SELF_HANDOFF_DISPATCHED"
          else
            echo "RIZAN_STANDALONE_PUBLISHER_SELF_HANDOFF_SKIPPED market=closed"
          fi
