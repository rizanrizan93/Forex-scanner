name: RIZAN XAU Standalone Snapshot V253

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 1-5"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/xau_standalone_mode_v253.py"
      - "src/fx_scanner/xau_standalone_ctrader_v253.py"
      - "src/fx_scanner/xau_standalone_snapshot_v253.py"
      - "src/fx_scanner/xau_standalone_bridge_v253.py"
      - "calibration/xau_v225_2_depth_prior.json"
      - ".github/workflows/rizan-xau-standalone-v253.yml"

permissions:
  contents: write

concurrency:
  group: rizan-xau-standalone-v253
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install isolated cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt

      - name: Recover encrypted durable cTrader token
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "$SUPABASE_URL/functions/v1/ctrader-token-vault-recovery-v1" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Accept: application/json" \
            -o /tmp/ctrader-token.enc.json

          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          associated = b"forex-scanner/ctrader-token-state/v1"
          encrypted = json.load(open("/tmp/ctrader-token.enc.json", "r", encoding="utf-8"))
          key = hashlib.sha256(
              associated + b"\\x00" + os.environ["CTRADER_CLIENT_SECRET"].encode("utf-8")
          ).digest()
          plaintext = AESGCM(key).decrypt(
              base64.b64decode(encrypted["nonce_b64"]),
              base64.b64decode(encrypted["ciphertext_b64"]),
              associated,
          )
          tokens = json.loads(plaintext.decode("utf-8"))
          access = str(tokens["access_token"])
          refresh = str(tokens["refresh_token"])
          print(f"::add-mask::{access}")
          print(f"::add-mask::{refresh}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"CTRADER_ACCESS_TOKEN={access}\\n")
              handle.write(f"CTRADER_REFRESH_TOKEN={refresh}\\n")
          PY

      - name: Configure runtime snapshot branch
        run: |
          git config user.name "RIZAN Runtime"
          git config user.email "actions@users.noreply.github.com"

      - name: Publish five one-minute snapshots
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            started="$(date +%s)"
            python -m fx_scanner.xau_standalone_snapshot_v253               --output runtime/xau_standalone_snapshot.json

            git add -f runtime/xau_standalone_snapshot.json
            if [ "$i" -eq 1 ]; then
              git commit -m "runtime: refresh RIZAN XAU standalone snapshot"
            else
              git commit --amend --no-edit
            fi
            git push --force origin HEAD:runtime-snapshots

            if [ "$i" -lt 5 ]; then
              elapsed="$(( $(date +%s) - started ))"
              sleep_for="$(( 60 - elapsed ))"
              if [ "$sleep_for" -gt 0 ]; then
                sleep "$sleep_for"
              fi
            fi
          done
