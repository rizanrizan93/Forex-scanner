name: Native autonomous M1 lifecycle test
on:
  push:
    branches: [research/native-v130-isolated-20261022]
    paths: ['.github/workflows/native-autonomous-m1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rizan-native-autonomous-m1
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'rizanrizan93/Forex-scanner' && github.ref == 'refs/heads/research/native-v130-isolated-20261022' && github.actor == 'rizanrizan93'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 787ac228837175f9c07c4e13070e2794ebc7a7fe
          path: frozen
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426
      - name: Build native historical transport from frozen source
        shell: bash
        run: |
          set -euo pipefail
          cp -a frozen/portfolio_7day_frozen/work native-work
          python3 research/native-v130/prepare_native.py native-work
          mkdir -p native-work/vendor/automate native-work/vendor/net6ref
          curl -fsSL --retry 3 --max-time 120 https://api.nuget.org/v3-flatcontainer/ctrader.automate/1.0.21/ctrader.automate.1.0.21.nupkg -o automate.zip
          curl -fsSL --retry 3 --max-time 120 https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.ref/6.0.36/microsoft.netcore.app.ref.6.0.36.nupkg -o net6ref.zip
          unzip -q automate.zip -d native-work/vendor/automate
          unzip -q net6ref.zip -d native-work/vendor/net6ref
          sdk=$(dirname "$(readlink -f "$(command -v dotnet)")")
          python3 native-work/build_native.py --sdk "$sdk" || { cat native-work/native/compile.log; cat native-work/native/bundle.log 2>/dev/null || true; exit 1; }
          cp native-work/native/RizanXauEurBtcPortfolio_FROZEN_7DAY_WEEKEND_V1_3_0.algo NativeHistorical.algo
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          sha=hashlib.sha256(Path('NativeHistorical.algo').read_bytes()).hexdigest()
          Path('BINARY_MANIFEST.json').write_text(json.dumps({'sha256':sha,'frozen_source':'787ac228837175f9c07c4e13070e2794ebc7a7fe','variant':'native-historical-local-transport-v1','original_frozen_binary':False}))
          Path('CASE.json').write_text(json.dumps({'symbol':'EURUSD','eur':True,'xau':False,'btc':False,'start':'09/06/2025','end':'01/07/2025','timeout_seconds':1200}))
          PY
      - name: Execute native autonomous M1 case on VPS
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target='Rizanrizan@202.74.74.172'
          remote_dir=$(ssh "${ssh_options[@]}" "$target" 'umask 077; mkdir -p "$HOME/REPLAY_RESULTS/native-autonomous-m1"; mktemp -d "$HOME/REPLAY_RESULTS/native-autonomous-m1/run.XXXXXXXX"')
          [[ "$remote_dir" =~ ^/home/Rizanrizan/REPLAY_RESULTS/native-autonomous-m1/run\.[a-zA-Z0-9]+$ ]] || { echo INVALID_TEST_DIRECTORY; exit 1; }
          scp "${ssh_options[@]}" research/native-v130/runner_m1.py research/native-tick/identity.sealed NativeHistorical.algo BINARY_MANIFEST.json CASE.json "$target:$remote_dir/"
          ssh "${ssh_options[@]}" "$target" "python3 '$remote_dir/runner_m1.py' '$remote_dir'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-autonomous-m1-build-evidence
          path: |
            NativeHistorical.algo
            BINARY_MANIFEST.json
            CASE.json
            native-work/NATIVE_ADAPTER_MANIFEST.json
            native-work/NATIVE_ADAPTER.diff
            native-work/native/compile.log
          retention-days: 14
