name: Core Satellite Portfolio V33

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_core_satellite_portfolio_v33.py"
      - "src/fx_scanner/research_core_satellite_portfolio_v33_runtime.py"
      - "tests/test_research_core_satellite_portfolio_v33.py"
      - ".github/workflows/research-core-satellite-portfolio-v33.yml"

permissions:
  contents: read

jobs:
  era:
    strategy:
      fail-fast: false
      matrix:
        era: ["2012_2018","2019_2024","2025_2026"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      V33_ERA: ${{ matrix.era }}
      V33_EVIDENCE_OUTPUT: artifacts/core-satellite-portfolio-v33-${{ matrix.era }}.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_core_satellite_portfolio_v33.py
      - name: Run core plus satellite portfolio
        run: python -m fx_scanner.research_core_satellite_portfolio_v33_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-satellite-portfolio-v33-${{ matrix.era }}
          path: artifacts/core-satellite-portfolio-v33-${{ matrix.era }}.json
          if-no-files-found: error
          retention-days: 30
