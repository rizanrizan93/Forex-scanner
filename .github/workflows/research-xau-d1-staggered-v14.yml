name: Research XAU D1 Staggered V14

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/xau_d1_staggered_v14.py"
      - "research/five_core_tournament_v1.py"
      - "tests/test_research_xau_d1_staggered_v14.py"
      - ".github/workflows/research-xau-d1-staggered-v14.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-d1-staggered-v14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xau-d1-staggered-v14:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1 pytest==9.0.2
      - name: Unit tests
        run: pytest -q tests/test_research_xau_d1_staggered_v14.py
      - name: Run preregistered staggered D1 research
        run: python research/xau_d1_staggered_v14.py
      - name: Verify artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_output_xau_d1_staggered_v14/xau_d1_staggered_v14.json")
          d=json.loads(p.read_text())
          assert d["contract"]=="XAU_D1_STAGGERED_V14"
          assert d["execution_influence"] is False
          assert d["split_contract"]["oos_used_for_selection"] is False
          assert d["history"]["h1_rows"] >= 70000
          assert len(d["variants"]) == 16
          print("V14_SELECTED", d["selected_variant"])
          print("V14_PROMOTION_ELIGIBLE", d["promotion_eligible"])
          if d["locked_oos"]:
              print("V14_OOS", json.dumps(d["locked_oos"], sort_keys=True))
          for row in d["variants"]:
              print("V14_VARIANT", row["variant_id"],
                    "dev_stress", row["dev_stress"],
                    "val_stress", row["validation_stress"],
                    "passed", row["development_passed"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xau-d1-staggered-v14
          path: research_output_xau_d1_staggered_v14/
          if-no-files-found: error
          retention-days: 30
