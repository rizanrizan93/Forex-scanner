name: research-stage4-session

on:
  push:
    branches:
      - research/strategy-regime-100-20260911
    paths:
      - scripts/research_stage4_session_oos.py
      - .github/workflows/research-stage4-session.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run frozen OOS session validation
        run: python scripts/research_stage4_session_oos.py --output out/stage4_session
      - name: Print report
        if: always()
        run: |
          if [ -f out/stage4_session/report.md ]; then cat out/stage4_session/report.md; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-session-results
          path: out/stage4_session/
          if-no-files-found: warn
          retention-days: 14
