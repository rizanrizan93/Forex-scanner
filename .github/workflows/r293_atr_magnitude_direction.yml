name: R29.3 ATR Magnitude Direction Research (Read Only)
on:
  push:
    branches: ['research/r293-atr-normalized-magnitude-20261123']
    paths:
      - 'scripts/r293_atr_magnitude_direction.py'
      - 'tests/test_r293_atr_magnitude_direction.py'
      - '.github/workflows/r293_atr_magnitude_direction.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r293-magnitude-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r293-atr-normalized-magnitude-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated research dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl pytest==9.0.2
      - name: Validate causal labels, fixed ATR scale and no-order contract
        run: python -m pytest -q tests/test_r29_direction60_walkforward.py tests/test_r292_magnitude_regime_expansion.py tests/test_r293_atr_magnitude_direction.py
      - name: Compile independent regression study
        run: python -m py_compile scripts/r293_atr_magnitude_direction.py

  explore:
    needs: contracts
    name: R29.3 ${{ matrix.tf }} / ${{ matrix.variant }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        tf: ['1h','4h','1D']
        variant: ['precision','coverage']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: 'scripts:src:.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r293-atr-normalized-magnitude-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research libraries
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - name: Fetch fixed original intraday historical source
        if: matrix.tf == '1h' || matrix.tf == '4h'
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Fetch fixed original daily historical source
        if: matrix.tf == '1D'
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Fit and test next-candle ATR-normalized independent BUY SELL regressors
        run: python scripts/r293_atr_magnitude_direction.py --tf "${{ matrix.tf }}" --variant "${{ matrix.variant }}"
      - name: Preserve all annual and aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r293-${{ matrix.variant }}-${{ matrix.tf }}
          path: artifacts/r293-${{ matrix.variant }}-${{ matrix.tf }}.json
          retention-days: 90
          if-no-files-found: warn
