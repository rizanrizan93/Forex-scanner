name: Research Brent Broker Symbol V238C

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/fx_scanner/execution/ctrader_session.py"
      - "src/fx_scanner/execution/ctrader_research.py"
      - "src/fx_scanner/demo_brent_symbol_discovery_v238c.py"
      - "tests/test_demo_brent_symbol_discovery_v238c.py"
      - ".github/workflows/research-brent-broker-symbol-v238c.yml"
  push:
    branches:
      - research/v238c-brent-broker-symbol-discovery
    paths:
      - "src/fx_scanner/execution/ctrader_session.py"
      - "src/fx_scanner/execution/ctrader_research.py"
      - "src/fx_scanner/demo_brent_symbol_discovery_v238c.py"
      - "tests/test_demo_brent_symbol_discovery_v238c.py"
      - ".github/workflows/research-brent-broker-symbol-v238c.yml"

permissions:
  contents: read

concurrency:
  group: research-brent-broker-symbol-v238c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==9.0.2
      - name: Test V238C
        run: pytest -q tests/test_demo_brent_symbol_discovery_v238c.py tests/test_ctrader_gateway_v04.py

  broker-discovery:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BRENT_V238C_OUTPUT: artifacts/brent-broker-symbol-v238c.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Read FP Markets DEMO symbol catalogue
        run: python -m fx_scanner.demo_brent_symbol_discovery_v238c
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: brent-broker-symbol-v238c
          path: artifacts/brent-broker-symbol-v238c.json
          if-no-files-found: error
          retention-days: 30
