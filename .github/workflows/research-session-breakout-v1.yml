name: Research Session Breakout V1

on:
  pull_request:
    paths:
      - "research/asia_london_breakout_v1.py"
      - ".github/workflows/research-session-breakout-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1
      - name: Run preregistered M5 Asia-London benchmark
        run: |
          mkdir -p research_output_session_v1
          python research/asia_london_breakout_v1.py | tee research_output_session_v1/console.txt
      - name: Verify research-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research_output_session_v1/asia_london_breakout_v1.json')
          d = json.loads(p.read_text())
          assert d['contract'] == 'ASIA_LONDON_BREAKOUT_V1'
          assert d['execution_influence'] is False
          assert d['timeframe'] == 'M5'
          assert d['same_bar_policy'] == 'STOP_FIRST'
          assert d['splits']['oos'] == '2025-01-01..2026-08-31'
          assert len(d['coverage']) == 6
          for pair, item in d['coverage'].items():
              assert item['rows'] >= 150000, (pair, item)
              assert item['end'] >= '2026-08-25', (pair, item)
          print('ASIA_LONDON_BREAKOUT_V1 research-only contract: PASS')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: asia-london-breakout-v1-results
          path: research_output_session_v1/
          retention-days: 14
