name: Snowball S8 XAU New Regimes Pilot
on:
  push:
    branches: ['research/bootstrap125-snowball-r2-20261122']
    paths: ['.github/workflows/snowball_s8_structural_pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2014,2024]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 requests==2.32.5
      - name: Safety and causality preflight
        run: python scripts/snowball_s8_structural_xau.py --selftest
      - name: Screen 7776 structurally different XAU policies, four cash tiers
        run: python scripts/snowball_s8_structural_xau.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowball-s8-pilot-${{ matrix.year }}
          path: artifacts/snowball_s8/s8_xau_${{ matrix.year }}.json
          if-no-files-found: warn
          retention-days: 90
