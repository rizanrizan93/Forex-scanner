name: Frozen V1 exact release replay preflight and BTC readiness
on:
  push:
    branches: ['audit/frozen-v1-replay-btc-20261124']
    paths: ['.github/workflows/frozen-v1-replay-btc-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90172c2fba345e4221ca822c8e7d1d760a98c6b1
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify release manifest and historical admission constraints
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('repairs/bootstrap125_v1_20261114')
          m=json.loads((root/'SOURCE_MANIFEST.json').read_text())
          mismatches=[x['path'] for x in m['source_files'] if hashlib.sha256((root/x['path']).read_bytes()).hexdigest()!=x['sha256']]
          print(json.dumps({'algo_sha256':m['algo_sha256'],'source_manifest_mismatches':mismatches,'replay_2019_2026':'NOT_EXECUTED_NEEDS_ISOLATED_POINT_IN_TIME_ADAPTER_AND_MATCHED_DATA','replay_2012_2026':'BLOCKED_EXACT_PRODUCTION_BTC_FEED_STARTS_2019_AND_PINS_SEED_THROUGH_2026','broker_orders':0}))
          assert not mismatches, 'SOURCE_MANIFEST_MISMATCH'
          PY
      - name: Run released functional checks (not historical performance replay)
        if: always()
        run: dotnet run --project repairs/bootstrap125_v1_20261114/tests/BootstrapTests.csproj -c Release
  btc-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read BTC feed continuity and checkpoint without acquiring leases
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf -- "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/hosts"
          ssh-keygen -y -f "$d/key" >/dev/null
          cat > "$d/read.py" <<'PY'
          import json,sqlite3,subprocess,runpy,sys,time
          from pathlib import Path
          from datetime import datetime,timezone
          def iso(t):
           return datetime.fromtimestamp(t,timezone.utc).isoformat() if t is not None else None
          r={"observed_at":iso(time.time()),"read_only":True,"execution_authority":False,"errors":[]}
          try:r["snapshot"]=runpy.run_path("/opt/rizan-bootstrap125-monitor/read_bootstrap125_dashboard.py")["snapshot"]()
          except Exception as e:r["errors"].append("snapshot:"+type(e).__name__)
          root=Path("/var/lib/rizan-bootstrap125-bridge")
          try:
           h=json.loads((root/"health.json").read_text())
           r["bridge_health"]={k:h.get(k) for k in ("observed_utc","btc","connected","macro_snapshot_present","execution_authority")}
          except Exception as e:r["errors"].append("health:"+type(e).__name__)
          try:
           d=sqlite3.connect((root/"btc-m1.sqlite").as_uri()+"?mode=ro",timeout=5);d.execute("PRAGMA query_only=ON")
           n,lo,hi=d.execute("SELECT count(*),min(at),max(at) FROM minutes").fetchone()
           hour=int(time.time())//3600*3600
           r["btc_minutes"]={"rows":n,"first":iso(lo),"last":iso(hi),"required_completed_hour":iso(hour),"expected_last_completed_minute":iso(hour-60),"covers_last_completed_minute":hi is not None and hi>=hour-60}
           rows=d.execute("SELECT at FROM minutes WHERE at>=? AND at<? ORDER BY at",(1792108800,hour)).fetchall()
           r["btc_minutes"]["extension_gap_count"]=sum(1 for i,x in enumerate(rows) if x[0]!=1792108800+i*60)
           r["btc_minutes"]["expected_extension_minutes"]=(hour-1792108800)//60
           r["btc_minutes"]["actual_extension_minutes"]=len(rows)
           d.close()
          except Exception as e:r["errors"].append("btc_db:"+type(e).__name__)
          r["replay_capabilities"]={}
          for tool in ("dotnet","docker"):
           p=subprocess.run(["sh","-c","command -v "+tool],capture_output=True,text=True,timeout=5)
           r["replay_capabilities"][tool]=p.returncode==0
          # Filename inventory only. Never load credentials or trading checkpoints.
          roots=["/opt","/home/Rizanrizan","/var/lib"]
          patterns=["*replay*.csproj","*Replay*.csproj","*MILLION*GROWTH*.zip","*BTC_SEED*.json","*XAUUSD*2012*","*EURUSD*2012*","*BTCUSD*2012*"]
          found=[]
          for base in roots:
           args=["find",base,"-maxdepth","7","-type","f","("]
           for i,p in enumerate(patterns):
            if i:args+=["-o"]
            args+=["-name",p]
           args +=[")","-printf","%p\t%s\n"]
           try:
            p=subprocess.run(args,capture_output=True,text=True,timeout=20)
            found+=p.stdout.splitlines()[:100]
           except subprocess.TimeoutExpired:r["errors"].append("inventory_timeout")
          r["replay_inventory"]=found[:200]
          r["native_instance_feed_accepted"]="UNKNOWN_WITHOUT_CTRADER_JOURNAL"
          r["native_instance_checkpoint_acked"]="UNKNOWN_WITHOUT_CTRADER_JOURNAL"
          print(json.dumps(r,separators=(",",":")))
          
          PY
          ssh -i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 Rizanrizan@202.74.74.172 'sudo -n /usr/bin/python3 -' < "$d/read.py"
