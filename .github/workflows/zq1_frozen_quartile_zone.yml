name: ZQ1 Frozen quartile zone replay
on:
  push:
    branches: ['research/r91-early-warning-m1-20261121']
    paths: ['scripts/zq1_frozen_quartile_zone_replay.py','.github/workflows/zq1_frozen_quartile_zone.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.ref == 'refs/heads/research/r91-early-warning-m1-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tf: [H1,H4,D1,W1]
    env:
      PYTHONPATH: 'frozen-ui/src:src:.'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 272a50cb48278b3bc038d12db1b53d0702e89764
          path: frozen-ui
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - run: python scripts/zq1_frozen_quartile_zone_replay.py --tf ${{ matrix.tf }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zq1-zone-${{ matrix.tf }}
          path: artifacts/zq1-*.json
          if-no-files-found: warn
          retention-days: 90
