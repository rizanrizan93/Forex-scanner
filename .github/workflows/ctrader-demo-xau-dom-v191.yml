name: cTrader Demo XAU DOM V191

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/execution/ctrader_session.py"
      - "src/fx_scanner/execution/ctrader_research.py"
      - "src/fx_scanner/demo_xau_dom_v191.py"
      - "tests/test_demo_xau_dom_v191.py"
      - ".github/workflows/ctrader-demo-xau-dom-v191.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-demo-xau-dom-v191
  cancel-in-progress: false

jobs:
  xau-dom-v191:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      XAU_DOM_V191_SAMPLE_SECONDS: "20"
      XAU_DOM_V191_SAMPLE_INTERVAL_SECONDS: "1"
      XAU_DOM_V191_MAX_LEVELS: "10"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit test V191
        run: pytest -q tests/test_demo_xau_dom_v191.py
      - name: Sample live XAU Level II depth
        run: python -m fx_scanner.demo_xau_dom_v191
