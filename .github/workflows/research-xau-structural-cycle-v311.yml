name: XAU Structural Cycle V311

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_zone_transition_ledger_v310.py"
      - "src/fx_scanner/research_xau_structural_cycle_v311.py"
      - "src/fx_scanner/research_xau_structural_cycle_v311_runtime.py"
      - "tests/test_research_xau_structural_cycle_v311.py"
      - ".github/workflows/research-xau-structural-cycle-v311.yml"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_zone_transition_ledger_v310.py"
      - "src/fx_scanner/research_xau_structural_cycle_v311.py"
      - "src/fx_scanner/research_xau_structural_cycle_v311_runtime.py"
      - ".github/workflows/research-xau-structural-cycle-v311.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-structural-cycle-v311
  cancel-in-progress: true

jobs:
  structural-cycle-v311:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://naxvdtvlfatljzzwhrmo.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      CTRADER_XAU_M15_RESEARCH_HISTORY_BARS: "100000"
      XAU_STRUCTURAL_CYCLE_V311_OUTPUT: artifacts/xau-structural-cycle-v311.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit test V311
        run: pytest -q tests/test_research_xau_structural_cycle_v311.py
      - name: Run 100K-bar structural cycle research
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m fx_scanner.research_xau_structural_cycle_v311_runtime
      - name: Upload V311 evidence
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: xau-structural-cycle-v311
          path: artifacts/xau-structural-cycle-v311.json
          if-no-files-found: error
          retention-days: 30
