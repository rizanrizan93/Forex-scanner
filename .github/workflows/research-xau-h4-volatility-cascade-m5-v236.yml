name: Research XAU H4 Volatility Cascade M5 V236

on:
  workflow_dispatch:
  push:
    branches: [research/v236-h4-volatility-cascade-m5]
    paths:
      - "src/fx_scanner/research_xau_h4_volatility_cascade_m5_v236_year.py"
      - "src/fx_scanner/research_xau_h4_volatility_cascade_m5_v236_aggregate.py"
      - "tests/test_research_xau_h4_volatility_cascade_m5_v236.py"
      - ".github/workflows/research-xau-h4-volatility-cascade-m5-v236.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: research-xau-h4-volatility-cascade-m5-v236-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pytest==9.0.2
      - run: |
          python -m py_compile src/fx_scanner/research_xau_h4_volatility_cascade_m5_v236_year.py
          python -m py_compile src/fx_scanner/research_xau_h4_volatility_cascade_m5_v236_aggregate.py
          pytest -q tests/test_research_xau_h4_volatility_cascade_m5_v236.py

  replay-year:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        year: [2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    env:
      XAU_V193_YEAR: ${{ matrix.year }}
      XAU_V193_PRICE_CSV: /tmp/histdata/xau-v236-${{ matrix.year }}.csv
      XAU_V193_PRICE_PROVENANCE: artifacts/xau-v236-price-provenance-${{ matrix.year }}.json
      XAU_V236_YEAR: ${{ matrix.year }}
      XAU_V236_PRICE_CSV: /tmp/histdata/xau-v236-${{ matrix.year }}.csv
      XAU_V236_OUTPUT: artifacts/xau-h4-volatility-cascade-m5-v236-${{ matrix.year }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - run: python -m fx_scanner.research_xau_histdata_download_v193
      - run: python -m fx_scanner.research_xau_h4_volatility_cascade_m5_v236_year
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v236-year-${{ matrix.year }}
          path: |
            artifacts/xau-h4-volatility-cascade-m5-v236-${{ matrix.year }}.json
            artifacts/xau-v236-price-provenance-${{ matrix.year }}.json
          retention-days: 30

  aggregate:
    needs: replay-year
    if: always() && needs.replay-year.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XAU_V236_DIR: /tmp/v236
      XAU_V236_V230_DIR: /tmp/v230
      XAU_V236_FULL_OUTPUT: artifacts/xau-h4-volatility-cascade-m5-portfolio-v236-full.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: xau-v236-year-*
          path: /tmp/v236
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36230335879
          pattern: xau-v230-year-*
          path: /tmp/v230
          merge-multiple: false
      - run: python -m fx_scanner.research_xau_h4_volatility_cascade_m5_v236_aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: xau-h4-volatility-cascade-m5-portfolio-v236-full
          path: artifacts/xau-h4-volatility-cascade-m5-portfolio-v236-full.json
          retention-days: 30
