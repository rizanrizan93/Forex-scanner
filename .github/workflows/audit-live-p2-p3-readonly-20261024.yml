name: LIVE VPS Status Inspection (read-only, audit branch)
on:
  push:
    branches:
      - audit/live-p2-p3-readonly-20261024
    paths:
      - .github/workflows/audit-live-p2-p3-readonly-20261024.yml
      - src/fx_scanner/runtime_telemetry_labels.py
      - tests/test_runtime_telemetry_labels.py
      - streamlit_app.py
      - src/fx_scanner/cbot_manual_dashboard.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify audit-only display logic and dashboard syntax
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p test_runtime_telemetry_labels.py -v
          python -m py_compile streamlit_app.py src/fx_scanner/runtime_telemetry_labels.py src/fx_scanner/cbot_manual_dashboard.py

  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read service state over existing SSH connection, without writes
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${VPS_SSH_KEY}" ] || [ -z "${VPS_KNOWN_HOSTS}" ]; then
            echo "AUDIT_BLOCKED_MISSING_SSH_CREDENTIALS"
            exit 2
          fi
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$d/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$d/hosts"
          ssh -T -i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=20 \
            Rizanrizan@202.74.74.172 'bash -s' <<'REMOTE_READ_ONLY'
          set -euo pipefail
          echo "AUDIT_REMOTE_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for unit in rizan-cbot-bridge.service rizan-btc7d130.service; do
            echo "AUDIT_UNIT=$unit"
            for field in LoadState ActiveState SubState Result ExecMainPID NRestarts ActiveEnterTimestamp; do
              value="$(systemctl show "$unit" -p "$field" --value --no-pager 2>/dev/null || true)"
              printf '%s=%s\n' "$field" "$value"
            done
          done
          echo "AUDIT_READ_ONLY_DONE=1"
          REMOTE_READ_ONLY
