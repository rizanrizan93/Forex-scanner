name: R30 XAU 2012-2026 Uniform History + Pareto H1 H4 D1 W1 (Read Only)
on:
  push:
    branches: ['research/r30-pareto-direction-2012-2026-20261123']
    paths:
      - 'scripts/r30_hf_uniform_archive.py'
      - 'tests/test_r30_hf_uniform_archive.py'
      - '.github/workflows/r30_uniform_full_2012_2026.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: r30-xau-full-2012-2026-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r30-pareto-direction-2012-2026-20261123
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 pyarrow requests pytest==9.0.2 openpyxl
      - name: Protect Unix timestamp source, per-year source hash and research-only Pareto
        run: |
          python -m py_compile scripts/r30_hf_uniform_archive.py scripts/r30_pareto_direction_search.py
          python -m pytest -q tests/test_r30_hf_uniform_archive.py tests/test_r30_pareto_direction_search.py

  backfill:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        year: [2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r30-pareto-direction-2012-2026-20261123
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install public-data parsers only, no trading SDK
        run: pip install numpy==2.3.5 pandas==2.2.3 pyarrow
      - name: Download version-pinned verified HTTPS 1-minute XAUUSD parquet
        run: |
          python scripts/r30_hf_uniform_archive.py \
            --year "${{ matrix.year }}" \
            --out artifacts/r30_uniform
      - name: Archive YEAR original hash and H1/H4 UTC candle data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r30-hf-yr-${{ matrix.year }}
          path: |
            artifacts/r30_uniform/r10-1h-${{ matrix.year }}.csv
            artifacts/r30_uniform/r10-4h-${{ matrix.year }}.csv
            artifacts/r30_uniform/r30-hf-provenance-${{ matrix.year }}.json
          retention-days: 90
          if-no-files-found: warn

  analyze:
    needs: backfill
    if: ${{ needs.backfill.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tf: ['1h','4h','1D','1W']
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r30-pareto-direction-2012-2026-20261123
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install quant only, no broker/execution SDK
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 openpyxl requests
      - name: Download all 15 source-year receipts from THIS workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: r30-hf-yr-*
          path: /tmp/r30_uniform
          merge-multiple: true
      - name: Fail closed unless all 15 years share identical provider commit and source SHAs
        run: |
          test "$(find /tmp/r30_uniform -name 'r30-hf-provenance-*.json' | wc -l)" -eq 15
          python - <<'PY'
          import json,glob
          paths=glob.glob("/tmp/r30_uniform/r30-hf-provenance-*.json")
          docs=[json.load(open(p)) for p in paths]
          assert len({d["source_commit"] for d in docs})==1
          assert sorted(d["year"] for d in docs)==list(range(2012,2027))
          assert all(d["execution_authority"] is False for d in docs)
          print("R30_UNIFORM_ORIGINAL_SOURCE_2012_2026_VERIFIED",
                len(docs),"revision",docs[0]["source_commit"])
          PY
      - name: Walk-forward H1 H4 D1 W1 actual 2012-26 uniform source
        run: python scripts/r30_pareto_direction_search.py --tf "${{ matrix.tf }}" --scope uniform
      - name: Save accuracy/coverage/n/expectancy Pareto frontier with immutable source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r30-uniform-pareto-${{ matrix.tf }}-2012-2026
          path: artifacts/r30_pareto/r30-pareto-${{ matrix.tf }}-uniform.json
          retention-days: 90
          if-no-files-found: warn
