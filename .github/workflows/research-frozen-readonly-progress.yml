name: Read-only research hash worker progress
on:
  push:
    branches: [research/tick-archive-2019-2026]
    paths: [.github/workflows/research-frozen-readonly-progress.yml]
permissions:
  contents: read
jobs:
  research_progress:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect isolated research hash progress without reading process arguments
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/hosts"
          chmod 600 "$d/key" "$d/hosts"
          ssh -i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=25 Rizanrizan@202.74.74.172 'python3 -' <<'PY'
          import subprocess,os,json
          from pathlib import Path
          root=Path('/home/Rizanrizan/rizan-ticks')
          ps=subprocess.run(['ps','-eo','pid=,ni=,comm=,etime=,pcpu=,rss='],capture_output=True,text=True,check=True)
          found=[]
          for line in ps.stdout.splitlines():
            p=line.split()
            if len(p)!=6 or p[1]!='15' or p[2]!='python3':continue
            item={'pid':int(p[0]),'elapsed':p[3],'cpu_pct':p[4],'rss_kb':p[5],'archive_handles':[]}
            try:
              for fd in Path('/proc',p[0],'fd').iterdir():
                try:
                  target=os.readlink(fd)
                  if target.startswith(str(root)+'/') and target.endswith('.parquet'):
                    pos=Path('/proc',p[0],'fdinfo',fd.name).read_text().splitlines()[0]
                    item['archive_handles'].append({'file':str(Path(target).relative_to(root)),'position':pos,'bytes':Path(target).stat().st_size})
                except (OSError,PermissionError):pass
            except OSError:pass
            found.append(item)
          print(json.dumps({'research_nice15_workers':found,'tick_parquet_files':sum(1 for s in ['XAUUSD','EURUSD'] for f in (root/s).glob('*/*.parquet'))},indent=2))
          PY
