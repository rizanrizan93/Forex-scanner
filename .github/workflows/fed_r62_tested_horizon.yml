name: XAU R6.2 — Fed D1 vs Yield DXY D5 Audited Horizon (No Orders)
on:
  pull_request:
    paths:
      - 'src/fx_scanner/fed_r61_operational_macro_direction.py'
      - 'src/fx_scanner/fed_r62_tested_horizon_policy.py'
      - 'src/fx_scanner/fed_r6_manual_entry_dashboard.py'
      - 'tests/test_fed_r61_operational_macro_direction.py'
      - 'tests/test_fed_r62_tested_horizon_policy.py'
      - '.github/workflows/fed_r62_tested_horizon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  horizon_ablation_integrity_and_direction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile new and affected modules
        run: |
          python -m py_compile src/fx_scanner/fed_r62_tested_horizon_policy.py src/fx_scanner/fed_r61_operational_macro_direction.py src/fx_scanner/fed_r6_manual_entry_dashboard.py
      - name: Verify exact historical counts, directional symmetry, stale DXY and no D5 hold extension
        run: |
          python -m pytest -q tests/test_fed_r62_tested_horizon_policy.py tests/test_fed_r61_operational_macro_direction.py tests/test_fed_r6_manual_entry_areas.py
