name: R31 High Coverage Precision Replay Contract Tests
on:
  push:
    branches: [research/r31-high-frequency-zone-precision-20261123]
    paths:
      - '.github/workflows/r31_high_coverage_smoke.yml'
      - 'scripts/research_r31_high_coverage_precision.py'
      - 'scripts/research_r31_high_coverage_aggregate.py'
      - 'tests/test_r31_high_coverage_precision.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-precision-contract:
    name: Causal, no fake holdout, no live promotion
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src:.:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install only pinned test dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - name: Static compile all R31 code
        run: python -m py_compile scripts/research_r31_high_coverage_precision.py scripts/research_r31_high_coverage_aggregate.py
      - name: Causality, stop-first and synthetic research unit tests
        run: python -m pytest -q tests/test_r31_high_coverage_precision.py
