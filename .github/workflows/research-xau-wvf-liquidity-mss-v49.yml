name: XAU WVF Liquidity MSS V49

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_wvf_liquidity_mss_v49.py"
      - "src/fx_scanner/research_xau_wvf_liquidity_mss_v49_runtime.py"
      - "tests/test_research_xau_wvf_liquidity_mss_v49.py"
      - ".github/workflows/research-xau-wvf-liquidity-mss-v49.yml"

permissions:
  contents: read

jobs:
  era:
    strategy:
      fail-fast: false
      matrix:
        era: ["2012_2018", "2019_2024", "2025_2026YTD"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      V49_ERA: ${{ matrix.era }}
      V49_EVIDENCE_OUTPUT: artifacts/xau-wvf-liquidity-mss-v49-${{ matrix.era }}.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_wvf_liquidity_mss_v49.py
      - name: Run VIX-Fix liquidity MSS era study
        run: python -m fx_scanner.research_xau_wvf_liquidity_mss_v49_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-wvf-liquidity-mss-v49-${{ matrix.era }}
          path: artifacts/xau-wvf-liquidity-mss-v49-${{ matrix.era }}.json
          if-no-files-found: error
          retention-days: 30
