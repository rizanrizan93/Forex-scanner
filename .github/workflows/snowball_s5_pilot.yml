name: Snowball S5 EUR 3456 Models Pilot 2019 2024
on:
  push:
    branches: ['research/bootstrap125-snowball-r2-20261122']
    paths:
      - '.github/workflows/snowball_s5_pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2019,2024]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned causal replay deps
        run: pip install numpy==2.3.5 pandas==2.2.3 requests==2.32.5
      - name: Validate 3456 model grid and source logic
        run: python scripts/snowball_s5_fxcm_grid.py --selftest
      - name: Screen 3456 bid-ask EURUSD models on public FXCM M1 (NOT Frozen V1 replay)
        run: python scripts/snowball_s5_fxcm_grid.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowball-s5-pilot-${{ matrix.year }}
          path: artifacts/snowball_s5/s5_eurusd_${{ matrix.year }}.json
          if-no-files-found: warn
          retention-days: 90
