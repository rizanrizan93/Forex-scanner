name: R8 Dollar Index As-Of Research
on:
  pull_request:
    paths:
      - 'scripts/research_r8_dollaridx_asof_audit.py'
      - 'tests/test_research_r8_dollaridx_asof_audit.py'
      - 'scripts/research_r8c_r6_dollaridx_ablation.py'
      - 'tests/test_research_r8c_r6_dollaridx_ablation.py'
      - '.github/workflows/research_r8_dollaridx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r8_integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 pytest==9.0.2
      - run: python -m py_compile scripts/research_r8_dollaridx_asof_audit.py scripts/research_r8c_r6_dollaridx_ablation.py
      - run: python -m pytest -q tests/test_research_r8_dollaridx_asof_audit.py tests/test_research_r8c_r6_dollaridx_ablation.py
