name: R8.3 M1 event first-touch net 10 USD in 60 minutes
on:
  push:
    branches: ['research/r83-m1-first-touch-20261121']
    paths:
      - 'scripts/r83_m1_first_touch.py'
      - '.github/workflows/r83_m1_first_touch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  year:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2016,2017,2018,2019,2020,2021,2022,2023,2024]
    env:
      PYTHONPATH: 'src:.'
      XAU_V193_YEAR: ${{ matrix.year }}
      XAU_V193_PRICE_CSV: /tmp/r83-price.csv
      XAU_V193_PRICE_PROVENANCE: /tmp/r83-price-source.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install numpy==2.3.5 pandas==2.2.3
          python -m pip install 'git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8'
      - name: Acquire historical minute bars
        run: python -m fx_scanner.research_xau_histdata_download_v193
      - name: Evaluate causal M5 events with M1 first-touch outcomes
        run: python scripts/r83_m1_first_touch.py
      - uses: actions/upload-artifact@v4
        with:
          name: r83-year-${{ matrix.year }}
          path: artifacts/r83-year-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 60
  aggregate:
    needs: year
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      R83_ROOT: /tmp/r83-years
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          pattern: r83-year-*
          path: /tmp/r83-years
          merge-multiple: true
      - name: Three prior years selection; evaluate subsequent calendar year
        run: python scripts/r83_m1_first_touch.py aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: r83-2016-24-first-touch-results
          path: artifacts/r83-results.json
          if-no-files-found: error
          retention-days: 60
