name: Research GBPAUD Component Crossfeed V5

on:
  workflow_dispatch:
  push:
    branches:
      - research/gbpaud-component-crossfeed-v5
    paths:
      - research/ctrader_gbpaud_component_crossfeed_v5.py
      - .github/workflows/research-gbpaud-component-crossfeed-v5.yml

permissions:
  contents: read

concurrency:
  group: research-gbpaud-component-crossfeed-v5
  cancel-in-progress: true

jobs:
  crossfeed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PYTHONPATH: research

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install -e .
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Run broker-native component replay
        run: |
          set -o pipefail
          rm -rf research_output_gbpaud_component_crossfeed_v5
          python research/ctrader_gbpaud_component_crossfeed_v5.py | tee research_output_gbpaud_component_crossfeed_v5-console.txt
      - name: Validate research-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research_output_gbpaud_component_crossfeed_v5/ctrader_gbpaud_component_crossfeed_v5.json')
          d = json.loads(p.read_text())
          assert d['contract'] == 'CTRADER_GBPAUD_COMPONENT_CROSSFEED_V5'
          assert d['environment'] == 'DEMO'
          assert d['execution_influence'] is False
          assert d['promotion_authority'] is False
          assert d['strategy_id'] == 'D1_COMPONENT_RET63_OPPOSITE_CHANDELIER3'
          assert d['aligned_bars'] > 0
          assert d['decision'] in {
              'BROKER_FEED_SUPPORT',
              'BROKER_FEED_CONTRADICTS',
              'INSUFFICIENT_BROKER_HISTORY',
              'INSUFFICIENT_BROKER_TRADES',
          }
          print('GBPAUD component V5 cTrader cross-feed contract: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gbpaud-component-crossfeed-v5
          path: |
            research_output_gbpaud_component_crossfeed_v5/
            research_output_gbpaud_component_crossfeed_v5-console.txt
          retention-days: 30
