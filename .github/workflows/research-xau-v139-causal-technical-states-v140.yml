name: XAU V139 Causal Technical States V140

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v139_causal_technical_states_v140.py"
      - "src/fx_scanner/research_xau_v139_causal_technical_states_v140_runtime.py"
      - "tests/test_research_xau_v139_causal_technical_states_v140.py"
      - ".github/workflows/research-xau-v139-causal-technical-states-v140.yml"

permissions:
  contents: read

jobs:
  causal-states:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V140_EVIDENCE_OUTPUT: artifacts/xau-v139-causal-technical-states-v140.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v139_causal_technical_states_v140.py
      - name: Run V140
        run: python -m fx_scanner.research_xau_v139_causal_technical_states_v140_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v139-causal-technical-states-v140
          path: artifacts/xau-v139-causal-technical-states-v140.json
          if-no-files-found: error
          retention-days: 30
