name: Forex Official Macro Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * 1-5"
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  group: forex-official-macro-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Refresh official macro evidence
        run: python -m fx_scanner.cli macro-refresh

  dispatch-demo:
    if: github.event_name == 'schedule' && github.event.schedule == '4,9,14,19,24,29,34,39,44,49,54,59 * * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch existing DEMO pipeline
        run: gh workflow run ctrader-demo-auto-pipeline.yml --ref main
