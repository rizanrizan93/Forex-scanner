name: XAU V126 Gated V24 M15 V130

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v126_gated_v24_m15_v130.py"
      - "src/fx_scanner/research_xau_v126_gated_v24_m15_v130_runtime.py"
      - "tests/test_research_xau_v126_gated_v24_m15_v130.py"
      - ".github/workflows/research-xau-v126-gated-v24-m15-v130.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V130_EVIDENCE_OUTPUT: artifacts/xau-v126-gated-v24-m15-v130.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v126_gated_v24_m15_v130.py
      - name: Run V130
        run: python -m fx_scanner.research_xau_v126_gated_v24_m15_v130_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v126-gated-v24-m15-v130
          path: artifacts/xau-v126-gated-v24-m15-v130.json
          if-no-files-found: error
          retention-days: 30
