name: XAU AFIC PlanB Remap V159 Recent
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_planb_remap_v159.py"
      - "src/fx_scanner/research_xau_afic_planb_remap_v159_recent_runtime.py"
      - "tests/test_research_xau_afic_planb_remap_v159.py"
      - ".github/workflows/research-xau-afic-planb-remap-v159-recent.yml"
permissions:
  contents: read
jobs:
  afic-v159-recent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      V159_RECENT_OUTPUT: artifacts/xau-afic-planb-remap-v159-recent.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit test
        run: pytest -q tests/test_research_xau_afic_planb_remap_v159.py
      - name: Run V159 recent
        run: python -m fx_scanner.research_xau_afic_planb_remap_v159_recent_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-planb-remap-v159-recent
          path: artifacts/xau-afic-planb-remap-v159-recent.json
          if-no-files-found: error
          retention-days: 30
