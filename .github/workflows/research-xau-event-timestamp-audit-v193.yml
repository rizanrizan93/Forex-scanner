name: Research XAU Event Timestamp Audit V193

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_event_supplement_v193.py"
      - "src/fx_scanner/research_xau_event_timestamp_audit_v193.py"
      - "tests/test_research_xau_event_timestamp_audit_v193.py"
      - ".github/workflows/research-xau-event-timestamp-audit-v193.yml"
  schedule:
    - cron: "17 2 * * 1-5"

permissions:
  contents: read

concurrency:
  group: research-xau-event-timestamp-audit-v193
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install audit runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install beautifulsoup4==4.13.4 pytest==9.0.2
      - name: Unit test timestamp audit
        run: pytest -q tests/test_research_xau_event_timestamp_audit_v193.py tests/test_research_xau_event_full_v193.py
      - name: Audit archive and supplement timestamps
        run: python -m fx_scanner.research_xau_event_timestamp_audit_v193
