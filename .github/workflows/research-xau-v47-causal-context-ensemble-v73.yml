name: XAU V47 Causal Context Ensemble V73

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v47_causal_context_ensemble_v73.py"
      - "src/fx_scanner/research_xau_v47_causal_context_ensemble_v73_runtime.py"
      - "tests/test_research_xau_v47_causal_context_ensemble_v73.py"
      - ".github/workflows/research-xau-v47-causal-context-ensemble-v73.yml"

permissions:
  contents: read

jobs:
  ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V73_EVIDENCE_OUTPUT: artifacts/xau-v47-causal-context-ensemble-v73.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v47_causal_context_ensemble_v73.py
      - name: Run causal context ensemble
        run: python -m fx_scanner.research_xau_v47_causal_context_ensemble_v73_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-v47-causal-context-ensemble-v73
          path: artifacts/xau-v47-causal-context-ensemble-v73.json
          if-no-files-found: error
          retention-days: 30
