name: Research Brent V229 Historical V239

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/fx_scanner/research_brent_v229_historical_v239.py"
      - "src/fx_scanner/research_brent_v229_historical_v239_year_runtime.py"
      - "src/fx_scanner/research_brent_v229_historical_v239_aggregate.py"
      - "tests/test_research_brent_v229_historical_v239.py"
      - ".github/workflows/research-brent-v229-historical-v239.yml"
  push:
    branches:
      - research/v239-brent-v229-historical
    paths:
      - "src/fx_scanner/research_brent_v229_historical_v239.py"
      - "src/fx_scanner/research_brent_v229_historical_v239_year_runtime.py"
      - "src/fx_scanner/research_brent_v229_historical_v239_aggregate.py"
      - "tests/test_research_brent_v229_historical_v239.py"
      - ".github/workflows/research-brent-v229-historical-v239.yml"

permissions:
  contents: read

concurrency:
  group: research-brent-v229-historical-v239-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==9.0.2
      - name: Test V239
        run: |
          pytest -q             tests/test_research_brent_v229_historical_v239.py             tests/test_demo_xau_structural_targets_v229.py             tests/test_research_xau_zone_reversal_depth_v225.py

  backfill-year:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      BRENT_V239_YEAR: ${{ matrix.year }}
      BRENT_V239_PRICE_CSV: /tmp/histdata/brent-v239-${{ matrix.year }}.csv
      BRENT_V239_PROVENANCE: artifacts/brent-v239-provenance-${{ matrix.year }}.json
      BRENT_V239_OUTPUT: artifacts/brent-v229-historical-v239-${{ matrix.year }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install historical runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Run Brent V229-style historical year
        run: python -m fx_scanner.research_brent_v229_historical_v239_year_runtime
      - name: Upload yearly shard
        uses: actions/upload-artifact@v4
        with:
          name: brent-v239-year-${{ matrix.year }}
          path: |
            artifacts/brent-v229-historical-v239-${{ matrix.year }}.json
            artifacts/brent-v239-provenance-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: backfill-year
    if: always() && needs.backfill-year.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRENT_V239_SHARD_DIR: /tmp/brent-v239-shards
      BRENT_V239_FULL_OUTPUT: artifacts/brent-v229-historical-v239-full.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install aggregator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download all yearly shards
        uses: actions/download-artifact@v4
        with:
          pattern: brent-v239-year-*
          path: /tmp/brent-v239-shards
          merge-multiple: false
      - name: Aggregate 2012-2026 and simulate $100 at 1:100
        run: python -m fx_scanner.research_brent_v229_historical_v239_aggregate
      - name: Upload full V239 result
        uses: actions/upload-artifact@v4
        with:
          name: brent-v229-historical-v239-full
          path: artifacts/brent-v229-historical-v239-full.json
          if-no-files-found: error
          retention-days: 30
