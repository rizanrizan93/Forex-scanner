name: cTrader Demo XAU M15 Reversal Forward Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/demo_xau_m15_ema_reversal_forward_evidence.py"
      - "src/fx_scanner/demo_xau_m15_ema_reversal_recovery.py"
      - ".github/workflows/ctrader-demo-xau-m15-reversal-forward-evidence.yml"
  schedule:
    - cron: "*/5 * * * 1-5"

permissions:
  contents: read

concurrency:
  group: ctrader-demo-xau-m15-reversal-forward-evidence
  cancel-in-progress: true

jobs:
  observe-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Record XAU M15 forward evidence with zero extra broker authority
        run: python -m fx_scanner.demo_xau_m15_ema_reversal_forward_evidence
