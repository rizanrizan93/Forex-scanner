name: XAU Decision Closed Candles Readonly Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_xau_decision_readonly.py'
      - 'scripts/publish_xau_decision_readonly.py'
      - 'src/fx_scanner/xau_decision_checklist_v1.py'
      - 'src/fx_scanner/xau_decision_candle_feed_v1.py'
      - 'src/fx_scanner/xau_technical_engine_v1.py'
      - 'pages/6_XAU_Technical_Engine.py'
      - '.github/workflows/xau-decision-readonly-publisher.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: xau-decision-candle-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rizanrizan93/Forex-scanner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 59
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      XAU_DECISION_LOOP_SECONDS: '3300'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing read-only cTrader transport
        run: python -m pip install -e '.[ctrader]' pytest==9.0.2
      - name: Verify authorization guard and closed candle contracts
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_xau_decision_checklist_v1.py tests/test_xau_decision_readonly_feed_v1.py
      - name: Continuously collect and publish fresh CLOSED H1 M15 M5 (read only)
        env:
          PYTHONPATH: "src:."
        run: python -u scripts/publish_xau_decision_readonly.py
      - name: Queue replacement publisher without depending on cron delivery
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run xau-decision-readonly-publisher.yml --ref main
