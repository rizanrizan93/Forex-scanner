name: Research Adaptive XAU cTrader Crossfeed V1

on:
  push:
    branches:
      - research/market-adaptive-router-v2-b
    paths:
      - "research/adaptive_xau_ctrader_crossfeed_v1.py"
      - "research/adaptive_router_market_core_v2.py"
      - ".github/workflows/research-adaptive-xau-ctrader-crossfeed-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-adaptive-xau-ctrader-crossfeed-v1
  cancel-in-progress: true

jobs:
  crossfeed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate demo-only config
        run: python -m fx_scanner.cli validate-config
      - name: Run broker-native crossfeed
        shell: bash
        env:
          PYTHONPATH: src:research
        run: |
          set -euo pipefail
          python research/adaptive_xau_ctrader_crossfeed_v1.py | tee adaptive_xau_ctrader_crossfeed_v1.json
      - name: Print evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('adaptive_xau_ctrader_crossfeed_v1.json').read_text())
          print('CROSSFEED_PASS', d['crossfeed_pass'])
          print('H1_ROWS', d['h1_coverage']['rows'])
          for x in d['boundaries']:
              m=x['confirm_2024_2026_stress']
              print('BOUNDARY',x['boundary_hour_utc'],'n=',m.get('trades'),'exp=',m.get('expectancy_r'),'pf=',m.get('profit_factor'),'net_r=',m.get('net_r'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-xau-ctrader-crossfeed-v1
          path: adaptive_xau_ctrader_crossfeed_v1.json
          if-no-files-found: error
