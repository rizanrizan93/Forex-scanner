name: ForexRizan Dashboard Bridge V254

on:
  workflow_dispatch:
  schedule:
    - cron: "3,33 * * * 0-5"
  push:
    branches:
      - main
    paths:
      - "src/fx_scanner/dashboard.py"
      - "src/fx_scanner/xau_dashboard_bridge_v254.py"
      - "src/fx_scanner/xau_canonical_decision_v240.py"
      - "streamlit_app.py"
      - ".github/workflows/forexrizan-dashboard-bridge-v254.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: forexrizan-dashboard-bridge-v254
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_URL: https://naxvdtvlfatljzzwhrmo.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dashboard bridge runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt

      - name: Configure snapshot publisher
        run: |
          git config user.name "RIZAN Dashboard Runtime"
          git config user.email "actions@users.noreply.github.com"

      - name: Hydrate previous dashboard snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          git fetch origin dashboard-snapshots --depth=1 || true
          git show FETCH_HEAD:runtime/xau_dashboard_snapshot.json             > runtime/xau_dashboard_snapshot.json 2>/dev/null || true

      - name: Publish continuous one-minute dashboard snapshots
        shell: bash
        run: |
          set -uo pipefail
          for i in $(seq 1 64); do
            started="$(date +%s)"
            snapshot_ok=0
            for attempt in 1 2 3; do
              if python -m fx_scanner.xau_dashboard_bridge_v254 --output runtime/xau_dashboard_snapshot.json; then
                snapshot_ok=1
                break
              fi
              echo "::warning::Dashboard snapshot attempt ${attempt}/3 failed; retrying"
              sleep "$(( attempt * 5 ))"
            done

            if [ "$snapshot_ok" -eq 1 ]; then
              git add -f runtime/xau_dashboard_snapshot.json
              if git diff --cached --quiet; then
                :
              elif [ "$i" -eq 1 ]; then
                git commit -m "runtime: refresh ForexRizan dashboard snapshot"
              else
                git commit --amend --no-edit
              fi

              if git rev-parse --verify HEAD >/dev/null 2>&1; then
                push_ok=0
                for push_attempt in 1 2 3; do
                  if git push --force origin HEAD:dashboard-snapshots; then
                    push_ok=1
                    break
                  fi
                  echo "::warning::Dashboard snapshot push ${push_attempt}/3 failed; retrying"
                  sleep "$(( push_attempt * 5 ))"
                done
                if [ "$push_ok" -ne 1 ]; then
                  echo "::warning::Dashboard snapshot publish skipped this cycle; worker will continue"
                fi
              fi
            else
              echo "::warning::Dashboard snapshot generation failed this cycle; worker will continue"
            fi

            if [ "$i" -lt 64 ]; then
              elapsed="$(( $(date +%s) - started ))"
              sleep_for="$(( 60 - elapsed ))"
              if [ "$sleep_for" -gt 0 ]; then
                sleep "$sleep_for"
              fi
            fi
          done

      - name: Self-handoff publisher if scheduler misses the next window
        if: ${{ success() && !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          market_open_utc() {
            weekday="$(date -u +%u)"
            hour="$(date -u +%H)"
            if [ "${weekday}" -eq 7 ]; then
              [ "${hour}" -ge 21 ]
            elif [ "${weekday}" -ge 1 ] && [ "${weekday}" -le 4 ]; then
              return 0
            elif [ "${weekday}" -eq 5 ]; then
              [ "${hour}" -lt 22 ]
            else
              return 1
            fi
          }
          if market_open_utc; then
            gh workflow run forexrizan-dashboard-bridge-v254.yml --ref main
            echo "FOREXRIZAN_DASHBOARD_PUBLISHER_SELF_HANDOFF_DISPATCHED"
          else
            echo "FOREXRIZAN_DASHBOARD_PUBLISHER_SELF_HANDOFF_SKIPPED market=closed"
          fi
