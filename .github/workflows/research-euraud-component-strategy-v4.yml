name: Research EURAUD Component Strategy V4

on:
  workflow_dispatch:
  push:
    branches:
      - research/euraud-component-strategy-v4
    paths:
      - research/euraud_component_strategy_v4.py
      - .github/workflows/research-euraud-component-strategy-v4.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1
      - name: Run frozen EURAUD component V4 tournament
        run: |
          set -o pipefail
          rm -rf research_output_euraud_component_v4
          mkdir -p research_output_euraud_component_v4
          python research/euraud_component_strategy_v4.py | tee research_output_euraud_component_v4/console.txt
      - name: Verify research-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research_output_euraud_component_v4/euraud_component_strategy_v4.json')
          d = json.loads(p.read_text())
          assert d['contract'] == 'EURAUD_COMPONENT_STRATEGY_SEARCH_V4'
          assert d['execution_influence'] is False
          assert d['promotion_authority'] is False
          assert d['symbol'] == 'EURAUD'
          assert min(d['coverage']['euraud_h1_rows'], d['coverage']['eurusd_h1_rows'], d['coverage']['audusd_h1_rows']) >= 70000
          assert len(d['candidate_set']) == 6
          print('EURAUD component V4 research contract: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: euraud-component-strategy-v4
          path: research_output_euraud_component_v4/
          retention-days: 30
