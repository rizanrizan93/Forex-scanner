name: XAU V1 Historical Native Tick Pilot Read Only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/research_v10/xau_native_tick_pilot.py
      - .github/workflows/xau-native-tick-pilot-readonly.yml
permissions:
  contents: read
jobs:
  historical-quotes:
    if: github.repository == 'rizanrizan93/Forex-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ctrader-open-api==0.9.2 service-identity==24.2.0
      - name: Read one historical bid/ask tick window only
        run: python -u scripts/research_v10/xau_native_tick_pilot.py artifacts/xau_native_tick_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xau-native-tick-pilot-no-orders
          path: artifacts/xau_native_tick_pilot/
          if-no-files-found: warn
          retention-days: 7
