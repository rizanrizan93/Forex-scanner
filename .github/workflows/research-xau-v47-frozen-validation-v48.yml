name: XAU V47 Frozen Validation V48

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v47_frozen_validation_v48.py"
      - "src/fx_scanner/research_xau_v47_frozen_validation_v48_runtime.py"
      - "tests/test_research_xau_v47_frozen_validation_v48.py"
      - ".github/workflows/research-xau-v47-frozen-validation-v48.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V48_EVIDENCE_OUTPUT: artifacts/xau-v47-frozen-validation-v48.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v47_frozen_validation_v48.py
      - name: Run continuous frozen validation
        run: python -m fx_scanner.research_xau_v47_frozen_validation_v48_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-v47-frozen-validation-v48
          path: artifacts/xau-v47-frozen-validation-v48.json
          if-no-files-found: error
          retention-days: 30
