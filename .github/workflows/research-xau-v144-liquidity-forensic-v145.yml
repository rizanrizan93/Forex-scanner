name: XAU Liquidity Forensic V145
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v144_liquidity_forensic_v145.py"
      - "src/fx_scanner/research_xau_v144_liquidity_forensic_v145_runtime.py"
      - "tests/test_research_xau_v144_liquidity_forensic_v145.py"
      - ".github/workflows/research-xau-v144-liquidity-forensic-v145.yml"
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V145_EVIDENCE_OUTPUT: artifacts/xau-liquidity-forensic-v145.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v144_liquidity_forensic_v145.py
      - name: Run V145
        run: python -m fx_scanner.research_xau_v144_liquidity_forensic_v145_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-liquidity-forensic-v145
          path: artifacts/xau-liquidity-forensic-v145.json
          if-no-files-found: error
          retention-days: 30
