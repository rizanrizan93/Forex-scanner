name: R30 XAU Independent TF Zone Direction Mega Replay 2012-2026 SESSION FILTERED

on:
  push:
    branches: [research/independent-tf-zone-replay-2012-2026]
    paths:
      - '.github/workflows/r30_independent_tf_zones_mega_2012_2026.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r30-independent-tf-zone-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-synthetic-contract:
    name: Causal no-orders contract (no synthetic market claims)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - run: PYTHONPATH=src:. python -m pytest -q tests/test_r30_tf_zone_replay.py tests/test_r30_duka_shards.py
      - run: python -m py_compile scripts/research_tf_zone_direction_mega.py scripts/research_tf_zone_mega_aggregate.py

  dukascopy-h1-h4-2012-2026:
    name: Dukascopy verified XAU H1 and derived H4 year ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned market data tooling (TLS validation enabled)
        run: |
          npm install --global dukascopy-node@1.51.1
          pip install numpy==2.3.5 pandas==2.2.3
      - name: Download public XAU H1 BID from Dukascopy
        run: |
          NEXT=$(( ${{ matrix.year }} + 1 ))
          mkdir -p /tmp/r30-duka
          dukascopy-node -i xauusd \
            -from "${{ matrix.year }}-01-01" -to "${NEXT}-01-01" \
            -t h1 -p bid -f csv \
            -dir /tmp/r30-duka -fn "xauusd-h1-${{ matrix.year }}" \
            -bs 3 -bp 1200 -r 3 --cache
          test -s "/tmp/r30-duka/xauusd-h1-${{ matrix.year }}.csv"
      - name: Validate source OHLC, UTC, months and H4 closed-candle derivation
        run: |
          python scripts/r30_duka_h1_h4_shard.py \
            --year ${{ matrix.year }} \
            --csv "/tmp/r30-duka/xauusd-h1-${{ matrix.year }}.csv"
      - name: Require tradable Monday-Friday bars and weekend quarantine receipt
        run: |
          python - <<'PY'
          import glob,json
          paths=glob.glob("artifacts/r30/r30-dukascopy-provenance-*.json")
          assert len(paths)==1,paths
          doc=json.load(open(paths[0]))
          counts=doc["session_filter"]
          assert counts["raw_h1"]>counts["tradable_h1"]>1200,counts
          assert counts["weekend_filtered"]>0,counts
          assert doc["validation"]=="UTC_H1_CLOSED_MON_FRI_NO_FLATS_FOUR_CONTIGUOUS_H1_TO_H4"
          print("R30_TRADABLE_SESSION_AUDIT_PASS",counts)
          PY
      - name: Upload provenance SHA + price bars, never orders
        uses: actions/upload-artifact@v4
        with:
          name: r30-duka-year-${{ matrix.year }}
          path: artifacts/r30/
          if-no-files-found: error
          retention-days: 45

  replay:
    name: ${{ matrix.tf }} direction-model-block-start-${{ matrix.model_start }}
    needs: [audit-synthetic-contract,dukascopy-h1-h4-2012-2026]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tf: [H1,H4,D1,W1]
        model_start: [0,16,32,48,64,80,96,112]
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3
      - name: Download uniform Dukascopy H1/H4 2012-2026
        if: ${{ matrix.tf == 'H1' || matrix.tf == 'H4' }}
        uses: actions/download-artifact@v4
        with:
          pattern: r30-duka-year-*
          path: /tmp/r30
          merge-multiple: true
      - name: Download immutable 2012-2026 D1 daily shards from R98
        if: ${{ matrix.tf == 'D1' || matrix.tf == 'W1' }}
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r30
          merge-multiple: true
      - name: Screen 262144 parameter combinations for this model block
        run: |
          python scripts/research_tf_zone_direction_mega.py \
            --tf ${{ matrix.tf }} \
            --direction-models 16 \
            --model-start ${{ matrix.model_start }} \
            --zone-configs 16384
      - name: Persist audited model-shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r30-result-${{ matrix.tf }}-${{ matrix.model_start }}
          path: artifacts/r30/r30-*.json
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Strict completeness gate, 8.39 million combos, no auto-promotion
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download all 32 result shards
        uses: actions/download-artifact@v4
        with:
          pattern: r30-result-*
          path: /tmp/r30-results
          merge-multiple: true
      - name: Fail closed if not 8,388,608 actual evaluations with 2012-2026 sources
        run: python scripts/research_tf_zone_mega_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r30-verified-combined-zone-direction-2012-2026
          path: artifacts/r30/r30-combined-2012-2026.json
          if-no-files-found: warn
          retention-days: 90
