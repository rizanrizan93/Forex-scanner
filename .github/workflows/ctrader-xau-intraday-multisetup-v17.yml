name: cTrader XAU Intraday MultiSetup V17

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_intraday_multisetup_v17.py"
      - "src/fx_scanner/research_xau_intraday_multisetup_v17_runtime.py"
      - "config/validation.yaml"
      - "tests/test_research_xau_intraday_multisetup_v17.py"
      - ".github/workflows/ctrader-xau-intraday-multisetup-v17.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-xau-intraday-multisetup-v17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xau-intraday-multisetup-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      XAU_V17_EVIDENCE_OUTPUT: artifacts/xau-intraday-multisetup-v17.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt\n          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit tests
        run: pytest -q tests/test_research_xau_intraday_multisetup_v17.py
      - name: Run XAU V17 on 300k M5 bars
        run: python -m fx_scanner.research_xau_intraday_multisetup_v17_runtime
      - name: Upload XAU V17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-intraday-multisetup-v17
          path: artifacts/xau-intraday-multisetup-v17.json
          if-no-files-found: error
          retention-days: 30
