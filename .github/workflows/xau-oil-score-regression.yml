name: XAU Oil Macro Score Regression

on:
  pull_request:
    paths:
      - "src/fx_scanner/xau_macro_gold_consensus.py"
      - "src/fx_scanner/xau_oil_macro_context.py"
      - "src/fx_scanner/xau_geopolitical_safehaven.py"
      - "src/fx_scanner/xau_macro_risk_monitor.py"
      - "src/fx_scanner/xau_market_quote_health.py"
      - "src/fx_scanner/xau_cnbc_macro_quotes.py"
      - "src/fx_scanner/xau_macro_daily_regime.py"
      - "pages/2_US10Y_Regime_Timing.py"
      - "tests/test_xau_macro_gold_consensus_v1.py"
      - "tests/test_xau_oil_macro_conclusion_v2.py"
      - "tests/test_xau_macro_weighted_oil_v3.py"
      - "tests/test_xau_oil_component_summary_20261109.py"
      - "tests/test_xau_geopolitical_safehaven_v4.py"
      - "tests/test_xau_market_quote_health_v5.py"
      - "tests/test_xau_cnbc_macro_quotes_v6.py"
      - "tests/test_xau_macro_daily_regime_v7.py"
      - ".github/workflows/xau-oil-score-regression.yml"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/xau_macro_gold_consensus.py"
      - "src/fx_scanner/xau_oil_macro_context.py"
      - "src/fx_scanner/xau_geopolitical_safehaven.py"
      - "src/fx_scanner/xau_macro_risk_monitor.py"
      - "src/fx_scanner/xau_market_quote_health.py"
      - "src/fx_scanner/xau_cnbc_macro_quotes.py"
      - "src/fx_scanner/xau_macro_daily_regime.py"
      - "pages/2_US10Y_Regime_Timing.py"
      - "tests/test_xau_macro_gold_consensus_v1.py"
      - "tests/test_xau_oil_macro_conclusion_v2.py"
      - "tests/test_xau_macro_weighted_oil_v3.py"
      - "tests/test_xau_oil_component_summary_20261109.py"
      - "tests/test_xau_geopolitical_safehaven_v4.py"
      - "tests/test_xau_market_quote_health_v5.py"
      - "tests/test_xau_cnbc_macro_quotes_v6.py"
      - "tests/test_xau_macro_daily_regime_v7.py"
      - ".github/workflows/xau-oil-score-regression.yml"

permissions:
  contents: read

jobs:
  oil-macro-score:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile score and dashboard modules
        run: python -m py_compile src/fx_scanner/xau_macro_gold_consensus.py src/fx_scanner/xau_oil_macro_context.py src/fx_scanner/xau_geopolitical_safehaven.py src/fx_scanner/xau_macro_risk_monitor.py pages/2_US10Y_Regime_Timing.py src/fx_scanner/xau_market_quote_health.py src/fx_scanner/xau_cnbc_macro_quotes.py src/fx_scanner/xau_macro_daily_regime.py
      - name: Core and Oil regression (stdlib only)
        run: |
          python -m unittest discover -s tests -p 'test_xau_macro_gold_consensus_v1.py' -v
          python -m unittest discover -s tests -p 'test_xau_oil_macro_conclusion_v2.py' -v
          python -m unittest discover -s tests -p 'test_xau_macro_weighted_oil_v3.py' -v
          python -m unittest discover -s tests -p 'test_xau_oil_component_summary_20261109.py' -v
          python -m unittest discover -s tests -p 'test_xau_geopolitical_safehaven_v4.py' -v
          python -m unittest discover -s tests -p 'test_xau_market_quote_health_v5.py' -v
          python -m unittest discover -s tests -p 'test_xau_cnbc_macro_quotes_v6.py' -v
          python -m unittest discover -s tests -p 'test_xau_macro_daily_regime_v7.py' -v
