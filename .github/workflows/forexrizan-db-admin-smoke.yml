name: ForexRizan DB Admin Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forexrizan-db-admin-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NEW_DB_URL: ${{ secrets.NEW_SUPABASE_DB_URL }}
      PROJECT_REF: naxvdtvlfatljzzwhrmo
    steps:
      - name: Verify PostgreSQL admin connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEW_DB_URL:-}" || { echo "NEW_SUPABASE_DB_URL missing"; exit 1; }
          SAFE_DB_URL="$(RAW_DB_URL="$NEW_DB_URL" PROJECT_REF="$PROJECT_REF" python -c 'import os; from urllib.parse import quote,unquote; raw=os.environ["RAW_DB_URL"].strip(); ref=os.environ["PROJECT_REF"]; scheme,rest=raw.split("://",1); userinfo,host=rest.rsplit("@",1); user,secret=userinfo.split(":",1); user=("postgres."+ref) if ("pooler.supabase.com" in host and user=="postgres") else user; print("{}://{}:{}@{}".format(scheme,user,quote(unquote(secret),safe=""),host))')"
          psql "$SAFE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select current_database(), current_user;" >/dev/null
          echo "FOREXRIZAN_DB_ADMIN_SMOKE_OK"
