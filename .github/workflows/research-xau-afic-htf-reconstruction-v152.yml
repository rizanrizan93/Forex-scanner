name: XAU AFIC HTF Reconstruction V152

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_htf_reconstruction_v152.py"
      - "src/fx_scanner/research_xau_afic_htf_reconstruction_v152_runtime.py"
      - "tests/test_research_xau_afic_htf_reconstruction_v152.py"
      - ".github/workflows/research-xau-afic-htf-reconstruction-v152.yml"

permissions:
  contents: read

jobs:
  afic-htf-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V152_EVIDENCE_OUTPUT: artifacts/xau-afic-htf-reconstruction-v152.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_afic_htf_reconstruction_v152.py
      - name: Run AFIC-inspired V152 reconstruction
        run: python -m fx_scanner.research_xau_afic_htf_reconstruction_v152_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-htf-reconstruction-v152
          path: artifacts/xau-afic-htf-reconstruction-v152.json
          if-no-files-found: error
          retention-days: 30
