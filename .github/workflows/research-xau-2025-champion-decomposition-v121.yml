name: XAU 2025 Champion Decomposition V121
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_2025_champion_decomposition_v121.py"
      - "src/fx_scanner/research_xau_2025_champion_decomposition_v121_runtime.py"
      - "tests/test_research_xau_2025_champion_decomposition_v121.py"
      - ".github/workflows/research-xau-2025-champion-decomposition-v121.yml"
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V121_EVIDENCE_OUTPUT: artifacts/xau-2025-champion-decomposition-v121.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11",cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - run: pytest -q tests/test_research_xau_2025_champion_decomposition_v121.py
      - run: python -m fx_scanner.research_xau_2025_champion_decomposition_v121_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-2025-champion-decomposition-v121
          path: artifacts/xau-2025-champion-decomposition-v121.json
          if-no-files-found: error
          retention-days: 30
