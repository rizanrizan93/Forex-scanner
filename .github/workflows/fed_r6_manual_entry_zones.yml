name: R6 Manual XAU Entry Area — Source and No-Order Gates
on:
  pull_request:
    paths:
      - 'src/fx_scanner/fed_r6_manual_entry_areas.py'
      - 'src/fx_scanner/fed_r6_manual_entry_dashboard.py'
      - 'tests/test_fed_r6_manual_entry_areas.py'
      - 'main.py'
      - 'src/fx_scanner/ui_terminal.py'
      - '.github/workflows/fed_r6_manual_entry_zones.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal_zones_and_failsafe_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 pytest==9.0.2
      - name: Validate source syntax
        run: |
          python -m py_compile src/fx_scanner/fed_r6_manual_entry_areas.py src/fx_scanner/fed_r6_manual_entry_dashboard.py main.py
      - name: Test actual-time geometry and no order authority
        run: python -m pytest -q tests/test_fed_r6_manual_entry_areas.py
