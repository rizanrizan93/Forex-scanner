name: Research M15 Asia-London V2

on:
  push:
    branches:
      - research/m15-asia-london-frozen-oos-v2
    paths:
      - "src/fx_scanner/research_m15_asia_london_v2.py"
      - "src/fx_scanner/demo_m15_asia_london_research.py"
      - "src/fx_scanner/execution/ctrader_research.py"
      - "tests/test_research_m15_asia_london_v2.py"
      - "tests/test_ctrader_research_closed_session_history_v1.py"
      - ".github/workflows/research-m15-asia-london-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-m15-asia-london-v2
  cancel-in-progress: true

jobs:
  broker-oos-tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install read-only research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Run frozen broker-history tournament
        shell: bash
        run: |
          set -euo pipefail
          python -m fx_scanner.demo_m15_asia_london_research | tee forex_m15_asia_london_v2.json
      - name: Validate research evidence JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("forex_m15_asia_london_v2.json")
          data = json.loads(p.read_text())
          assert data["schema_version"] == "FOREX_M15_ASIA_LONDON_FROZEN_OOS_V2"
          assert data["research_only"] is True
          assert data["execution_influence"] is False
          assert data["live_execution_enabled"] is False
          assert len(data["candidates"]) == 2
          print("FOREX_RESEARCH_EVIDENCE_OK", data["ranking"])
          for row in data["candidates"]:
              name = row["candidate"]["name"]
              base = row["base"]["oos"]
              stress = row["stress"]["oos"]
              print(
                  "FOREX_OOS",
                  name,
                  "trades=", base["trades"],
                  "avg_net_r=", base["average_net_r"],
                  "stress_avg_net_r=", stress["average_net_r"],
                  "pf=", base["profit_factor"],
                  "max_dd_r=", base["max_drawdown_r"],
              )
          PY
      - name: Upload immutable research evidence
        uses: actions/upload-artifact@v4
        with:
          name: forex-m15-asia-london-v2
          path: forex_m15_asia_london_v2.json
          if-no-files-found: error
