name: cTrader Demo Donchian Contextual V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/demo_donchian_contextual_v2.py"
      - "src/fx_scanner/demo_donchian_contextual_runtime.py"
      - "src/fx_scanner/technical.py"
      - "config/validation.yaml"
      - ".github/workflows/ctrader-demo-donchian-contextual-v2.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-demo-donchian-contextual-v2
  cancel-in-progress: true

jobs:
  contextual-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      CTRADER_DONCHIAN_CONTEXT_HISTORY_BARS: "2200"
      DONCHIAN_CONTEXT_EVIDENCE_OUTPUT: artifacts/donchian-contextual-v2-evidence.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Run contextual Donchian V2 split-sample research
        run: python -m fx_scanner.demo_donchian_contextual_runtime
      - name: Upload contextual V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: donchian-contextual-v2-evidence
          path: artifacts/donchian-contextual-v2-evidence.json
          if-no-files-found: error
          retention-days: 30
