name: RIZAN Supabase Migration Backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-migration-backup.yml"

permissions:
  contents: read

concurrency:
  group: rizan-supabase-migration-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_DB_URL: ${{ secrets.OLD_SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.MIGRATION_BACKUP_PASSPHRASE }}
      SOURCE_PROJECT_REF: fotzcxjeypmjldhvfskt
      OLD_SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      OLD_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_CLI_VERSION: 2.118.0
      PG_DUMP_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.171

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${OLD_DB_URL:-}" || { echo "Missing GitHub Secret: OLD_SUPABASE_DB_URL"; exit 1; }
          test -n "${BACKUP_PASSPHRASE:-}" || { echo "Missing GitHub Secret: MIGRATION_BACKUP_PASSPHRASE"; exit 1; }
          case "$OLD_DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "OLD_SUPABASE_DB_URL must be a PostgreSQL connection string."; exit 1 ;;
          esac
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "MIGRATION_BACKUP_PASSPHRASE must be at least 20 characters."
            exit 1
          fi

      - name: Verify pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version
          psql --version

      - name: Dump old Supabase database
        shell: bash
        run: |
          set -euo pipefail
          set +x

          WORKDIR="$RUNNER_TEMP/rizan-supabase-backup"
          mkdir -p "$WORKDIR"
          chmod 700 "$WORKDIR"
          cd "$WORKDIR"

          # Normalize the userinfo using the final @ as the host separator.
          SAFE_OLD_DB_URL="$(RAW_DB_URL="$OLD_DB_URL" PROJECT_REF="$SOURCE_PROJECT_REF" python -c 'import os; from urllib.parse import quote,unquote; raw=os.environ["RAW_DB_URL"].strip(); ref=os.environ["PROJECT_REF"]; scheme,rest=raw.split("://",1); userinfo,hostpart=rest.rsplit("@",1); username,raw_secret=userinfo.split(":",1); username=("postgres."+ref) if ("pooler.supabase.com" in hostpart and username=="postgres") else username; safe_secret=quote(unquote(raw_secret),safe=""); print("{}://{}:{}@{}".format(scheme,username,safe_secret,hostpart))')"
          ACTIVE_DB_URL="$SAFE_OLD_DB_URL"
          MIGRATION_ROLE_ACTIVE=0

          if ! psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select current_database(), current_user;" >/dev/null 2>&1; then
            HOSTPART="${SAFE_OLD_DB_URL##*@}"
            MIGRATION_TEMP_PASSWORD="$(printf '%s' 'rizan-migration-role-v1' | openssl dgst -sha256 -hmac "$BACKUP_PASSPHRASE" -binary | xxd -p -c 256)"
            SAFE_RUNTIME_PASSWORD="$(RAW_SECRET="$MIGRATION_TEMP_PASSWORD" python -c 'import os; from urllib.parse import quote; print(quote(os.environ["RAW_SECRET"],safe=""))')"
            ACTIVE_DB_URL="postgresql://rizan_migration.${SOURCE_PROJECT_REF}:${SAFE_RUNTIME_PASSWORD}@${HOSTPART}"

            if ! psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select current_database(), current_user;" >/dev/null 2>&1; then
              echo "Temporary read-only migration role is unavailable."
              exit 1
            fi
            MIGRATION_ROLE_ACTIVE=1
          fi

          # Native PostgreSQL 17 dump: no SET ROLE postgres, no writes to source.
          printf '%s\n' '-- RIZAN migration: built-in Supabase roles are recreated by destination.' > roles.sql

          docker run --rm \
            -v "$WORKDIR:/work" \
            --entrypoint pg_dump \
            "$PG_DUMP_IMAGE" \
            "$ACTIVE_DB_URL" \
            --schema=public \
            --schema-only \
            --no-owner \
            --file=/work/schema.sql

          docker run --rm \
            -v "$WORKDIR:/work" \
            --entrypoint pg_dump \
            "$PG_DUMP_IMAGE" \
            "$ACTIVE_DB_URL" \
            --schema=public \
            --data-only \
            --no-owner \
            --file=/work/data.sql

          cat > history_schema.sql <<'SQL'
          create schema if not exists supabase_migrations;
          create table if not exists supabase_migrations.schema_migrations (
            version text primary key,
            statements text[],
            name text,
            created_by text,
            idempotency_key text,
            rollback text[]
          );
          alter table supabase_migrations.schema_migrations add column if not exists created_by text;
          alter table supabase_migrations.schema_migrations add column if not exists idempotency_key text;
          alter table supabase_migrations.schema_migrations add column if not exists rollback text[];
          truncate table supabase_migrations.schema_migrations;
          SQL

          docker run --rm \
            -v "$WORKDIR:/work" \
            --entrypoint pg_dump \
            "$PG_DUMP_IMAGE" \
            "$ACTIVE_DB_URL" \
            --table=supabase_migrations.schema_migrations \
            --data-only \
            --column-inserts \
            --no-owner \
            --file=/work/history_data.sql

          test -s roles.sql
          test -s schema.sql
          test -s data.sql
          test -s history_schema.sql
          test -s history_data.sql

          # Exact public-table row-count fingerprint for post-restore parity.
          psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "select format('select %L as table_name, count(*)::bigint as row_count from %I.%I;', schemaname||'.'||tablename, schemaname, tablename) from pg_tables where schemaname='public' order by tablename;" \
            | psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F $'\t' \
            > source-public-row-counts.tsv

          psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F $'\t' -c \
            "select version, name from supabase_migrations.schema_migrations order by version;" \
            > source-migrations.tsv

          psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F $'\t' -c \
            "select n.nspname, p.proname, pg_get_function_identity_arguments(p.oid), p.prosecdef from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' order by 1,2,3;" \
            > source-public-functions.tsv

          psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F $'\t' -c \
            "select event_object_schema, event_object_table, trigger_name, action_timing, event_manipulation from information_schema.triggers where event_object_schema='public' order by 1,2,3,5;" \
            > source-public-triggers.tsv

          psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F $'\t' -c \
            "select n.nspname, c.relname, c.relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') order by c.relname;" \
            > source-public-rls.tsv

          psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F $'\t' -c \
            "select e.extname, e.extversion, n.nspname from pg_extension e join pg_namespace n on n.oid=e.extnamespace order by e.extname;" \
            > source-extensions.tsv

          psql "$ACTIVE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F $'\t' -c \
            "select pg_database_size(current_database()), pg_size_pretty(pg_database_size(current_database()));" \
            > source-db-size.tsv

          sha256sum \
            roles.sql schema.sql data.sql history_schema.sql history_data.sql \
            source-public-row-counts.tsv source-migrations.tsv source-public-functions.tsv \
            source-public-triggers.tsv source-public-rls.tsv source-extensions.tsv source-db-size.tsv \
            > dump-files.sha256

          cat > manifest.txt <<EOF
          project_ref=${SOURCE_PROJECT_REF}
          head_sha=${GITHUB_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          supabase_cli_version=${SUPABASE_CLI_VERSION}
          created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          encryption=AES-256-CBC/PBKDF2/SHA-256
          plaintext_uploaded=false
          EOF

          tar -czf rizan-supabase-old-backup.tar.gz \
            roles.sql schema.sql data.sql history_schema.sql history_data.sql \
            source-public-row-counts.tsv source-migrations.tsv source-public-functions.tsv \
            source-public-triggers.tsv source-public-rls.tsv source-extensions.tsv source-db-size.tsv \
            dump-files.sha256 manifest.txt

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
            -in rizan-supabase-old-backup.tar.gz \
            -out rizan-supabase-old-backup.tar.gz.enc \
            -pass env:BACKUP_PASSPHRASE

          sha256sum rizan-supabase-old-backup.tar.gz.enc > rizan-supabase-old-backup.tar.gz.enc.sha256
          chmod 600 rizan-supabase-old-backup.tar.gz.enc rizan-supabase-old-backup.tar.gz.enc.sha256

          # Do not leave plaintext dumps for artifact upload.
          rm -f \
            roles.sql schema.sql data.sql history_schema.sql history_data.sql \
            source-public-row-counts.tsv source-migrations.tsv source-public-functions.tsv \
            source-public-triggers.tsv source-public-rls.tsv source-extensions.tsv source-db-size.tsv \
            dump-files.sha256 manifest.txt rizan-supabase-old-backup.tar.gz

          mkdir -p "$RUNNER_TEMP/rizan-encrypted-artifact"
          mv rizan-supabase-old-backup.tar.gz.enc* "$RUNNER_TEMP/rizan-encrypted-artifact/"

      - name: Upload encrypted migration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rizan-supabase-old-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/rizan-encrypted-artifact/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Migration backup summary
        shell: bash
        run: |
          {
            echo "### RIZAN Supabase migration backup"
            echo
            echo "- Source project: `fotzcxjeypmjldhvfskt`"
            echo "- Artifact contains only encrypted backup material."
            echo "- Plaintext SQL dumps are not uploaded."
            echo "- Exact public-table row counts are included for restore parity."
            echo "- Retention: 3 days."
            echo "- Keep `MIGRATION_BACKUP_PASSPHRASE` unchanged until restore is complete."
          } >> "$GITHUB_STEP_SUMMARY"
