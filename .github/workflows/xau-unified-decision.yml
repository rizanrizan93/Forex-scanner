name: XAU Unified Decision Readonly Tests

on:
  pull_request:
    paths:
      - 'src/fx_scanner/xau_unified_decision_v1.py'
      - 'pages/7_XAU_Unified_Decision.py'
      - 'main.py'
      - 'tests/test_xau_unified_decision_v1.py'
      - '.github/workflows/xau-unified-decision.yml'
  push:
    branches: [main]
    paths:
      - 'src/fx_scanner/xau_unified_decision_v1.py'
      - 'pages/7_XAU_Unified_Decision.py'
      - 'main.py'
      - 'tests/test_xau_unified_decision_v1.py'
      - '.github/workflows/xau-unified-decision.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install pytest==9.0.2
      - name: Compile unified code and navigation
        run: python -m py_compile src/fx_scanner/xau_unified_decision_v1.py pages/7_XAU_Unified_Decision.py main.py
      - name: Unit tests and regression of existing indicators
        run: PYTHONPATH=src:. python -m pytest -q tests/test_xau_unified_decision_v1.py tests/test_xau_technical_engine_v1.py tests/test_xau_decision_checklist_v1.py
      - name: Assert read-only execution separation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/fx_scanner/xau_unified_decision_v1.py').read_text()
          d = Path('pages/7_XAU_Unified_Decision.py').read_text()
          assert 'missed_order_verdict' in p and 'NOT_EVALUATED' in p
          assert 'order_enabled' in p and 'False' in p
          assert 'execute_order(' not in p+d
          assert 'submit_order(' not in p+d
          assert 'pages/7_XAU_Unified_Decision.py' in Path('main.py').read_text()
          PY
