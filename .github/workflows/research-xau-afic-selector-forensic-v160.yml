name: XAU AFIC Selector Forensic V160
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_selector_forensic_v160.py"
      - "src/fx_scanner/research_xau_afic_selector_forensic_v160_runtime.py"
      - "tests/test_research_xau_afic_selector_forensic_v160.py"
      - ".github/workflows/research-xau-afic-selector-forensic-v160.yml"
permissions:
  contents: read
jobs:
  afic-v160:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      V160_OUTPUT: artifacts/xau-afic-selector-forensic-v160.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit test
        run: pytest -q tests/test_research_xau_afic_selector_forensic_v160.py
      - name: Run V160
        run: python -m fx_scanner.research_xau_afic_selector_forensic_v160_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-selector-forensic-v160
          path: artifacts/xau-afic-selector-forensic-v160.json
          if-no-files-found: error
          retention-days: 30
