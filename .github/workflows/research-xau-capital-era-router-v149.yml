name: XAU Capital Era Router V149
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v121_capital_era_router_v149.py"
      - "src/fx_scanner/research_xau_v121_capital_era_router_v149_runtime.py"
      - "tests/test_research_xau_v121_capital_era_router_v149.py"
      - ".github/workflows/research-xau-capital-era-router-v149.yml"
permissions:
  contents: read
jobs:
  capital-era-router:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V149_EVIDENCE_OUTPUT: artifacts/xau-capital-era-router-v149.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v121_capital_era_router_v149.py
      - name: Run V149
        run: python -m fx_scanner.research_xau_v121_capital_era_router_v149_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-capital-era-router-v149
          path: artifacts/xau-capital-era-router-v149.json
          if-no-files-found: error
          retention-days: 30
