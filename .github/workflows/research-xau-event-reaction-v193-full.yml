name: Research XAU Event Reaction V193 Full

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_event_supplement_v193.py"
      - "src/fx_scanner/research_xau_event_corpus_v193_full_runtime.py"
      - "src/fx_scanner/research_xau_event_conditioning_v193.py"
      - "src/fx_scanner/research_xau_event_reaction_v193_year_runtime.py"
      - "src/fx_scanner/research_xau_histdata_download_v193.py"
      - "src/fx_scanner/research_xau_event_parity_v193.py"
      - "src/fx_scanner/research_xau_event_walkforward_v193.py"
      - "tests/test_research_xau_event_full_v193.py"
      - "tests/test_research_xau_event_walkforward_v193.py"
      - ".github/workflows/research-xau-event-reaction-v193-full.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-event-reaction-v193-full
  cancel-in-progress: true

jobs:
  prepare-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      XAU_EVENT_CORPUS_V193_FULL_OUTPUT: artifacts/xau-event-corpus-v193-full.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install V193 corpus runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install beautifulsoup4==4.13.4 pytest==9.0.2
      - name: Unit tests for corpus/conditioning
        run: |
          pytest -q             tests/test_research_xau_event_full_v193.py             tests/test_research_xau_event_walkforward_v193.py
      - name: Build full USD event corpus through current date
        run: python -m fx_scanner.research_xau_event_corpus_v193_full_runtime
      - name: Upload full event corpus
        uses: actions/upload-artifact@v4
        with:
          name: xau-v193-full-event-corpus
          path: artifacts/xau-event-corpus-v193-full.json
          if-no-files-found: error
          retention-days: 14

  backfill-year:
    needs: prepare-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year:
          - 2012
          - 2013
          - 2014
          - 2015
          - 2016
          - 2017
          - 2018
          - 2019
          - 2020
          - 2021
          - 2022
          - 2023
          - 2024
          - 2025
          - 2026
    env:
      XAU_V193_YEAR: ${{ matrix.year }}
      XAU_V193_CORPUS_JSON: /tmp/v193-corpus/xau-event-corpus-v193-full.json
      XAU_V193_PRICE_CSV: /tmp/histdata/xau-v193-${{ matrix.year }}.csv
      XAU_V193_PRICE_PROVENANCE: artifacts/xau-v193-price-provenance-${{ matrix.year }}.json
      XAU_V193_PRICE_SOURCE: HISTDATA_XAUUSD_M1_FIXED_EST_NORMALIZED_UTC
      XAU_V193_YEAR_OUTPUT: artifacts/xau-event-reaction-v193-${{ matrix.year }}.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install V193 runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Download full event corpus
        uses: actions/download-artifact@v4
        with:
          name: xau-v193-full-event-corpus
          path: /tmp/v193-corpus
      - name: Download and normalize HistData XAUUSD M1 shard
        run: python -m fx_scanner.research_xau_histdata_download_v193
      - name: Build yearly reaction + technical conditioning shard
        run: python -m fx_scanner.research_xau_event_reaction_v193_year_runtime
      - name: Upload yearly V193 shard
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xau-v193-year-${{ matrix.year }}
          path: |
            artifacts/xau-event-reaction-v193-${{ matrix.year }}.json
            artifacts/xau-v193-price-provenance-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: backfill-year
    if: always() && needs.backfill-year.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      XAU_V193_SHARD_DIR: /tmp/v193-shards
      XAU_V193_FULL_OUTPUT: artifacts/xau-event-reaction-v193-full.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install aggregator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download all yearly shards
        uses: actions/download-artifact@v4
        with:
          pattern: xau-v193-year-*
          path: /tmp/v193-shards
          merge-multiple: false
      - name: Build eras and expanding walk-forward
        run: python -m fx_scanner.research_xau_event_walkforward_v193
      - name: Upload full V193 reaction atlas
        uses: actions/upload-artifact@v4
        with:
          name: xau-event-reaction-v193-full
          path: artifacts/xau-event-reaction-v193-full.json
          if-no-files-found: error
          retention-days: 30

  parity:
    needs: aggregate
    if: needs.aggregate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      XAU_V193_FULL_ARTIFACT: /tmp/v193-full/xau-event-reaction-v193-full.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Download full V193 atlas
        uses: actions/download-artifact@v4
        with:
          name: xau-event-reaction-v193-full
          path: /tmp/v193-full
      - name: Compare recent public-reference reactions with cTrader
        run: python -m fx_scanner.research_xau_event_parity_v193
