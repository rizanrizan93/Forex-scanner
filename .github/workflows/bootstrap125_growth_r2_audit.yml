name: Bootstrap125 Snowball R2 matched historical archive audit
on:
  push:
    branches: ['research/bootstrap125-snowball-r2-20261122']
    paths:
      - 'research/bootstrap125_growth_r2_existing_replay_evidence.json'
      - 'scripts/bootstrap125_growth_r2_audit.py'
      - 'scripts/bootstrap125_seed_r2_parity_gate.py'
      - 'research/bootstrap125_seed_r2_proxy_rejected_parity.json'
      - '.github/workflows/bootstrap125_growth_r2_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run historical evidence integrity and robust-candidate screen
        run: python scripts/bootstrap125_growth_r2_audit.py
      - name: Fail-closed native baseline parity gate for proposed seed changes
        run: python scripts/bootstrap125_seed_r2_parity_gate.py
      - name: Upload independent audit results
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap125-snowball-r2-readonly-audit
          path: artifacts/bootstrap125_growth_r2_audit.json
          if-no-files-found: error
          retention-days: 90
