name: XAU M15 Exceptional Expansion Audit V109
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_m15_exceptional_expansion_audit_v109.py"
      - "src/fx_scanner/research_xau_m15_exceptional_expansion_audit_v109_runtime.py"
      - "tests/test_research_xau_m15_exceptional_expansion_audit_v109.py"
      - ".github/workflows/research-xau-m15-exceptional-expansion-audit-v109.yml"
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V109_EVIDENCE_OUTPUT: artifacts/xau-m15-exceptional-expansion-audit-v109.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11",cache: pip}
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_m15_exceptional_expansion_audit_v109.py
      - name: Run exceptional-expansion audit
        run: python -m fx_scanner.research_xau_m15_exceptional_expansion_audit_v109_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-m15-exceptional-expansion-audit-v109
          path: artifacts/xau-m15-exceptional-expansion-audit-v109.json
          if-no-files-found: error
          retention-days: 30
