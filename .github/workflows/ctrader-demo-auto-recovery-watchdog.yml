name: cTrader Demo Auto Recovery Watchdog

on:
  workflow_dispatch:
  schedule:
    # Independent recovery lane. If the primary 5-minute supervisor goes stale,
    # re-dispatch it without executing orders from this workflow itself.
    - cron: "4,14,24,34,44,54 * * * 1-5"

permissions:
  actions: write
  contents: read

concurrency:
  group: ctrader-demo-auto-recovery-watchdog
  cancel-in-progress: true

jobs:
  recover-stale-supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check supervisor freshness and recover if stale
        shell: bash
        run: |
          set -euo pipefail

          weekday="$(date -u +%u)"
          if [ "${weekday}" -gt 5 ]; then
            echo "CTRADER_DEMO_RECOVERY_WATCHDOG_MARKET_CLOSED calendar=WEEKDAY_24X5 action=NO_DISPATCH"
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          latest_success="$({
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-supervisor.yml/runs?branch=main&per_page=10" \
              --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")][0].updated_at // ""'
          } || true)"

          stale=0
          age_seconds=-1
          if [ -z "${latest_success}" ]; then
            stale=1
          else
            latest_epoch="$(date -u -d "${latest_success}" +%s)"
            age_seconds=$((now_epoch - latest_epoch))
            if [ "${age_seconds}" -gt 480 ]; then
              stale=1
            fi
          fi

          active_supervisors="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-supervisor.yml/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
          )"

          if [ "${stale}" -eq 1 ] && [ "${active_supervisors}" -eq 0 ]; then
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-supervisor.yml/dispatches" \
              -f ref=main
            echo "CTRADER_DEMO_RECOVERY_WATCHDOG_DISPATCHED age_seconds=${age_seconds} stale_threshold_seconds=480"
          elif [ "${active_supervisors}" -gt 0 ]; then
            echo "CTRADER_DEMO_RECOVERY_WATCHDOG_ACTIVE_SUPERVISOR active_runs=${active_supervisors} age_seconds=${age_seconds} action=NO_DUPLICATE"
          else
            echo "CTRADER_DEMO_RECOVERY_WATCHDOG_HEALTHY age_seconds=${age_seconds} stale_threshold_seconds=480 action=NO_DISPATCH"
          fi
