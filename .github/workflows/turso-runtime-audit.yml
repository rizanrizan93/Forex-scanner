name: Turso demo runtime audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/turso-runtime-audit.yml', 'scripts/turso_runtime_audit.py']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONPATH: src
      FX_DATABASE_BACKEND: turso
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx==0.28.1 pandas==2.2.3 PyYAML==6.0.2
      - run: python scripts/turso_runtime_audit.py
