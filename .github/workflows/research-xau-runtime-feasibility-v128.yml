name: XAU Runtime Feasibility V128

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_runtime_feasibility_v128.py"
      - "src/fx_scanner/research_xau_runtime_feasibility_v128_runtime.py"
      - "tests/test_research_xau_runtime_feasibility_v128.py"
      - ".github/workflows/research-xau-runtime-feasibility-v128.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V128_EVIDENCE_OUTPUT: artifacts/xau-runtime-feasibility-v128.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_runtime_feasibility_v128.py
      - name: Run V128
        run: python -m fx_scanner.research_xau_runtime_feasibility_v128_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-runtime-feasibility-v128
          path: artifacts/xau-runtime-feasibility-v128.json
          if-no-files-found: error
          retention-days: 30
