name: Snowball S8 XAU 7776 Structural Models Annual 2012-2025
on:
  push:
    branches: ['research/bootstrap125-snowball-r2-20261122']
    paths: ['.github/workflows/snowball_s8_structural_full.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: snowball-s8-structural-xau-2012-2025
  cancel-in-progress: false
jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 requests==2.32.5
      - name: Test 12 novel families, 7776 configurations and no-live safety
        run: python scripts/snowball_s8_structural_xau.py --selftest
      - name: Screen bid/ask XAU intraday strategies with 4 hypothetical cash-tier constraints
        run: python scripts/snowball_s8_structural_xau.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowball-s8-xau-${{ matrix.year }}
          path: artifacts/snowball_s8/s8_xau_${{ matrix.year }}.json
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: annual
    if: always() && needs.annual.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 requests==2.32.5
      - uses: actions/download-artifact@v4
        with:
          pattern: snowball-s8-xau-*
          path: /tmp/snowball_s8
          merge-multiple: true
      - name: Select on 2012-18 training and 2019-22 validation only, disclose 2023-25 retrospective
        run: python scripts/snowball_s8_structural_xau.py --aggregate --root /tmp/snowball_s8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowball-s8-xau-2012-2025-selection
          path: artifacts/snowball_s8/s8_aggregate.json
          if-no-files-found: warn
          retention-days: 90
