name: V402 XAU AFIQ Walk Forward 2012-2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/xau_afiq_walkforward_v402.py"
      - "src/fx_scanner/demo_xau_afiq_walkforward_v402.py"
      - "tests/test_xau_afiq_walkforward_v402.py"
      - ".github/workflows/ctrader-demo-xau-afiq-walkforward-v402.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-demo-xau-afiq-walkforward-v402
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research test runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: V402 deterministic regression gate
        run: |
          pytest -q \
            tests/test_xau_afiq_challenger_v395.py \
            tests/test_xau_afiq_replay_v396.py \
            tests/test_xau_afiq_risk_replay_v397.py \
            tests/test_xau_afiq_frozen_reclaim_replay_v398.py \
            tests/test_xau_afiq_probe_add_replay_v399.py \
            tests/test_xau_afiq_local_sweep_recovery_v400.py \
            tests/test_xau_afiq_local_confirm_entry_v401.py \
            tests/test_xau_afiq_walkforward_v402.py

  replay-year:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://naxvdtvlfatljzzwhrmo.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      V402_YEAR: ${{ matrix.year }}
      V402_OUTPUT_PATH: v402_${{ matrix.year }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Run causal calendar-year replay with 60-day warmup
        id: replay
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m fx_scanner.demo_xau_afiq_walkforward_v402 2>&1 | tee v402_${{ matrix.year }}.log
      - name: Upload year evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v402-year-${{ matrix.year }}
          path: |
            v402_${{ matrix.year }}.json
            v402_${{ matrix.year }}.log
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce year replay gate
        if: steps.replay.outcome != 'success'
        run: exit 1

  aggregate:
    if: always()
    needs: [regression, replay-year]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all available year reports
        uses: actions/download-artifact@v4
        with:
          pattern: v402-year-*
          path: v402-years
          merge-multiple: true
      - name: Aggregate fixed-price walk-forward evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fx_scanner.xau_afiq_walkforward_v402 import aggregate_reports

          root = Path('v402-years')
          reports = []
          for path in sorted(root.glob('v402_*.json')):
              try:
                  reports.append(json.loads(path.read_text(encoding='utf-8')))
              except Exception as exc:
                  print(f'V402_SKIP {path}: {exc}')
          result = aggregate_reports(reports, range(2012, 2027))
          Path('v402_aggregate.json').write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=False),
              encoding='utf-8',
          )
          summary = {
              name: payload.get('metrics', {})
              for name, payload in result.get('variants', {}).items()
          }
          print('V402_PRESENT_YEARS ' + json.dumps(result.get('present_years')))
          print('V402_MISSING_YEARS ' + json.dumps(result.get('missing_years')))
          print('V402_AGGREGATE_SUMMARY ' + json.dumps(summary, sort_keys=True, default=str))
          print('V402_NUMERIC_GATES ' + json.dumps(result.get('numeric_gates', {}), sort_keys=True, default=str))
          PY
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: v402-xau-afiq-walkforward-aggregate
          path: v402_aggregate.json
          retention-days: 30
