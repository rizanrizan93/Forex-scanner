name: R29.4 Frozen H4 BUY Selection, Broker & Forward Shadow Proof
on:
  push:
    branches: ['research/r294-frozen-h4-buy-shadow-20261123']
    paths:
      - 'scripts/r294_frozen_h4_buy_shadow.py'
      - 'scripts/r294_publish_gate.py'
      - 'tests/test_r294_frozen_h4_buy_shadow.py'
      - 'tests/test_r294_publish_gate.py'
      - '.github/workflows/r294_frozen_h4_buy_research_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Check historical 2026-fold freeze and live read-only shadow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r294-frozen-h4-buy-shadow-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated historical inference dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl pytest==9.0.2
      - name: Verify lock, no-order, synthetic broker, publish and expiry
        run: python -m pytest -q tests/test_r294_frozen_h4_buy_shadow.py tests/test_r294_publish_gate.py tests/test_r292_magnitude_regime_expansion.py
      - name: Retrieve immutable 2019-2026 R10 shards
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Verify EXACT 2025 63/41 parity with 2026 selection and no 2026 train
        run: |
          python - <<'PY'
          import r294_frozen_h4_buy_shadow as r
          model,proof=r.verified_refit()
          assert proof["validation"]=={"n":63,"correct":41}
          assert proof["training_end_exclusive"]=="2025-01-01T00:00:00+00:00"
          print("R294 FROZEN 2025 SELECTION VERIFIED:",proof)
          PY
      - name: Infer fresh complete H4 broker candle without placing order
        run: python scripts/r294_frozen_h4_buy_shadow.py
      - name: Reject source age, policy drift, time expiry and forged signal
        run: python scripts/r294_publish_gate.py
      - name: Archive read-only inference proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r294-frozen-h4-buy-research-proof
          path: runtime/r294-h4-buy-shadow.json
          retention-days: 30
          if-no-files-found: warn
