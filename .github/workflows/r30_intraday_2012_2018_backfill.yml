name: R30 XAUUSD H1 H4 2012-2018 HistData Intraday Audit Backfill (Read Only)
on:
  push:
    branches: ['research/r30-pareto-direction-2012-2026-20261123']
    paths:
      - 'scripts/r30_backfill_xau_intraday.py'
      - 'tests/test_r30_backfill_xau_intraday.py'
      - '.github/workflows/r30_intraday_2012_2018_backfill.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r30-xau-h1h4-backfill-2012-2018
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r30-pareto-direction-2012-2026-20261123
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.2.3 numpy==2.3.5 pytest==9.0.2
      - run: PYTHONPATH=scripts python -m pytest -q tests/test_r30_backfill_xau_intraday.py

  history:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        year: [2012,2013,2014,2015,2016,2017,2018]
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      PYTHONPATH: 'scripts:src:.'
      XAU_V193_YEAR: ${{ matrix.year }}
      XAU_V193_PRICE_CSV: /tmp/histdata/xau-r30-${{ matrix.year }}.csv
      XAU_V193_PRICE_PROVENANCE: /tmp/histdata/xau-r30-source-${{ matrix.year }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r30-pareto-direction-2012-2026-20261123
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install verified XAU secondary-market-data fetcher, no trading SDK
        run: |
          pip install pandas==2.2.3 numpy==2.3.5
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Download and normalize original fixed EST XAUUSD M1 year, record failed months
        run: python -m fx_scanner.research_xau_histdata_download_v193
      - name: Audit and resample fully formed H1 H4 UTC candles
        run: |
          python scripts/r30_backfill_xau_intraday.py \
            --source "$XAU_V193_PRICE_CSV" --provenance "$XAU_V193_PRICE_PROVENANCE" \
            --year "${{ matrix.year }}" --output artifacts/r30_backfill
      - name: Save research OHLC sources and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r30-intraday-${{ matrix.year }}
          path: |
            artifacts/r30_backfill/r10-1h-${{ matrix.year }}.csv
            artifacts/r30_backfill/r10-4h-${{ matrix.year }}.csv
            artifacts/r30_backfill/r30-backfill-provenance-${{ matrix.year }}.json
          retention-days: 90
          if-no-files-found: warn
