name: Research GBPAUD Component Strategy V5

on:
  workflow_dispatch:
  push:
    branches:
      - research/gbpaud-component-strategy-search-v5
    paths:
      - research/gbpaud_component_strategy_search_v5.py
      - .github/workflows/research-gbpaud-component-strategy-v5.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1
      - name: Run frozen GBPAUD V5 tournament
        run: |
          set -o pipefail
          rm -rf research_output_gbpaud_v5
          mkdir -p research_output_gbpaud_v5
          python research/gbpaud_component_strategy_search_v5.py | tee research_output_gbpaud_v5/console.txt
      - name: Verify research-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research_output_gbpaud_v5/gbpaud_component_strategy_search_v5.json')
          d = json.loads(p.read_text())
          assert d['contract'] == 'GBPAUD_COMPONENT_STRATEGY_SEARCH_V5'
          assert d['execution_influence'] is False
          assert d['promotion_authority'] is False
          assert d['symbol'] == 'GBPAUD'
          assert min(d['coverage']['gbpaud_h1_rows'], d['coverage']['gbpusd_h1_rows'], d['coverage']['audusd_h1_rows']) >= 70000
          assert len(d['candidate_set']) == 6
          print('GBPAUD V5 research contract: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gbpaud-component-strategy-v5
          path: research_output_gbpaud_v5/
          retention-days: 30
