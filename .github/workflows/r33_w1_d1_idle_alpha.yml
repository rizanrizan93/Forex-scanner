name: R33 XAU 2012-2026 W1 Trend Plus D1 Idle-Only Extra Alpha (Read Only)
on:
  push:
    branches: ['research/r33-d1-w1-profit-frequency-idle-20261124']
    paths:
      - 'scripts/r33_w1_d1_idle_overlay.py'
      - 'tests/test_r33_w1_d1_idle_overlay.py'
      - '.github/workflows/r33_w1_d1_idle_alpha.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r33-w1-d1-profit-frequency-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated historical research math/test requirements
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl pytest==9.0.2
      - name: Prove closed-week causal gates and no one-ounce simultaneous W1/D1 positions
        run: |
          python -m py_compile scripts/r33_w1_d1_idle_overlay.py
          python -m pytest -q tests/test_r33_w1_d1_idle_overlay.py

  study:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 17
    name: W1 base + D1 ${{ matrix.mode }} ${{ matrix.gate }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        mode: ['max_net','max_signals','profit_frequency']
        gate: ['any','d1_ema','d1_adx','d1_breakout','prior_week_ema']
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install numeric source readers only, no trading SDK
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - name: Restore exact 2012–2026 original XAU D1 and W1 daily market history
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Restore prior-year frozen D1 annual signal receipts from R32 (no model re-fit)
        uses: actions/download-artifact@v4
        with:
          run-id: 45194199077
          github-token: ${{ github.token }}
          pattern: r32-1D-*
          path: artifacts/r32
          merge-multiple: true
      - name: Verify W1 baseline 75 trades/2825.987 then simulate actual D1 idle-only trade PnL
        run: python scripts/r33_w1_d1_idle_overlay.py --mode "${{ matrix.mode }}" --gate "${{ matrix.gate }}"
      - name: Archive exact chronological multi-timeframe single-ounce trades, DD and cost stress
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r33-${{ matrix.mode }}-${{ matrix.gate }}
          path: artifacts/r33/r33-${{ matrix.mode }}-${{ matrix.gate }}.json
          retention-days: 90
          if-no-files-found: warn
