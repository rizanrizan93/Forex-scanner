name: R31.1 Freeze 24 Extended XAU 2012-2026 Net Profit and Baselines
on:
  push:
    branches: ['research/r31-net-profit-max-2012-2026-20261123']
    paths:
      - 'scripts/r311_consolidate_holds.py'
      - '.github/workflows/r311_consolidate_holds.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore all 24 extended-hold and 3 unoptimized baseline artifact receipts
        uses: actions/download-artifact@v4
        with:
          run-id: 45189758797
          github-token: ${{ github.token }}
          pattern: r311-*
          path: artifacts/r311
          merge-multiple: true
      - name: Install checked historical price-only quant dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 openpyxl requests
      - name: Restore 2012-2018 SHA-audited price context for H4 baseline
        uses: actions/download-artifact@v4
        with:
          run-id: 45183311130
          github-token: ${{ github.token }}
          pattern: r30-hf-yr-*
          path: /tmp/r30_early
          merge-multiple: true
      - name: Restore original R10 2019-2026 intraday context for H4 baseline
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Restore R9.8 original daily XAU context for D1/W1 baseline
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Correct independently re-run the extended-hold fixed EMA/always BUY SELL baselines
        env:
          PYTHONPATH: 'scripts:src:.'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -m py_compile scripts/r311_recompute_baselines.py
          for tf in 1W 1D 4h; do
            python scripts/r311_recompute_baselines.py --tf "$tf"
          done
      - name: Check all original 24 model plus 3 corrected baseline receipts and independently audit profit
        run: |
          set -euo pipefail
          python -m py_compile scripts/r311_consolidate_holds.py
          test "$(find artifacts/r311 -name 'r311-*.json' | wc -l)" -eq 27
          python scripts/r311_consolidate_holds.py
      - name: Commit final non-executable research audit and drawdown receipt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/RIZAN_R311_EXTENDED_NET_PROFIT_RESEARCH_LOCK_20261123.json
          git add research/RIZAN_R311_EXTENDED_NET_PROFIT_FINDINGS_20261123.md
          if ! git diff --cached --quiet; then
            git commit -m "Freeze R31.1 24 extended-hold XAU profit trials and 3 fixed trend baselines, research only"
            git push origin HEAD:refs/heads/research/r31-net-profit-max-2012-2026-20261123
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r311-frozen-extended-net-profit-study
          path: |
            research/RIZAN_R311_EXTENDED_NET_PROFIT_RESEARCH_LOCK_20261123.json
            research/RIZAN_R311_EXTENDED_NET_PROFIT_FINDINGS_20261123.md
          retention-days: 90
          if-no-files-found: warn
