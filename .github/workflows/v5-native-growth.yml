name: V5 native growth baseline ledger audit and build
on:
  push:
    branches: ['research/v5-native-growth-optimization-20261124']
    paths: ['research/v5_native_growth/**', '.github/workflows/v5-native-growth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 994d68edc9bb87e5c1e57997a65be18873af84b8
          path: evidence
          persist-credentials: false
      - run: python research/v5_native_growth/ledger_audit.py evidence/research/r15_frozen_shared_replay/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: v5-native-ledger-audit
          path: ledger_audit.json
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 26bf8396b6e703d650e703fca48d556252782f03
          path: reference
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile isolated native execution adapter
        run: |
          mkdir native
          cp -a reference/research/r11_profitable_addon_alpha/native_original/. native/
          patch -p1 -d native < research/frozen_v1_10b_20261124/native_changes.patch
          cp research/frozen_v1_10b_20261124/BtcResearchFilter.cs native/native_replay/
          python research/v5_native_growth/extend_native.py native
          dotnet build native/native_replay/NovemberReplay.csproj -c Release -o build --nologo
          dotnet build/NovemberReplay.dll --filter-selftest
      - name: Validate registered configurations
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v5_native_growth/profiles.json'))
          assert len(p)==141 and len({x['Id'] for x in p})==len(p)
          assert all(x['Year']==2019 and x['EndYear']==2026 for x in p)
          print('V5_PROFILES',len(p),'native_replays=0; exact restored prices required')
          PY
