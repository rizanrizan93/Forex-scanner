name: Public real bid ask Settlement replay
on:
  push:
    branches: [codex/native-tick-preflight-20261017]
    paths: ['.github/workflows/public-settlement-real-ticks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rizan-public-settlement-real-ticks
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'rizanrizan93/Forex-scanner' && github.ref == 'refs/heads/codex/native-tick-preflight-20261017' && github.actor == 'rizanrizan93'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - name: Run isolated backtest probe
        shell: bash
        env:
          RIZAN_NATIVE_DOCKER: '1'
          RIZAN_NATIVE_PRECISE: '1'
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          export RIZAN_NATIVE_PRIVATE="$work"
          trap 'rm -rf -- "$RIZAN_NATIVE_PRIVATE"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$work/ssh-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$work/known_hosts"
          ssh_options=(-i "$work/ssh-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" -o ConnectTimeout=20)
          python3 -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(open("research/native-tick/public-harness.sealed.json"))["wrapped"]))' | ssh "${ssh_options[@]}" Rizanrizan@202.74.74.172 'openssl pkeyutl -decrypt -inkey "$HOME/.local/state/rizan-native-preflight/transfer.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256' > "$work/source-key"
          export RIZAN_NATIVE_STRATEGY=1
          export RIZAN_NATIVE_VARIANT=optimized2
          python3 -m venv "$work/venv"
          "$work/venv/bin/pip" -q install cryptography
          "$work/venv/bin/python" research/native-tick/public_tick/real_tick_driver.py

