name: XAU Stable H1 Context Readonly Tests

on:
  pull_request:
    paths:
      - 'src/fx_scanner/xau_stable_h1_context.py'
      - 'src/fx_scanner/frozen_v1_bias_dashboard.py'
      - 'src/fx_scanner/xau_v1_consensus_dashboard.py'
      - 'pages/7_XAU_Unified_Decision.py'
      - 'tests/test_xau_stable_h1_context.py'
      - '.github/workflows/xau-stable-h1-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'src/fx_scanner/xau_stable_h1_context.py'
      - 'src/fx_scanner/frozen_v1_bias_dashboard.py'
      - 'src/fx_scanner/xau_v1_consensus_dashboard.py'
      - 'pages/7_XAU_Unified_Decision.py'
      - 'tests/test_xau_stable_h1_context.py'
      - '.github/workflows/xau-stable-h1-readonly.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused testing dependencies
        run: python -m pip install --disable-pip-version-check pytest streamlit
      - name: Compile affected modules
        run: |
          python -m py_compile src/fx_scanner/xau_stable_h1_context.py src/fx_scanner/frozen_v1_bias_dashboard.py src/fx_scanner/xau_v1_consensus_dashboard.py pages/7_XAU_Unified_Decision.py
      - name: Stable H1 and unchanged Frozen V1 test suite
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q tests/test_xau_stable_h1_context.py tests/test_frozen_v1_directional_score.py tests/test_xau_v1_primary_consensus.py tests/test_xau_weighted_opportunity_v1.py
