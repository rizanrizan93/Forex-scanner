name: TEMP Crypto Contract Patch

on:
  push:
    branches: [fix/demo-five-crypto-broker-pips]
    paths:
      - .github/workflows/temp-crypto-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/demo-five-crypto-broker-pips
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Patch broker-authoritative crypto contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "src/fx_scanner/cli.py",
              '"BTCUSD": ("CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS", 100.0, 5000.0),',
              '"BTCUSD": ("CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS", 1.0, 50.0),',
          )
          replace(
              "src/fx_scanner/cli.py",
              '"ETHUSD": ("CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS", 10.0, 1000.0),',
              '"ETHUSD": ("CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS", 0.1, 10.0),',
          )

          for path in (
              ".github/workflows/ctrader-demo-auto-pipeline.yml",
              ".github/workflows/ctrader-demo-discovery-pipeline.yml",
          ):
              replace(path, 'CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS: "2000"', 'CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS: "20"')
              replace(path, 'CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS: "100"', 'CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS: "1"')

          for path in (
              "tests/test_demo_auto_pipeline_v020.py",
              "tests/test_demo_weekend_spread_workflow_v051.py",
          ):
              replace(path, 'CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS: "2000"', 'CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS: "20"')
              replace(path, 'CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS: "100"', 'CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS: "1"')

          preflight = Path("src/fx_scanner/demo_crypto_broker_preflight.py")
          text = preflight.read_text()
          text = text.replace(
              '    if set(symbols) != set(CRYPTO_WEEKEND_SYMBOLS):\n        raise SystemExit("CTRADER_DEMO_CRYPTO_PREFLIGHT_UNIVERSE_INCOMPLETE")',
              '    if len(symbols) != len(CRYPTO_WEEKEND_SYMBOLS) or set(symbols) != set(CRYPTO_WEEKEND_SYMBOLS):\n        raise SystemExit("CTRADER_DEMO_CRYPTO_PREFLIGHT_UNIVERSE_INCOMPLETE")',
          )
          text = text.replace(
              '    mismatches: list[str] = []\n    try:',
              '    mismatches: list[str] = []\n    read_symbols: list[str] = []\n    read_error: Exception | None = None\n    try:',
          )
          text = text.replace(
              '            status = feed.market_status(pair.symbol, at=now)\n            broker_pip = status.broker_pip_size',
              '            status = feed.market_status(pair.symbol, at=now)\n            read_symbols.append(pair.symbol)\n            broker_pip = status.broker_pip_size',
          )
          text = text.replace(
              '            if not pip_match:\n                mismatches.append(pair.symbol)\n    finally:\n        feed.close()\n\n    if mismatches:',
              '            if not pip_match:\n                mismatches.append(pair.symbol)\n    except Exception as exc:\n        read_error = exc\n    finally:\n        feed.close()\n\n    if tuple(read_symbols) != tuple(symbols):\n        missing = ",".join(symbol for symbol in symbols if symbol not in set(read_symbols)) or "NONE"\n        message = (\n            "CTRADER_DEMO_CRYPTO_PREFLIGHT_READ_COUNT_MISMATCH:"\n            f"read={len(read_symbols)} expected={len(symbols)} missing={missing}"\n        )\n        if read_error is not None:\n            raise SystemExit(message) from read_error\n        raise SystemExit(message)\n    if read_error is not None:\n        raise read_error\n\n    if mismatches:',
          )
          text = text.replace(
              '        f"symbols={\',\'.join(symbols)} broker_schedule=AUTHORITATIVE"',
              '        f"read_count={len(read_symbols)} expected_count={len(symbols)} "\n        f"symbols={\',\'.join(symbols)} broker_schedule=AUTHORITATIVE"',
          )
          if "CTRADER_DEMO_CRYPTO_PREFLIGHT_READ_COUNT_MISMATCH" not in text:
              raise SystemExit("preflight read-count patch did not apply")
          preflight.write_text(text)

          Path("tests/test_demo_crypto_broker_contract_v054.py").write_text('''from pathlib import Path\n\nfrom fx_scanner.config import load_project_config\nfrom fx_scanner.demo_market_schedule import weekend_crypto_pairs\n\n\ndef test_five_crypto_pip_contract_matches_observed_ctrader_metadata():\n    cfg = load_project_config(None)\n    pairs = weekend_crypto_pairs(cfg)\n    assert {pair.symbol: pair.pip_size for pair in pairs} == {\n        "BTCUSD": 1.0,\n        "ETHUSD": 1.0,\n        "SOLUSD": 0.01,\n        "RPLUSD": 0.001,\n        "LTCUSD": 0.1,\n    }\n\n\ndef test_preflight_requires_exactly_five_successful_symbol_reads():\n    root = Path(__file__).resolve().parents[1]\n    source = (root / "src/fx_scanner/demo_crypto_broker_preflight.py").read_text()\n    assert "CTRADER_DEMO_CRYPTO_PREFLIGHT_READ_COUNT_MISMATCH" in source\n    assert "tuple(read_symbols) != tuple(symbols)" in source\n    assert "read_count={len(read_symbols)}" in source\n    assert "expected_count={len(symbols)}" in source\n\n\ndef test_crypto_spread_caps_preserve_prechange_absolute_price_limits():\n    root = Path(__file__).resolve().parents[1]\n    workflow = (root / ".github/workflows/ctrader-demo-auto-pipeline.yml").read_text()\n    assert 'CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS: "20"' in workflow\n    assert 'CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS: "1"' in workflow\n''')
          PY

          python -m pytest -q \
            tests/test_demo_crypto_preflight_retry_v053.py \
            tests/test_demo_crypto_broker_contract_v054.py \
            tests/test_demo_weekend_crypto_schedule_v038.py \
            tests/test_demo_weekend_spread_workflow_v051.py \
            tests/test_demo_auto_pipeline_v020.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fx_scanner/cli.py src/fx_scanner/demo_crypto_broker_preflight.py .github/workflows/ctrader-demo-auto-pipeline.yml .github/workflows/ctrader-demo-discovery-pipeline.yml tests/test_demo_auto_pipeline_v020.py tests/test_demo_weekend_spread_workflow_v051.py tests/test_demo_crypto_broker_contract_v054.py
          git diff --cached --check
          git commit -m "fix(demo): require five crypto reads and preserve spread caps"
          git push origin HEAD:fix/demo-five-crypto-broker-pips
