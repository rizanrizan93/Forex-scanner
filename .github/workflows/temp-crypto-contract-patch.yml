name: TEMP Crypto Contract Patch

on:
  push:
    branches: [fix/demo-five-crypto-broker-pips]
    paths:
      - .github/workflows/temp-crypto-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/demo-five-crypto-broker-pips
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Patch spread validation bounds only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/fx_scanner/cli.py")
          text = p.read_text()
          replacements = {
              '"BTCUSD": ("CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS", 100.0, 5000.0),': '"BTCUSD": ("CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS", 1.0, 50.0),',
              '"ETHUSD": ("CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS", 10.0, 1000.0),': '"ETHUSD": ("CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS", 0.1, 10.0),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing expected cli contract: {old}")
              text = text.replace(old, new)
          p.write_text(text)
          PY
          python - <<'PY'
          import os
          from fx_scanner.cli import _demo_spread_limit_overrides
          from fx_scanner.config import load_project_config
          cfg = load_project_config(None)
          os.environ["CTRADER_DEMO_BTCUSD_MAX_SPREAD_PIPS"] = "20"
          os.environ["CTRADER_DEMO_ETHUSD_MAX_SPREAD_PIPS"] = "1"
          values = _demo_spread_limit_overrides(cfg)
          assert values["BTCUSD"] == 20.0
          assert values["ETHUSD"] == 1.0
          print("CRYPTO_SPREAD_VALIDATION_OK BTCUSD=20 ETHUSD=1")
          PY
      - name: Commit non-workflow patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fx_scanner/cli.py
          git diff --cached --check
          git commit -m "fix(demo): align crypto spread validation units"
          git push origin HEAD:fix/demo-five-crypto-broker-pips
