name: XAU Geometry Bootstrap V151
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v150_geometry_bootstrap_v151.py"
      - "src/fx_scanner/research_xau_v150_geometry_bootstrap_v151_runtime.py"
      - "tests/test_research_xau_v150_geometry_bootstrap_v151.py"
      - ".github/workflows/research-xau-geometry-bootstrap-v151.yml"
permissions:
  contents: read
jobs:
  geometry-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V151_EVIDENCE_OUTPUT: artifacts/xau-geometry-bootstrap-v151.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v150_geometry_bootstrap_v151.py
      - name: Run V151
        run: python -m fx_scanner.research_xau_v150_geometry_bootstrap_v151_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-geometry-bootstrap-v151
          path: artifacts/xau-geometry-bootstrap-v151.json
          if-no-files-found: error
          retention-days: 30
