name: XAU AFIC Public Robustness V158
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_public_robustness_v158.py"
      - "src/fx_scanner/research_xau_afic_public_robustness_v158_runtime.py"
      - "tests/test_research_xau_afic_public_robustness_v158.py"
      - ".github/workflows/research-xau-afic-public-robustness-v158.yml"
permissions:
  contents: read
jobs:
  afic-v158:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V158_OUTPUT: artifacts/xau-afic-public-robustness-v158.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit test
        run: pytest -q tests/test_research_xau_afic_public_robustness_v158.py
      - name: Run V158 full history
        run: python -m fx_scanner.research_xau_afic_public_robustness_v158_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-public-robustness-v158
          path: artifacts/xau-afic-public-robustness-v158.json
          if-no-files-found: error
          retention-days: 30
