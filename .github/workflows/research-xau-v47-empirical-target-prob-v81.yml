name: XAU V47 Empirical Target Prob V81

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v47_empirical_target_prob_v81.py"
      - "src/fx_scanner/research_xau_v47_empirical_target_prob_v81_runtime.py"
      - "tests/test_research_xau_v47_empirical_target_prob_v81.py"
      - ".github/workflows/research-xau-v47-empirical-target-prob-v81.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V81_EVIDENCE_OUTPUT: artifacts/xau-v47-empirical-target-prob-v81.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v47_empirical_target_prob_v81.py
      - name: Run empirical target-probability diagnostic
        run: python -m fx_scanner.research_xau_v47_empirical_target_prob_v81_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-v47-empirical-target-prob-v81
          path: artifacts/xau-v47-empirical-target-prob-v81.json
          if-no-files-found: error
          retention-days: 30
