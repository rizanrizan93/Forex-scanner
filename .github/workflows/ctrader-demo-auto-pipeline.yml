name: cTrader Demo Auto Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctrader-demo-auto-pipeline
  cancel-in-progress: false

jobs:
  fast-revalidate-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FX_KILL_SWITCH: "0"
      FX_IDEMPOTENCY_STATE_PATH: /tmp/execution_idempotency.json
      CTRADER_DEMO_AUTOTRADE_ENABLED: ${{ secrets.CTRADER_DEMO_AUTOTRADE_ENABLED }}
      CTRADER_DEMO_EXECUTION_CANDIDATE_MIN: "50.01"
      CTRADER_DEMO_TECHNICAL_ONLY: "1"
      CTRADER_DEMO_CALIBRATION_ALLOW_PRETRIGGER: "0"
      CTRADER_DEMO_CHASE_BLOCK_ATR: "2.0"
      CTRADER_DEMO_WAVE_MIN_PULLBACK_ATR: "0.25"
      CTRADER_DEMO_WAVE_MAX_ZONE_ATR: "0.50"
      CTRADER_DEMO_MOMENTUM_MAX_ZONE_ATR: "0.20"
      CTRADER_DEMO_MAX_ENTRY_DRIFT_R: "0.50"
      CTRADER_DEMO_MIN_LIVE_RR: "1.0"
      CTRADER_DEMO_RISK_PER_TRADE_PCT: "5.0"
      CTRADER_DEMO_MAX_CONCURRENT_POSITIONS: "10"
      CTRADER_DEMO_MAX_ORDER_LOTS: "0.50"
      CTRADER_DEMO_MAX_PORTFOLIO_RISK_PCT: "6.0"
      CTRADER_DEMO_MAX_MARGIN_FREE_USAGE_PCT: "25.0"
      CTRADER_DEMO_ALLOW_SAME_SYMBOL_STACKING: "1"
      CTRADER_DEMO_STACK_MIN_SCORE: "50.01"
      CTRADER_DEMO_STACK_MIN_COVERAGE: "0.80"
      CTRADER_DEMO_STACK_MIN_RR2: "1.5"
      CTRADER_DEMO_MAX_SAME_SYMBOL_POSITIONS: "4"
      CTRADER_DEMO_MIN_STACK_SPACING_SECONDS: "0"
      CTRADER_DEMO_FVG_MAX_AGE_MINUTES: "90"
      CTRADER_DEMO_XAUUSD_MAX_SPREAD_PIPS: "30"
      CTRADER_DEMO_FAST_MAX_SYMBOLS: "5"
      CTRADER_DEMO_FAST_CANDIDATE_LOOKBACK_MINUTES: "45"
      CTRADER_DEMO_FAST_RANKING_MAX_AGE_MINUTES: "20"
      CTRADER_DEMO_HISTORICAL_REQUEST_DELAY_SECONDS: "0.20"
      CTRADER_DEMO_ADAPTIVE_PROFIT_LOCK_ENABLED: "0"
      CTRADER_DEMO_STRUCTURAL_PROFIT_PROTECT_ENABLED: "0"
      CTRADER_DEMO_XAU_V42_PROFIT_LOCK_ENABLED: "1"
      CTRADER_DEMO_ADAPTIVE_CALIBRATION_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Record auto pipeline running
        continue-on-error: true
        run: python -m fx_scanner.demo_runtime_heartbeat ctrader_demo_auto_pipeline RUNNING

      # Producers are isolated so a transient failure in one strategy does not
      # suppress protection maintenance for positions that already exist.
      - name: Evaluate five-core strategy router
        id: produce_five_core
        continue-on-error: true
        run: python -m fx_scanner.demo_execution_fast_candidate_producer
      - name: Evaluate promoted XAU Expansion V4.2 DEMO strategy
        id: produce_xau_v42
        continue-on-error: true
        run: python -m fx_scanner.demo_xau_expansion_v42_candidate_producer
      - name: Evaluate XAU M15 EMA reversal/recovery probationary DEMO strategy
        id: produce_xau_m15_reversal
        continue-on-error: true
        run: python -m fx_scanner.demo_xau_m15_ema_reversal_candidate_producer
      - name: Evaluate XAU M15 liquidity-sweep fade probationary DEMO strategy
        id: produce_xau_m15_sweep_fade
        continue-on-error: true
        run: python -m fx_scanner.demo_xau_m15_liquidity_sweep_fade_candidate_producer
      - name: Evaluate promoted EURAUD and GBPAUD frozen DEMO strategies
        id: produce_euraud_gbpaud
        continue-on-error: true
        run: python -m fx_scanner.demo_euraud_gbpaud_candidate_producer

      - name: Repair missing SL/TP on scanner-linked DEMO positions
        id: repair_existing_protection
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_existing_protection_repair

      # New entries remain fail-closed. A producer or protection-repair failure
      # blocks handoff for this cycle rather than executing stale/partial intent.
      - name: Execute all fresh strategy-authorized DEMO signals within safety caps
        id: execute_fresh_handoff
        if: >-
          ${{ !cancelled() &&
              steps.produce_five_core.outcome == 'success' &&
              steps.produce_xau_v42.outcome == 'success' &&
              steps.produce_xau_m15_reversal.outcome == 'success' &&
              steps.produce_xau_m15_sweep_fade.outcome == 'success' &&
              steps.produce_euraud_gbpaud.outcome == 'success' &&
              steps.repair_existing_protection.outcome == 'success' }}
        continue-on-error: true
        run: python -m fx_scanner.demo_execution_fresh_ready_handoff --limit 10

      - name: Enforce pair-specific max-hold exits
        id: pair_time_exit
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_five_core_time_exit
      - name: Apply EURAUD and GBPAUD completed-D1 Chandelier stops
        id: euraud_gbpaud_chandelier
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_euraud_gbpaud_chandelier
      - name: Enforce XAU Expansion V4.2 seven-D1-bar max-hold exit
        id: xau_v42_time_exit
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_xau_expansion_v42_time_exit
      - name: Apply XAU Expansion V4.2 completed-H1 deferred profit lock
        id: xau_v42_profit_lock
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_xau_v42_deferred_profit_lock
      - name: Keep legacy adaptive profit lock disabled for fixed-exit D1 strategy
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_adaptive_profit_lock
      - name: Keep legacy structural profit protector disabled for frozen strategies
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: python -m fx_scanner.demo_structural_profit_protector

      - name: Assert critical execution and protection stages succeeded
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          FIVE_CORE_OUTCOME: ${{ steps.produce_five_core.outcome }}
          XAU_V42_OUTCOME: ${{ steps.produce_xau_v42.outcome }}
          XAU_M15_REVERSAL_OUTCOME: ${{ steps.produce_xau_m15_reversal.outcome }}
          XAU_M15_SWEEP_FADE_OUTCOME: ${{ steps.produce_xau_m15_sweep_fade.outcome }}
          EURAUD_GBPAUD_OUTCOME: ${{ steps.produce_euraud_gbpaud.outcome }}
          REPAIR_OUTCOME: ${{ steps.repair_existing_protection.outcome }}
          HANDOFF_OUTCOME: ${{ steps.execute_fresh_handoff.outcome }}
          PAIR_EXIT_OUTCOME: ${{ steps.pair_time_exit.outcome }}
          CHANDELIER_OUTCOME: ${{ steps.euraud_gbpaud_chandelier.outcome }}
          XAU_EXIT_OUTCOME: ${{ steps.xau_v42_time_exit.outcome }}
          XAU_LOCK_OUTCOME: ${{ steps.xau_v42_profit_lock.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "FIVE_CORE:${FIVE_CORE_OUTCOME}" \
            "XAU_V42:${XAU_V42_OUTCOME}" \
            "XAU_M15_REVERSAL:${XAU_M15_REVERSAL_OUTCOME}" \
            "XAU_M15_SWEEP_FADE:${XAU_M15_SWEEP_FADE_OUTCOME}" \
            "EURAUD_GBPAUD:${EURAUD_GBPAUD_OUTCOME}" \
            "REPAIR:${REPAIR_OUTCOME}" \
            "HANDOFF:${HANDOFF_OUTCOME}" \
            "PAIR_EXIT:${PAIR_EXIT_OUTCOME}" \
            "CHANDELIER:${CHANDELIER_OUTCOME}" \
            "XAU_EXIT:${XAU_EXIT_OUTCOME}" \
            "XAU_LOCK:${XAU_LOCK_OUTCOME}"; do
            stage="${item%%:*}"
            outcome="${item#*:}"
            if [ "${outcome}" != "success" ]; then
              echo "CRITICAL_STAGE_FAILED stage=${stage} outcome=${outcome}"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "CTRADER_DEMO_AUTO_PIPELINE_FAIL_CLOSED new_entry_handoff=BLOCKED protection_maintenance=ATTEMPTED"
            exit 1
          fi
          echo "CTRADER_DEMO_AUTO_PIPELINE_CRITICAL_STAGES_OK"

      - name: Record auto pipeline success
        if: success()
        continue-on-error: true
        run: python -m fx_scanner.demo_runtime_heartbeat ctrader_demo_auto_pipeline SUCCESS
      - name: Record auto pipeline failure
        if: failure()
        continue-on-error: true
        run: python -m fx_scanner.demo_runtime_heartbeat ctrader_demo_auto_pipeline FAILED
