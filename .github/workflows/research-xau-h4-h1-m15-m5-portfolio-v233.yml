name: Research XAU H4 H1 M15 M5 Portfolio V233

on:
  workflow_dispatch:
  push:
    branches:
      - research/v233-h4-h1-m15-m5-portfolio
    paths:
      - "src/fx_scanner/research_xau_h4_h1_m15_m5_portfolio_v233_year.py"
      - "src/fx_scanner/research_xau_h4_h1_m15_m5_portfolio_v233_aggregate.py"
      - "tests/test_research_xau_h4_h1_m15_m5_portfolio_v233.py"
      - ".github/workflows/research-xau-h4-h1-m15-m5-portfolio-v233.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: research-xau-h4-h1-m15-m5-portfolio-v233-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest==9.0.2
      - name: Compile
        run: |
          python -m py_compile src/fx_scanner/research_xau_h4_h1_m15_m5_portfolio_v233_year.py
          python -m py_compile src/fx_scanner/research_xau_h4_h1_m15_m5_portfolio_v233_aggregate.py
      - name: Focused tests
        run: pytest -q tests/test_research_xau_h4_h1_m15_m5_portfolio_v233.py

  replay-year:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        year:
          - 2012
          - 2013
          - 2014
          - 2015
          - 2016
          - 2017
          - 2018
          - 2019
          - 2020
          - 2021
          - 2022
          - 2023
          - 2024
          - 2025
          - 2026
    env:
      XAU_V193_YEAR: ${{ matrix.year }}
      XAU_V193_PRICE_CSV: /tmp/histdata/xau-v233-${{ matrix.year }}.csv
      XAU_V193_PRICE_PROVENANCE: artifacts/xau-v233-price-provenance-${{ matrix.year }}.json
      XAU_V233_YEAR: ${{ matrix.year }}
      XAU_V233_PRICE_CSV: /tmp/histdata/xau-v233-${{ matrix.year }}.csv
      XAU_V233_OUTPUT: artifacts/xau-h4-h1-m15-m5-continuation-v233-${{ matrix.year }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install historical runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Download and normalize HistData XAUUSD M1
        run: python -m fx_scanner.research_xau_histdata_download_v193
      - name: Replay causal H4-H1-M15-M5 continuation
        run: python -m fx_scanner.research_xau_h4_h1_m15_m5_portfolio_v233_year
      - name: Upload V233 year
        uses: actions/upload-artifact@v4
        with:
          name: xau-v233-year-${{ matrix.year }}
          path: |
            artifacts/xau-h4-h1-m15-m5-continuation-v233-${{ matrix.year }}.json
            artifacts/xau-v233-price-provenance-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: replay-year
    if: always() && needs.replay-year.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XAU_V233_CONTINUATION_DIR: /tmp/v233-cont
      XAU_V233_V230_DIR: /tmp/v230-shards
      XAU_V233_FULL_OUTPUT: artifacts/xau-h4-h1-m15-m5-portfolio-v233-full.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download V233 continuation shards
        uses: actions/download-artifact@v4
        with:
          pattern: xau-v233-year-*
          path: /tmp/v233-cont
          merge-multiple: false
      - name: Download frozen V230 reversal shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36230335879
          pattern: xau-v230-year-*
          path: /tmp/v230-shards
          merge-multiple: false
      - name: Aggregate V233 portfolio
        run: python -m fx_scanner.research_xau_h4_h1_m15_m5_portfolio_v233_aggregate
      - name: Upload V233 full result
        uses: actions/upload-artifact@v4
        with:
          name: xau-h4-h1-m15-m5-portfolio-v233-full
          path: artifacts/xau-h4-h1-m15-m5-portfolio-v233-full.json
          if-no-files-found: error
          retention-days: 30
