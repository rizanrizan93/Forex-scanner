name: R7.1 Nested Official Treasury and Broker Dollar History Research
on:
  push:
    branches: ['research/r71-regime-pit-20261121']
    paths:
      - '.github/workflows/r71_official_treasury_dollar_nested.yml'
      - 'src/fx_scanner/fed_r71_official_treasury_dollar.py'
      - 'src/fx_scanner/fed_r71_treasury_dollar_runner.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: 'src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      R71_ORIGINAL_SHARDS: '/tmp/r71-original'
      R71_DUKA_REPAIR: '/tmp/r71-repaired'
      R71_DOLLAR_ROOT: '/tmp/r71-dollar'
      R71_TREASURY_ROOT: '/tmp/r71-treasury'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deterministic numpy and pandas
        run: python -m pip install numpy pandas==2.2.3
      - name: Original 2018 XAU price shard
        uses: actions/download-artifact@v4
        with:
          name: r7-xau-price-2018
          path: /tmp/r71-original/2018
          run-id: 44759599059
          github-token: ${{ github.token }}
      - name: Original 2019 XAU price shard
        uses: actions/download-artifact@v4
        with:
          name: r7-xau-price-2019
          path: /tmp/r71-original/2019
          run-id: 44759599059
          github-token: ${{ github.token }}
      - name: Original 2020 XAU price shard
        uses: actions/download-artifact@v4
        with:
          name: r7-xau-price-2020
          path: /tmp/r71-original/2020
          run-id: 44759599059
          github-token: ${{ github.token }}
      - name: Original 2021 XAU price shard
        uses: actions/download-artifact@v4
        with:
          name: r7-xau-price-2021
          path: /tmp/r71-original/2021
          run-id: 44759599059
          github-token: ${{ github.token }}
      - name: Original 2022 XAU price shard
        uses: actions/download-artifact@v4
        with:
          name: r7-xau-price-2022
          path: /tmp/r71-original/2022
          run-id: 44759599059
          github-token: ${{ github.token }}
      - name: Original 2023 XAU price shard
        uses: actions/download-artifact@v4
        with:
          name: r7-xau-price-2023
          path: /tmp/r71-original/2023
          run-id: 44759599059
          github-token: ${{ github.token }}
      - name: Original 2024 XAU price shard
        uses: actions/download-artifact@v4
        with:
          name: r7-xau-price-2024
          path: /tmp/r71-original/2024
          run-id: 44759599059
          github-token: ${{ github.token }}
      - name: Repaired independent XAU 2023 price source
        uses: actions/download-artifact@v4
        with:
          name: r71-repaired-independent-dukas-2023
          path: /tmp/r71-repaired
          run-id: 44831450440
          github-token: ${{ github.token }}
      - name: All 2018-2024 hourly dollar index quotes from independent CFD vendor
        uses: actions/download-artifact@v4
        with:
          pattern: r71-duka-dollar-idx-h1-*
          path: /tmp/r71-dollar
          merge-multiple: false
          run-id: 44831876236
          github-token: ${{ github.token }}
      - name: Verified original Treasury nominal and real yield archives
        uses: actions/download-artifact@v4
        with:
          name: r71-treasury-nominal-real-2018-2024-original
          path: /tmp/r71-treasury
          run-id: 44831912361
          github-token: ${{ github.token }}
      - name: Compare nested development folds with official yield observations and broker USD
        run: python -m fx_scanner.fed_r71_treasury_dollar_runner
      - name: Store empirical results and full original-source checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r71-original-official-treasury-and-broker-dollar-nested-results
          path: artifacts/r71-official-treasury-dollar-nested.json
          if-no-files-found: warn
          retention-days: 30
