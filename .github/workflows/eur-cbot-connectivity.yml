name: EUR cBot Connectivity
on:
  push:
    branches: [main]
    paths: ['cbot_connectivity/eur-batch-v1.1.0/**', 'cbot_bridge/**', '.github/workflows/eur-cbot-connectivity.yml']
  pull_request:
    paths: ['cbot_connectivity/eur-batch-v1.1.0/**', 'cbot_bridge/**', '.github/workflows/eur-cbot-connectivity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - run: python -m pip install -r cbot_bridge/requirements.txt
      - run: python cbot_connectivity/eur-batch-v1.1.0/verify_scope.py
      - run: python -m unittest discover -s cbot_bridge -p 'test_*.py' -v
      - run: dotnet run --project cbot_connectivity/eur-batch-v1.1.0/tests/RuntimeTests.csproj
      - run: dotnet run --project cbot_connectivity/eur-batch-v1.1.0/tests/PlannerTests.csproj
      - run: dotnet run --project cbot_connectivity/eur-batch-v1.1.0/ConnectivityTests.csproj
      - name: Build native cTrader EUR release
        run: dotnet build cbot_connectivity/eur-batch-v1.1.0/source/RizanEURBatch/RizanEURBatch/RizanEURBatch.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: RizanEURBatch-v1.1.0-bridgefix
          path: cbot_connectivity/eur-batch-v1.1.0/source/RizanEURBatch/RizanEURBatch/bin/Release/net6.0/*.algo
