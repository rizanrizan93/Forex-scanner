name: R28.1 reconstructed inference replay parity (research only)
on:
  push:
    branches: ['research/r281-direction-inference-parity-20261123']
    paths:
      - 'scripts/r281_live_shadow_parity.py'
      - 'scripts/r281_live_market.py'
      - 'tests/test_r281_live_shadow_parity.py'
      - 'tests/test_r281_live_market.py'
      - '.github/workflows/r281_live_shadow_parity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r281-parity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tf: ['1h','4h','1D','1W']
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay-compatible research dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl joblib pytest
      - name: Check policy schema and replay selection
        run: python -m pytest -q tests/test_r281_live_shadow_parity.py tests/test_r281_live_market.py
      - name: Download immutable ECB source
        uses: actions/download-artifact@v4
        with:
          run-id: 44970328847
          github-token: ${{ github.token }}
          name: r281-ecb
          path: /tmp/r281
      - name: Download immutable R10 H1/H4 candles
        if: ${{ matrix.tf == '1h' || matrix.tf == '4h' }}
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Download immutable R9.8 daily candles
        if: ${{ matrix.tf == '1D' || matrix.tf == '1W' }}
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Refit immutable selected 2025 policy and require exact sample parity
        env:
          TF: ${{ matrix.tf }}
        run: python scripts/r281_live_shadow_parity.py --tf "$TF"
      - name: Retain research proof and reconstructed fitted model (no orders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r281-parity-${{ matrix.tf }}
          path: artifacts/r281_inference/*
          retention-days: 30
          if-no-files-found: warn
