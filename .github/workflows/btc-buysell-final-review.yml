name: BTC BUY SELL independent final review
on:
  push:
    branches: [research/btc-buysell-dd56-600k-2019-2026]
    paths: [.github/workflows/btc-buysell-final-review.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  final-review:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas==2.2.3 numpy matplotlib tabulate
      - name: Wait for checkpoint recovery and primary audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PY'
          import urllib.request,json,time,os
          url='https://api.github.com/repos/rizanrizan93/Forex-scanner/actions/runs/39335312836'
          for i in range(260):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response:r=json.load(response)
              if r['status']=='completed':
                  assert r['conclusion']=='success',r['conclusion']
                  print('PRIMARY_AUDIT_SUCCESS',r['head_sha']);break
              if i%4==0:print('Waiting for recovery/audit:',r['status'],flush=True)
              time.sleep(30)
          else:raise RuntimeError('Primary audit wait timeout')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-BTC-BUYSELL-DD56-600K-AUDITED
          run-id: 39335312836
          github-token: ${{ github.token }}
          path: downloaded
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-BTCUSD-EXTENDED-INPUT-2019-OCT2026
          run-id: 39212036090
          github-token: ${{ github.token }}
          path: source
      - name: Verify package and independent replay then enrich report
        run: |
          set -euo pipefail
          gzip -dk source/data/BTCUSD_M1.csv.gz
          python -u research_btc_jpy/finalize_btc_both_review.py
      - name: Save reviewed package to isolated research VPS folders
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/hosts"
          chmod 600 "$d/key" "$d/hosts"
          opts=(-i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=30)
          for suffix in run-39273886250 review-$GITHUB_RUN_ID; do
            dest="/home/Rizanrizan/rizan-ticks/REPLAY_RESULTS/btc-buysell-dd56-600k-2019-oct2026/$suffix"
            ssh "${opts[@]}" Rizanrizan@202.74.74.172 "umask 077; mkdir -p '$dest'"
            scp -l 24000 "${opts[@]}" review/*.zip review/*.md review/*STATUS.json review/PACKAGE_SHA256.txt "Rizanrizan@202.74.74.172:$dest/"
            printf '%s\n' "$dest" >> review/VPS_VERIFICATION.txt
            ssh "${opts[@]}" Rizanrizan@202.74.74.172 "cd '$dest' && nice -n 15 ionice -c3 sha256sum -c PACKAGE_SHA256.txt" >> review/VPS_VERIFICATION.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-BTC-BUYSELL-DD56-600K-INDEPENDENT-REVIEW
          path: |
            review/*.zip
            review/*.md
            review/*.json
            review/*.csv
            review/*.txt
            review/*.png
            review/independent/*.json
          retention-days: 90
          compression-level: 1
