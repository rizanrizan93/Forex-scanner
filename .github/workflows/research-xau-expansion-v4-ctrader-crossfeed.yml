name: Research XAU Expansion V4 cTrader Crossfeed

on:
  push:
    branches:
      - research/market-adaptive-router-v4
    paths:
      - "research/adaptive_xau_expansion_v4_ctrader_crossfeed.py"
      - "research/adaptive_xau_expansion_v4_walkforward.py"
      - ".github/workflows/research-xau-expansion-v4-ctrader-crossfeed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-xau-expansion-v4-ctrader-crossfeed
  cancel-in-progress: true

jobs:
  crossfeed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate demo-only config
        run: python -m fx_scanner.cli validate-config
      - name: Run V4 broker-native crossfeed
        shell: bash
        env:
          PYTHONPATH: src:research
        run: |
          set -euo pipefail
          python research/adaptive_xau_expansion_v4_ctrader_crossfeed.py | tee xau_expansion_v4_ctrader_crossfeed.json
      - name: Print compact evidence
        run: grep -E '^(PRIMARY_PASS|BOUNDARY)' xau_expansion_v4_ctrader_crossfeed.json
      - uses: actions/upload-artifact@v4
        with:
          name: xau-expansion-v4-ctrader-crossfeed
          path: xau_expansion_v4_ctrader_crossfeed.json
          if-no-files-found: error
