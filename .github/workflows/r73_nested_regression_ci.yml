name: R7.3 Fed FOMC COT Nested Research Regression (No Orders)
on:
  push:
    branches: ['research/r73-fed-fomc-liquidity-20261121']
    paths:
      - 'src/fx_scanner/fed_r73_official_policy_cot_panel.py'
      - 'src/fx_scanner/fed_r73_nested_matched_ablation.py'
      - 'src/fx_scanner/fed_r73_fomc_surprise_gate.py'
      - 'src/fx_scanner/fed_r73_research_runner.py'
      - 'tests/test_fed_r73_nested_macro.py'
      - '.github/workflows/r73_nested_regression_ci.yml'
  pull_request:
    paths:
      - 'src/fx_scanner/fed_r73_official_policy_cot_panel.py'
      - 'src/fx_scanner/fed_r73_nested_matched_ablation.py'
      - 'src/fx_scanner/fed_r73_fomc_surprise_gate.py'
      - 'src/fx_scanner/fed_r73_research_runner.py'
      - 'tests/test_fed_r73_nested_macro.py'
      - '.github/workflows/r73_nested_regression_ci.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deterministic numeric tests
        run: python -m pip install numpy pandas==2.2.3 pytest==9.0.2
      - name: Compile factors and validate nested PIT/leakage gates
        run: |
          python -m py_compile src/fx_scanner/fed_r73_official_policy_cot_panel.py src/fx_scanner/fed_r73_nested_matched_ablation.py src/fx_scanner/fed_r73_fomc_surprise_gate.py src/fx_scanner/fed_r73_research_runner.py
          python -m pytest -q tests/test_fed_r73_nested_macro.py tests/test_fed_r71_regime_pit.py tests/test_fed_r71_forward_shadow_gate.py
