name: XAU Analog Path Forecast V168

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_analog_path_forecast_v168.py"
      - "src/fx_scanner/research_xau_analog_path_forecast_v168_runtime.py"
      - "tests/test_research_xau_analog_path_forecast_v168.py"
      - ".github/workflows/research-xau-analog-path-forecast-v168.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-analog-path-forecast-v168-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analog-v168:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      XAU_ANALOG_PATH_V168_EVIDENCE_OUTPUT: artifacts/xau-analog-path-forecast-v168.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit test V168
        run: pytest -q tests/test_research_xau_analog_path_forecast_v168.py
      - name: Run 100k-bar prequential analog forecast
        run: python -m fx_scanner.research_xau_analog_path_forecast_v168_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-analog-path-forecast-v168
          path: artifacts/xau-analog-path-forecast-v168.json
          if-no-files-found: error
          retention-days: 30
