name: R29.6 H4 BUY Historical Coverage Frozen and Live Broker Parity
on:
  push:
    branches: ['research/r296-r291-h4-coverage-frozen-20261123']
    paths:
      - 'scripts/r296_h4_coverage_live_shadow.py'
      - 'scripts/r296_publish_gate.py'
      - 'tests/test_r296_h4_coverage_shadow.py'
      - '.github/workflows/r296_h4_coverage_broker_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r296-r291-h4-coverage-frozen-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl pytest==9.0.2
      - name: Verify frozen SHA and fail-closed research publisher contracts
        run: python -m pytest -q tests/test_r296_h4_coverage_shadow.py
      - name: Download immutable XAU H1/H4 archive for original model refit
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Prove exact original 2025 and 2026 annual model validation and evaluation
        run: |
          python - <<'PY'
          import r296_h4_coverage_live_shadow as r
          for year in ("2025","2026"):
              _,proof=r.train_historical(year)
              assert proof["validation"]==r.EXPECTED[year]["validation"]
              assert proof["original_evaluation"]==r.EXPECTED[year]["evaluation"]
              print("R296_FROZEN_PARITY_PASS",year,proof["policy"],
                    "2026 carry:",proof["carry_2026_diagnostic"])
          PY
      - name: Evaluate both frozen models on fresh CLOSED cTrader H4 data
        run: python scripts/r296_h4_coverage_live_shadow.py
      - name: Verify broker age, H4 target and independent score+gate on both lanes
        run: python scripts/r296_publish_gate.py
      - name: Archive model proof (read-only, not LIVE orders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r296-original-h4-coverage-model-proof
          path: runtime/r296-h4-buy-coverage-shadow.json
          retention-days: 30
          if-no-files-found: warn
