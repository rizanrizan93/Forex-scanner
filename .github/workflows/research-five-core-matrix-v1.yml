name: Research Five Core Matrix V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/five-core-tournament-v1
    paths:
      - 'research/five_core_tournament_v1.py'
      - 'research/five_core_single_symbol_v1.py'
      - '.github/workflows/research-five-core-matrix-v1.yml'

permissions:
  contents: read

jobs:
  instrument:
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAUUSD, EURUSD, GBPUSD, USDJPY, AUDUSD]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CORE_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1
      - name: Run frozen tournament for one instrument
        run: |
          rm -rf research_output_five_core_v1
          mkdir -p research_output_five_core_v1
          python research/five_core_single_symbol_v1.py | tee research_output_five_core_v1/console-${CORE_SYMBOL}.txt
      - name: Verify isolated contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('research_output_five_core_v1/five_core_tournament_v1.json').read_text())
          s = os.environ['CORE_SYMBOL']
          assert d['contract'] == 'FIVE_CORE_TOURNAMENT_V1'
          assert d['execution_influence'] is False
          assert d['universe'] == [s]
          assert list(d['scorecard']) == [s]
          assert d['coverage'][s]['h1_rows'] >= 40000
          assert d['coverage'][s]['m15_rows'] >= 80000
          print(s, 'isolated five-core contract: PASS')
          PY
      - name: Upload instrument evidence
        uses: actions/upload-artifact@v4
        with:
          name: five-core-${{ matrix.symbol }}-v1
          path: research_output_five_core_v1/
          retention-days: 30
