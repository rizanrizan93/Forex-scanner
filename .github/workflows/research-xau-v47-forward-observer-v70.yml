name: XAU V47 Forward Observer V70

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v47_forward_observer_v70.py"
      - "src/fx_scanner/research_xau_v47_forward_freeze_v69.py"
      - "tests/test_research_xau_v47_forward_observer_v70.py"
      - ".github/workflows/research-xau-v47-forward-observer-v70.yml"
  schedule:
    - cron: "*/5 * * * 1-5"

permissions:
  contents: read

concurrency:
  group: xau-v47-forward-observer-v70
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      V70_EVIDENCE_OUTPUT: artifacts/xau-v47-forward-observer-v70.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v47_forward_observer_v70.py
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Record prospective V47 context with zero broker authority
        run: python -m fx_scanner.research_xau_v47_forward_observer_v70
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-v47-forward-observer-v70
          path: artifacts/xau-v47-forward-observer-v70.json
          if-no-files-found: error
          retention-days: 30
