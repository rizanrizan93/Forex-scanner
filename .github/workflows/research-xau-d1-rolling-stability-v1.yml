name: Research XAU D1 Rolling Stability V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/xau-rolling-stability-v1
    paths:
      - 'research/xau_d1_rolling_stability_v1.py'
      - 'research/xau_d1_boundary_sensitivity_v1.py'
      - '.github/workflows/research-xau-d1-rolling-stability-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1
      - name: Run preregistered rolling stability gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research_output_xau_rolling_stability_v1
          mkdir -p research_output_xau_rolling_stability_v1
          python research/xau_d1_rolling_stability_v1.py | tee research_output_xau_rolling_stability_v1/console.txt
      - name: Verify immutable research contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research_output_xau_rolling_stability_v1/xau_d1_rolling_stability_v1.json')
          d = json.loads(p.read_text())
          assert d['contract'] == 'XAU_D1_ROLLING_STABILITY_V1'
          assert d['execution_influence'] is False
          assert d['symbol'] == 'XAUUSD'
          assert d['strategy'] == 'D1_TSMOM_60_200'
          assert d['boundary'] == '17:00 America/New_York DST-aware'
          assert d['minimum_trades'] == {'3Y': 30, '5Y': 50}
          assert d['frozen_parameters']['stop_atr'] == 2.0
          assert d['frozen_parameters']['target_atr'] == 4.0
          assert d['frozen_parameters']['max_hold_d1'] == 30
          assert set(d['by_cost']) == {'base_0.17_usd', 'stress_0.35_usd'}
          print('XAU rolling stability immutable research contract: PASS')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-d1-rolling-stability-v1
          path: research_output_xau_rolling_stability_v1/
          retention-days: 30
