name: cTrader XAU M5 Confirmation V6

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_m5_confirmation_v6.py"
      - "src/fx_scanner/research_xau_m5_confirmation_v6_runtime.py"
      - "src/fx_scanner/research_xau_m5_history.py"
      - "config/validation.yaml"
      - ".github/workflows/ctrader-xau-m5-confirmation-v6.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-xau-m5-confirmation-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xau-m5-confirmation-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      XAU_M5_CONFIRMATION_V6_EVIDENCE_OUTPUT: artifacts/xau-m5-confirmation-v6.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Run H1-M15-M5 XAU confirmation V6 on 300k closed M5 bars
        run: python -m fx_scanner.research_xau_m5_confirmation_v6_runtime
      - name: Upload XAU M5 confirmation V6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-m5-confirmation-v6
          path: artifacts/xau-m5-confirmation-v6.json
          if-no-files-found: error
          retention-days: 30
