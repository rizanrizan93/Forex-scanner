name: R29.2 Precision vs Coverage XAU Direction Walk Forward (Research Only)
on:
  push:
    branches: ['research/r292-precision-coverage-expansion-20261123']
    paths:
      - 'scripts/r292_magnitude_regime_expansion.py'
      - 'tests/test_r292_magnitude_regime_expansion.py'
      - '.github/workflows/r292_magnitude_regime_expansion.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r292-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    name: Anti-leakage and no-trade contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r292-precision-coverage-expansion-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only research dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl pytest==9.0.2
      - name: Check causal features, validation-only objectives and safety
        run: python -m pytest -q tests/test_r29_direction60_walkforward.py tests/test_r291_event_structure_direction.py tests/test_r292_magnitude_regime_expansion.py
      - name: Compile isolated research module
        run: python -m py_compile scripts/r292_magnitude_regime_expansion.py
  explore:
    name: R29.2 ${{ matrix.tf }} / ${{ matrix.variant }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        tf: ['1h','4h','1D']
        variant: ['precision','balanced']
    env:
      PYTHONPATH: 'scripts:src:.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout immutable R29.2 branch (never LIVE)
        uses: actions/checkout@v4
        with:
          ref: research/r292-precision-coverage-expansion-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical study dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - name: Retrieve original 2019–2026 H1/H4 evidence
        if: matrix.tf == '1h' || matrix.tf == '4h'
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Retrieve original D1 2012–2026 evidence
        if: matrix.tf == '1D'
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Run independent side, validation-selected precision/coverage configuration
        run: python scripts/r292_magnitude_regime_expansion.py --tf "${{ matrix.tf }}" --variant "${{ matrix.variant }}"
      - name: Archive full annual, direction, sample, cost and coverage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r292-${{ matrix.variant }}-${{ matrix.tf }}
          path: artifacts/r292-${{ matrix.variant }}-${{ matrix.tf }}.json
          if-no-files-found: warn
          retention-days: 90
