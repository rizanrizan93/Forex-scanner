name: V6 native PDS entry and capacity reconciliation
on:
  push:
    branches: ['research/v5-native-growth-optimization-20261124']
    paths: ['.github/workflows/v6-pds-interference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 994d68edc9bb87e5c1e57997a65be18873af84b8
          path: evidence
          persist-credentials: false
      - run: python research/v5_native_growth/audit_pds_interference.py evidence/research/r15_frozen_shared_replay/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: v6-pds-interference
          path: pds_interference.json
          if-no-files-found: error
