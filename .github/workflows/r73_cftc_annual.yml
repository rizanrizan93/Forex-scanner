name: R7.3 Official CFTC Gold COT 2018-2024 Archive (Research Only)
on:
  push:
    branches: ['research/r73-fed-fomc-liquidity-20261121']
    paths: ['.github/workflows/r73_cftc_annual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cftc_gold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2018,2019,2020,2021,2022,2023,2024]
    env:
      YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pandas for official CFTC source validation
        run: python -m pip install pandas==2.2.3
      - name: Retrieve officially published annual disaggregated futures-only report
        run: |
          python - <<'PY'
          import os,hashlib,zipfile,io,json
          from urllib.request import urlopen,Request
          from pathlib import Path
          import pandas as pd
          y=int(os.environ["YEAR"])
          u=f"https://www.cftc.gov/files/dea/history/fut_disagg_txt_{y}.zip"
          with urlopen(Request(u,headers={"User-Agent":"RIZAN-R73-CFTC-Source-Audit/1.0"}),timeout=45) as r:
            blob=r.read(6_000_001)
          if not 20000<len(blob)<6_000_000:raise SystemExit("BAD_CFTC_SOURCE_SIZE")
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
            names=[n for n in z.namelist() if n.lower().endswith((".txt",".csv"))]
            if len(names)!=1:raise SystemExit("MULTIPLE_OR_NO_CFTC_CSV")
            raw=z.read(names[0])
            data=pd.read_csv(io.BytesIO(raw),low_memory=False)
          required={
            "Market_and_Exchange_Names","CFTC_Contract_Market_Code",
            "Report_Date_as_YYYY-MM-DD","M_Money_Positions_Long_All",
            "M_Money_Positions_Short_All","Open_Interest_All"}
          if not required.issubset(data.columns):raise SystemExit("CFTC_SCHEMA_CHANGED")
          gold=data[data.CFTC_Contract_Market_Code.astype(str).str.strip()=="088691"].copy()
          dates=pd.to_datetime(gold["Report_Date_as_YYYY-MM-DD"],errors="raise")
          if len(gold)<45 or len(gold)>75 or not (dates.dt.year==y).all():
            raise SystemExit(f"CFTC_GOLD_YEAR_RANGE_UNEXPECTED:{y}:{len(gold)}")
          if dates.duplicated().any():raise SystemExit("GOLD_REPORT_DUPLICATE_DATE")
          out=Path("artifacts/r73-cftc-source");out.mkdir(parents=True,exist_ok=True)
          fn=out/f"cftc-gold-disagg-futures-only-{y}.zip";fn.write_bytes(blob)
          meta={"year":y,"source_url":u,"raw_zip_sha256":hashlib.sha256(blob).hexdigest(),
                "source_file":names[0],"csv_sha256":hashlib.sha256(raw).hexdigest(),
                "official_gold_contract_code":"088691","valid_gold_weeks":len(gold),
                "first_report":str(dates.min().date()),"last_report":str(dates.max().date()),
                "historical_original_release_receipts_verified":False,
                "research_only":True}
          fn.with_suffix(".json").write_text(json.dumps(meta,sort_keys=True,indent=2))
          print("R73_CFTC_ARCHIVED",json.dumps(meta,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r73-cftc-gold-${{ matrix.year }}
          path: artifacts/r73-cftc-source/*
          if-no-files-found: error
          retention-days: 30
