name: RIZAN portable verified research archives
on:
  push:
    branches: [research/btcusd-usdjpy-million-2019-2026]
    paths: [.github/workflows/btcusd-usdjpy-portable-verified.yml]
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas==2.2.3 numpy
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-BTCUSD-USDJPY-DEFINITIVE-2019-2026
          run-id: 39217369074
          github-token: ${{ github.token }}
          path: original
      - name: Verify original archive hashes before compacting
        run: |
          set -euo pipefail
          cd original
          sha256sum -c PACKAGE_SHA256.txt
      - name: Create strict JSON and independently hashed portable archives
        run: python -u research_btc_jpy/compact_verified.py
      - name: Persist portable reports and charts to same isolated VPS folder
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/hosts"
          chmod 600 "$d/key" "$d/hosts"
          dest='/home/Rizanrizan/rizan-ticks/REPLAY_RESULTS/btcusd-usdjpy-million-2019-oct2026/final-39217369074/portable'
          opts=(-i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=30)
          ssh "${opts[@]}" Rizanrizan@202.74.74.172 "umask 077; mkdir -p '$dest'"
          scp -l 24000 "${opts[@]}" compact/* "Rizanrizan@202.74.74.172:$dest/"
          ssh "${opts[@]}" Rizanrizan@202.74.74.172 "cd '$dest' && nice -n 15 ionice -c3 sha256sum -c COMPACT_SHA256.txt" > compact/VPS_PORTABLE_VERIFICATION.txt
      - name: Publish small review files and charts on research branch
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,json,base64,subprocess
          for p in pathlib.Path('compact').iterdir():
            if p.suffix not in ['.json','.md','.png','.txt']:continue
            path='research_results/btcusd-usdjpy-2019-oct2026/portable/'+p.name
            branch='research/btcusd-usdjpy-million-2019-2026'
            old=subprocess.run(['gh','api','repos/rizanrizan93/Forex-scanner/contents/'+path+'?ref='+branch],capture_output=True,text=True)
            b={'message':'research: publish portable verified '+p.name,'branch':branch,'content':base64.b64encode(p.read_bytes()).decode()}
            if old.returncode==0:b['sha']=json.loads(old.stdout)['sha']
            f=pathlib.Path('/tmp/portable_payload.json');f.write_text(json.dumps(b))
            subprocess.run(['gh','api','--method','PUT','repos/rizanrizan93/Forex-scanner/contents/'+path,'--input',str(f),'--silent'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-PORTABLE-VERIFIED-2019-2026
          path: compact/
          compression-level: 1
          retention-days: 90
