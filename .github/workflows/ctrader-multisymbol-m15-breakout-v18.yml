name: cTrader MultiSymbol M15 Breakout V18

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_multisymbol_m15_breakout_v18.py"
      - "src/fx_scanner/research_multisymbol_m15_breakout_v18_runtime.py"
      - "config/validation.yaml"
      - "tests/test_research_multisymbol_m15_breakout_v18.py"
      - ".github/workflows/ctrader-multisymbol-m15-breakout-v18.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-multisymbol-m15-breakout-v18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multisymbol-m15-breakout-v18:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      V18_EVIDENCE_OUTPUT: artifacts/multisymbol-m15-breakout-v18.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit tests
        run: pytest -q tests/test_research_multisymbol_m15_breakout_v18.py
      - name: Run multi-symbol M15 breakout research
        run: python -m fx_scanner.research_multisymbol_m15_breakout_v18_runtime
      - name: Upload V18 evidence
        uses: actions/upload-artifact@v4
        with:
          name: multisymbol-m15-breakout-v18
          path: artifacts/multisymbol-m15-breakout-v18.json
          if-no-files-found: error
          retention-days: 30
