name: R31.1 XAU Extended 2012-2026 Higher Net Profit Exploratory Holds
on:
  push:
    branches: ['research/r31-net-profit-max-2012-2026-20261123']
    paths:
      - 'scripts/r311_extended_holds.py'
      - '.github/workflows/r311_extended_holds.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl pytest==9.0.2
      - name: Validate bounded extended-hold menu and research-only source
        run: |
          python -m py_compile scripts/r311_extended_holds.py
          python -m pytest -q tests/test_r31_profit_grid.py
          PYTHONPATH=scripts:src:. python - <<'PY'
          import r311_extended_holds as r
          assert r.EXTRA=={"1W":(3,4,6,8),"1D":(3,5),"4h":(4,6)}
          assert r.STUDY.startswith("RIZAN_R311_")
          PY
  study:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {tf: '1W', hold: 3, mode: 'max_net'}
          - {tf: '1W', hold: 3, mode: 'net_dd'}
          - {tf: '1W', hold: 3, mode: 'profit_frequency'}
          - {tf: '1W', hold: 4, mode: 'max_net'}
          - {tf: '1W', hold: 4, mode: 'net_dd'}
          - {tf: '1W', hold: 4, mode: 'profit_frequency'}
          - {tf: '1W', hold: 6, mode: 'max_net'}
          - {tf: '1W', hold: 6, mode: 'net_dd'}
          - {tf: '1W', hold: 6, mode: 'profit_frequency'}
          - {tf: '1W', hold: 8, mode: 'max_net'}
          - {tf: '1W', hold: 8, mode: 'net_dd'}
          - {tf: '1W', hold: 8, mode: 'profit_frequency'}
          - {tf: '1D', hold: 3, mode: 'max_net'}
          - {tf: '1D', hold: 3, mode: 'net_dd'}
          - {tf: '1D', hold: 3, mode: 'profit_frequency'}
          - {tf: '1D', hold: 5, mode: 'max_net'}
          - {tf: '1D', hold: 5, mode: 'net_dd'}
          - {tf: '1D', hold: 5, mode: 'profit_frequency'}
          - {tf: '4h', hold: 4, mode: 'max_net'}
          - {tf: '4h', hold: 4, mode: 'net_dd'}
          - {tf: '4h', hold: 4, mode: 'profit_frequency'}
          - {tf: '4h', hold: 6, mode: 'max_net'}
          - {tf: '4h', hold: 6, mode: 'net_dd'}
          - {tf: '4h', hold: 6, mode: 'profit_frequency'}
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    name: Extended ${{ matrix.tf }} H${{ matrix.hold }} ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - uses: actions/download-artifact@v4
        if: matrix.tf == '4h'
        with:
          run-id: 45183311130
          github-token: ${{ github.token }}
          pattern: r30-hf-yr-*
          path: /tmp/r30_early
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: matrix.tf == '4h'
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: matrix.tf == '1D' || matrix.tf == '1W'
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Conduct fully nonoverlapping prior-two-year selected next-open research
        run: python scripts/r311_extended_holds.py --tf "${{ matrix.tf }}" --hold "${{ matrix.hold }}" --mode "${{ matrix.mode }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r311-${{ matrix.tf }}-h${{ matrix.hold }}-${{ matrix.mode }}
          path: artifacts/r311/r311-${{ matrix.tf }}-h${{ matrix.hold }}-${{ matrix.mode }}.json
          retention-days: 90
          if-no-files-found: warn
  baseline:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        tf: ['1W','1D','4h']
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    name: Extended unoptimized baseline ${{ matrix.tf }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - uses: actions/download-artifact@v4
        if: matrix.tf == '4h'
        with:
          run-id: 45183311130
          github-token: ${{ github.token }}
          pattern: r30-hf-yr-*
          path: /tmp/r30_early
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: matrix.tf == '4h'
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: matrix.tf == '1D' || matrix.tf == '1W'
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Equal duration EMA/always long-short baseline without optimization
        run: python scripts/r311_extended_holds.py --tf "${{ matrix.tf }}" --mode baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r311-baseline-${{ matrix.tf }}
          path: artifacts/r311/r311-baseline-${{ matrix.tf }}.json
          retention-days: 90
          if-no-files-found: warn
