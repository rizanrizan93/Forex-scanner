name: XAU Reversal Scanner Read Only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/run_reversal_feed.py
      - scripts/publish_reversal_snapshot.py
      - src/fx_scanner/manual_reversal_dashboard.py
      - src/fx_scanner/reversal_scanner.py
      - src/fx_scanner/manual_reversal_map.py
      - src/fx_scanner/zone_v05*.py
      - calibration/reversal_10m_results.json
      - .github/workflows/reversal-scanner-readonly.yml
  schedule:
    - cron: '17 * * * 0-5'
permissions:
  contents: write
concurrency:
  group: xau-reversal-readonly
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  scanner:
    if: github.repository == 'rizanrizan93/Forex-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 pandas==2.2.3 ctrader-open-api==0.9.2 service-identity==24.2.0
      - name: Publish read-only XAU geometry every five minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The publisher validates the read-only and freshness contracts;
        # only runtime/reversal_snapshot.json, runtime/manual_reversal_snapshot.json
        # and runtime/zone_v05_snapshot.json
        # are written on scanner-reversal-snapshots.
        run: python -u scripts/run_reversal_feed.py
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-readonly-snapshot
          path: |
            artifacts/reversal_snapshot.json
            artifacts/manual_reversal_snapshot.json
            artifacts/zone_v05_snapshot.json
          # Market closed: intentionally no fresh publication, not a job failure.
          if-no-files-found: ignore
          retention-days: 7
