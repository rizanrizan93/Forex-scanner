name: XAU Reversal Scanner Read Only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/publish_reversal_snapshot.py
      - src/fx_scanner/reversal_scanner.py
      - src/fx_scanner/manual_reversal_map.py
      - calibration/reversal_10m_results.json
      - .github/workflows/reversal-scanner-readonly.yml
  schedule:
    - cron: '*/5 * * * 1-5'
permissions:
  contents: write
concurrency:
  group: xau-reversal-readonly
  cancel-in-progress: false
jobs:
  scanner:
    if: github.repository == 'rizanrizan93/Forex-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 pandas==2.2.3 ctrader-open-api==0.9.2 service-identity==24.2.0
      - name: Collect XAU market bars without order APIs
        run: python scripts/publish_reversal_snapshot.py artifacts/reversal_snapshot.json
      - name: Publish only sanitized scanner geometry to isolated branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('artifacts/reversal_snapshot.json','utf8'));
            const manual = JSON.parse(fs.readFileSync('artifacts/manual_reversal_snapshot.json','utf8'));
            for (const item of [data, manual]) {
              if (item.execution_authority !== false || item.execution_influence !== false || item.symbol !== 'XAUUSD') throw Error('read-only guard');
            }
            if (manual.contract !== 'RIZAN_XAU_MANUAL_REVERSAL_MAP_V2') throw Error('manual contract guard');
            const {owner, repo} = context.repo;
            const branch = 'scanner-reversal-snapshots';
            let parent, exists = true;
            try { parent = (await github.rest.git.getRef({owner,repo,ref:'heads/'+branch})).data.object.sha; }
            catch(e) { if(e.status!==404) throw e; exists=false; parent=context.sha; }
            const tree = await github.rest.git.createTree({owner,repo,base_tree:parent,tree:[{path:'runtime/reversal_snapshot.json',mode:'100644',type:'blob',content:JSON.stringify(data)},{path:'runtime/manual_reversal_snapshot.json',mode:'100644',type:'blob',content:JSON.stringify(manual)}]});
            const commit = await github.rest.git.createCommit({owner,repo,message:'scanner: read-only XAU reversal map',tree:tree.data.sha,parents:[parent]});
            if (exists) await github.rest.git.updateRef({owner,repo,ref:'heads/'+branch,sha:commit.data.sha,force:false});
            else await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branch,sha:commit.data.sha});
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-readonly-snapshot
          path: |
            artifacts/reversal_snapshot.json
            artifacts/manual_reversal_snapshot.json
          if-no-files-found: error
          retention-days: 7
