name: cTrader Demo Broker Risk Probe

on:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/demo_broker_risk_sizing.py"
      - "src/fx_scanner/demo_broker_risk_probe.py"
      - ".github/workflows/ctrader-demo-broker-risk-probe.yml"
      - "requirements-research-cloud.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctrader-demo-broker-risk-probe
  cancel-in-progress: false

jobs:
  no-order-risk-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate no-order broker-native risk path
        run: python -m fx_scanner.demo_broker_risk_probe
