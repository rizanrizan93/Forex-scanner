name: cTrader XAU Canonical Replay V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_canonical_replay_v1.py"
      - "src/fx_scanner/research_xau_canonical_replay_v1_runtime.py"
      - "src/fx_scanner/demo_xau_m15_ema_smc_reclaim.py"
      - "src/fx_scanner/demo_xau_m15_ema_smc_reclaim_execution.py"
      - "src/fx_scanner/demo_xau_m15_canonical_policy.py"
      - "src/fx_scanner/demo_xau_m15_ict_layer.py"
      - "config/validation.yaml"
      - ".github/workflows/ctrader-xau-canonical-replay-v1.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-xau-canonical-replay-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      XAU_CANONICAL_REPLAY_EVIDENCE_OUTPUT: artifacts/xau-canonical-replay-v1.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Replay current canonical XAU strategy on 50k closed M15 bars
        run: python -m fx_scanner.research_xau_canonical_replay_v1_runtime
      - name: Upload canonical replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-canonical-replay-v1
          path: artifacts/xau-canonical-replay-v1.json
          if-no-files-found: error
          retention-days: 30
