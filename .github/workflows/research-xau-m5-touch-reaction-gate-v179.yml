name: XAU M5 Touch Reaction Gate V179

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_m5_touch_reaction_gate_v179.py"
      - "src/fx_scanner/research_xau_m5_touch_reaction_gate_v179_runtime.py"
      - ".github/workflows/research-xau-m5-touch-reaction-gate-v179.yml"
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_m5_touch_reaction_gate_v179.py"
      - "src/fx_scanner/research_xau_m5_touch_reaction_gate_v179_runtime.py"
      - "tests/test_research_xau_m5_touch_reaction_gate_v179.py"
      - ".github/workflows/research-xau-m5-touch-reaction-gate-v179.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-m5-touch-reaction-gate-v179
  cancel-in-progress: true

jobs:
  m5-touch-reaction-v179:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      XAU_M5_TOUCH_REACTION_GATE_V179_OUTPUT: artifacts/xau-m5-touch-reaction-gate-v179.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit test V179
        run: pytest -q tests/test_research_xau_m5_touch_reaction_gate_v179.py
      - name: Run 100K M15 plus 300K M5 touch research
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m fx_scanner.research_xau_m5_touch_reaction_gate_v179_runtime
      - name: Upload V179 evidence
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: xau-m5-touch-reaction-gate-v179
          path: artifacts/xau-m5-touch-reaction-gate-v179.json
          if-no-files-found: error
          retention-days: 30
