name: Bootstrap125 extended lifecycle and native loader
on:
  push:
    branches: ['verify/bootstrap125-completion-20261115']
    paths:
      - '.github/workflows/bootstrap125-completion.yml'
      - 'repairs/bootstrap125_v1_20261114/tests/**'
      - 'repairs/bootstrap125_v1_20261114/bridge/test_bridge.py'
      - 'maintenance/bootstrap125_native_metadata.py'
      - 'maintenance/bootstrap125_metadata_control/**'
permissions:
  contents: read
concurrency:
  group: bootstrap125-native-loader
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen source startup and checkpoint lifecycle
        working-directory: repairs/bootstrap125_v1_20261114
        run: |
          dotnet build source/RizanBootstrap125V1.csproj -c Release
          dotnet build ../../maintenance/bootstrap125_metadata_control/source/MetadataControl.csproj -c Release
          dotnet run --project tests/BootstrapTests.csproj -c Release | tee extended-tests.log
          python -m pip install -r bridge/requirements.txt
          python -m unittest discover -s bridge -p 'test_*.py' 2>&1 | tee extended-bridge-tests.log
      - name: Load compiled algo metadata in offline cTrader Console
        working-directory: .
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo SSH_PREREQUISITES_UNAVAILABLE; exit 1; }
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/known"
          ssh-keygen -y -f "$d/key" >/dev/null
          sshopt=(-i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/known" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          host='Rizanrizan@202.74.74.172'
          remote=$(ssh "${sshopt[@]}" "$host" 'umask 077; mktemp -d /tmp/rizan-bootstrap125.XXXXXXXX')
          [[ "$remote" =~ ^/tmp/rizan-bootstrap125\.[a-zA-Z0-9]+$ ]] || exit 1
          cleanup() { ssh "${sshopt[@]}" "$host" "rm -rf -- '$remote'" >/dev/null 2>&1 || true; rm -rf "$d"; }
          trap cleanup EXIT
          scp "${sshopt[@]}" maintenance/bootstrap125_native_metadata.py "$host:$remote/"
          scp "${sshopt[@]}" repairs/bootstrap125_v1_20261114/source/bin/Release/net6.0/*.algo "$host:$remote/RizanBootstrap125V1.algo"
          scp "${sshopt[@]}" maintenance/bootstrap125_metadata_control/source/bin/Release/net6.0/*.algo "$host:$remote/BootstrapMetadataControl.algo"
          ssh "${sshopt[@]}" "$host" "sudo -n python3 '$remote/bootstrap125_native_metadata.py' '$remote'" | tee native-metadata-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap125-extended-verification
          path: |
            native-metadata-result.json
            repairs/bootstrap125_v1_20261114/source/bin/Release/net6.0/*.algo
            repairs/bootstrap125_v1_20261114/source/bin/Release/net6.0/*.algo.metadata
            repairs/bootstrap125_v1_20261114/extended-tests.log
            repairs/bootstrap125_v1_20261114/extended-bridge-tests.log

