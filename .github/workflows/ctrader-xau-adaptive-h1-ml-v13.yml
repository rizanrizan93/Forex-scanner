name: cTrader XAU Adaptive H1 ML V13

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_adaptive_h1_ml_v13.py"
      - "src/fx_scanner/research_xau_adaptive_h1_ml_v13_runtime.py"
      - "src/fx_scanner/research_xau_h1_history.py"
      - "config/validation.yaml"
      - ".github/workflows/ctrader-xau-adaptive-h1-ml-v13.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-xau-adaptive-h1-ml-v13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xau-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      XAU_V13_EVIDENCE_OUTPUT: artifacts/xau-adaptive-h1-ml-v13.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install scikit-learn==1.7.2
      - name: Validate config
        run: python -m fx_scanner.cli validate-config
      - name: Run adaptive H1 ML V13
        run: python -m fx_scanner.research_xau_adaptive_h1_ml_v13_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-adaptive-h1-ml-v13
          path: artifacts/xau-adaptive-h1-ml-v13.json
          if-no-files-found: error
          retention-days: 30
