name: XAU V394 2025 Profitability Execution Calibration

on:
  workflow_dispatch:
  push:
    branches: [research-v394-profitability-execution]
    paths:
      - ".github/workflows/xau-v394-profitability-execution-2025.yml"
      - "research/xau_v394_profitability_execution.py"
      - "research/xau_v387_execution_pnl_replay.py"
      - "research/xau_v384_adaptive_c4_reforecast_cached.py"
      - "src/fx_scanner/xau_sd_liquidity_engine_v342.py"
      - "src/fx_scanner/xau_sd_liquidity_engine_v342_legacy.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: xau-v394-profitability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate-2025:
    name: profitability-2025-s${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      XAU_V193_YEAR: 2025
      XAU_V193_PRICE_CSV: /tmp/histdata/xau-v394-2025-s${{ matrix.shard }}.csv
      XAU_V193_PRICE_PROVENANCE: artifacts/xau-v394-price-2025-s${{ matrix.shard }}.json
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rizanrizan93/Forex-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Syntax smoke V394
        run: python -m py_compile research/xau_v394_profitability_execution.py
      - name: Download frozen V386 2025 adaptive artifact
        run: |
          mkdir -p /tmp/adaptive
          gh run download 37238066989 -n xau-v386-adaptive-c4-2025 -D /tmp/adaptive
          FILE="/tmp/adaptive/xau-v386-adaptive-c4-2025.json"
          test -s "$FILE"
          echo "ADAPTIVE_JSON=$FILE" >> "$GITHUB_ENV"
      - name: Download causal public XAUUSD M1 2025
        run: python -m fx_scanner.research_xau_histdata_download_v193
      - name: Run V394 profitability shard
        run: |
          python -u research/xau_v394_profitability_execution.py shard \
            --adaptive-json "$ADAPTIVE_JSON" \
            --csv "$XAU_V193_PRICE_CSV" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --output "artifacts/xau-v394-profitability-2025-s${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xau-v394-profitability-2025-s${{ matrix.shard }}
          path: |
            artifacts/xau-v394-profitability-2025-s${{ matrix.shard }}.json
            artifacts/xau-v394-price-2025-s${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

  select-2025:
    name: select-profitability-champion-2025
    needs: calibrate-2025
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install aggregate runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: xau-v394-profitability-2025-s*
          path: /tmp/v394/shards
          merge-multiple: true
      - name: Select only if H1 and H2 are both profitable
        run: |
          python -u research/xau_v394_profitability_execution.py aggregate \
            --inputs "/tmp/v394/shards/xau-v394-profitability-2025-s*.json" \
            --output "artifacts/xau-v394-profitability-2025-selection.json"
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v394-profitability-2025-selection
          path: artifacts/xau-v394-profitability-2025-selection.json
          retention-days: 14
