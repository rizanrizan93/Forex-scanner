name: XAU Williams Adaptive V119
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_williams_adaptive_v119.py"
      - "src/fx_scanner/research_xau_williams_adaptive_v119_runtime.py"
      - "tests/test_research_xau_williams_adaptive_v119.py"
      - ".github/workflows/research-xau-williams-adaptive-v119.yml"
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V119_EVIDENCE_OUTPUT: artifacts/xau-williams-adaptive-v119.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11",cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - run: pytest -q tests/test_research_xau_williams_adaptive_v119.py
      - run: python -m fx_scanner.research_xau_williams_adaptive_v119_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-williams-adaptive-v119
          path: artifacts/xau-williams-adaptive-v119.json
          if-no-files-found: error
          retention-days: 30
