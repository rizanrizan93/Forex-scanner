name: XAU Frozen V1 Primary Consensus Readonly

on:
  pull_request:
    paths:
      - 'main.py'
      - 'pages/7_XAU_Unified_Decision.py'
      - 'src/fx_scanner/xau_v1_primary_consensus.py'
      - 'src/fx_scanner/xau_v1_consensus_dashboard.py'
      - 'src/fx_scanner/xau_unified_inputs_v1.py'
      - 'src/fx_scanner/frozen_v1_bias_dashboard.py'
      - 'tests/test_xau_v1_primary_consensus.py'
      - '.github/workflows/xau-v1-primary-consensus-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'pages/7_XAU_Unified_Decision.py'
      - 'src/fx_scanner/xau_v1_primary_consensus.py'
      - 'src/fx_scanner/xau_v1_consensus_dashboard.py'
      - 'src/fx_scanner/xau_unified_inputs_v1.py'
      - 'src/fx_scanner/frozen_v1_bias_dashboard.py'
      - 'tests/test_xau_v1_primary_consensus.py'
      - '.github/workflows/xau-v1-primary-consensus-readonly.yml'

permissions:
  contents: read

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and dashboard dependencies
        run: python -m pip install --disable-pip-version-check pytest streamlit
      - name: Python page + scorer compile
        run: |
          python -m py_compile main.py pages/7_XAU_Unified_Decision.py src/fx_scanner/xau_v1_primary_consensus.py src/fx_scanner/xau_v1_consensus_dashboard.py src/fx_scanner/xau_unified_inputs_v1.py src/fx_scanner/frozen_v1_bias_dashboard.py
      - name: Frozen and research consensus regression
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q tests/test_xau_v1_primary_consensus.py tests/test_frozen_v1_directional_score.py tests/test_xau_unified_decision_v1.py tests/test_xau_weighted_opportunity_v1.py
