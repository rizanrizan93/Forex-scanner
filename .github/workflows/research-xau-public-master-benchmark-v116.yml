name: XAU Public Master Benchmark V116
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_public_master_benchmark_v116.py"
      - "src/fx_scanner/research_xau_public_master_benchmark_v116_runtime.py"
      - "tests/test_research_xau_public_master_benchmark_v116.py"
      - ".github/workflows/research-xau-public-master-benchmark-v116.yml"
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V116_EVIDENCE_OUTPUT: artifacts/xau-public-master-benchmark-v116.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11",cache: pip}
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_public_master_benchmark_v116.py
      - name: Run public master benchmark
        run: python -m fx_scanner.research_xau_public_master_benchmark_v116_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-public-master-benchmark-v116
          path: artifacts/xau-public-master-benchmark-v116.json
          if-no-files-found: error
          retention-days: 30
