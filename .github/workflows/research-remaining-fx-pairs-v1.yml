name: Research Remaining FX Pairs V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/remaining-fx-pairs-v1
    paths:
      - research/remaining_fx_pair_strategy_search_v1.py
      - .github/workflows/research-remaining-fx-pairs-v1.yml

permissions:
  contents: read

jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        symbol:
          - USDCHF
          - USDCAD
          - NZDUSD
          - EURJPY
          - GBPJPY
          - EURGBP
          - AUDJPY
          - CADJPY
          - EURCHF
          - EURAUD
          - GBPAUD
    env:
      CORE_SYMBOL: ${{ matrix.symbol }}
      PYTHONPATH: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1
      - name: Run remaining-pair tournament
        run: |
          rm -rf research_output_remaining_fx_v1
          mkdir -p research_output_remaining_fx_v1
          python research/remaining_fx_pair_strategy_search_v1.py | tee research_output_remaining_fx_v1/console-${CORE_SYMBOL}.txt
      - name: Verify research-only contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = os.environ['CORE_SYMBOL']
          p = Path(f'research_output_remaining_fx_v1/remaining_fx_search_{s}.json')
          d = json.loads(p.read_text())
          assert d['contract'] == 'REMAINING_FX_PAIR_STRATEGY_SEARCH_V1'
          assert d['execution_influence'] is False
          assert d['symbol'] == s
          assert d['coverage']['h1_rows'] >= 70000, d['coverage']
          assert len(d['candidate_set']) == 6
          print(s, 'remaining FX research contract: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-fx-${{ matrix.symbol }}-v1
          path: research_output_remaining_fx_v1/
          retention-days: 30
