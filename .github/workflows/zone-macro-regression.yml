name: Zone and Macro Dashboard Regression

on:
  pull_request:
    paths:
      - "src/fx_scanner/manual_reversal_map.py"
      - "src/fx_scanner/manual_reversal_dashboard.py"
      - "src/fx_scanner/dashboard_independent_feeds.py"
      - "src/fx_scanner/xau_whalezone_reaction_base_v409.py"
      - "pages/0A_RIZAN_Zone_Hierarchy_V406.py"
      - "pages/2_US10Y_Regime_Timing.py"
      - "tests/test_manual_reversal_reference.py"
      - "tests/test_dashboard_independent_feeds.py"
      - "tests/test_xau_whalezone_reaction_base_v409.py"
      - ".github/workflows/zone-macro-regression.yml"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/manual_reversal_map.py"
      - "src/fx_scanner/manual_reversal_dashboard.py"
      - "src/fx_scanner/dashboard_independent_feeds.py"
      - "src/fx_scanner/xau_whalezone_reaction_base_v409.py"
      - "pages/0A_RIZAN_Zone_Hierarchy_V406.py"
      - "pages/2_US10Y_Regime_Timing.py"
      - ".github/workflows/zone-macro-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install scanner test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Compile changed source and pages
        run: |
          python -m py_compile \
            src/fx_scanner/manual_reversal_map.py \
            src/fx_scanner/manual_reversal_dashboard.py \
            src/fx_scanner/dashboard_independent_feeds.py \
            src/fx_scanner/xau_whalezone_reaction_base_v409.py \
            pages/0A_RIZAN_Zone_Hierarchy_V406.py \
            pages/2_US10Y_Regime_Timing.py
      - name: Run isolated lifecycle and dashboard regression
        run: |
          pytest -q \
            tests/test_xau_whalezone_reaction_base_v409.py \
            tests/test_xau_whalezone_reconstruction_v405.py \
            tests/test_xau_zone_hierarchy_v406.py \
            tests/test_manual_reversal_original.py \
            tests/test_manual_reversal_reference.py \
            tests/test_manual_reversal_ui.py \
            tests/test_dashboard_independent_feeds.py
