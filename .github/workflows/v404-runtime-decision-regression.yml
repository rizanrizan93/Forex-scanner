name: V404-V405 XAU Runtime Regression

on:
  pull_request:
    paths:
      - "main.py"
      - "pages/**"
      - "src/fx_scanner/xau_simple_reversal_engine_v390.py"
      - "src/fx_scanner/xau_afiq_challenger_v395.py"
      - "src/fx_scanner/xau_afiq_scanner_bridge_v403.py"
      - "src/fx_scanner/xau_runtime_decision_v404.py"
      - "src/fx_scanner/xau_whalezone_reconstruction_v405.py"
      - "tests/test_xau_runtime_decision_v404.py"
      - "tests/test_xau_whalezone_reconstruction_v405.py"
      - "tests/test_streamlit_import_bootstrap_v404.py"
      - ".github/workflows/v404-runtime-decision-regression.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "pages/**"
      - "src/fx_scanner/xau_simple_reversal_engine_v390.py"
      - "src/fx_scanner/xau_afiq_challenger_v395.py"
      - "src/fx_scanner/xau_afiq_scanner_bridge_v403.py"
      - "src/fx_scanner/xau_runtime_decision_v404.py"
      - "src/fx_scanner/xau_whalezone_reconstruction_v405.py"
      - "tests/test_xau_runtime_decision_v404.py"
      - "tests/test_xau_whalezone_reconstruction_v405.py"
      - "tests/test_streamlit_import_bootstrap_v404.py"
      - ".github/workflows/v404-runtime-decision-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest==9.0.2
      - name: Compile V390/V395/V403/V404/V405
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/fx_scanner/xau_simple_reversal_engine_v390.py \
            src/fx_scanner/xau_afiq_challenger_v395.py \
            src/fx_scanner/xau_afiq_scanner_bridge_v403.py \
            src/fx_scanner/xau_runtime_decision_v404.py \
            src/fx_scanner/xau_whalezone_reconstruction_v405.py
      - name: Run XAU runtime regression tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_xau_runtime_decision_v404.py \
            tests/test_xau_whalezone_reconstruction_v405.py \
            tests/test_streamlit_import_bootstrap_v404.py
