name: cTrader XAU Canonical Gate V4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_canonical_gate_v4.py"
      - "src/fx_scanner/research_xau_canonical_gate_v4_runtime.py"
      - "config/validation.yaml"
      - ".github/workflows/ctrader-xau-canonical-gate-v4.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-xau-canonical-gate-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xau-canonical-gate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      XAU_CANONICAL_GATE_V4_EVIDENCE_OUTPUT: artifacts/xau-canonical-gate-v4.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Replay canonical EMA-SMC-ICT gates on 100k closed M15 bars
        run: python -m fx_scanner.research_xau_canonical_gate_v4_runtime
      - name: Upload XAU canonical gate V4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-canonical-gate-v4
          path: artifacts/xau-canonical-gate-v4.json
          if-no-files-found: error
          retention-days: 30
