name: R29.1 XAU Event Structure Side Direction (Read Only)

on:
  push:
    branches: ['research/r291-event-structure-direction-20261123']
    paths:
      - 'scripts/r291_event_structure_direction.py'
      - 'tests/test_r291_event_structure_direction.py'
      - '.github/workflows/r291_event_structure_direction.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r291-event-direction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r291-event-structure-direction-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated research dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl pytest==9.0.2
      - name: Enforce pre-registered R29 and new R29.1 causal event gates
        run: python -m pytest -q tests/test_r29_direction60_walkforward.py tests/test_r291_event_structure_direction.py
      - name: Compile both independent research modules
        run: python -m py_compile scripts/r29_direction60_walkforward.py scripts/r291_event_structure_direction.py

  replay:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tf: ['1h','4h','1D','1W']
    env:
      PYTHONPATH: 'scripts:src:.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r291-event-structure-direction-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl
      - name: Fetch unchanged historical H1/H4 source artifact
        if: matrix.tf == '1h' || matrix.tf == '4h'
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Fetch unchanged D1/W1 daily source artifact
        if: matrix.tf == '1D' || matrix.tf == '1W'
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Run independently selected BUY and SELL event specialist
        run: python scripts/r291_event_structure_direction.py --tf "${{ matrix.tf }}"
      - name: Save all non-promotional annual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r291-event-${{ matrix.tf }}
          path: artifacts/r291-event-${{ matrix.tf }}.json
          retention-days: 90
          if-no-files-found: warn
