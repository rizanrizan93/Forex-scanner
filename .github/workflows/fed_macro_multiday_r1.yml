name: Fed Macro R1 — D1 D3 D5 D10 Real XAU 2023 (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/fed_expectation_r1/macro_horizons.py'
      - 'scripts/replay_fed_macro_multiday_2023_r1.py'
      - 'tests/test_fed_macro_horizons_r1.py'
      - '.github/workflows/fed_macro_multiday_r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi_session_integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - env: {PYTHONPATH: 'src:.'}
        run: python -m pytest -q tests/test_fed_macro_horizons_r1.py tests/test_fed_macro_replay_release_gate_r1.py
  real_xau_macro_d1_d3_d5_d10:
    needs: multi_session_integrity
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env: {PYTHONPATH: 'src:.'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - run: python -m pip install 'git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8'
      - name: Real XAU 8 Fed meetings, 23 following calendar days per meeting
        run: |
          mkdir -p artifacts
          python scripts/replay_fed_macro_multiday_2023_r1.py --out artifacts/fed-macro-r1-2023-H4-D1-D3-D5-D10-ORACLE.json
      - uses: actions/upload-artifact@v4
        with:
          name: fed-macro-r1-multiday-2023-XAU-real-expost
          path: artifacts/fed-macro-r1-2023-H4-D1-D3-D5-D10-ORACLE.json
          retention-days: 30
          if-no-files-found: error
