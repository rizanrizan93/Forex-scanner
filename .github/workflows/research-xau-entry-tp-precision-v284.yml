name: Research XAU Entry TP Precision V284

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_entry_tp_precision_v284*.py"
      - ".github/workflows/research-xau-entry-tp-precision-v284.yml"
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_entry_tp_precision_v284*.py"
      - "scripts/research_xau_entry_tp_precision_v284*.py"
      - "tests/test_research_xau_entry_tp_precision_v284.py"
      - ".github/workflows/research-xau-entry-tp-precision-v284.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-entry-tp-precision-v284-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . pytest==9.0.2
      - run: pytest -q tests/test_research_xau_entry_tp_precision_v284.py

  backfill-year:
    if: ${{ github.event_name != 'pull_request' }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      XAU_V242_YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - run: python -m fx_scanner.research_xau_entry_tp_precision_v284_year_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v284-year-${{ matrix.year }}
          path: |
            artifacts/xau-entry-tp-precision-v284-${{ matrix.year }}.json
            artifacts/xau-v284-provenance-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: ${{ github.event_name != 'pull_request' }}
    needs: backfill-year
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XAU_V284_SHARD_DIR: /tmp/v284-shards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: xau-v284-year-*
          path: /tmp/v284-shards
      - run: python -m fx_scanner.research_xau_entry_tp_precision_v284_aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: xau-entry-tp-precision-v284-full
          path: artifacts/xau-entry-tp-precision-v284-full.json
          if-no-files-found: error
          retention-days: 30
