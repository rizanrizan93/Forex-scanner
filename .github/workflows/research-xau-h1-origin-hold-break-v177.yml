name: XAU H1 Origin Hold Break V177

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_h1_origin_hold_break_v177.py"
      - "src/fx_scanner/research_xau_h1_origin_hold_break_v177_runtime.py"
      - "src/fx_scanner/demo_xau_afic_path_shadow_observer.py"
      - ".github/workflows/research-xau-h1-origin-hold-break-v177.yml"
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_h1_origin_hold_break_v177.py"
      - "src/fx_scanner/research_xau_h1_origin_hold_break_v177_runtime.py"
      - "tests/test_research_xau_h1_origin_hold_break_v177.py"
      - "src/fx_scanner/demo_xau_afic_path_shadow_observer.py"
      - ".github/workflows/research-xau-h1-origin-hold-break-v177.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-h1-origin-hold-break-v177
  cancel-in-progress: true

jobs:
  h1-origin-hold-break-v177:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CTRADER_XAU_M15_RESEARCH_HISTORY_BARS: "100000"
      XAU_H1_ORIGIN_HOLD_BREAK_V177_OUTPUT: artifacts/xau-h1-origin-hold-break-v177.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Unit test V177
        run: pytest -q tests/test_research_xau_h1_origin_hold_break_v177.py
      - name: Run 100K-bar hold-break research
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m fx_scanner.research_xau_h1_origin_hold_break_v177_runtime
      - name: Upload V177 evidence
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: xau-h1-origin-hold-break-v177
          path: artifacts/xau-h1-origin-hold-break-v177.json
          if-no-files-found: error
          retention-days: 30
