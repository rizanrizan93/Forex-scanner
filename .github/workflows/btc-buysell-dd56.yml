name: BTC BUY SELL resume182700 audit630k DD56
on:
  push:
    branches: [research/btc-buysell-dd56-600k-2019-2026]
    paths: [.github/workflows/btc-buysell-dd56.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0,1,2,3]}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-BTCUSD-EXTENDED-INPUT-2019-OCT2026
          run-id: 39212036090
          github-token: ${{ github.token }}
          path: source
      - run: pip install --disable-pip-version-check pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          pattern: RIZAN-BTC-BOTH56-SHARD-*
          run-id: 39273886250
          github-token: ${{ github.token }}
          path: checkpoint
      - name: Prepare compile fixtures baseline differential and resume
        run: |
          set -euo pipefail
          mkdir -p result
          gzip -dk source/data/BTCUSD_M1.csv.gz
          echo 'c217e367a22cab5f157d6d8a38828b9ada249f5a2d0657f20d204fee881c9504  source/data/BTCUSD_M1.csv' | sha256sum -c -
          python research_btc_jpy/prepare_btc_both.py result
          cp research_btc_jpy/btc_both.cpp result/
          python research_btc_jpy/generate_btc_both.py CONFIGS.csv
          g++ -O3 -std=c++17 result/btc_both.cpp -o replay
          ./replay --test | tee result/FIXTURES.log
          python research_btc_jpy/resume_btc_both.py prepare ${{ matrix.shard }}
          ./replay search source/data/BTCUSD_M1.csv result REMAINING.csv ${{ matrix.shard }} | tee result/RUN.log
          grep -q 'COMPLETE 45675' result/RUN.log
          python research_btc_jpy/resume_btc_both.py merge ${{ matrix.shard }}
          git rev-parse HEAD > result/COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-BTC-BOTH56-SHARD-${{ matrix.shard }}
          path: result/
          retention-days: 90
          compression-level: 1
  audit:
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check pandas==2.2.3 numpy matplotlib tabulate
      - uses: actions/download-artifact@v4
        with: {pattern: RIZAN-BTC-BOTH56-SHARD-*, path: shards}
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-BTCUSD-EXTENDED-INPUT-2019-OCT2026
          run-id: 39212036090
          github-token: ${{ github.token }}
          path: source
      - name: Reproduce finalists stress reconcile and package
        run: |
          set -euo pipefail
          gzip -dk source/data/BTCUSD_M1.csv.gz
          echo 'c217e367a22cab5f157d6d8a38828b9ada249f5a2d0657f20d204fee881c9504  source/data/BTCUSD_M1.csv' | sha256sum -c -
          python -u research_btc_jpy/audit_btc_both.py
      - name: Save isolated research packages to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/hosts"
          chmod 600 "$d/key" "$d/hosts"
          dest="/home/Rizanrizan/rizan-ticks/REPLAY_RESULTS/btc-buysell-dd56-600k-2019-oct2026/run-$GITHUB_RUN_ID"
          opts=(-i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=30)
          ssh "${opts[@]}" Rizanrizan@202.74.74.172 "umask 077; mkdir -p '$dest'"
          scp -l 24000 "${opts[@]}" both_results/*.zip both_results/*.md both_results/*STATUS.json both_results/PACKAGE_SHA256.txt "Rizanrizan@202.74.74.172:$dest/"
          ssh "${opts[@]}" Rizanrizan@202.74.74.172 "cd '$dest' && nice -n 15 ionice -c3 sha256sum -c PACKAGE_SHA256.txt" > both_results/VPS_VERIFICATION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-BTC-BUYSELL-DD56-600K-AUDITED
          path: |
            both_results/*.zip
            both_results/*.md
            both_results/*.json
            both_results/*.csv
            both_results/*.txt
          retention-days: 90
          compression-level: 1

