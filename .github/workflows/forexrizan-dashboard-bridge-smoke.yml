name: ForexRizan Dashboard Bridge Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/forexrizan-dashboard-bridge-smoke.yml"
      - "src/fx_scanner/xau_public_hot_v362.py"
      - "streamlit_app.py"
  schedule:
    - cron: "8,18,28,38,48,58 * * * 0-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/forexrizan-dashboard-bridge-smoke.yml"
      - "src/fx_scanner/xau_dashboard_bridge_v254.py"
      - "src/fx_scanner/xau_public_hot_v362.py"
      - "streamlit_app.py"

permissions:
  contents: read
  actions: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch public dashboard bridge
        id: bridge_smoke
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          from fx_scanner.xau_dashboard_bridge_v254 import fetch_snapshot

          import time

          payload = None
          last_error = None
          for attempt in range(1, 4):
              try:
                  payload = fetch_snapshot(timeout_seconds=20.0)
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"BRIDGE_SMOKE_RETRY attempt={attempt}/3 error={type(exc).__name__}:{exc}")
                  if attempt < 3:
                      time.sleep(10)
          if payload is None:
              raise SystemExit(f"BRIDGE_SMOKE_FETCH_FAILED: {last_error}")

          backend = dict(payload.get("backend") or {})
          control = dict(backend.get("control") or {})
          bridge = dict(payload.get("bridge") or {})
          source = dict(payload.get("source") or {})
          required = (
              "heartbeats",
              "xau_signals",
              "afic_forecast_states",
              "afic_prepared_plans",
              "afic_execution_geometry",
              "xau_execution_events",
              "xau_prepared_plan_lifecycle",
              "control",
          )
          missing = [key for key in required if key not in backend]
          if missing:
              raise SystemExit("BRIDGE_SMOKE_MISSING=" + ",".join(missing))
          if source.get("project_ref") != "naxvdtvlfatljzzwhrmo":
              raise SystemExit("BRIDGE_SMOKE_PROJECT_MISMATCH")
          if not bridge.get("fresh"):
              raise SystemExit("BRIDGE_SMOKE_STALE")
          print(
              "FOREXRIZAN_DASHBOARD_BRIDGE_SMOKE_OK "
              f"age_seconds={bridge.get('age_seconds')} "
              f"execution_mode={control.get('execution_mode')} "
              f"heartbeats={len(list(backend.get('heartbeats') or []))} "
              f"xau_signals={len(list(backend.get('xau_signals') or []))}"
          )
          PY

      - name: Recover dashboard publisher when bridge is stale
        if: ${{ steps.bridge_smoke.outcome == 'failure' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail

          now_epoch="$(date -u +%s)"
          snapshot_date="$(
            gh api "repos/${GITHUB_REPOSITORY}/branches/dashboard-snapshots-v344" \
              --jq '.commit.commit.committer.date' 2>/dev/null || true
          )"
          if [ -z "${snapshot_date}" ]; then
            snapshot_age=999999
          else
            snapshot_epoch="$(date -u -d "${snapshot_date}" +%s)"
            snapshot_age="$(( now_epoch - snapshot_epoch ))"
            if [ "${snapshot_age}" -lt 0 ]; then
              snapshot_age=0
            fi
          fi

          publisher_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/forexrizan-dashboard-bridge-v254.yml/runs?branch=main&per_page=20"
          )"
          active_publishers="$(
            printf '%s' "${publisher_json}" \
              | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
          )"
          in_progress_publishers="$(
            printf '%s' "${publisher_json}" \
              | jq '[.workflow_runs[] | select(.status == "in_progress")] | length'
          )"

          echo "FOREXRIZAN_BRIDGE_SMOKE_RECOVERY snapshot_age_seconds=${snapshot_age} active_publishers=${active_publishers} in_progress_publishers=${in_progress_publishers}"

          if [ "${active_publishers}" -gt 0 ] && [ "${snapshot_age}" -gt 240 ] && [ "${in_progress_publishers}" -gt 0 ]; then
            echo "::warning::ForexRizan bridge stale >240s while publisher is in progress; cancelling zombie/stalled publisher"
            printf '%s' "${publisher_json}" \
              | jq -r '.workflow_runs[] | select(.status == "in_progress") | .id' \
              | while read -r run_id; do
                  [ -n "${run_id}" ] && gh run cancel -R "${GITHUB_REPOSITORY}" "${run_id}" || true
                done
            sleep 5

            active_publishers="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/forexrizan-dashboard-bridge-v254.yml/runs?branch=main&per_page=20" \
                --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
            )"
          fi

          if [ "${active_publishers}" -eq 0 ]; then
            echo "::warning::ForexRizan bridge stale and no replacement publisher active; dispatching recovery publisher"
            gh workflow run -R "${GITHUB_REPOSITORY}" forexrizan-dashboard-bridge-v254.yml --ref main
          else
            echo "::warning::ForexRizan bridge recovery publisher is active/queued; waiting for fresh snapshot"
          fi

          python - <<'PY'
          from fx_scanner.xau_dashboard_bridge_v254 import fetch_snapshot
          import time

          last_error = None
          for attempt in range(1, 17):
              try:
                  payload = fetch_snapshot(timeout_seconds=20.0)
                  bridge = dict(payload.get("bridge") or {})
                  source = dict(payload.get("source") or {})
                  if source.get("project_ref") != "naxvdtvlfatljzzwhrmo":
                      raise RuntimeError("BRIDGE_RECOVERY_PROJECT_MISMATCH")
                  if not bridge.get("fresh"):
                      raise RuntimeError("BRIDGE_RECOVERY_STILL_STALE")
                  print(
                      "FOREXRIZAN_DASHBOARD_BRIDGE_RECOVERED "
                      f"attempt={attempt}/16 age_seconds={bridge.get('age_seconds')}"
                  )
                  break
              except Exception as exc:
                  last_error = exc
                  print(
                      f"BRIDGE_RECOVERY_WAIT attempt={attempt}/16 "
                      f"error={type(exc).__name__}:{exc}"
                  )
                  if attempt < 16:
                      time.sleep(15)
          else:
              raise SystemExit(f"BRIDGE_RECOVERY_TIMEOUT: {last_error}")
          PY
