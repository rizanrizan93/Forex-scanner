name: XAU H1 H4 Direction R1 Historical Replay (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/zone_rebound/h1h4_direction_r1.py'
      - 'scripts/research_xau_h1h4_direction_r1.py'
      - 'tests/test_xau_h1h4_direction_r1.py'
      - '.github/workflows/xau-h1h4-direction-r1.yml'
permissions:
  contents: read
concurrency:
  group: h1h4-direction-r1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - run: PYTHONPATH=src:. python -m pytest -q tests/test_xau_h1h4_direction_r1.py
  replay-year:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    env:
      XAU_V193_YEAR: ${{ matrix.year }}
      XAU_V193_PRICE_CSV: /tmp/xau-h1h4-${{ matrix.year }}.csv
      XAU_V193_PRICE_PROVENANCE: /tmp/xau-h1h4-${{ matrix.year }}-provenance.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install research-only data dependencies
        run: |
          python -m pip install numpy==2.3.5 pandas==2.2.3
          python -m pip install 'git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8'
      - name: Fetch XAU M1 from public historical provider
        env: {PYTHONPATH: 'src:.'}
        run: python -m fx_scanner.research_xau_histdata_download_v193
      - name: Verify normalized input, provenance and provider availability
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          prov=json.loads(Path(os.environ['XAU_V193_PRICE_PROVENANCE']).read_text())
          actual=hashlib.sha256(Path(os.environ['XAU_V193_PRICE_CSV']).read_bytes()).hexdigest()
          assert prov['normalized_csv_sha256']==actual,'PRICE_HASH_MISMATCH'
          assert not prov['failed_periods'],f"PRICE_PROVIDER_GAPS:{prov['failed_periods']}"
          print('PRICE_SOURCE_OK',prov['year'],prov['rows'],prov['last_timestamp_utc'])
          PY
      - name: Run H1 and H4 year directional replay (no orders)
        env: {PYTHONPATH: 'src:.'}
        run: |
          python scripts/research_xau_h1h4_direction_r1.py --csv "$XAU_V193_PRICE_CSV" --year ${{ matrix.year }} --provenance "$XAU_V193_PRICE_PROVENANCE" --out "artifacts/direction-year-${{ matrix.year }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: direction-year-${{ matrix.year }}
          path: artifacts/direction-year-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 45
  aggregate:
    needs: replay-year
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          pattern: direction-year-*
          path: artifacts/shards
          merge-multiple: true
      - name: Locked training (2019-23), validation (2024), test (2025-26)
        env: {PYTHONPATH: 'src:.'}
        run: |
          python scripts/research_xau_h1h4_direction_r1.py --aggregate artifacts/shards/direction-year-*.json --out artifacts/h1h4-direction-full-2019-2026.json
          python - <<'PY'
          import json
          p=json.load(open('artifacts/h1h4-direction-full-2019-2026.json'))
          assert p['years']==list(range(2019,2027))
          assert not p['execution_authority'] and not p['execution_influence']
          print('H1H4_REPLAY_VERIFIED',json.dumps(p['selected'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xau-h1h4-direction-2019-2026-report
          path: artifacts/h1h4-direction-full-2019-2026.json
          if-no-files-found: error
          retention-days: 90
