name: RIZAN combined equity tick stage-0 pilot
on:
  push:
    branches: [research/tick-archive-2019-2026]
    paths: [.github/workflows/research-tick-portfolio-stage0-pilot.yml]
permissions:
  contents: read
jobs:
  stage0_research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip -q install 'pyarrow>=17,<24' 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Run 2019 Q1 bid-ask tick sequential shared-cash pilot
        run: |
          python -u research/tick_replay_2019/portfolio_stage0.py \
            --start 2019-01 --end 2019-03 \
            --out tick_portfolio_stage0_q1_2019.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rizan-tick-stage0-q1-2019
          path: tick_portfolio_stage0_q1_2019.json
          retention-days: 30
          if-no-files-found: warn
