name: Fed R6 — 69 FOMC Causal Swing / Continuation Adverse Risk (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/fx_scanner/rejection_confirmed_swing_r6_research.py'
      - 'src/fx_scanner/fomc_continuation_risk_r6_research.py'
      - 'scripts/replay_fed_r5_paired_pilot.py'
      - 'scripts/replay_fed_r5_2019_2026_paired.py'
      - 'scripts/aggregate_fed_r5_paired_2019_2026.py'
      - 'tests/test_fed_r5_2019_2026_paired.py'
      - '.github/workflows/fed_r6_2019_2026_pivot_risk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no_lookahead_pivot_and_risk_units:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - run: |
          python -m py_compile scripts/replay_fed_r5_2019_2026_paired.py scripts/aggregate_fed_r5_paired_2019_2026.py
          python -m pytest -q tests/test_rejection_confirmed_swing_r6.py tests/test_fomc_continuation_risk_r6.py tests/test_fed_r5_2019_2026_paired.py
  eight_year_real_xau_price_ablation:
    needs: no_lookahead_pivot_and_risk_units
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - run: python -m pip install 'git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8'
      - name: Audit real XAU closed M1 at each official FOMC plus post-news risk
        run: |
          mkdir -p artifacts
          python scripts/replay_fed_r5_2019_2026_paired.py --year ${{ matrix.year }} --out artifacts/fed_r5_paired_${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: fed-r6-swing-risk-${{ matrix.year }}
          path: artifacts/fed_r5_paired_${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 30
  audited_meeting_unit_results:
    needs: eight_year_real_xau_price_ablation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          pattern: fed-r6-swing-risk-*
          path: artifacts/eight_years
      - name: Verify all 69 sources, no duplicate M1 wins; tabulate BUY/SELL +$3 vs −$3 and MAE
        run: |
          python scripts/aggregate_fed_r5_paired_2019_2026.py --input-dir artifacts/eight_years --out artifacts/fed-r6-2019-2026-swing-risk-aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: fed-r6-2019-2026-swing-risk-final-audit
          path: artifacts/fed-r6-2019-2026-swing-risk-aggregate.json
          if-no-files-found: error
          retention-days: 30
