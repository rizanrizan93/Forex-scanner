name: V389 Simple Decision Center Check

on:
  push:
    branches: [feature-v389-simple-decision-center]
    paths:
      - "pages/0_Pusat_Keputusan_XAUUSD.py"
      - ".github/workflows/v389-simple-decision-center-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "pages/0_Pusat_Keputusan_XAUUSD.py"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile decision center
        run: python -m py_compile pages/0_Pusat_Keputusan_XAUUSD.py
