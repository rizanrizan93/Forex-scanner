name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Streamlit syntax smoke
        run: python -m py_compile main.py streamlit_app.py
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - name: Upload pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Config contract
        run: python -m fx_scanner.cli validate-config
      - name: Macro source smoke
        run: python -m fx_scanner.cli macro-source-smoke
      - name: Demo ingest
        run: python -m fx_scanner.cli demo-ingest --symbol EURUSD --minutes 10
