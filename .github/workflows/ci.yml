name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Streamlit syntax smoke
        run: python -m py_compile streamlit_app.py
      - name: Unit tests
        run: pytest -q
      - name: Config contract
        run: python -m fx_scanner.cli validate-config
      - name: Demo ingest
        run: python -m fx_scanner.cli demo-ingest --symbol EURUSD --minutes 10
