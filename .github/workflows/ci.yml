name: CI

on:
  push:
    branches: [main, "promotion/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install scipy==1.17.0 numba==0.63.1
      - name: Verify Numba research dependency
        run: |
          python - <<'PY'
          import numba
          import scipy
          from numba import njit

          @njit
          def _smoke(n):
              return n * n + 1

          assert _smoke(6) == 37
          print(f"NUMBA_CI_READY numba={numba.__version__} scipy={scipy.__version__} jit=OK")
          PY
      - name: Streamlit syntax smoke
        run: python -m py_compile main.py streamlit_app.py
      - name: Zone V05 M1 regression
        run: pytest -q tests/test_zone_v05.py
      - name: Unit tests
        run: pytest -q
      - name: Config contract
        run: python -m fx_scanner.cli validate-config
      - name: Macro source smoke
        run: python -m fx_scanner.cli macro-source-smoke
      - name: Demo ingest
        run: python -m fx_scanner.cli demo-ingest --symbol EURUSD --minutes 10
