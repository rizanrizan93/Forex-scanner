name: Research XAU Depth Account V230

on:
  workflow_dispatch:
  push:
    branches:
      - research/v230-depth-account-no-risk
    paths:
      - "src/fx_scanner/research_xau_depth_account_v230.py"
      - "src/fx_scanner/research_xau_depth_account_v230_aggregate.py"
      - ".github/workflows/research-xau-depth-account-v230.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-depth-account-v230-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile V230
        run: |
          python -m py_compile src/fx_scanner/research_xau_depth_account_v230.py
          python -m py_compile src/fx_scanner/research_xau_depth_account_v230_aggregate.py

  replay-year:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year:
          - 2012
          - 2013
          - 2014
          - 2015
          - 2016
          - 2017
          - 2018
          - 2019
          - 2020
          - 2021
          - 2022
          - 2023
          - 2024
          - 2025
          - 2026
    env:
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      XAU_V193_YEAR: ${{ matrix.year }}
      XAU_V193_PRICE_CSV: /tmp/histdata/xau-v230-${{ matrix.year }}.csv
      XAU_V193_PRICE_PROVENANCE: artifacts/xau-v230-price-provenance-${{ matrix.year }}.json
      XAU_V225_YEAR: ${{ matrix.year }}
      XAU_V225_PRICE_CSV: /tmp/histdata/xau-v230-${{ matrix.year }}.csv
      XAU_V225_PRICE_PROVENANCE: artifacts/xau-v230-price-provenance-${{ matrix.year }}.json
      XAU_V225_YEAR_OUTPUT: artifacts/xau-zone-reversal-depth-v225-${{ matrix.year }}.json
      XAU_V230_YEAR: ${{ matrix.year }}
      XAU_V230_PRICE_CSV: /tmp/histdata/xau-v230-${{ matrix.year }}.csv
      XAU_V230_V225_YEAR_JSON: artifacts/xau-zone-reversal-depth-v225-${{ matrix.year }}.json
      XAU_V230_OUTPUT: artifacts/xau-depth-account-v230-${{ matrix.year }}.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install historical runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Download and normalize HistData XAUUSD M1
        run: python -m fx_scanner.research_xau_histdata_download_v193
      - name: Rebuild causal V225.2 yearly first-touch shard
        run: python -m fx_scanner.research_xau_zone_reversal_depth_v225_year_runtime
      - name: Replay V226/V229 no-risk account candidates
        run: python -m fx_scanner.research_xau_depth_account_v230
      - name: Upload V230 year
        uses: actions/upload-artifact@v4
        with:
          name: xau-v230-year-${{ matrix.year }}
          path: |
            artifacts/xau-depth-account-v230-${{ matrix.year }}.json
            artifacts/xau-v230-price-provenance-${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: replay-year
    if: always() && needs.replay-year.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XAU_V230_SHARD_DIR: /tmp/v230-shards
      XAU_V230_FULL_OUTPUT: artifacts/xau-depth-account-v230-full.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install aggregator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download all V230 yearly shards
        uses: actions/download-artifact@v4
        with:
          pattern: xau-v230-year-*
          path: /tmp/v230-shards
          merge-multiple: false
      - name: Aggregate $200 1:100 no-risk account replay
        run: python -m fx_scanner.research_xau_depth_account_v230_aggregate
      - name: Upload full V230 result
        uses: actions/upload-artifact@v4
        with:
          name: xau-depth-account-v230-full
          path: artifacts/xau-depth-account-v230-full.json
          if-no-files-found: error
          retention-days: 30
