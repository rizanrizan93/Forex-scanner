name: Research Market Adaptive Router V2

on:
  push:
    branches:
      - research/market-adaptive-router-v2-b
    paths:
      - "research/adaptive_router_market_core_v2.py"
      - "research/adaptive_router_market_adaptive_v2.py"
      - ".github/workflows/research-market-adaptive-router-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-market-adaptive-router-v2
  cancel-in-progress: true

jobs:
  adaptive-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run adaptive market backtest
        shell: bash
        run: |
          set -euo pipefail
          python research/adaptive_router_market_adaptive_v2.py | tee adaptive_router_market_v2.log
          grep '^RESULT_JSON=' adaptive_router_market_v2.log | sed 's/^RESULT_JSON=//' > adaptive_router_market_v2.json
          test -s adaptive_router_market_v2.json
      - name: Show compact evidence
        run: grep -E '^(DATA|SUMMARY|PERIOD|SETUP)' adaptive_router_market_v2.log
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-router-market-v2
          path: |
            adaptive_router_market_v2.json
            adaptive_router_market_v2.log
          if-no-files-found: error
