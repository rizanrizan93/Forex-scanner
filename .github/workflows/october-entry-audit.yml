name: October verified prefix hybrid proxy replay
on:
  push:
    branches: [research/october-entry-audit-20261021]
    paths: ['october_entry_audit/**', '.github/workflows/october-entry-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-OCTOBER-ENTRY-AUDIT
          run-id: 39528092818
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-OCTOBER-FROZEN-SOURCE-PROXY-REPLAY
          run-id: 39529776251
          github-token: ${{ github.token }}
          path: resume
      - name: Acquire separate data using isolated research folder on VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/hosts"
          opts=(-i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=20)
          dest="/home/Rizanrizan/rizan-ticks/REPLAY_RESULTS/october-entry-audit-20261021/proxy-${GITHUB_RUN_ID}"
          target=Rizanrizan@202.74.74.172
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('raw-cache.tar.gz','w:gz') as t:
              for p in Path('resume').rglob('*.bi5'):t.add(p,arcname='publish/proxy_raw/'+p.name,recursive=False)
          PY
          ssh "${opts[@]}" "$target" "umask 077; mkdir -p '$dest'"
          scp "${opts[@]}" october_entry_audit/prepare_hybrid.py raw-cache.tar.gz "$target:$dest/"
          ssh "${opts[@]}" "$target" "mkdir -p '$dest/october_entry_audit/verified_inputs'"
          scp "${opts[@]}" october_entry_audit/verified_inputs/*.gz "$target:$dest/october_entry_audit/verified_inputs/"
          ssh "${opts[@]}" "$target" "cd '$dest' && tar -xzf raw-cache.tar.gz && nice -n 15 ionice -c 3 /usr/bin/python3 prepare_hybrid.py" | tee PROXY_INPUT.log
          ssh "${opts[@]}" "$target" "cd '$dest' && tar -czf PROXY_DATA.tar.gz publish"
          scp "${opts[@]}" "$target:$dest/PROXY_DATA.tar.gz" .
          tar -xzf PROXY_DATA.tar.gz
          printf '%s\n' "$dest" > publish/VPS_PROXY_DATA_PATH.txt
      - name: Compile source and execute bounded windows
        run: |
          python3 october_entry_audit/build_proxy.py
          dotnet build october_entry_audit/ProxyReplay.csproj --configuration Release | tee publish/PROXY_BUILD.log
          cp october_entry_audit/PROXY_HARNESS.diff october_entry_audit/INPUT_REPAIR_PROTOCOL.json publish/
          python3 october_entry_audit/run_proxy.py | tee publish/PROXY_EXECUTION.log
      - name: Require completed cases
        run: |
          test -s publish/PROXY_ENTRY_SUMMARY.json
          python3 - <<'PY'
          import json
          x=json.load(open('publish/PROXY_ENTRY_SUMMARY.json'))
          assert len(x)==6 and all(r['error_count']==0 for r in x)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-OCTOBER-FROZEN-SOURCE-PROXY-REPLAY
          path: |
            publish/
            PROXY_INPUT.log
            prior/
