name: October frozen source price-proxy replay
on:
  push:
    branches: [research/october-entry-audit-20261021]
    paths: ['october_entry_audit/**', '.github/workflows/october-entry-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-OCTOBER-ENTRY-AUDIT
          run-id: 39528092818
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-OCTOBER-FROZEN-SOURCE-PROXY-REPLAY
          run-id: 39529776251
          github-token: ${{ github.token }}
          path: resume
      - name: Resume verified-format raw downloads
        run: |
          mkdir -p publish/proxy_raw
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for p in Path('resume').rglob('*.bi5'):
              shutil.copyfile(p,Path('publish/proxy_raw')/p.name)
          print('cached_raw_files',len(list(Path('publish/proxy_raw').glob('*.bi5'))))
          PY
      - name: Acquire separate public FX and BTC execution inputs
        run: python3 october_entry_audit/prepare_proxy.py | tee PROXY_INPUT.log
      - name: Compile unchanged frozen strategy with bounded-window harness
        run: |
          python3 october_entry_audit/build_proxy.py
          dotnet build october_entry_audit/ProxyReplay.csproj --configuration Release | tee publish/PROXY_BUILD.log
          cp october_entry_audit/PROXY_HARNESS.diff publish/
      - name: Execute start1/start10 price-proxy and macro-block controls
        run: python3 october_entry_audit/run_proxy.py | tee publish/PROXY_EXECUTION.log
      - name: Require actual completed replay rows
        run: |
          test -s publish/PROXY_ENTRY_SUMMARY.json
          python3 - <<'PY'
          import json
          x=json.load(open('publish/PROXY_ENTRY_SUMMARY.json'))
          assert len(x)==6 and all(r['error_count']==0 for r in x)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-OCTOBER-FROZEN-SOURCE-PROXY-REPLAY
          path: |
            publish/
            PROXY_INPUT.log
            prior/
