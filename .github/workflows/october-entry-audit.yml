name: October verified prefix hybrid proxy replay
on:
  push:
    branches: [research/october-entry-audit-20261021]
    paths: ['october_entry_audit/**', '.github/workflows/october-entry-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-OCTOBER-ENTRY-AUDIT
          run-id: 39528092818
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-OCTOBER-FROZEN-SOURCE-PROXY-REPLAY
          run-id: 39531738894
          github-token: ${{ github.token }}
          path: resume
      - name: Acquire bounded public extension on research runner
        run: |
          mkdir -p publish/proxy_raw
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          for p in Path('resume').rglob('*.bi5'):shutil.copy2(p,Path('publish/proxy_raw')/p.name)
          PY
          python3 october_entry_audit/prepare_hybrid.py | tee PROXY_INPUT.log
      - name: Compile source and execute bounded windows
        run: |
          python3 october_entry_audit/build_proxy.py
          dotnet build october_entry_audit/ProxyReplay.csproj --configuration Release | tee publish/PROXY_BUILD.log
          cp october_entry_audit/PROXY_HARNESS.diff october_entry_audit/INPUT_REPAIR_PROTOCOL.json publish/
          python3 october_entry_audit/run_proxy.py | tee publish/PROXY_EXECUTION.log
      - name: Require completed cases
        run: |
          test -s publish/PROXY_ENTRY_SUMMARY.json
          python3 - <<'PY'
          import json
          x=json.load(open('publish/PROXY_ENTRY_SUMMARY.json'))
          assert len(x)==6 and all(r['error_count']==0 for r in x)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-OCTOBER-FROZEN-SOURCE-PROXY-REPLAY
          path: |
            publish/
            PROXY_INPUT.log
            prior/
