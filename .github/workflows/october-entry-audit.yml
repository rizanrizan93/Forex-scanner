name: October FX input availability probe
on:
  push:
    branches: [research/october-entry-audit-20261021]
    paths: ['october_entry_audit/**', '.github/workflows/october-entry-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: RIZAN-OCTOBER-ENTRY-AUDIT
          run-id: 39528352854
          github-token: ${{ github.token }}
          path: prior
      - name: Check public FX M1 coverage without modifying native data
        run: python3 october_entry_audit/fx_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIZAN-OCTOBER-FX-DATA-PROBE
          path: |
            publish/
            prior/
