name: XAU AFIC Target Geometry Attribution V167

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_afic_target_geometry_attribution_v167.py"
      - "src/fx_scanner/research_xau_afic_target_geometry_attribution_v167_runtime.py"
      - "tests/test_research_xau_afic_target_geometry_attribution_v167.py"
      - ".github/workflows/research-xau-afic-target-geometry-attribution-v167.yml"

permissions:
  contents: read

jobs:
  afic-v167:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V167_OUTPUT: artifacts/xau-afic-target-geometry-attribution-v167.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit test
        run: pytest -q tests/test_research_xau_afic_target_geometry_attribution_v167.py
      - name: Run V167 geometry attribution diagnostic
        run: python -m fx_scanner.research_xau_afic_target_geometry_attribution_v167_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-afic-target-geometry-attribution-v167
          path: artifacts/xau-afic-target-geometry-attribution-v167.json
          if-no-files-found: error
          retention-days: 30
