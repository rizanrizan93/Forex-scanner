name: Research XAU D1 Staggered Robustness V16

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/xau_d1_staggered_v14.py"
      - "research/xau_d1_staggered_robustness_v16.py"
      - "research/five_core_tournament_v1.py"
      - "tests/test_research_xau_d1_staggered_robustness_v16.py"
      - ".github/workflows/research-xau-d1-staggered-robustness-v16.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-d1-staggered-robustness-v16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xau-d1-staggered-robustness-v16:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1 pytest==9.0.2
      - name: Unit tests
        run: pytest -q tests/test_research_xau_d1_staggered_robustness_v16.py
      - name: Run post-hoc robustness diagnostic
        run: python research/xau_d1_staggered_robustness_v16.py
      - name: Verify artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_output_xau_d1_staggered_robustness_v16/xau_d1_staggered_robustness_v16.json")
          d=json.loads(p.read_text())
          assert d["contract"]=="XAU_D1_STAGGERED_ROBUSTNESS_V16"
          assert d["execution_influence"] is False
          assert d["diagnostic_only"] is True
          assert d["promotion_eligible"] is False
          assert d["diagnostic_provenance"]["oos_previously_exposed"] is True
          assert len(d["variants"]) == 16
          print("V16_STABLE", json.dumps(d["stable_diagnostic_candidates"], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xau-d1-staggered-robustness-v16
          path: research_output_xau_d1_staggered_robustness_v16/
          if-no-files-found: error
          retention-days: 30
