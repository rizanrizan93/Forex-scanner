name: Research XAU Event Corpus V193

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/research_xau_event_corpus_v193.py"
      - "src/fx_scanner/research_xau_event_corpus_v193_runtime.py"
      - "src/fx_scanner/research_xau_event_reaction_v193.py"
      - "tests/test_research_xau_event_corpus_v193.py"
      - "tests/test_research_xau_event_reaction_v193.py"
      - ".github/workflows/research-xau-event-corpus-v193.yml"

permissions:
  contents: read

concurrency:
  group: research-xau-event-corpus-v193
  cancel-in-progress: true

jobs:
  event-corpus-v193:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest==9.0.2
      - name: Unit tests V193
        run: |
          pytest -q             tests/test_research_xau_event_corpus_v193.py             tests/test_research_xau_event_reaction_v193.py
      - name: Build bounded historical USD event corpus
        run: python -m fx_scanner.research_xau_event_corpus_v193_runtime
      - name: Upload V193 corpus artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-event-corpus-v193
          path: artifacts/xau-event-corpus-v193.json
          if-no-files-found: error
          retention-days: 14
