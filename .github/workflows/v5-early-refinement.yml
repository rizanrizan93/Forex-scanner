name: V5 early native basket sensitivity refinement
on:
  push:
    branches: ['research/v5-native-growth-optimization-20261124']
    paths: ['.github/workflows/v5-early-refinement.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 994d68edc9bb87e5c1e57997a65be18873af84b8
          path: evidence
          persist-credentials: false
      - run: python research/v5_native_growth/prepare_compound_tape.py evidence/research/r15_frozen_shared_replay/evidence tape
      - run: python research/v5_native_growth/refine_early.py tape
      - uses: actions/upload-artifact@v4
        with:
          name: v5-early-refinement
          path: early_refinement.json
          if-no-files-found: error
