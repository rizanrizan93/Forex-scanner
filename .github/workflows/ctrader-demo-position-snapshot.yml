name: cTrader Demo Position Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * 1-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ctrader-demo-position-snapshot.yml"
      - "src/fx_scanner/demo_live_position_snapshot.py"
      - "src/fx_scanner/demo_broker_pnl.py"

permissions:
  actions: write
  contents: read

concurrency:
  group: ctrader-demo-position-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FX_KILL_SWITCH: "0"
      FX_IDEMPOTENCY_STATE_PATH: /tmp/execution_idempotency.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate config
        run: python -m fx_scanner.cli validate-config
      - name: Capture read-only broker position snapshot
        run: python -m fx_scanner.demo_live_position_snapshot

      - name: Recover stale DEMO supervisor
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          now_epoch="$(date -u +%s)"
          latest_success="$({
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-supervisor.yml/runs?branch=main&per_page=10"               --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")][0].updated_at // ""'
          } || true)"

          stale=0
          age_seconds=-1
          if [ -z "${latest_success}" ]; then
            stale=1
          else
            latest_epoch="$(date -u -d "${latest_success}" +%s)"
            age_seconds=$((now_epoch - latest_epoch))
            if [ "${age_seconds}" -gt 480 ]; then
              stale=1
            fi
          fi

          active_supervisors="$(
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-supervisor.yml/runs?branch=main&per_page=20"               --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
          )"

          if [ "${stale}" -eq 1 ] && [ "${active_supervisors}" -eq 0 ]; then
            gh api --method POST               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/${GITHUB_REPOSITORY}/actions/workflows/ctrader-demo-auto-supervisor.yml/dispatches"               -f ref=main
            echo "CTRADER_DEMO_POSITION_SNAPSHOT_RECOVERY_DISPATCHED age_seconds=${age_seconds} stale_threshold_seconds=480"
          elif [ "${active_supervisors}" -gt 0 ]; then
            echo "CTRADER_DEMO_POSITION_SNAPSHOT_RECOVERY_ACTIVE_SUPERVISOR active_runs=${active_supervisors} age_seconds=${age_seconds}"
          else
            echo "CTRADER_DEMO_POSITION_SNAPSHOT_RECOVERY_HEALTHY age_seconds=${age_seconds}"
          fi
