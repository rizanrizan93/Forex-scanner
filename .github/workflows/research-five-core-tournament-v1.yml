name: Research Five Core Tournament V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/five-core-tournament-v1
    paths:
      - 'research/five_core_tournament_v1.py'
      - 'research/FIVE_CORE_TOURNAMENT_V1_PLAN.md'
      - '.github/workflows/research-five-core-tournament-v1.yml'

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1

      - name: Run frozen five-core historical tournament
        run: |
          mkdir -p research_output_five_core_v1
          python research/five_core_tournament_v1.py | tee research_output_five_core_v1/console.txt

      - name: Verify research-only contract and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research_output_five_core_v1/five_core_tournament_v1.json')
          d = json.loads(p.read_text())
          assert d['contract'] == 'FIVE_CORE_TOURNAMENT_V1'
          assert d['execution_influence'] is False
          assert d['universe'] == ['XAUUSD','EURUSD','GBPUSD','USDJPY','AUDUSD']
          assert set(d['scorecard']) == set(d['universe'])
          for symbol in d['universe']:
              c = d['coverage'][symbol]
              assert c['h1_rows'] >= 40000, (symbol, c)
              assert c['m15_rows'] >= 80000, (symbol, c)
              assert set(d['scorecard'][symbol]) == {
                  'D1_TSMOM_60_200',
                  'H4_TREND_PULLBACK',
                  'H4_COMPRESSION_BREAKOUT',
                  'M15_ASIA_SWEEP_REVERSAL',
              }
          print('five-core research contract: PASS')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: five-core-tournament-v1-results
          path: research_output_five_core_v1/
          retention-days: 30
