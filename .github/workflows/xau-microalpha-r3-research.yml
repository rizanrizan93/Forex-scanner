name: XAU MicroAlpha R3 Research Readonly

on:
  pull_request:
    paths:
      - "main.py"
      - "src/fx_scanner/xau_microalpha_r3.py"
      - "pages/5_XAU_MicroAlpha_R3.py"
      - "tests/test_xau_microalpha_r3.py"
      - "scripts/research_xau_microalpha_r3_public_pilot.py"
      - ".github/workflows/xau-microalpha-r3-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microalpha-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Research-only Python dependencies
        run: python -m pip install pandas==2.2.3 pytest==9.0.2
      - name: Syntax smoke and causal unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile main.py src/fx_scanner/xau_microalpha_r3.py pages/5_XAU_MicroAlpha_R3.py scripts/research_xau_microalpha_r3_public_pilot.py
          python -m pytest -q tests/test_xau_microalpha_r3.py
      - name: Reproduce third-party public sample replay
        env:
          PYTHONPATH: src
        run: python scripts/research_xau_microalpha_r3_public_pilot.py | tee microalpha_r3_pilot.json
      - name: Save isolated research results
        uses: actions/upload-artifact@v4
        with:
          name: microalpha-r3-pilot
          path: microalpha_r3_pilot.json
          retention-days: 7
