name: cTrader LIVE Manual Approval

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Prepared private LIVE ticket ID (RZLIVE-...)"
        required: true
        type: string
      confirmation:
        description: "Type exactly: APPROVE LIVE <ticket_id>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ctrader-live-manual-execution
  cancel-in-progress: false

jobs:
  execute-approved-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      FX_ENV: live
      FX_LIVE_TRADING_ENABLED: "0"
      FX_KILL_SWITCH: "1"
      CTRADER_DEMO_AUTOTRADE_ENABLED: "0"
      LIVE_MANUAL_APPROVAL_ENABLED: I_UNDERSTAND_LIVE_ORDER
      LIVE_MANUAL_MAX_MARGIN_FRACTION: "0.50"
      SUPABASE_URL: https://naxvdtvlfatljzzwhrmo.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install LIVE approval runtime
        run: pip install -r requirements-research-cloud.txt
      - name: Execute exactly one approved LIVE ticket
        env:
          RIZAN_TICKET_ID: ${{ inputs.ticket_id }}
          RIZAN_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python -m fx_scanner.live_manual_approval execute \
            --ticket-id "$RIZAN_TICKET_ID" \
            --confirmation "$RIZAN_CONFIRMATION"
