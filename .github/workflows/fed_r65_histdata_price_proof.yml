name: R6.5 Empirical XAU Four-Hour Price-only Pilot (No Orders)
on:
  push:
    branches: ['research/r63-liquidity-stress-20261120']
    paths:
      - 'src/fx_scanner/fed_r65_histdata_price_audit.py'
      - 'src/fx_scanner/fed_r65_histdata_yearmonth_runner.py'
      - 'tests/test_fed_r65_histdata_price_audit.py'
      - '.github/workflows/fed_r65_histdata_price_proof.yml'
  pull_request:
    paths:
      - 'src/fx_scanner/fed_r65_histdata_price_audit.py'
      - 'src/fx_scanner/fed_r65_histdata_yearmonth_runner.py'
      - 'tests/test_fed_r65_histdata_price_audit.py'
      - '.github/workflows/fed_r65_histdata_price_proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r65-histdata-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate H1/M15 parity and 4h no-order accounting
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/test_fed_r65_histdata_price_audit.py
  public-month-samples:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month: ['2019-06','2020-03','2021-06','2022-09','2023-03','2024-11','2025-01','2026-03']
    env:
      R65_AUDIT_MONTH: ${{ matrix.month }}
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install research-only dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "git+https://github.com/Njenjo/histdata-fetcher.git@4a3c11b67f97758f6e3f77a3e5905b6aa87367b8"
      - name: Fetch public secondary XAUUSD M1 + run locked 4h A/B study
        run: python -m fx_scanner.fed_r65_histdata_yearmonth_runner
      - name: Attach immutable result + data provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r65-price-only-4h-${{ matrix.month }}
          path: artifacts/r65-price-only-4h-${{ matrix.month }}.json
          if-no-files-found: warn
          retention-days: 14
