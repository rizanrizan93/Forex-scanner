name: R8-D Selective Coverage Research
on:
  pull_request:
    paths:
      - 'research/zone_rebound/r8d_selective_coverage_audit.py'
      - 'tests/test_r8d_selective_coverage_audit.py'
      - '.github/workflows/r8d_selective_coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity_only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==9.0.2
      - run: python -m py_compile research/zone_rebound/r8d_selective_coverage_audit.py
      - run: python -m pytest -q tests/test_r8d_selective_coverage_audit.py
