name: cTrader Controlled Demo Order Smoke

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PLACE_ONE_DEMO_ORDER
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ctrader-controlled-demo-order-smoke
  cancel-in-progress: false

jobs:
  order-smoke:
    if: ${{ inputs.confirmation == 'PLACE_ONE_DEMO_ORDER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      CTRADER_DEMO_AUTOTRADE_ENABLED: ${{ secrets.CTRADER_DEMO_AUTOTRADE_ENABLED }}
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FX_KILL_SWITCH: "0"
      FX_IDEMPOTENCY_STATE_PATH: /tmp/execution_idempotency.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Place exactly one EURUSD demo market order
        run: python -m fx_scanner.cli ctrader-demo-order-smoke --symbol EURUSD --confirmed
