name: Rizan bridge - sync research credentials

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: rizan-bridge-research-credentials
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'rizanrizan93/Forex-scanner' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'rizanrizan93'
    # Register the dedicated runner with --no-default-labels.
    # Use --ephemeral so it unregisters after this one credential-transfer job.
    runs-on: rizan-bridge-credentials-only
    timeout-minutes: 15
    steps:
      - name: Install private environment and check research runtime
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import contextlib
          import io
          import os
          import re
          import stat
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          root = Path('/home/Rizanrizan/Forex-scanner')
          target = root / '.env'
          required = (
              'TURSO_DATABASE_URL', 'TURSO_AUTH_TOKEN',
              'CTRADER_CLIENT_ID', 'CTRADER_CLIENT_SECRET',
              'CTRADER_ACCESS_TOKEN', 'CTRADER_REFRESH_TOKEN',
              'CTRADER_TRADER_LOGIN',
          )

          def fail(code):
              # Never include exception messages, credential values or raw logs.
              print(code, flush=True)
              raise SystemExit(1)

          def main():
              if Path.home() != root.parent or root.is_symlink():
                  fail('RUNNER_USER_OR_REPO_PATH_INVALID')
              if not (root / '.venv/bin/python').is_file():
                  fail('VPS_VENV_MISSING')
              policy = (root / 'config/execution.yaml').read_text()
              if len(re.findall(r'^mode:\s*DISABLED\s*(?:#.*)?$', policy, re.M)) != 1:
                  fail('EXECUTION_MUST_REMAIN_DISABLED')

              values = {}
              for key in required + ('CTRADER_ACCOUNT_ID',):
                  value = os.environ.get(key, '')
                  if not value:
                      if key in required:
                          fail('MISSING_SECRET_NAME:' + key)
                      continue
                  # These credentials must be single-line environment-file scalars.
                  # Refuse ambiguous quoting instead of altering a credential.
                  if any(c.isspace() or c in "'\"\\" or ord(c) < 32 for c in value):
                      fail('INVALID_ENV_SCALAR_NAME:' + key)
                  values[key] = value
              values.update({
                  'FX_DATABASE_BACKEND': 'turso',
                  'FX_LIVE_TRADING_ENABLED': '0',
                  'FX_KILL_SWITCH': '1',
                  'CTRADER_LIVE_AUTOTRADE_ENABLED': '0',
                  'CTRADER_DEMO_AUTOTRADE_ENABLED': '0',
              })

              fd = os.open(target, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd) as source:
                  info = os.fstat(source.fileno())
                  if not stat.S_ISREG(info.st_mode) or info.st_uid != os.getuid():
                      fail('ENV_OWNER_OR_TYPE_INVALID')
                  old = source.read()
              # Preserve unrelated settings; remove all old instances of updated keys.
              lines = []
              for line in old.splitlines():
                  match = re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=', line)
                  if match and match.group(1) in values:
                      continue
                  lines.append(line)
              lines.extend(key + '=' + value for key, value in values.items())
              payload = '\n'.join(lines) + '\n'
              fd, temporary = tempfile.mkstemp(prefix='.env-sync-', dir=root)
              try:
                  os.fchmod(fd, 0o600)
                  with os.fdopen(fd, 'w') as output:
                      output.write(payload)
                      output.flush()
                      os.fsync(output.fileno())
                  os.replace(temporary, target)
                  directory = os.open(root, os.O_RDONLY | os.O_DIRECTORY)
                  try:
                      os.fsync(directory)
                  finally:
                      os.close(directory)
              finally:
                  if os.path.exists(temporary):
                      os.unlink(temporary)
              if stat.S_IMODE(target.stat().st_mode) != 0o600:
                  fail('ENV_PERMISSION_INVALID')
              print('ENV_SYNC_OK permission=600 backend=turso live=disabled kill_switch=active', flush=True)

              runtime_env = os.environ.copy()
              for line in payload.splitlines():
                  match = re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$', line)
                  if match:
                      runtime_env[match.group(1)] = match.group(2).strip().strip("'\"")
              # Probe the installed VPS code before restarting; no checkout, pull,
              # deployment, order command, raw journal output or secret artifact.
              probe = '''
          import contextlib, io
          from pathlib import Path
          from fx_scanner.config import load_project_config
          from fx_scanner.execution.policy import load_execution_policy
          from fx_scanner.execution.factory import build_ctrader_research_feed
          from fx_scanner.cloud_runtime import CTraderCloudResearchRuntime
          from fx_scanner.storage.supabase_operational import SupabaseOperationalStore
          root = Path('.')
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              cfg = load_project_config(root)
              policy = load_execution_policy(root)
              symbols = [pair.symbol for pair in cfg.pairs]
              if not {'XAUUSD', 'EURUSD'}.issubset(symbols):
                  raise SystemExit(2)
              feed = build_ctrader_research_feed(policy, symbols)
              try:
                  store = SupabaseOperationalStore.from_env()
                  report = CTraderCloudResearchRuntime(cfg, feed, store).probe(include_mtf=True)
                  if not report.healthy or report.failures:
                      raise SystemExit(2)
              finally:
                  feed.close()
          '''
              result = subprocess.run(
                  [str(root / '.venv/bin/python'), '-c', probe],
                  cwd=root, env=runtime_env, timeout=600,
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              )
              if result.returncode:
                  fail('TURSO_OR_CTRADER_PROBE_FAILED_RESEARCH_NOT_RESTARTED')
              print('RESEARCH_PROBE_OK turso_readiness_and_heartbeat=pass XAUUSD_and_EURUSD_quotes_and_MTF=pass', flush=True)
              result = subprocess.run(
                  ['sudo', '-n', 'systemctl', 'restart', 'rizan-research-cloud.service'],
                  timeout=60, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              )
              if result.returncode:
                  fail('RESEARCH_RESTART_FAILED')
              for attempt in range(12):
                  result = subprocess.run(
                      ['systemctl', 'is-active', '--quiet', 'rizan-research-cloud.service'],
                      timeout=10, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  )
                  if result.returncode:
                      fail('RESEARCH_SERVICE_NOT_ACTIVE')
                  time.sleep(5)
              print('RESEARCH_RESTART_OK active_for_60s; auto_start_not_changed', flush=True)

          try:
              main()
          except SystemExit:
              raise
          except Exception:
              fail('ENV_SYNC_OR_RESEARCH_CHECK_FAILED_DETAILS_SUPPRESSED')
          PY
