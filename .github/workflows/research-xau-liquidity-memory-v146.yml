name: XAU Liquidity Memory V146
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v145_liquidity_memory_v146.py"
      - "src/fx_scanner/research_xau_v145_liquidity_memory_v146_runtime.py"
      - "tests/test_research_xau_v145_liquidity_memory_v146.py"
      - ".github/workflows/research-xau-liquidity-memory-v146.yml"
permissions:
  contents: read
jobs:
  liquidity-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V146_EVIDENCE_OUTPUT: artifacts/xau-liquidity-memory-v146.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v145_liquidity_memory_v146.py
      - name: Run V146
        run: python -m fx_scanner.research_xau_v145_liquidity_memory_v146_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-liquidity-memory-v146
          path: artifacts/xau-liquidity-memory-v146.json
          if-no-files-found: error
          retention-days: 30
