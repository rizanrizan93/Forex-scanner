name: XAU V141 M15 Stop Geometry V142
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v141_m15_stop_geometry_v142.py"
      - "src/fx_scanner/research_xau_v141_m15_stop_geometry_v142_runtime.py"
      - "tests/test_research_xau_v141_m15_stop_geometry_v142.py"
      - ".github/workflows/research-xau-v141-m15-stop-geometry-v142.yml"
permissions:
  contents: read
jobs:
  stop-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V142_EVIDENCE_OUTPUT: artifacts/xau-v141-m15-stop-geometry-v142.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v141_m15_stop_geometry_v142.py
      - name: Run V142
        run: python -m fx_scanner.research_xau_v141_m15_stop_geometry_v142_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v141-m15-stop-geometry-v142
          path: artifacts/xau-v141-m15-stop-geometry-v142.json
          if-no-files-found: error
          retention-days: 30
