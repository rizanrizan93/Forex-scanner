name: Fed R5 — ONLY Enter in Macro Direction (Research No Deploy)
on:
  pull_request:
    paths:
      - 'research/fed_expectation_r1/macro_entry_alignment_r5.py'
      - 'research/fed_expectation_r1/policy_information_watch_r4.py'
      - 'src/fx_scanner/rejection_dashboard_research.py'
      - 'tests/test_fed_macro_entry_alignment_r5.py'
      - 'tests/test_fed_r4_v4_entry_integration_r5.py'
      - 'research/fed_expectation_r1/fomc_continuation_observation_r5.py'
      - 'tests/test_fed_r5_continuation_observation.py'
      - '.github/workflows/fed_macro_entry_alignment_r5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove_buy_sell_direction_only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exactly the test dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 pytest==9.0.2
      - name: Source syntax integrity
        run: |
          python -m py_compile research/fed_expectation_r1/macro_entry_alignment_r5.py research/fed_expectation_r1/policy_information_watch_r4.py src/fx_scanner/rejection_dashboard_research.py
      - name: Validate symmetric macro filter, V4 patterns, stale feeds, no execution
        run: |
          python -m pytest -q tests/test_fed_macro_entry_alignment_r5.py tests/test_fed_r4_v4_entry_integration_r5.py tests/test_fed_r5_continuation_observation.py tests/test_fed_policy_information_watch_r4.py tests/test_rejection_v4_research.py
