name: RIZAN full tick portfolio stage0 cost2 stress (research only)
on:
  push:
    branches: [research/tick-archive-2019-2026]
    paths: [.github/workflows/research-tick-portfolio-stress2.yml]
permissions:
  contents: read
concurrency:
  group: rizan-tick-stage0-cost2
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip -q install 'pyarrow>=17,<24' 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Full bid-ask cost x2 isolated technical stage-0 replay
        run: |
          python -u research/tick_replay_2019/portfolio_stage0.py \
            --start 2019-01 --end 2026-03 --cost 2 \
            --out tick_portfolio_2019_2026_stage0_cost2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rizan-real-tick-technical-stage0-2019-2026-cost2
          path: tick_portfolio_2019_2026_stage0_cost2.json
          retention-days: 45
          if-no-files-found: warn
