name: VPS memory recovery and bridge verification
on:
  push:
    branches: ['work/btc-eff20-frozen-20261102']
    paths: ['maintenance/vps_memory_recovery.py', 'maintenance/test_memory_recovery.py', '.github/workflows/vps-memory-recovery.yml']
permissions:
  contents: read
concurrency:
  group: rizan-cbot-bridge-production-ssh
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify inactive-service guards
        run: python3 -m unittest discover -s maintenance -p 'test_*.py' -v
      - name: Activate guarded swap reserve and inspect old bridges
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          private_dir=$(mktemp -d)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$private_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$private_dir/known_hosts"
          ssh_options=(-4 -i "$private_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$private_dir/known_hosts" -o ConnectTimeout=30 -o IPQoS=none -o Compression=no -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          trap 'rm -rf "$private_dir"' EXIT
          ssh "${ssh_options[@]}" Rizanrizan@202.74.74.172 'sudo -n python3 - --retire-idle' < maintenance/vps_memory_recovery.py
          ssh "${ssh_options[@]}" Rizanrizan@202.74.74.172 'sudo -n /opt/rizan-btc10-bridge/.venv/bin/python -' < diagnostics/btc10_readonly.py
