name: Pair Specific Compatibility Patch Once

on:
  push:
    branches:
      - feature/demo-usdjpy-gbpusd-public-history
    paths:
      - .github/workflows/patch-pair-specific-compat-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/demo-usdjpy-gbpusd-public-history
      - name: Patch compatibility exports
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('src/fx_scanner/demo_five_core_router.py')
          text = router.read_text()
          marker = '\ndef _rsi14(closes: Sequence[float]) -> float:\n'
          quantile = '''\ndef _linear_quantile(values: Sequence[float], q: float) -> float:\n    clean = sorted(float(v) for v in values if isfinite(float(v)))\n    if not clean:\n        raise ValueError("quantile requires values")\n    if len(clean) == 1:\n        return clean[0]\n    pos = (len(clean) - 1) * q\n    lo = int(pos)\n    hi = min(lo + 1, len(clean) - 1)\n    frac = pos - lo\n    return clean[lo] * (1.0 - frac) + clean[hi] * frac\n\n'''
          if 'def _linear_quantile(' not in text:
              text = text.replace(marker, quantile + marker, 1)
          text = text.replace(
              '    timeframe_seconds: int,\n) -> datetime:\n',
              '    timeframe_seconds: int | None = None,\n) -> datetime:\n',
              1,
          )
          needle = '    signal_ts = ensure_utc(signal_bar.timestamp)\n'
          replacement = '''    signal_ts = ensure_utc(signal_bar.timestamp)\n    if timeframe_seconds is None:\n        timeframe_seconds = {"D1": 86400, "H4": 14400, "H1": 3600, "M15": 900, "M5": 300, "M1": 60}.get(str(signal_bar.timeframe).upper())\n        if timeframe_seconds is None:\n            raise ValueError(f"unsupported timeframe for next-bar fallback: {signal_bar.timeframe}")\n'''
          if replacement not in text:
              text = text.replace(needle, replacement, 1)
          router.write_text(text)

          handoff = Path('src/fx_scanner/demo_execution_fresh_ready_handoff.py')
          text = handoff.read_text()
          marker = '}\n\n\ndef _install_five_core_identity_filter'
          alias = '}\n\n# Backward-compatible aggregate used by existing tests/observers.\n_ALLOWED_STRATEGIES = frozenset().union(*_ALLOWED_STRATEGIES_BY_SYMBOL.values())\n\n\ndef _install_five_core_identity_filter'
          if '_ALLOWED_STRATEGIES = ' not in text:
              text = text.replace(marker, alias, 1)
          handoff.write_text(text)
          PY
      - name: Commit compatibility patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fx_scanner/demo_five_core_router.py src/fx_scanner/demo_execution_fresh_ready_handoff.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve five-core compatibility exports"
          git push origin HEAD:feature/demo-usdjpy-gbpusd-public-history
