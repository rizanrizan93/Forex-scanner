name: XAU Adaptive Family Selector V118
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_adaptive_family_selector_v118.py"
      - "src/fx_scanner/research_xau_adaptive_family_selector_v118_runtime.py"
      - "tests/test_research_xau_adaptive_family_selector_v118.py"
      - ".github/workflows/research-xau-adaptive-family-selector-v118.yml"
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V118_EVIDENCE_OUTPUT: artifacts/xau-adaptive-family-selector-v118.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11",cache: pip}
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_adaptive_family_selector_v118.py
      - name: Run adaptive family selector diagnostic
        run: python -m fx_scanner.research_xau_adaptive_family_selector_v118_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-adaptive-family-selector-v118
          path: artifacts/xau-adaptive-family-selector-v118.json
          if-no-files-found: error
          retention-days: 30
