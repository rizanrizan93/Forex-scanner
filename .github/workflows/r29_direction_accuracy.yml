name: R29 Direction Accuracy Research
on:
  workflow_dispatch:
  push:
    branches: ['research/r29-direction-accuracy-20261123']
    paths:
      - 'scripts/r29_direction_accuracy.py'
      - 'scripts/r29_accuracy_report.py'
      - 'tests/test_r29_direction_accuracy.py'
      - '.github/workflows/r29_direction_accuracy.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: r29-direction-accuracy
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tf: ['1h','4h','1D','1W']
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install replay-compatible dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl joblib pytest
      - name: Validate purge, conflicts and coverage safeguards
        run: python -m pytest -q tests/test_r29_direction_accuracy.py
      - name: Download immutable ECB replay source
        uses: actions/download-artifact@v4
        with:
          run-id: 44970328847
          github-token: ${{ github.token }}
          name: r281-ecb
          path: /tmp/r281
      - name: Download immutable intraday candles
        if: ${{ matrix.tf == '1h' || matrix.tf == '4h' }}
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Download immutable daily candles
        if: ${{ matrix.tf == '1D' || matrix.tf == '1W' }}
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Evaluate independently selected BUY and SELL specialists
        env:
          TF: ${{ matrix.tf }}
        run: python scripts/r29_direction_accuracy.py --tf "$TF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-${{ matrix.tf }}
          path: artifacts/r29/*
          retention-days: 30
          if-no-files-found: warn
  report:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r29-*
          path: /tmp/r29
          merge-multiple: true
      - name: Record all results without changing production model
        run: |
          python scripts/r29_accuracy_report.py /tmp/r29
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/r29
          if ! git diff --cached --quiet; then
            git commit -m "Record R29 chronological accuracy and coverage evidence"
            git push origin HEAD:refs/heads/research/r29-direction-accuracy-20261123
          fi
