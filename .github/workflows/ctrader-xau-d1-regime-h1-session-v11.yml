name: cTrader XAU D1 Regime H1 Session V11

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_d1_regime_h1_session_v11.py"
      - "src/fx_scanner/research_xau_d1_regime_h1_session_v11_runtime.py"
      - "src/fx_scanner/research_xau_h1_history.py"
      - "config/validation.yaml"
      - ".github/workflows/ctrader-xau-d1-regime-h1-session-v11.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-xau-d1-regime-h1-session-v11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xau-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      XAU_V11_EVIDENCE_OUTPUT: artifacts/xau-d1-regime-h1-session-v11.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate config
        run: python -m fx_scanner.cli validate-config
      - name: Run D1-regime H1 session V11
        run: python -m fx_scanner.research_xau_d1_regime_h1_session_v11_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-d1-regime-h1-session-v11
          path: artifacts/xau-d1-regime-h1-session-v11.json
          if-no-files-found: error
          retention-days: 30
