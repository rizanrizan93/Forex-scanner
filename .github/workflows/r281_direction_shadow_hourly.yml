name: R28.1 XAU Direction Shadow Hourly (Read Only)
# Four independent model/parity jobs compute in parallel; publication remains
# atomic/fail-closed. No cBot integration or orders.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r281_direction_shadow_hourly.yml'
  schedule:
    # More frequent bounded retries, including the first minutes after H1 close.
    - cron: '7,22,37,52 * * * 1-5'
permissions:
  contents: write
  actions: read
concurrency:
  group: r281-xau-shadow-hourly
  cancel-in-progress: false

jobs:
  infer:
    name: Model parity and broker shadow ${{ matrix.tf }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tf: 1h
            label: H1
          - tf: 4h
            label: H4
          - tf: 1D
            label: D1
          - tf: 1W
            label: W1
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout isolated R28.1 research branch, never cBot runtime
        uses: actions/checkout@v4
        with:
          ref: research/r281-direction-inference-parity-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl joblib pytest
      - name: Enforce provenance, no-orders, and candle contract
        run: python -m pytest -q tests/test_r281_live_shadow_parity.py tests/test_r281_live_market.py tests/test_r281_publish_shadow.py tests/test_r281_fast_live_inference.py
      - name: Restore immutable 2025 parity-refit model and historical source
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/r281
            /tmp/r10
            /tmp/r98
            artifacts/r281_inference/r281-${{ matrix.tf }}-reconstructed-model.joblib
            artifacts/r281_inference/r281-${{ matrix.tf }}-shadow.json
          # Frozen through 2025. Bump this key ONLY when the model/archives/
          # validated policy intentionally changes; cache is reusable for each close.
          key: r281-2025-parity-refit-fast-v1-${{ runner.os }}-${{ matrix.tf }}
      - name: Download immutable ECB replay source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: 44970328847
          github-token: ${{ github.token }}
          name: r281-ecb
          path: /tmp/r281
      - name: Download immutable XAU H1/H4 data
        if: steps.cache.outputs.cache-hit != 'true' && (matrix.tf == '1h' || matrix.tf == '4h')
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Download immutable XAU D1/W1 data
        if: steps.cache.outputs.cache-hit != 'true' && (matrix.tf == '1D' || matrix.tf == '1W')
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Bootstrap parity-verifiable refit ONCE on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/r281_live_shadow_parity.py --tf "${{ matrix.tf }}"
      - name: Fast broker inference without replay or model refitting
        if: steps.cache.outputs.cache-hit == 'true'
        run: python scripts/r281_fast_live_inference.py --tf "${{ matrix.tf }}"
      - name: Upload one model's proof, even when publication cannot proceed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r281-model-${{ matrix.label }}
          path: artifacts/r281_inference/r281-${{ matrix.tf }}-shadow.json
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Atomic fail-closed four-model snapshot
    needs: [infer]
    if: ${{ needs.infer.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: 'scripts:src:.'
    steps:
      - name: Checkout isolated R28.1 research branch for snapshot only
        uses: actions/checkout@v4
        with:
          ref: research/r281-direction-inference-parity-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publisher dependency
        run: pip install pandas==2.2.3
      - name: Download this run's four model proofs
        uses: actions/download-artifact@v4
        with:
          pattern: r281-model-*
          path: artifacts/r281_inference
          merge-multiple: true
      - name: Require all four fresh historical parity proofs and fresh broker data
        run: python scripts/r281_publish_shadow.py
      - name: Publish only read-only JSON; no live cBot files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/r281-shadow-direction.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh R28.1 reconstructed research-only XAU direction packet"
            git push origin HEAD:refs/heads/research/r281-direction-inference-parity-20261123
          fi
      - name: Archive published feed and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r281-hourly-shadow-receipt
          path: |
            runtime/r281-shadow-direction.json
            artifacts/r281_inference/*-shadow.json
          retention-days: 7
          if-no-files-found: warn
