name: R28.1 XAU Direction Shadow Hourly (Read Only)
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * 1-5'
permissions:
  contents: write
  actions: read
concurrency:
  group: r281-xau-shadow-hourly
  cancel-in-progress: false
jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: 'scripts:src:.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout isolated R28.1 research branch, never cBot runtime
        uses: actions/checkout@v4
        with:
          ref: research/r281-direction-inference-parity-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy scikit-learn==1.7.2 requests openpyxl joblib pytest
      - name: Enforce no-orders, provenance and candle contract tests
        run: python -m pytest -q tests/test_r281_live_shadow_parity.py tests/test_r281_live_market.py tests/test_r281_publish_shadow.py
      - name: Download immutable ECB replay source
        uses: actions/download-artifact@v4
        with:
          run-id: 44970328847
          github-token: ${{ github.token }}
          name: r281-ecb
          path: /tmp/r281
      - name: Download immutable XAU 2019–2026 H1/H4 data
        uses: actions/download-artifact@v4
        with:
          run-id: 44901264975
          github-token: ${{ github.token }}
          pattern: r10-shard-*
          path: /tmp/r10
          merge-multiple: true
      - name: Download immutable XAU 2012–2026 D1/W1 data
        uses: actions/download-artifact@v4
        with:
          run-id: 44886465487
          github-token: ${{ github.token }}
          pattern: r98-daily-*
          path: /tmp/r98
          merge-multiple: true
      - name: Require 2025 replay parity before each live-market SHADOW prediction
        run: |
          set -euo pipefail
          for tf in 1h 4h 1D 1W; do
            python scripts/r281_live_shadow_parity.py --tf "$tf"
          done
      - name: Fail closed unless all four reconstructed model proofs match
        run: python scripts/r281_publish_shadow.py
      - name: Commit only published nonexecution JSON to research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/r281-shadow-direction.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh R28.1 reconstructed research-only XAU direction packet"
            git push origin HEAD:refs/heads/research/r281-direction-inference-parity-20261123
          fi
      - name: Retain compact research proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r281-hourly-shadow-receipt
          path: |
            runtime/r281-shadow-direction.json
            artifacts/r281_inference/*-shadow.json
          retention-days: 7
          if-no-files-found: warn
