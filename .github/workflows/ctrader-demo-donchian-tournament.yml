name: cTrader Demo Donchian Adaptive Tournament

on:
  workflow_dispatch:
  schedule:
    - cron: "35 22 * * 1-5"
  push:
    branches: [main]
    paths:
      - "src/fx_scanner/demo_donchian_adaptive_tournament.py"
      - "src/fx_scanner/demo_donchian_tournament_runtime.py"
      - "src/fx_scanner/demo_donchian_export_evidence.py"
      - "src/fx_scanner/demo_donchian_atr_h1.py"
      - "config/validation.yaml"
      - ".github/workflows/ctrader-demo-donchian-tournament.yml"

permissions:
  contents: read

concurrency:
  group: ctrader-demo-donchian-adaptive-tournament
  cancel-in-progress: true

jobs:
  research-tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: "1"
      CTRADER_DISABLE_TOKEN_REFRESH: "1"
      CTRADER_DONCHIAN_HISTORY_BARS: "2200"
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DONCHIAN_EVIDENCE_WORKER: ctrader_demo_donchian_adaptive_tournament
      DONCHIAN_EVIDENCE_OUTPUT: artifacts/donchian-tournament-evidence.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cTrader research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
      - name: Validate fail-closed config
        run: python -m fx_scanner.cli validate-config
      - name: Run bounded Donchian historical tournament
        run: python -m fx_scanner.demo_donchian_tournament_runtime
      - name: Export exact tournament evidence
        run: python -m fx_scanner.demo_donchian_export_evidence
      - name: Upload tournament evidence
        uses: actions/upload-artifact@v4
        with:
          name: donchian-tournament-evidence
          path: artifacts/donchian-tournament-evidence.json
          if-no-files-found: error
          retention-days: 30
