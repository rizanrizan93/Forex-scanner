name: R7.8 2012-2024 Long History Intraday Result
on:
  push:
    branches: ['research/r78-long-history-intraday-20261121']
    paths: ['.github/workflows/r78_replay_long_history.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      R78_ROOT: '/tmp/r78-history'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Wait for bounded independent source archive
        run: |
          for i in $(seq 1 25); do
            s=$(gh api repos/${{ github.repository }}/actions/runs/44852452166 --jq '.status + ":" + (.conclusion // "")')
            echo "$s"
            if [ "$s" = "completed:success" ]; then exit 0; fi
            if [[ "$s" == completed:* ]]; then exit 1; fi
            sleep 10
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: r78-xau-h1-*
          path: /tmp/r78-history
          merge-multiple: false
          run-id: 44852452166
          github-token: ${{ github.token }}
      - name: Install pinned research runtime
        run: python -m pip install pandas==2.2.3 numpy==2.2.6 scikit-learn==1.6.1
      - name: Run per-year prior-only selected clock and model
        run: python scripts/r78_long_history_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: r78-long-history-results
          path: artifacts/r78-long-history-results.json
          retention-days: 60
          if-no-files-found: error
