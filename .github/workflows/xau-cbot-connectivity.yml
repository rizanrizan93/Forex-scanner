name: XAU cBot Connectivity
on:
  push:
    branches: [main, 'fix/xau110-bridge-connectivity', 'fix/xau121-bridge-connectivity']
    paths: ['cbot_bridge/**', 'cbot_connectivity/xau-batch-v1.1.0/**', 'cbot_sources/archive/xau-batch-v1.1.0/**', 'cbot_connectivity/xau-stable-v1.2.1/**', 'cbot_sources/archive/xau-stable-v1.2.1/**', '.github/workflows/xau-cbot-connectivity.yml']
  pull_request:
    paths: ['cbot_bridge/**', 'cbot_connectivity/xau-batch-v1.1.0/**', 'cbot_sources/archive/xau-batch-v1.1.0/**', 'cbot_connectivity/xau-stable-v1.2.1/**', 'cbot_sources/archive/xau-stable-v1.2.1/**', '.github/workflows/xau-cbot-connectivity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - run: python -m pip install -r cbot_bridge/requirements.txt
      - run: python cbot_connectivity/xau-batch-v1.1.0/verify_scope.py
      - run: python -m unittest discover -s cbot_bridge -p 'test_*.py' -v
      - name: CSharp soak and frozen execution regressions
        run: |
          for test in ConnectivityTests BatchAckTests BatchRuntimeTests SizingParityTests; do
            dotnet run --project "cbot_connectivity/xau-batch-v1.1.0/tests/$test.csproj"
          done
      - name: Build actual cTrader release
        run: dotnet build cbot_connectivity/xau-batch-v1.1.0/source/RizanXAUBatch/RizanXAUBatch/RizanXAUBatch.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: RizanXAUBatch-v1.1.0-bridgefix
          path: cbot_connectivity/xau-batch-v1.1.0/source/RizanXAUBatch/RizanXAUBatch/bin/Release/net6.0/*.algo
      - name: Verify latest v1.2.1 profile unchanged
        run: python cbot_connectivity/xau-stable-v1.2.1/verify_scope.py
      - name: Latest execution fixtures and transport soak
        run: |
          dotnet run --project cbot_connectivity/xau-stable-v1.2.1/Tests.csproj
          dotnet run --project cbot_connectivity/xau-stable-v1.2.1/ConnectivityTests.csproj
      - name: Build latest native cTrader package
        run: dotnet build cbot_connectivity/xau-stable-v1.2.1/source/RizanXAUStable/RizanXAUStable/RizanXAUStable.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: RizanXAUStable-v1.2.1-bridgefix
          path: cbot_connectivity/xau-stable-v1.2.1/source/RizanXAUStable/RizanXAUStable/bin/Release/net6.0/*.algo
