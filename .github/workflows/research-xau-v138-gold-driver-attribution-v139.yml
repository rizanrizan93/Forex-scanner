name: XAU V138 Gold Driver Attribution V139

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_v138_gold_driver_attribution_v139.py"
      - "src/fx_scanner/research_xau_v138_gold_driver_attribution_v139_runtime.py"
      - "tests/test_research_xau_v138_gold_driver_attribution_v139.py"
      - ".github/workflows/research-xau-v138-gold-driver-attribution-v139.yml"

permissions:
  contents: read

jobs:
  driver-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V139_EVIDENCE_OUTPUT: artifacts/xau-v138-gold-driver-attribution-v139.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_v138_gold_driver_attribution_v139.py
      - name: Run V139
        run: python -m fx_scanner.research_xau_v138_gold_driver_attribution_v139_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: xau-v138-gold-driver-attribution-v139
          path: artifacts/xau-v138-gold-driver-attribution-v139.json
          if-no-files-found: error
          retention-days: 30
