name: XAU H1 Event Stability V61

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fx_scanner/research_xau_h1_event_stability_v61.py"
      - "src/fx_scanner/research_xau_h1_event_stability_v61_runtime.py"
      - "tests/test_research_xau_h1_event_stability_v61.py"
      - ".github/workflows/research-xau-h1-event-stability-v61.yml"

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      V61_EVIDENCE_OUTPUT: artifacts/xau-h1-event-stability-v61.json
      SUPABASE_URL: https://fotzcxjeypmjldhvfskt.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research-cloud.txt
          pip install pytest==9.0.2 dukascopy-python==4.0.1
      - name: Unit tests
        run: pytest -q tests/test_research_xau_h1_event_stability_v61.py
      - name: Run H1 event stability audit
        run: python -m fx_scanner.research_xau_h1_event_stability_v61_runtime
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xau-h1-event-stability-v61
          path: artifacts/xau-h1-event-stability-v61.json
          if-no-files-found: error
          retention-days: 30
