name: Weekend V121 research inventory
on:
  push:
    branches: [research/weekend-v121-audit-stress-20261020]
    paths: ['.github/workflows/weekend-v121-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate research input files only
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$d/hosts"
          chmod 600 "$d/key" "$d/hosts"
          ssh -i "$d/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/hosts" -o ConnectTimeout=30 Rizanrizan@202.74.74.172 'find /home/Rizanrizan/rizan-ticks/REPLAY_RESULTS -maxdepth 8 -type f \( -name "*xau*.csv" -o -name "*eur*.csv" -o -name "*SETTLEMENT*20261017*.zip" -o -name "*long*harness*" \) -printf "%p %s\n"' > INPUT_INVENTORY.txt
          cat INPUT_INVENTORY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PORTFOLIO-INPUT-INVENTORY
          path: INPUT_INVENTORY.txt
