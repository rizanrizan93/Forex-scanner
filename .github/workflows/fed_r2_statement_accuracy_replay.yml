name: Fed R2 — Official Action Accuracy + 2019-2026 XAU Audit (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/fed_expectation_r1/official_communications_r2.py'
      - 'research/fed_expectation_r1/polarity_guard_r2.py'
      - 'tests/test_fed_official_statement_replay_r2.py'
      - 'scripts/replay_fed_official_statement_actions_r2.py'
      - '.github/workflows/fed_r2_statement_accuracy_replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  no_inverted_direction_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest==9.0.2 numpy==2.3.5 pandas==2.2.3
      - name: Verify exact committee action, negative/ambiguous phrasing and FOMC dissent
        env: {PYTHONPATH: 'src:.'}
        run: |
          python -m py_compile research/fed_expectation_r1/polarity_guard_r2.py scripts/replay_fed_official_statement_actions_r2.py
          python -m pytest -q tests/test_fed_official_statement_replay_r2.py tests/test_fed_official_communications_r2.py
  official_rate_action_vs_xau_full_history:
    needs: no_inverted_direction_tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env: {PYTHONPATH: 'src:.'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest==9.0.2 numpy==2.3.5 pandas==2.2.3
      - name: Download sealed 2019-26 yearly XAU replay from former CI run
        uses: actions/download-artifact@v4
        with:
          pattern: fed-macro-research-expost-20*
          path: artifacts/annual
          run-id: 44621561755
          github-token: ${{ github.token }}
      - name: Replay official archival FOMC statements and compare action vs policy surprise vs XAU
        run: |
          mkdir -p artifacts
          python scripts/replay_fed_official_statement_actions_r2.py --input-dir artifacts/annual --out artifacts/fed-r2-official-statement-2019-2026.json
      - uses: actions/upload-artifact@v4
        with:
          name: fed-r2-actual-FOMC-action-2019-2026-source-audit
          path: artifacts/fed-r2-official-statement-2019-2026.json
          if-no-files-found: error
          retention-days: 30
