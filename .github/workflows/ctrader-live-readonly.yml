name: cTrader LIVE Read-Only Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ctrader-live-readonly.yml"
      - "src/fx_scanner/live_account_readonly.py"
  schedule:
    - cron: "*/5 * * * 0-5"

permissions:
  contents: read

concurrency:
  group: ctrader-live-readonly-monitor
  cancel-in-progress: true

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      FX_ENV: live
      FX_LIVE_TRADING_ENABLED: "0"
      FX_KILL_SWITCH: "1"
      CTRADER_DEMO_AUTOTRADE_ENABLED: "0"
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install cTrader read-only runtime
        run: pip install -r requirements-research-cloud.txt
      - name: Verify LIVE account with view-only token
        run: python -m fx_scanner.live_account_readonly
