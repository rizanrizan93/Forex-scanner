name: Turso encrypted operational migration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/turso-migrate.yml'
      - 'scripts/turso_import.py'
      - 'turso/migration.encrypted.json'
permissions:
  contents: read
concurrency:
  group: turso-operational-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==9.0.2 httpx==0.28.1 cryptography==42.0.8 PyYAML==6.0.2
      - run: python -m pytest -q tests/test_turso_client.py
      - name: Import and verify encrypted operational state
        run: python scripts/turso_import.py
