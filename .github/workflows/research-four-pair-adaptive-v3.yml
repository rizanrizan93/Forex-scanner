name: Research Four Pair Adaptive V3

on:
  workflow_dispatch:
  push:
    branches:
      - research/four-pair-strategy-search-v1
    paths:
      - 'research/four_pair_strategy_search_v3_adaptive.py'
      - '.github/workflows/research-four-pair-adaptive-v3.yml'

permissions:
  contents: read

jobs:
  pair:
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, AUDUSD]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CORE_SYMBOL: ${{ matrix.symbol }}
      PYTHONPATH: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned research dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 dukascopy-python==4.0.1
      - name: Run causal adaptive router
        run: |
          rm -rf research_output_four_pair_v3
          mkdir -p research_output_four_pair_v3
          python research/four_pair_strategy_search_v3_adaptive.py | tee research_output_four_pair_v3/console-${CORE_SYMBOL}.txt
      - name: Verify research-only contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = os.environ['CORE_SYMBOL']
          d = json.loads(Path(f'research_output_four_pair_v3/four_pair_adaptive_v3_{s}.json').read_text())
          assert d['contract'] == 'FOUR_PAIR_CAUSAL_ADAPTIVE_V3'
          assert d['execution_influence'] is False
          assert d['symbol'] == s
          assert d['coverage']['h1_rows'] >= 70000
          assert len(d['pool']) == 4
          print(s, 'V3 adaptive contract: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: four-pair-${{ matrix.symbol }}-v3-adaptive
          path: research_output_four_pair_v3/
          retention-days: 30
