name: ForexRizan Dashboard Bridge Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/forexrizan-dashboard-bridge-watchdog.yml", "scripts/rizan_bridge_watchdog.py"]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: forexrizan-dashboard-bridge-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify publication and engine freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/rizan_bridge_watchdog.py
