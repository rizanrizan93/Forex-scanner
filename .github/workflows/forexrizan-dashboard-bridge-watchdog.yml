name: ForexRizan Dashboard Bridge Watchdog

on:
  workflow_dispatch:
  # A completed main checkpoint publication also verifies independent shadow
  # and event freshness. This is in addition to the best-effort cron trigger.
  workflow_run:
    workflows: ["BUY050 cBots Dashboard Snapshot (readonly)"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: [".github/workflows/forexrizan-dashboard-bridge-watchdog.yml", "scripts/rizan_bridge_watchdog.py", "scripts/buy050_publication_watchdog.py", "tests/test_buy050_publication_watchdog.py", "scripts/buy050_auxiliary_watchdog.py", "tests/test_buy050_auxiliary_watchdog.py", "scripts/xau_m15_market_watchdog.py", "tests/test_xau_m15_market_watchdog.py"]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: forexrizan-dashboard-bridge-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify publication and engine freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/rizan_bridge_watchdog.py
      - name: Verify BUY050 recovery gating (no duplicate dispatch)
        run: python -m unittest discover -s tests -p 'test_buy050_publication_watchdog.py' -v
      - name: Recover stalled BUY050 read-only publication (never trade)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/buy050_publication_watchdog.py
      - name: Validate shadow/event publication recovery
        if: always()
        run: python -m unittest discover -s tests -p 'test_buy050_auxiliary_watchdog.py' -v
      - name: Recover stalled BUY050 shadow and event publications
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/buy050_auxiliary_watchdog.py
      - name: Verify XAU M15 independent market feed watchdog
        if: always()
        run: python -m pip install pytest==9.0.2 && python -m pytest -q tests/test_xau_m15_market_watchdog.py
      - name: Recover stale XAU M15 read-only feed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/xau_m15_market_watchdog.py
