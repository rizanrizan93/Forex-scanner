name: Demo broker order and protection audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/demo_order_protection_audit.py', '.github/workflows/demo-order-protection-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_TRADER_LOGIN: ${{ secrets.CTRADER_TRADER_LOGIN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_TOKEN_STATE_PATH: /tmp/ctrader_tokens.json
      CTRADER_TOKEN_STATE_DURABLE: '1'
      CTRADER_DISABLE_TOKEN_REFRESH: '1'
      FX_DATABASE_BACKEND: turso
      TURSO_USAGE_TRACKING: '1'
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      SUPABASE_URL: https://naxvdtvlfatljzzwhrmo.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      FX_IDEMPOTENCY_STATE_PATH: /tmp/eurusd_idempotency.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-research-cloud.txt
      - run: python scripts/demo_order_protection_audit.py
      - name: Verify persisted row usage after broker audit
        run: |
          python - <<'PYTHON'
          import json
          from fx_scanner.storage.backend import create_backend_client
          from fx_scanner.storage.turso_budget import report_budget
          print("TURSO_USAGE_PERSISTED " + json.dumps(report_budget(create_backend_client())))
          PYTHON
