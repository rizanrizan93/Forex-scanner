# v0.13 phone-only demo-forward architecture.
# FP Markets cTrader is the research feed AND the only permitted DEMO execution venue.
# Real/live execution remains forbidden; committed execution mode stays DISABLED.
mode: DISABLED

broker:
  dual_feed_single_execution: false
  research: CTRADER
  execution: CTRADER
  automatic_fallback: false

ctrader:
  role: RESEARCH_AND_DEMO_EXECUTION
  broker_label: FP_MARKETS
  environment: DEMO
  client_id_env: CTRADER_CLIENT_ID
  client_secret_env: CTRADER_CLIENT_SECRET
  access_token_env: CTRADER_ACCESS_TOKEN
  refresh_token_env: CTRADER_REFRESH_TOKEN
  token_state_path_env: CTRADER_TOKEN_STATE_PATH
  trader_login_env: CTRADER_TRADER_LOGIN
  account_id_env: CTRADER_ACCOUNT_ID
  require_demo: true
  request_timeout_seconds: 10
  max_quote_age_seconds: 2
  quote_wait_timeout_seconds: 5
  quote_poll_seconds: 0.10

mt5:
  role: EXECUTION_ONLY
  broker_label: HFM_CENT
  terminal_path_env: MT5_TERMINAL_PATH
  login_env: MT5_LOGIN
  server_env: MT5_SERVER
  password_env: MT5_PASSWORD
  initialize_timeout_ms: 10000
  max_quote_age_seconds: 1
  symbol_suffix_candidates: ["", "c"]
  symbol_map: {}

reconciliation:
  research_quote_max_age_seconds: 2
  execution_quote_max_age_seconds: 1
  max_mid_divergence_pips: 2.0
  max_execution_spread_pips: 4.0
  spread_ratio_floor_pips: 0.10
  max_spread_ratio_vs_research: 12.0
  max_entry_drift_pips: 2.0
  max_entry_drift_r: 0.15
  min_rr: 1.50
  max_internal_revalidation_ms: 500
  expected_account_currency: USC
  expected_fx_contract_size: 1000
  allow_pending_orders: false

adaptive_cadence:
  NO_TRADE: 2.0
  WATCH: 1.0
  SETUP_FORMING: 0.5
  ARMED: 0.25
  EXECUTION_READY: 0.25
  MISSED: 2.0
  INVALIDATED: 2.0
  COOLDOWN: 2.0

scheduler:
  heavy_scan_seconds: 900
  fast_setup_seconds: 15
  execution_watch_seconds: 0.25
  position_monitor_seconds: 2

runtime:
  max_lag_seconds:
    heavy_scan: 120
    fast_setup: 5
    execution_watch: 0.50
    position_monitor: 3
  supervisor_tick_seconds: 0.05
  execution_queue_maxsize: 100
  concurrent_workers: 4
  execution_worker_poll_seconds: 0.05
  reconnect:
    max_attempts: 3
    backoff_initial_seconds: 1
    backoff_multiplier: 2
    backoff_max_seconds: 30
  circuit_breaker:
    failure_threshold: 3
    recovery_seconds: 30

order:
  default_deviation_points: 20
  magic_number: 26083001
  comment_prefix: FXIS
  max_signal_age_seconds: 300
  require_server_side_sl: true
  require_server_side_tp: true
  require_broker_preflight: true
  require_order_check: true
  max_spread_ratio: 1.75
  max_preflight_entry_drift_r: 0.03

live_safety:
  live_enable_env: FX_LIVE_TRADING_ENABLED
  live_enable_value: I_UNDERSTAND_LIVE_ORDERS
  account_allowlist_env: FX_BROKER_ACCOUNT_ALLOWLIST
  require_account_allowlist: true
  kill_switch_env: FX_KILL_SWITCH
  kill_switch_safe_value: "0"
  require_control_plane: true
  control_state_max_age_seconds: 5
  require_revalidation: false
  require_persistent_idempotency: true
  idempotency_state_path_env: FX_IDEMPOTENCY_STATE_PATH

demo_safety:
  enable_env: CTRADER_DEMO_AUTOTRADE_ENABLED
  enable_value: I_UNDERSTAND_DEMO_ORDERS
  require_demo_account: true
  require_trade_scope: true
  require_atomic_signal_claim: true
  min_signal_coverage: 0.80
  max_order_lots: 0.01
  max_risk_pct: 1.00
  max_concurrent_positions: 2
  poll_seconds: 1.0


modes:
  allowed:
    - DISABLED
    - SIMULATION
    - CONFIRM_TO_TRADE
    - AUTO
